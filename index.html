      const saveAutomation = () => { if(!subjectId){showToast('Select a subject','warning');return;} DS.saveQuizAutomation({subjectId,enabled:autoEnabled,approvalRequired,day:'Saturday',time:weeklyTime,questionCount,duration,difficulty,teacherId:user.id,updatedAt:new Date().toISOString()}); showToast(autoEnabled?'Saturday automation enabled':'Saturday automation saved','success'); };
      const runWeeklyNow = () => { const mats=DS.getAcademicMaterials({teacherId:user.id,subjectId}); const text=mats.map(m=>m.content).join('\n'); if(!text){showToast('No uploaded material found for this subject','warning');return;} createGeneratedQuiz(false,text); };
      const saveMaterial = () => { if(!materialText.trim()){showToast('Material is empty','warning');return;} DS.addAcademicMaterial({id:`mat-${Date.now()}`,teacherId:user.id,subjectId,title:materialTitle||'Untitled Material',content:materialText,sourceUrl:googleDocUrl||'',createdAt:new Date().toISOString()}); showToast('Material saved to Academic Materials','success'); };

      useEffect(()=>{
        let interval;
        if(selectedQuiz&&!submitted&&timeLeft>0) interval=setInterval(()=>setTimeLeft(t=>{if(t<=1){submitQuiz();return 0;}return t-1;}),1000);
        return()=>clearInterval(interval);
      },[selectedQuiz,submitted,timeLeft]);

      useEffect(()=>{
        if(effectiveRole==='STUDENT') return;
        const day=new Date().getDay();
        if(day!==6) return;
        DS.getCollection('quizAutomation').filter(a=>a.enabled&&a.teacherId===user.id).forEach(a=>{
          const key=`edutrack_weekly_run_${a.subjectId}_${new Date().toISOString().slice(0,10)}`;
          if(localStorage.getItem(key)) return;
          const mats=DS.getAcademicMaterials({teacherId:user.id,subjectId:a.subjectId});
          if(!mats.length)return;
          const text=mats.slice(0,10).map(m=>m.content).join('\n');
          const qs=makeQuestions(text,a.questionCount||10,a.difficulty||'Mixed',a.subjectId,'Saturday Automation');
          const all=DS.getCollection('quizzes');all.push({id:`q-${Date.now()}`,title:'Saturday Weekly Quiz',subjectId:a.subjectId,questions:qs,marks:qs.length,duration:a.duration||15,difficulty:a.difficulty||'Mixed',published:!a.approvalRequired,approvalRequired:a.approvalRequired,createdBy:user.id,source:'Saturday Automation',createdAt:new Date().toISOString()});DS.setCollection('quizzes',all);localStorage.setItem(key,'1');showToast(a.approvalRequired?'Saturday quiz generated for approval':'Saturday quiz automatically published','success');
        });
      },[]);

      const handleAnswer=(qid,oi)=>setAnswers({...answers,[qid]:oi});
      const submitQuiz=()=>{if(!selectedQuiz)return;let correct=0;selectedQuiz.questions.forEach(q=>{if(answers[q.id]===q.answer)correct++;});const pct=Math.round((correct/selectedQuiz.questions.length)*100);setScore(pct);setSubmitted(true);if(student){DS.addQuizAttempt({id:`qa-${Date.now()}`,studentId:student.id,quizId:selectedQuiz.id,score:pct,total:selectedQuiz.questions.length,date:new Date().toISOString().split('T')[0],timeTaken:selectedQuiz.duration*60-timeLeft});const att=DS.getQuizAttempts(student.id);DS.updateStudent(student.id,{quizAverage:Math.round(att.reduce((a,x)=>a+x.score,0)/att.length)});}showToast(`Quiz submitted! Score: ${pct}%`,pct>=60?'success':'warning');};
      const startQuiz=q=>{setSelectedQuiz(q);setSubmitted(false);setAnswers({});setScore(null);setTimeLeft((q.duration||15)*60);};

      if(effectiveRole==='STUDENT'){
        const myAttempts=student?DS.getQuizAttempts(student.id):[];
        const available=quizzes.filter(q=>q.published && q.questions?.length);
        return <div>
          <div className="stats-grid"><StatCard icon="fa-pencil-alt" iconClass="purple" label="Quizzes Taken" value={myAttempts.length} delay={1}/><StatCard icon="fa-percentage" iconClass="green" label="Average Score" value={student?.quizAverage||0} suffix="%" delay={2}/><StatCard icon="fa-trophy" iconClass="orange" label="Best Score" value={myAttempts.length?Math.max(...myAttempts.map(a=>a.score)):0} suffix="%" delay={3}/></div>
          <div className="tabs"><button className={`tab ${activeTab==='available'?'active':''}`} onClick={()=>setActiveTab('available')}>Available</button><button className={`tab ${activeTab==='history'?'active':''}`} onClick={()=>setActiveTab('history')}>History</button></div>
          {activeTab==='available'&&!selectedQuiz&&<div className="grid-2">{available.map(q=><div className="card animate-fadeIn" key={q.id}><div className="card-header"><h3 className="card-title">{q.title}</h3><span className="badge badge-primary">{q.source||'Assessment'}</span></div><p style={{color:'var(--text-secondary)',fontSize:13,marginBottom:14}}>{DS.getSubjectById(q.subjectId)?.name||'Course'} · {q.questions.length} questions · {q.duration} min</p><button className="btn btn-primary btn-block" onClick={()=>startQuiz(q)}><i className="fas fa-play"/> Start Quiz</button></div>)}</div>}
          {selectedQuiz&&!submitted&&<div className="card animate-fadeIn"><div className="card-header"><h3 className="card-title">{selectedQuiz.title}</h3><span className="badge badge-danger"><i className="fas fa-clock"/> {Math.floor(timeLeft/60)}:{String(timeLeft%60).padStart(2,'0')}</span></div>{selectedQuiz.questions.map((q,i)=><div key={q.id} style={{padding:18,borderBottom:'1px solid var(--border-light)',marginBottom:8,background:i%2?'transparent':'var(--bg-primary)',borderRadius:12}}><p style={{fontWeight:700,marginBottom:12}}>Q{i+1}. {q.text}</p>{q.options.map((o,oi)=><label key={oi} style={{display:'flex',gap:10,padding:10,border:'1px solid var(--border-color)',borderRadius:10,marginBottom:7,cursor:'pointer',background:answers[q.id]===oi?'var(--primary)':'var(--bg-card)',color:answers[q.id]===oi?'white':'var(--text-primary)'}}><input type="radio" checked={answers[q.id]===oi} onChange={()=>handleAnswer(q.id,oi)}/>{o}</label>)}</div>)}<div style={{display:'flex',justifyContent:'space-between'}}><button className="btn btn-secondary" onClick={()=>setSelectedQuiz(null)}>Cancel</button><button className="btn btn-success" onClick={submitQuiz}>Submit Quiz</button></div></div>}
          {submitted&&<div className="card animate-scaleIn" style={{textAlign:'center',padding:60}}><div style={{fontSize:64}}>{score>=80?'🎉':score>=60?'👍':'📚'}</div><h1 style={{fontSize:48,fontFamily:'Space Grotesk'}}>{score}%</h1><p style={{color:'var(--text-secondary)'}}>Quiz completed successfully.</p><button className="btn btn-primary" style={{marginTop:20}} onClick={()=>{setSelectedQuiz(null);setSubmitted(false);setActiveTab('history')}}>View History</button></div>}
          {activeTab==='history'&&<div className="card"><div className="card-header"><h3 className="card-title">Quiz History</h3></div><div className="table-container"><table><thead><tr><th>Quiz</th><th>Score</th><th>Date</th><th>Time</th></tr></thead><tbody>{myAttempts.map(a=><tr key={a.id}><td>{DS.getQuizById(a.quizId)?.title||'Quiz'}</td><td><span className={`badge ${a.score>=60?'badge-success':'badge-warning'}`}>{a.score}%</span></td><td>{a.date}</td><td>{a.timeTaken?`${Math.floor(a.timeTaken/60)}m ${a.timeTaken%60}s`:'-'}</td></tr>)}</tbody></table></div></div>}
        </div>;
      }

      const teacherQuizzes=quizzes.filter(q=>q.createdBy===user.id||role==='ADMIN'||role==='TEACHER');
      return <div>
        <div className="card card-gradient animate-fadeIn" style={{marginBottom:20}}><div style={{display:'flex',justifyContent:'space-between',gap:12,alignItems:'center',flexWrap:'wrap'}}><div><h2 style={{fontSize:24}}>AI Smart Quiz Engine</h2><p style={{opacity:.82,marginTop:5}}>Upload material → build a question bank → automate weekly assessment → analyze learning.</p></div><button className="btn" style={{background:'white',color:'var(--primary)'}} onClick={()=>setShowBuilder(true)}><i className="fas fa-plus"/> Create Quiz</button></div></div>
        <div className="tabs"><button className={`tab ${activeTab==='manage'?'active':''}`} onClick={()=>setActiveTab('manage')}>Quiz Management</button><button className={`tab ${activeTab==='materials'?'active':''}`} onClick={()=>setActiveTab('materials')}>Academic Materials</button><button className={`tab ${activeTab==='automation'?'active':''}`} onClick={()=>setActiveTab('automation')}>Saturday Automation</button><button className={`tab ${activeTab==='question-bank'?'active':''}`} onClick={()=>setActiveTab('question-bank')}>Question Bank</button></div>
        {activeTab==='manage'&&<div className="card animate-fadeIn"><div className="card-header"><h3 className="card-title">Quiz Management</h3><span className="badge badge-info">{teacherQuizzes.length} quizzes</span></div><div className="table-container"><table><thead><tr><th>Quiz</th><th>Subject</th><th>Questions</th><th>Source</th><th>Status</th><th>Action</th></tr></thead><tbody>{teacherQuizzes.map(q=><tr key={q.id}><td><strong>{q.title}</strong><div style={{fontSize:11,color:'var(--text-light)'}}>{q.createdAt?new Date(q.createdAt).toLocaleString():''}</div></td><td>{DS.getSubjectById(q.subjectId)?.name||'-'}</td><td>{q.questions?.length||0}</td><td>{q.source||'Manual'}</td><td><span className={`badge ${q.published?'badge-success':'badge-warning'}`}>{q.published?'Published':'Pending Approval'}</span></td><td>{!q.published&&q.createdBy===user.id?<button className="btn btn-sm btn-success" onClick={()=>{DS.updateQuiz(q.id,{published:true,approvalRequired:false});showToast('Quiz approved and published','success');setActiveTab('manage')}}>Approve</button>:<span className="badge badge-secondary">Ready</span>}</td></tr>)}</tbody></table></div></div>}
        {activeTab==='materials'&&<div className="grid-2"><div className="card"><div className="card-header"><h3 className="card-title">Upload Teaching Material</h3></div><div className="upload-zone"><i className="fas fa-file-upload" style={{fontSize:40,color:'var(--primary)'}}/><h4 style={{marginTop:12}}>Choose PDF, DOCX, TXT or CSV</h4><input type="file" accept=".pdf,.docx,.txt,.csv,.md,.pptx" onChange={e=>parseMaterialFile(e.target.files[0])} style={{marginTop:14}}/></div><div className="form-group" style={{marginTop:16}}><label className="form-label">Title</label><input className="input" value={materialTitle} onChange={e=>setMaterialTitle(e.target.value)}/></div><div className="form-group"><label className="form-label">Subject</label><select className="input" value={subjectId} onChange={e=>setSubjectId(e.target.value)}>{DS.getSubjects().map(s=><option key={s.id} value={s.id}>{s.name}</option>)}</select></div><div className="form-group"><label className="form-label">Google Docs (authorized link)</label><input className="input" placeholder="https://docs.google.com/..." value={googleDocUrl} onChange={e=>setGoogleDocUrl(e.target.value)}/></div><div className="form-group"><label className="form-label">Material Text</label><textarea className="input" style={{minHeight:180}} value={materialText} onChange={e=>setMaterialText(e.target.value)} placeholder="Paste lecture notes here if needed..."/></div><button className="btn btn-primary" onClick={saveMaterial} disabled={busy}><i className="fas fa-save"/> Save Material</button></div><div className="card"><div className="card-header"><h3 className="card-title">Saved Materials</h3></div>{DS.getAcademicMaterials({teacherId:user.id}).map(m=><div className="source-chip" style={{display:'flex',marginBottom:8}} key={m.id}><i className="fas fa-book"/> {m.title}<span style={{marginLeft:'auto'}}>{DS.getSubjectById(m.subjectId)?.code||''}</span></div>)}{!DS.getAcademicMaterials({teacherId:user.id}).length&&<EmptyState icon="fa-folder-open" title="No materials" description="Upload your first teaching material."/>}</div></div>}
        {activeTab==='automation'&&<div className="automation-card"><h3 style={{fontSize:18,fontWeight:800}}><i className="fas fa-robot"/> Saturday Weekly Quiz Automation</h3><p style={{color:'var(--text-secondary)',margin:'8px 0 18px'}}>When the app is open on Saturday, the browser checks this schedule. Production deployment should move the scheduler to a backend job for guaranteed execution.</p><div className="grid-2"><div><label className="form-label">Subject</label><select className="input" value={subjectId} onChange={e=>setSubjectId(e.target.value)}>{DS.getSubjects().map(s=><option key={s.id} value={s.id}>{s.name}</option>)}</select></div><div><label className="form-label">Time</label><input type="time" className="input" value={weeklyTime} onChange={e=>setWeeklyTime(e.target.value)}/></div><div><label className="form-label">Questions</label><input type="number" min="1" max="50" className="input" value={questionCount} onChange={e=>setQuestionCount(Number(e.target.value)||10)}/></div><div><label className="form-label">Duration (minutes)</label><input type="number" min="1" className="input" value={duration} onChange={e=>setDuration(Number(e.target.value)||15)}/></div></div><div style={{marginTop:18,display:'flex',gap:18,flexWrap:'wrap'}}><label><input type="checkbox" checked={autoEnabled} onChange={e=>setAutoEnabled(e.target.checked)}/> Enable weekly quiz</label><label><input type="checkbox" checked={approvalRequired} onChange={e=>setApprovalRequired(e.target.checked)}/> Teacher approval required</label></div><div style={{marginTop:18,display:'flex',gap:8,flexWrap:'wrap'}}><button className="btn btn-primary" onClick={saveAutomation}>Save Automation</button><button className="btn btn-secondary" onClick={runWeeklyNow}>Generate Test Run Now</button></div></div>}
        {activeTab==='question-bank'&&<div className="card"><div className="card-header"><h3 className="card-title">Reusable Question Bank</h3></div><div className="table-container"><table><thead><tr><th>Question</th><th>Subject</th><th>Topic</th><th>Difficulty</th><th>Source</th><th>Status</th></tr></thead><tbody>{DS.getQuestionBank({}).filter(q=>q.createdBy===user.id||role==='ADMIN').map(q=><tr key={q.id}><td>{q.text}</td><td>{DS.getSubjectById(q.subjectId)?.code||'-'}</td><td>{q.topic||'-'}</td><td>{q.difficulty}</td><td>{q.source}</td><td><span className={`badge ${q.approved?'badge-success':'badge-warning'}`}>{q.approved?'Approved':'Review'}</span></td></tr>)}</tbody></table></div></div>}
        {showBuilder&&<Modal isOpen={showBuilder} onClose={()=>setShowBuilder(false)} title="Create Smart Quiz" footer={<><button className="btn btn-secondary" onClick={()=>setShowBuilder(false)}>Cancel</button>{builderMode==='AI'?<button className="btn btn-primary" onClick={()=>createGeneratedQuiz(true)} disabled={busy}><i className="fas fa-wand-magic-sparkles"/> Generate Quiz</button>:<button className="btn btn-primary" onClick={createManualQuiz}>Publish Manual Quiz</button>}</>}>
          <div className="tabs"><button className={`tab ${builderMode==='AI'?'active':''}`} onClick={()=>setBuilderMode('AI')}>AI Generated</button><button className={`tab ${builderMode==='MANUAL'?'active':''}`} onClick={()=>setBuilderMode('MANUAL')}>Manual</button></div>
          <div className="grid-2"><div className="form-group"><label className="form-label">Subject</label><select className="input" value={subjectId} onChange={e=>setSubjectId(e.target.value)}>{DS.getSubjects().map(s=><option key={s.id} value={s.id}>{s.name}</option>)}</select></div><div className="form-group"><label className="form-label">Topic</label><input className="input" value={topic} onChange={e=>setTopic(e.target.value)} placeholder="e.g. Normalization"/></div><div className="form-group"><label className="form-label">Questions</label><input type="number" className="input" min="1" max="50" value={questionCount} onChange={e=>setQuestionCount(Number(e.target.value)||10)}/></div><div className="form-group"><label className="form-label">Duration</label><input type="number" className="input" min="1" value={duration} onChange={e=>setDuration(Number(e.target.value)||15)}/></div><div className="form-group"><label className="form-label">Difficulty</label><select className="input" value={difficulty} onChange={e=>setDifficulty(e.target.value)}><option>Easy</option><option>Medium</option><option>Hard</option><option>Mixed</option></select></div></div>
          {builderMode==='AI'?<><div className="form-group"><label className="form-label">Material Source</label><input type="file" accept=".pdf,.docx,.txt,.csv,.md" onChange={e=>parseMaterialFile(e.target.files[0])}/><textarea className="input" style={{marginTop:10,minHeight:150}} value={materialText} onChange={e=>setMaterialText(e.target.value)} placeholder="Paste teaching material here..."/></div><div className="source-chip"><i className="fas fa-shield-check"/> AI questions are validated structurally and can require teacher approval before publishing.</div></>:<textarea className="input" style={{minHeight:220}} value={manualText} onChange={e=>setManualText(e.target.value)} placeholder="One question per line: Question | A | B | C | D | correctIndex"/>}
        </Modal>}
      </div>;
    }


    // ===================== FEES =====================
    

function FeesPage({ user, role, viewAs }) {
      const effectiveRole = viewAs || role;
      const [showReceipt, setShowReceipt] = useState(null);
      const [filterMethod, setFilterMethod] = useState('ALL');
      const [search, setSearch] = useState('');
      const [showPayModal, setShowPayModal] = useState(false);
      const [payMode, setPayMode] = useState('UPI');
      const [payAmount, setPayAmount] = useState('');
      const [selectedHeads, setSelectedHeads] = useState([]);
      const [upiId, setUpiId] = useState('student@okaxis');
      const [cardNo, setCardNo] = useState('4532 •••• •••• 8821');
      const [cardExp, setCardExp] = useState('12/28');
      const [cardCvv, setCardCvv] = useState('883');
      const [selectedBank, setSelectedBank] = useState('HDFC Bank');
      const [isProcessing, setIsProcessing] = useState(false);

      // Accountant Collect Modal
      const [showCollectModal, setShowCollectModal] = useState(false);
      const [collectStudentId, setCollectStudentId] = useState(DS.getStudents()[0]?.id || '');
      const [collectAmount, setCollectAmount] = useState('');
      const [collectMode, setCollectMode] = useState('CASH');
      const [collectRef, setCollectRef] = useState('');
      const [collectHead, setCollectHead] = useState('Tuition Fee');

      // Fee Structure Modal
      const [showStructureModal, setShowStructureModal] = useState(false);
      const [structClassId, setStructClassId] = useState(DS.getClasses()[0]?.id || '');
      const [structSem, setStructSem] = useState(1);
      const [structDueDate, setStructDueDate] = useState('2026-11-30');
      const [structTuition, setStructTuition] = useState('45000');
      const [structLab, setStructLab] = useState('8000');
      const [structExam, setStructExam] = useState('3500');
      const [structLibrary, setStructLibrary] = useState('2000');

      const [, setTick] = useState(0);

      const student = effectiveRole === 'STUDENT' ? (DS.getStudentById(user?.id) || DS.getStudents()[0]) : null;
      const feeStructure = student ? DS.getFeeStructureForStudent(student.id) : null;
      const balances = student ? DS.getStudentFeeBalances(student.id) : [];
      const pendingTotal = student ? DS.getTotalPending(student.id) : 0;
      const totalPaid = student ? DS.getTotalPaid(student.id) : 0;
      const myTxs = student ? DS.getFeeTransactions(student.id) : [];
      const allTxs = DS.getAllFeeTransactions() || [];

      const paymentMethods = [
        ['UPI', 'UPI / QR Scan', 'fa-qrcode'],
        ['CARD', 'Debit / Credit Card', 'fa-credit-card'],
        ['NET_BANKING', 'Net Banking', 'fa-university'],
        ['CASH', 'Cash Counter', 'fa-money-bill-wave'],
        ['CHEQUE', 'Cheque / DD', 'fa-money-check-alt']
      ];
      const getLabel = m => paymentMethods.find(x => x[0] === m)?.[1] || m;
      const getIcon = m => paymentMethods.find(x => x[0] === m)?.[2] || 'fa-receipt';

      const handleOnlinePayment = () => {
        const amt = Number(payAmount) || pendingTotal;
        if (amt <= 0) { showToast('Please enter a valid payment amount', 'error'); return; }
        setIsProcessing(true);
        setTimeout(() => {
          setIsProcessing(false);
          const headsToPay = selectedHeads.length ? selectedHeads : (feeStructure?.feeHeads?.map(h=>h.head) || ['Tuition Fee']);
          const tx = DS.payFee(student.id, amt, payMode, headsToPay);
          setShowPayModal(false);
          setTick(t => t + 1);
          triggerConfetti();
          showToast(`Payment of ₹${amt.toLocaleString('en-IN')} successful!`, 'success');
          setShowReceipt(tx);
        }, 800);
      };

      const handleAccountantCollect = () => {
        const amt = Number(collectAmount);
        if (!amt || amt <= 0) { showToast('Please enter valid collected amount', 'error'); return; }
        const tx = DS.payFee(collectStudentId, amt, collectMode, [collectHead]);
        setShowCollectModal(false);
        setCollectAmount('');
        setCollectRef('');
        setTick(t => t + 1);
        showToast(`Collected ₹${amt.toLocaleString('en-IN')} successfully!`, 'success');
        setShowReceipt(tx);
      };

      const handleSaveStructure = () => {
        const t = Number(structTuition)||0;
        const l = Number(structLab)||0;
        const e = Number(structExam)||0;
        const lib = Number(structLibrary)||0;
        const total = t + l + e + lib;
        const newStruct = {
          id: 'fs_' + Date.now(),
          classId: structClassId,
          semester: Number(structSem)||1,
          totalAmount: total,
          dueDate: structDueDate,
          feeHeads: [
            { head: 'Tuition Fee', amount: t, mandatory: true },
            { head: 'Lab Fee', amount: l, mandatory: true },
            { head: 'Exam Fee', amount: e, mandatory: true },
            { head: 'Library Fee', amount: lib, mandatory: false }
          ]
        };
        DS.addFeeStructure(newStruct);
        setShowStructureModal(false);
        setTick(t => t + 1);
        showToast('New fee structure configured successfully!', 'success');
      };

      const exportLedgerCSV = () => {
        const headers = ['Receipt No', 'Date', 'GR No', 'Student Name', 'Fee Heads', 'Amount Paid', 'Mode', 'Status'];
        const rows = allTxs.map(t => [
          t.receiptNumber,
          new Date(t.paidAt).toLocaleDateString(),
          t.grNumber || '',
          `"${DS.getStudentById(t.studentId)?.name || 'Unknown'}"`,
          `"${(t.feeHeads?.join(', ') || t.feeHead || '')}"`,
          t.amountPaid,
          t.paymentMode,
          t.status
        ]);
        const csvContent = 'data:text/csv;charset=utf-8,' + [headers.join(','), ...rows.map(e => e.join(','))].join('\n');
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement('a');
        link.setAttribute('href', encodedUri);
        link.setAttribute('download', `fee_ledger_${new Date().toISOString().slice(0,10)}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        showToast('Fee ledger exported as CSV', 'success');
      };

      if (effectiveRole === 'STUDENT') {
        return (
          <div>
            <div className="stats-grid">
              <StatCard icon="fa-rupee-sign" iconClass="green" label="Total Paid" value={totalPaid} delay={1} />
              <StatCard icon="fa-exclamation-triangle" iconClass="red" label="Pending" value={pendingTotal} delay={2} />
              <StatCard icon="fa-receipt" iconClass="purple" label="Transactions" value={myTxs.length} delay={3} />
              <StatCard icon="fa-percentage" iconClass="blue" label="Payment Progress" value={feeStructure?Math.round(totalPaid/feeStructure.totalAmount*100):0} suffix="%" delay={4} />
            </div>

            <div className="card animate-fadeIn" style={{marginBottom:20}}>
              <div className="card-header">
                <h3 className="card-title"><i className="fas fa-file-invoice"/> Fee Card · Semester {student?.semester}</h3>
                <div style={{display:'flex',gap:'10px',alignItems:'center'}}>
                  <span className={`badge ${pendingTotal?'badge-warning':'badge-success'}`}>
                    {pendingTotal?'Payment Due':'Fully Paid'}
                  </span>
                  {pendingTotal > 0 && (
                    <button className="btn btn-primary btn-sm" onClick={()=>{
                      setPayAmount(pendingTotal);
                      setShowPayModal(true);
                    }}>
                      <i className="fas fa-bolt"></i> Pay Fees Online
                    </button>
                  )}
                </div>
              </div>

              {balances.map(f=> (
                <div className="fee-select-row" key={f.head}>
                  <div>
                    <span className={`fee-head-badge ${f.mandatory?'mandatory':'optional'}`}>{f.head}</span>
                    <div style={{fontSize:11,color:'var(--text-light)',marginTop:5}}>
                      {f.mandatory?'Mandatory':'Optional'} · Paid ₹{f.paid.toLocaleString('en-IN')} / ₹{f.amount.toLocaleString('en-IN')}
                    </div>
                  </div>
                  <strong>{f.due>0?`₹${f.due.toLocaleString('en-IN')} due`:'✓ Paid'}</strong>
                </div>
              ))}

              <div style={{marginTop:18,padding:20,borderRadius:14,background:'var(--bg-primary)',display:'flex',justifyContent:'space-between',alignItems:'center',gap:16,flexWrap:'wrap'}}>
                <div>
                  <div style={{fontSize:12,color:'var(--text-light)'}}>Outstanding Balance</div>
                  <div style={{fontSize:30,fontWeight:900,color:pendingTotal>0?'var(--danger)':'var(--success)'}}>
                    ₹{pendingTotal.toLocaleString('en-IN')}
                  </div>
                </div>
                {pendingTotal > 0 && (
                  <button className="btn btn-success" onClick={()=>{
                    setPayAmount(pendingTotal);
                    setShowPayModal(true);
                  }}>
                    <i className="fas fa-lock"></i> Pay Now · ₹{pendingTotal.toLocaleString('en-IN')}
                  </button>
                )}
              </div>
            </div>

            <div className="card">
              <div className="card-header">
                <h3 className="card-title"><i className="fas fa-history"/> Payment History & Receipts</h3>
              </div>
              <div className="table-container">
                <table>
                  <thead>
                    <tr>
                      <th>Date</th>
                      <th>Receipt #</th>
                      <th>Fee Heads</th>
                      <th>Amount</th>
                      <th>Method</th>
                      <th>Status</th>
                      <th>Actions</th>
                    </tr>
                  </thead>
                  <tbody>
                    {myTxs.length === 0 ? (
                      <tr><td colSpan="7" style={{textAlign:'center',padding:30,color:'var(--text-light)'}}>No payment records found.</td></tr>
                    ) : myTxs.map(t=> (
                      <tr key={t.id}>
                        <td>{new Date(t.paidAt).toLocaleDateString()}</td>
                        <td><span className="badge badge-primary">{t.receiptNumber}</span></td>
                        <td>{t.feeHeads?.join(', ')||t.feeHead}</td>
                        <td><strong>₹{Number(t.amountPaid).toLocaleString('en-IN')}</strong></td>
                        <td><span className="badge badge-info"><i className={`fas ${getIcon(t.paymentMode)}`}/> {getLabel(t.paymentMode)}</span></td>
                        <td><span className="badge badge-success">{t.status}</span></td>
                        <td>
                          <button className="btn btn-sm btn-secondary" onClick={()=>setShowReceipt(t)} title="View & Print Official Receipt">
                            <i className="fas fa-receipt"/> Receipt
                          </button>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>

            {/* Student Payment Gateway Modal */}
            {showPayModal && (
              <Modal isOpen={showPayModal} onClose={()=>setShowPayModal(false)} title="EDUTrack Pay · Instant Fee Checkout"
                footer={<>
                  <button className="btn btn-secondary" onClick={()=>setShowPayModal(false)} disabled={isProcessing}>Cancel</button>
                  <button className="btn btn-primary" onClick={handleOnlinePayment} disabled={isProcessing}>
                    {isProcessing ? <><i className="fas fa-spinner fa-spin"></i> Processing...</> : <><i className="fas fa-lock"></i> Authorize & Pay ₹{Number(payAmount||pendingTotal).toLocaleString('en-IN')}</>}
                  </button>
                </>}>
                <div>
                  <div style={{background:'var(--bg-primary)',padding:16,borderRadius:12,marginBottom:18,display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                    <div>
                      <div style={{fontSize:12,color:'var(--text-light)'}}>Student Account</div>
                      <strong>{student?.name} (GR: {student?.grNumber})</strong>
                    </div>
                    <div style={{textAlign:'right'}}>
                      <div style={{fontSize:12,color:'var(--text-light)'}}>Amount Due</div>
                      <strong style={{color:'var(--danger)',fontSize:16}}>₹{pendingTotal.toLocaleString('en-IN')}</strong>
                    </div>
                  </div>

                  <div className="form-group">
                    <label className="form-label">Payment Amount (₹)</label>
                    <input className="input" type="number" value={payAmount} onChange={e=>setPayAmount(e.target.value)} placeholder={`Max ₹${pendingTotal}`} />
                  </div>

                  <div className="form-group">
                    <label className="form-label">Select Payment Gateway / Method</label>
                    <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:10}}>
                      {[['UPI','UPI / QR','fa-qrcode'],['CARD','Cards','fa-credit-card'],['NET_BANKING','NetBanking','fa-university']].map(([m,l,ic])=> (
                        <button key={m} type="button" className={`btn btn-sm btn-${payMode===m?'primary':'secondary'}`} onClick={()=>setPayMode(m)} style={{display:'flex',flexDirection:'column',alignItems:'center',gap:6,padding:12}}>
                          <i className={`fas ${ic}`} style={{fontSize:18}}></i>
                          <span>{l}</span>
                        </button>
                      ))}
                    </div>
                  </div>

                  {payMode === 'UPI' && (
                    <div style={{border:'1px solid var(--border-light)',padding:16,borderRadius:12,textAlign:'center',background:'var(--bg-card)'}}>
                      <div style={{background:'#fff',padding:12,borderRadius:8,display:'inline-block',marginBottom:10}}>
                        {/* Simulated QR code box */}
                        <div style={{width:130,height:130,background:'repeating-conic-gradient(#1e1b4b 0% 25%, #ffffff 0% 50%) 50% / 20px 20px',borderRadius:4,display:'flex',alignItems:'center',justifyContent:'center'}}>
                          <div style={{background:'#fff',padding:4,borderRadius:4,fontWeight:900,fontSize:10,color:'#4f46e5'}}>EDU-PAY</div>
                        </div>
                      </div>
                      <p style={{fontSize:12,color:'var(--text-secondary)',marginBottom:8}}>Scan with Google Pay, PhonePe, Paytm, or BHIM</p>
                      <div style={{display:'flex',gap:8,maxWidth:280,margin:'0 auto'}}>
                        <input className="input" value={upiId} onChange={e=>setUpiId(e.target.value)} placeholder="yourname@upi" />
                        <button className="btn btn-sm btn-secondary" onClick={()=>showToast('UPI Request sent to mobile app!','info')}>Verify</button>
                      </div>
                    </div>
                  )}

                  {payMode === 'CARD' && (
                    <div style={{border:'1px solid var(--border-light)',padding:16,borderRadius:12,background:'var(--bg-card)'}}>
                      <div className="form-group">
                        <label className="form-label">Card Number</label>
                        <input className="input" value={cardNo} onChange={e=>setCardNo(e.target.value)} placeholder="16-digit card number" />
                      </div>
                      <div className="grid-2">
                        <div className="form-group">
                          <label className="form-label">Expiry MM/YY</label>
                          <input className="input" value={cardExp} onChange={e=>setCardExp(e.target.value)} placeholder="MM/YY" />
                        </div>
                        <div className="form-group">
                          <label className="form-label">CVV</label>
                          <input className="input" type="password" maxLength="4" value={cardCvv} onChange={e=>setCardCvv(e.target.value)} placeholder="•••" />
                        </div>
                      </div>
                    </div>
                  )}

                  {payMode === 'NET_BANKING' && (
                    <div style={{border:'1px solid var(--border-light)',padding:16,borderRadius:12,background:'var(--bg-card)'}}>
                      <label className="form-label">Choose Bank</label>
                      <select className="input" value={selectedBank} onChange={e=>setSelectedBank(e.target.value)}>
                        <option>HDFC Bank</option>
                        <option>State Bank of India (SBI)</option>
                        <option>ICICI Bank</option>
                        <option>Axis Bank</option>
                        <option>Punjab National Bank</option>
                        <option>Kotak Mahindra Bank</option>
                      </select>
                      <div style={{fontSize:12,color:'var(--text-light)',marginTop:8}}>
                        <i className="fas fa-shield-alt"></i> You will be redirected to safe 256-bit encrypted banking portal.
                      </div>
                    </div>
                  )}
                </div>
              </Modal>
            )}

            {showReceipt && (
              <Modal isOpen={!!showReceipt} onClose={()=>setShowReceipt(null)} title={`Official Fee Receipt · ${showReceipt.receiptNumber}`}
                footer={<>
                  <button className="btn btn-secondary" onClick={()=>printReceipt(showReceipt, 'STUDENT COPY')}><i className="fas fa-print"></i> Print Official Receipt</button>
                  <button className="btn btn-primary" onClick={()=>setShowReceipt(null)}>Done</button>
                </>}>
                <div className="receipt-box" style={{border:'1px dashed var(--border-color)',padding:20,borderRadius:12}}>
                  <div style={{textAlign:'center',marginBottom:16}}>
                    <h3 style={{margin:0,color:'var(--primary)'}}>{DS.getSettings().institutionName}</h3>
                    <div style={{fontSize:12,color:'var(--text-light)'}}>{DS.getSettings().address}</div>
                    <div className="badge badge-success" style={{marginTop:8}}>PAYMENT CONFIRMED</div>
                  </div>
                  <div className="grid-2" style={{fontSize:13,gap:12}}>
                    <div><span style={{color:'var(--text-light)'}}>Student:</span> <strong>{student?.name}</strong></div>
                    <div><span style={{color:'var(--text-light)'}}>GR No:</span> <strong>{showReceipt.grNumber}</strong></div>
                    <div><span style={{color:'var(--text-light)'}}>Receipt No:</span> <strong>{showReceipt.receiptNumber}</strong></div>
                    <div><span style={{color:'var(--text-light)'}}>Txn ID:</span> <strong>{showReceipt.transactionId}</strong></div>
                    <div><span style={{color:'var(--text-light)'}}>Heads:</span> <strong>{showReceipt.feeHeads?.join(', ') || showReceipt.feeHead}</strong></div>
                    <div><span style={{color:'var(--text-light)'}}>Method:</span> <strong>{getLabel(showReceipt.paymentMode)}</strong></div>
                  </div>
                  <div style={{textAlign:'center',marginTop:20,paddingTop:14,borderTop:'1px solid var(--border-light)'}}>
                    <div style={{fontSize:12,color:'var(--text-light)'}}>Amount Paid</div>
                    <div style={{fontSize:32,fontWeight:900,color:'var(--success)'}}>₹{Number(showReceipt.amountPaid).toLocaleString('en-IN')}</div>
                  </div>
                </div>
              </Modal>
            )}
          </div>
        );
      }

      if (effectiveRole === 'ACCOUNTANT') {
        const filtered = allTxs.filter(t => (filterMethod === 'ALL' || t.paymentMode === filterMethod) && (!search || String(t.grNumber).toLowerCase().includes(search.toLowerCase()) || String(DS.getStudentById(t.studentId)?.name || '').toLowerCase().includes(search.toLowerCase())));
        const total = filtered.filter(t=>t.status==='SUCCESS').reduce((a,t)=>a+Number(t.amountPaid||0),0);
        return (
          <div>
            <div className="stats-grid">
              <StatCard icon="fa-rupee-sign" iconClass="green" label="Total Collected" value={total} delay={1} />
              <StatCard icon="fa-receipt" iconClass="purple" label="Transactions" value={filtered.length} delay={2} />
              <StatCard icon="fa-users" iconClass="blue" label="Total Students" value={DS.getStudents().length} delay={3} />
              <StatCard icon="fa-exclamation-triangle" iconClass="red" label="Pending Dues" value={DS.getStudents().filter(s=>DS.getTotalPending(s.id)>0).length} delay={4} />

            <div className="card" style={{marginBottom:20}}>
              <div style={{display:'flex',gap:12,flexWrap:'wrap',alignItems:'center',justifyContent:'space-between'}}>
                <div style={{display:'flex',gap:10,flex:1,minWidth:280,flexWrap:'wrap'}}>

                  <select className="input" style={{width:'auto'}} value={filterMethod} onChange={e=>setFilterMethod(e.target.value)}>
                    <option value="ALL">All Payment Methods</option>

                  </select>

                <div style={{display:'flex',gap:10}}>
                  <button className="btn btn-secondary btn-sm" onClick={exportLedgerCSV}>
                    <i className="fas fa-file-csv"></i> Export CSV
                  </button>
                  <button className="btn btn-success btn-sm" onClick={()=>{
                    const stus = DS.getStudents();
                    if (stus.length) {
                      setCollectStudentId(stus[0].id);
                      setCollectAmount(DS.getTotalPending(stus[0].id) || 15000);
                    }
                    setShowCollectModal(true);
                  }}>
                    <i className="fas fa-hand-holding-usd"></i> Collect Fee Offline
                  </button>
                </div>
              </div>
            </div>

            <div className="card">
              <div className="card-header">
                <h3 className="card-title"><i className="fas fa-file-invoice-dollar"/> Accountant Payment Ledger</h3>
                <span className="badge badge-info">{filtered.length} Records</span>
              </div>
              <div className="table-container">
                <table>
                  <thead>
                    <tr>
                      <th>Date</th>
                      <th>Receipt</th>
                      <th>GR No</th>
                      <th>Student</th>
                      <th>Fee Head</th>
                      <th>Amount</th>
                      <th>Method</th>
                      <th>Status</th>
                      <th>Actions</th>
                    </tr>
                  </thead>
                  <tbody>
                    {filtered.length === 0 ? (
                      <tr><td colSpan="9" style={{textAlign:'center',padding:30,color:'var(--text-light)'}}>No matching payment entries found.</td></tr>
                    ) : filtered.map(t=> (
                      <tr key={t.id}>
                        <td>{new Date(t.paidAt).toLocaleDateString()}</td>
                        <td><span className="badge badge-primary">{t.receiptNumber}</span></td>
                        <td><strong>{t.grNumber}</strong></td>
                        <td>{DS.getStudentById(t.studentId)?.name || 'Unknown'}</td>
                        <td>{t.feeHeads?.join(', ') || t.feeHead}</td>
                        <td><strong>₹{Number(t.amountPaid).toLocaleString('en-IN')}</strong></td>
                        <td><span className="badge badge-info"><i className={`fas ${getIcon(t.paymentMode)}`}/> {getLabel(t.paymentMode)}</span></td>
                        <td><span className={`badge ${t.status==='SUCCESS'?'badge-success':'badge-warning'}`}>{t.status}</span></td>
                        <td>
                          <button className="btn btn-sm btn-secondary" onClick={()=>setShowReceipt(t)} title="Print Accountant Copy">
                            <i className="fas fa-receipt"/>
                          </button>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>

            {/* Offline Collection Modal */}
            {showCollectModal && (
              <Modal isOpen={showCollectModal} onClose={()=>setShowCollectModal(false)} title="Counter Fee Collection (Cash / Cheque / DD / POS)"
                footer={<>
                  <button className="btn btn-secondary" onClick={()=>setShowCollectModal(false)}>Cancel</button>
                  <button className="btn btn-success" onClick={handleAccountantCollect}>
                    <i className="fas fa-check-circle"></i> Confirm & Issue Receipt
                  </button>
                </>}>
                <div className="form-group">
                  <label className="form-label">Select Student</label>
                  <select className="input" value={collectStudentId} onChange={e=>{
                    setCollectStudentId(e.target.value);
                    const due = DS.getTotalPending(e.target.value);
                    if (due > 0) setCollectAmount(due);
                  }}>
                    {DS.getStudents().map(s=> (
                      <option key={s.id} value={s.id}>{s.name} · GR: {s.grNumber} · Pending: ₹{DS.getTotalPending(s.id).toLocaleString('en-IN')}</option>
                    ))}
                  </select>
                </div>
                <div className="grid-2">
                  <div className="form-group">
                    <label className="form-label">Fee Head</label>
                    <select className="input" value={collectHead} onChange={e=>setCollectHead(e.target.value)}>
                      <option>Tuition Fee</option>
                      <option>Lab & Practical Fee</option>
                      <option>Examination Fee</option>
                      <option>Library & Reading Room</option>
                      <option>Sports & Cultural Fee</option>
                    </select>
                  </div>
                  <div className="form-group">
                    <label className="form-label">Payment Mode</label>
                    <select className="input" value={collectMode} onChange={e=>setCollectMode(e.target.value)}>
                      <option value="CASH">Cash Counter</option>
                      <option value="CHEQUE">Cheque</option>
                      <option value="DD">Demand Draft (DD)</option>
                      <option value="CARD">Debit / Credit POS</option>
                      <option value="UPI">Counter QR / UPI</option>
                      <option value="BANK_TRANSFER">NEFT / RTGS</option>
                    </select>
                  </div>
                </div>
                <div className="grid-2">
                  <div className="form-group">
                    <label className="form-label">Amount Collected (₹)</label>
                    <input className="input" type="number" value={collectAmount} onChange={e=>setCollectAmount(e.target.value)} />
                  </div>
                  <div className="form-group">
                    <label className="form-label">Cheque / Txn / Ref No.</label>
                    <input className="input" value={collectRef} onChange={e=>setCollectRef(e.target.value)} placeholder="e.g. CHQ-992120 / UTR" />
                  </div>
                </div>
              </Modal>
            )}

            {showReceipt && (
              <Modal isOpen={!!showReceipt} onClose={()=>setShowReceipt(null)} title={`Official Receipt · ${showReceipt.receiptNumber}`}
                footer={<>
                  <button className="btn btn-secondary" onClick={()=>printReceipt(showReceipt,'OFFICE / ACCOUNTANT COPY')}><i className="fas fa-print"></i> Print Office Copy</button>
                  <button className="btn btn-primary" onClick={()=>setShowReceipt(null)}>Close</button>
                </>}>
                <div className="receipt-box" style={{border:'1px dashed var(--border-color)',padding:20,borderRadius:12}}>
                  <h3 style={{textAlign:'center',color:'var(--primary)'}}>{DS.getSettings().institutionName}</h3>
                  <div style={{textAlign:'center',fontSize:12,color:'var(--text-light)',marginBottom:16}}>ACCOUNTANT LEDGER VOUCHER</div>
                  <div className="grid-2">
                    <div><label className="form-label">Student</label><strong>{DS.getStudentById(showReceipt.studentId)?.name}</strong></div>
                    <div><label className="form-label">GR Number</label><strong>{showReceipt.grNumber}</strong></div>
                    <div><label className="form-label">Receipt #</label><strong>{showReceipt.receiptNumber}</strong></div>
                    <div><label className="form-label">Transaction ID</label><strong>{showReceipt.transactionId}</strong></div>
                    <div><label className="form-label">Fee Heads</label><strong>{showReceipt.feeHeads?.join(', ') || showReceipt.feeHead}</strong></div>
                    <div><label className="form-label">Payment Method</label><strong>{getLabel(showReceipt.paymentMode)}</strong></div>
                  </div>
                  <div style={{textAlign:'center',marginTop:20,fontSize:32,fontWeight:900,color:'var(--primary)'}}>
                    ₹{Number(showReceipt.amountPaid).toLocaleString('en-IN')}
                  </div>
                </div>
              </Modal>
            )}
          </div>
        );
      }

      // ADMIN / MANAGEMENT VIEW
      return (
        <div className="card animate-fadeIn">
          <div className="card-header">
            <div>
              <h3 className="card-title"><i className="fas fa-sliders-h"></i> Institutional Fee Structure Manager</h3>
              <p style={{fontSize:12,color:'var(--text-light)',margin:'4px 0 0 0'}}>Configure semester tuition, labs, library, and examination fees across branches.</p>
            </div>
            <div style={{display:'flex',gap:10}}>
              <button className="btn btn-secondary btn-sm" onClick={exportLedgerCSV}><i className="fas fa-file-csv"></i> Export Ledger</button>
              <button className="btn btn-primary btn-sm" onClick={()=>setShowStructureModal(true)}><i className="fas fa-plus"></i> Configure New Fee Structure</button>
            </div>
          </div>
          <div className="table-container">
            <table>
              <thead>
                <tr>
                  <th>Class / Department</th>
                  <th>Semester</th>
                  <th>Total Fee</th>
                  <th>Due Date</th>
                  <th>Fee Components Breakdown</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody>
                {DS.getFeeStructures().map(f=> (
                  <tr key={f.id}>
                    <td><strong>{DS.getClassById(f.classId)?.name || f.classId}</strong></td>
                    <td><span className="badge badge-secondary">Semester {f.semester}</span></td>
                    <td><strong style={{color:'var(--primary)',fontSize:15}}>₹{Number(f.totalAmount).toLocaleString('en-IN')}</strong></td>
                    <td><span className="badge badge-warning">{f.dueDate}</span></td>
                    <td>
                      <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
                        {f.feeHeads.map((x,idx)=> (
                          <span key={idx} className="badge badge-info" style={{fontSize:11}}>
                            {x.head}: ₹{Number(x.amount).toLocaleString('en-IN')}
                          </span>
                        ))}
                      </div>
                    </td>
                    <td>
                      <button className="btn btn-sm btn-secondary" onClick={()=>showToast('Fee structure active and locked for current term','info')}>
                        <i className="fas fa-check"></i> Active
                      </button>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>

          {showStructureModal && (
            <Modal isOpen={showStructureModal} onClose={()=>setShowStructureModal(false)} title="Configure Class Fee Structure"
              footer={<>
                <button className="btn btn-secondary" onClick={()=>setShowStructureModal(false)}>Cancel</button>
                <button className="btn btn-primary" onClick={handleSaveStructure}>Save Fee Structure</button>
              </>}>
              <div className="grid-2">
                <div className="form-group">
                  <label className="form-label">Target Class</label>
                  <select className="input" value={structClassId} onChange={e=>setStructClassId(e.target.value)}>
                    {DS.getClasses().map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
                  </select>
                </div>
                <div className="form-group">
                  <label className="form-label">Semester</label>
                  <input className="input" type="number" min="1" max="8" value={structSem} onChange={e=>setStructSem(e.target.value)} />
                </div>
              </div>
              <div className="form-group">
                <label className="form-label">Fee Due Date</label>
                <input className="input" type="date" value={structDueDate} onChange={e=>setStructDueDate(e.target.value)} />
              </div>
              <div className="grid-2">
                <div className="form-group">
                  <label className="form-label">Tuition Fee (₹)</label>
                  <input className="input" type="number" value={structTuition} onChange={e=>setStructTuition(e.target.value)} />
                </div>
                <div className="form-group">
                  <label className="form-label">Laboratory Fee (₹)</label>
                  <input className="input" type="number" value={structLab} onChange={e=>setStructLab(e.target.value)} />
                </div>
                <div className="form-group">
                  <label className="form-label">Exam Fee (₹)</label>
                  <input className="input" type="number" value={structExam} onChange={e=>setStructExam(e.target.value)} />
                </div>
                <div className="form-group">
                  <label className="form-label">Library & Amenities (₹)</label>
                  <input className="input" type="number" value={structLibrary} onChange={e=>setStructLibrary(e.target.value)} />
                </div>
              </div>
              <div style={{background:'var(--bg-primary)',padding:12,borderRadius:8,textAlign:'right'}}>
                Total Semester Fee: <strong style={{color:'var(--primary)',fontSize:18}}>₹{(Number(structTuition||0)+Number(structLab||0)+Number(structExam||0)+Number(structLibrary||0)).toLocaleString('en-IN')}</strong>
              </div>
            </Modal>
          )}
        </div>
      );
    }


function TransportPage({ user, role, viewAs }) {
      const effectiveRole = viewAs || role;
      const [activeTab, setActiveTab] = useState(effectiveRole==='STUDENT'?'my-transport':'routes');
      const [showAddRoute, setShowAddRoute] = useState(false);
      const [showAllocate, setShowAllocate] = useState(false);
      const [newRouteName, setNewRouteName] = useState('');
      const [newRouteCode, setNewRouteCode] = useState('');
      const [newVehicle, setNewVehicle] = useState('MH-12-BP-4491');
      const [newDriver, setNewDriver] = useState('Ramesh Sharma');
      const [newDriverPhone, setNewDriverPhone] = useState('+91 98230 11223');
      const [selectedRoute, setSelectedRoute] = useState(DS.getTransportRoutes()[0]?.id || '');
      const [selectedStudent, setSelectedStudent] = useState(DS.getStudents()[0]?.id || '');
      const [selectedStop, setSelectedStop] = useState(0);
      const [allocFee, setAllocFee] = useState('12000');
      const [simStep, setSimStep] = useState(1);
      const [isTrackingLive, setIsTrackingLive] = useState(false);
      const [, setTick] = useState(0);

      const student = DS.getStudentById(user?.id) || (effectiveRole==='STUDENT' ? DS.getStudents()[0] : null);
      const routes = DS.getTransportRoutes();
      const allocations = DS.getTransportAllocations(student?.id);
      const allAllocations = DS.getTransportAllocations();

      useEffect(() => {
        if (!isTrackingLive) return;
        const interval = setInterval(() => {
          setSimStep(s => (s >= 3 ? 3 : s + 1));
        }, 8000);
        return () => clearInterval(interval);
      }, [isTrackingLive]);

      const handleSaveRoute = () => {
        if (!newRouteName || !newRouteCode) { showToast('Please enter route name and code', 'error'); return; }
        const r = {
          id: 'route_' + Date.now(),
          routeName: newRouteName,
          routeCode: newRouteCode,
          vehicleNumber: newVehicle,
          driverName: newDriver,
          driverPhone: newDriverPhone,
          totalDistanceKm: 18,
          estimatedTimeMin: 45,
          stops: [
            { stopName: 'Central Railway Station', pickupTime: '07:15 AM', dropTime: '05:30 PM' },
            { stopName: 'City Circle Square', pickupTime: '07:35 AM', dropTime: '05:10 PM' },
            { stopName: 'North Tech Boulevard', pickupTime: '07:55 AM', dropTime: '04:50 PM' },
            { stopName: 'Campus Main Gate', pickupTime: '08:15 AM', dropTime: '04:30 PM' }
          ]
        };
        DS.addTransportRoute(r);
        setShowAddRoute(false);
        setNewRouteName('');
        setNewRouteCode('');
        setTick(t => t + 1);
        showToast('New transport route created!', 'success');
      };

      const handleAllocateStudent = () => {
        if (!selectedRoute || !selectedStudent) { showToast('Please select both student and route', 'error'); return; }
        const targetRoute = DS.getTransportRouteById(selectedRoute);
        const stopObj = targetRoute?.stops[selectedStop] || targetRoute?.stops[0];
        DS.allocateTransportRoute({
          id: 'alloc_' + Date.now(),
          studentId: selectedStudent,
          routeId: selectedRoute,
          stopName: stopObj?.stopName || 'Campus Main Gate',
          pickupTime: stopObj?.pickupTime || '07:30 AM',
          feeAmount: Number(allocFee) || 12000,
          status: 'ACTIVE'
        });
        setShowAllocate(false);
        setTick(t => t + 1);
        showToast('Student allocated to bus route successfully!', 'success');
      };

      if (effectiveRole === 'STUDENT') {
        const myAllocation = allocations.length > 0 ? allocations[0] : {
          routeId: routes[0]?.id,
          stopName: routes[0]?.stops[1]?.stopName || 'City Circle Square',
          pickupTime: '07:35 AM',
          status: 'ACTIVE'
        };
        const myRoute = DS.getTransportRouteById(myAllocation?.routeId) || routes[0];
        const stops = myRoute?.stops || [];
        const currentStopIndex = Math.min(simStep, Math.max(0, stops.length - 1));

        return (
          <div>
            <div className="stats-grid">
              <StatCard icon="fa-bus" iconClass="blue" label="Assigned Bus" value={myRoute?.routeCode || 'R-101'} delay={1} />
              <StatCard icon="fa-map-marker-alt" iconClass="green" label="My Boarding Stop" value={myAllocation?.stopName || 'City Center'} delay={2} />
              <StatCard icon="fa-clock" iconClass="purple" label="Pickup Time" value={myAllocation?.pickupTime || '07:35 AM'} delay={3} />
              <StatCard icon="fa-tachometer-alt" iconClass="cyan" label="Live Vehicle Speed" value={isTrackingLive ? '38 km/h' : 'Stationary'} delay={4} />
            </div>

            <div className="grid-2">
              <div className="card animate-fadeIn">
                <div className="card-header">
                  <div>
                    <h3 className="card-title"><i className="fas fa-satellite-dish"/> Live Bus GPS & Fleet Status</h3>
                    <div style={{fontSize:12,color:'var(--text-light)',marginTop:4}}>Vehicle: {myRoute?.vehicleNumber} · Driver: {myRoute?.driverName} ({myRoute?.driverPhone})</div>
                  </div>
                  <div style={{display:'flex',gap:8,alignItems:'center'}}>
                    <button className={`btn btn-sm btn-${isTrackingLive?'success':'secondary'}`} onClick={()=>{
                      const next = !isTrackingLive;
                      setIsTrackingLive(next);
                      showToast(next ? 'Live GPS tracking telemetry connected!' : 'GPS tracking paused. Vehicle stationary at terminal.', next ? 'success' : 'info');
                    }}>
                      <i className={`fas fa-${isTrackingLive?'satellite-dish fa-spin':'pause'}`}></i> {isTrackingLive ? 'Live Tracking Active' : 'Enable Live GPS'}
                    </button>
                    <button className="btn btn-sm btn-secondary" onClick={()=>setSimStep(s => Math.min(stops.length - 1, s + 1))} title="Advance vehicle to next stop">
                      <i className="fas fa-step-forward"></i> Next Stop
                    </button>
                    <button className="btn btn-sm btn-secondary" onClick={()=>setSimStep(0)} title="Reset vehicle to terminal">
                      <i className="fas fa-undo"></i> Reset
                    </button>
                  </div>
                </div>
                <div style={{background: isTrackingLive ? 'rgba(16,185,129,0.1)' : 'var(--bg-primary)',padding:'10px 14px',borderRadius:8,margin:'0 16px 14px 16px',border:`1px solid ${isTrackingLive?'rgba(16,185,129,0.3)':'var(--border-color)'}`,fontSize:12,display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                  <span>
                    <i className={`fas fa-circle`} style={{color: isTrackingLive ? 'var(--success)' : 'var(--warning)',fontSize:9,marginRight:8}}></i>
                    <strong>Fleet Status:</strong> {isTrackingLive ? 'Vehicle in transit · GPS telemetry synced' : 'Vehicle docked at initial terminal · Ready for morning pickup dispatch'}
                  </span>
                  <span className="badge badge-secondary">Speed: {isTrackingLive ? '38 km/h' : '0 km/h (Stationary)'}</span>
                </div>

                {/* Visual Route Timeline */}
                <div style={{position:'relative',padding:'20px 10px'}}>
                  <div style={{position:'absolute',left:34,top:30,bottom:30,width:4,background:'var(--border-color)',borderRadius:2}}></div>
                  <div style={{position:'absolute',left:34,top:30,height:`${(currentStopIndex / Math.max(1, stops.length - 1)) * 80}%`,width:4,background:'var(--primary)',borderRadius:2,transition:'all 0.5s ease'}}></div>

                  {stops.map((stop, idx) => {
                    const isPassed = idx < currentStopIndex;
                    const isCurrent = idx === currentStopIndex;
                    const isMyStop = stop.stopName === myAllocation?.stopName;

                    return (
                      <div key={idx} style={{display:'flex',alignItems:'flex-start',gap:16,marginBottom:24,position:'relative'}}>
                        <div style={{
                          width:26,
                          height:26,
                          borderRadius:'50%',
                          background: isCurrent ? 'var(--primary)' : isPassed ? 'var(--success)' : 'var(--bg-card)',
                          border: `3px solid ${isCurrent?'var(--primary)':isPassed?'var(--success)':'var(--border-color)'}`,
                          color: '#fff',
                          display:'flex',
                          alignItems:'center',
                          justifyContent:'center',
                          fontSize:11,
                          fontWeight:700,
                          zIndex:2,
                          boxShadow: isCurrent ? '0 0 12px var(--primary)' : 'none'
                        }}>
                          {isPassed ? <i className="fas fa-check" style={{fontSize:10}}></i> : isCurrent ? <i className="fas fa-bus" style={{fontSize:10}}></i> : (idx+1)}
                        </div>
                        <div style={{flex:1,background: isCurrent ? 'var(--bg-primary)' : 'transparent',padding: isCurrent ? '10px 14px' : '0 4px',borderRadius:10}}>
                          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                            <strong style={{color: isCurrent ? 'var(--primary)' : 'var(--text-primary)',fontSize:14}}>
                              {stop.stopName}
                              {isMyStop && <span className="badge badge-warning" style={{marginLeft:8}}>My Stop</span>}
                            </strong>
                            <span className="badge badge-secondary">{stop.pickupTime}</span>
                          </div>
                          <div style={{fontSize:12,color:'var(--text-light)',marginTop:2}}>
                            {isCurrent ? '⚡ Vehicle is currently approaching this stop' : isPassed ? '✓ Passed on schedule' : 'Upcoming stop'}
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>

              <div className="card animate-fadeIn">
                <div className="card-header">
                  <h3 className="card-title"><i className="fas fa-id-badge"/> Student Transport Pass</h3>
                  <span className="badge badge-success">VALID 2026-27</span>
                </div>
                <div style={{border:'2px dashed var(--primary)',borderRadius:16,padding:20,background:'var(--bg-primary)',position:'relative'}}>
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14}}>
                    <h4 style={{margin:0,color:'var(--primary)'}}>EDUTrack Transit Card</h4>
                    <span className="badge badge-primary">{myRoute?.routeCode}</span>
                  </div>
                  <div className="grid-2" style={{fontSize:13,gap:12}}>
                    <div><span style={{color:'var(--text-light)'}}>Student:</span><br/><strong>{student?.name}</strong></div>
                    <div><span style={{color:'var(--text-light)'}}>GR Number:</span><br/><strong>{student?.grNumber}</strong></div>
                    <div><span style={{color:'var(--text-light)'}}>Boarding Stop:</span><br/><strong>{myAllocation?.stopName}</strong></div>
                    <div><span style={{color:'var(--text-light)'}}>Scheduled Pickup:</span><br/><strong>{myAllocation?.pickupTime}</strong></div>
                    <div><span style={{color:'var(--text-light)'}}>Bus Vehicle:</span><br/><strong>{myRoute?.vehicleNumber}</strong></div>
                    <div><span style={{color:'var(--text-light)'}}>Emergency Contact:</span><br/><strong>{myRoute?.driverPhone}</strong></div>
                  </div>
                  <div style={{marginTop:16,paddingTop:12,borderTop:'1px solid var(--border-light)',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                    <div style={{fontSize:11,color:'var(--text-light)'}}>Show this digital pass to bus attendant upon entry.</div>
                    <button className="btn btn-secondary btn-sm" onClick={()=>showToast('Digital pass downloaded!','success')}>
                      <i className="fas fa-download"></i> Save
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        );
      }

      // ADMIN & TEACHER & ACCOUNTANT VIEW
      return (
        <div>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:12,marginBottom:20}}>
            <div style={{display:'flex',gap:10}}>
              <button className={`btn btn-${activeTab==='routes'?'primary':'secondary'} btn-sm`} onClick={()=>setActiveTab('routes')}>
                <i className="fas fa-route"></i> Fleet & Routes ({routes.length})
              </button>
              <button className={`btn btn-${activeTab==='allocations'?'primary':'secondary'} btn-sm`} onClick={()=>setActiveTab('allocations')}>
                <i className="fas fa-users"></i> Student Allocations ({allAllocations.length})
              </button>
            </div>
            <div style={{display:'flex',gap:10}}>
              <button className="btn btn-secondary btn-sm" onClick={()=>setShowAllocate(true)}>
                <i className="fas fa-user-plus"></i> Allocate Student
              </button>
              <button className="btn btn-primary btn-sm" onClick={()=>setShowAddRoute(true)}>
                <i className="fas fa-plus"></i> Add New Route
              </button>
            </div>
          </div>

          {activeTab === 'routes' ? (
            <div className="grid-2">
              {routes.map(r => (
                <div key={r.id} className="card animate-fadeIn">
                  <div className="card-header">
                    <div>
                      <h3 className="card-title">{r.routeName}</h3>
                      <div style={{fontSize:12,color:'var(--text-light)',marginTop:2}}>Vehicle: <strong>{r.vehicleNumber}</strong> · Code: {r.routeCode}</div>
                    </div>
                    <span className="badge badge-success">ACTIVE ROUTE</span>
                  </div>
                  <div style={{marginBottom:14,fontSize:13}}>
                    <div style={{display:'flex',justifyContent:'space-between',padding:'6px 0',borderBottom:'1px solid var(--border-light)'}}>
                      <span style={{color:'var(--text-light)'}}>Driver Name & Phone:</span>
                      <strong>{r.driverName} ({r.driverPhone})</strong>
                    </div>
                    <div style={{display:'flex',justifyContent:'space-between',padding:'6px 0',borderBottom:'1px solid var(--border-light)'}}>
                      <span style={{color:'var(--text-light)'}}>Total Route Length:</span>
                      <strong>{r.totalDistanceKm || 16} km (~{r.estimatedTimeMin || 40} mins)</strong>
                    </div>
                  </div>
                  <div style={{fontSize:12,fontWeight:700,marginBottom:8,color:'var(--text-secondary)'}}>STOPS & TIMINGS:</div>
                  <div style={{display:'flex',flexDirection:'column',gap:6}}>
                    {(r.stops || []).map((st, i) => (
                      <div key={i} style={{display:'flex',justifyContent:'space-between',background:'var(--bg-primary)',padding:'6px 10px',borderRadius:6,fontSize:12}}>
                        <span>{i+1}. {st.stopName}</span>

                  </div>
                </div>
              ))}

                    <tr>
                      <th>Student</th>
                      <th>GR Number</th>

                      <th>Pickup Stop</th>
                      <th>Morning Pickup</th>

                      <th>Annual Fee</th>
                      <th>Status</th>

                    {allAllocations.map(al => {

                      const stopName = al.stopName || r?.stops?.[1]?.stopName || r?.stops?.[0]?.stopName || 'City Circle Square';

                      const driverName = r?.driverName || 'Ramesh Sharma';
                      const driverPhone = r?.driverPhone || '+91 98230 11223';
                      return (
                        <tr key={al.id}>
                          <td><strong>{stu?.name || 'Aarav Shah'}</strong></td>
                          <td><span className="badge badge-primary">{stu?.grNumber || al.grNumber || 'GR2026036'}</span></td>
                          <td>
                            <strong>{r?.routeName || 'Andheri - Campus Express'}</strong><br/>
                            <small style={{color:'var(--text-light)'}}>Bus No: {r?.vehicleNumber || 'MH-12-BP-4491'} ({r?.routeCode || 'R01'})</small>
                          </td>
                          <td><i className="fas fa-map-marker-alt" style={{color:'var(--primary)',marginRight:6}}></i><strong>{stopName}</strong></td>
                          <td><span className="badge badge-info"><i className="fas fa-clock" style={{marginRight:4}}></i>{pickupTime}</span></td>

                            <strong>{driverName}</strong><br/>

                          </td>

          {/* Add Route Modal */}
          {showAddRoute && (
            <Modal isOpen={showAddRoute} onClose={()=>setShowAddRoute(false)} title="Create New Transport Route"
              footer={<>
                <button className="btn btn-secondary" onClick={()=>setShowAddRoute(false)}>Cancel</button>
                <button className="btn btn-primary" onClick={handleSaveRoute}>Create Route</button>
              </>}>
              <div className="grid-2">
                <div className="form-group">
                  <label className="form-label">Route Title</label>
                  <input className="input" value={newRouteName} onChange={e=>setNewRouteName(e.target.value)} placeholder="e.g. South Sector Express" />
                </div>
                <div className="form-group">
                  <label className="form-label">Route Code</label>
                  <input className="input" value={newRouteCode} onChange={e=>setNewRouteCode(e.target.value)} placeholder="e.g. R-105" />
                </div>
              </div>
              <div className="grid-2">
                <div className="form-group">
                  <label className="form-label">Vehicle Registration Number</label>
                  <input className="input" value={newVehicle} onChange={e=>setNewVehicle(e.target.value)} placeholder="e.g. MH-12-BP-4491" />
                </div>
                <div className="form-group">
                  <label className="form-label">Driver Name</label>
                  <input className="input" value={newDriver} onChange={e=>setNewDriver(e.target.value)} placeholder="Driver full name" />
                </div>
              </div>
              <div className="form-group">
                <label className="form-label">Driver Contact Phone</label>
                <input className="input" value={newDriverPhone} onChange={e=>setNewDriverPhone(e.target.value)} placeholder="+91 98230 11223" />
              </div>
            </Modal>
          )}

          {/* Allocate Student Modal */}
          {showAllocate && (
            <Modal isOpen={showAllocate} onClose={()=>setShowAllocate(false)} title="Allocate Student to Bus Route"
              footer={<>
                <button className="btn btn-secondary" onClick={()=>setShowAllocate(false)}>Cancel</button>
                <button className="btn btn-primary" onClick={handleAllocateStudent}>Allocate Pass</button>
              </>}>
              <div className="form-group">
                <label className="form-label">Student</label>
                <select className="input" value={selectedStudent} onChange={e=>setSelectedStudent(e.target.value)}>
                  {DS.getStudents().map(s => <option key={s.id} value={s.id}>{s.name} ({s.grNumber})</option>)}
                </select>
              </div>
              <div className="form-group">
                <label className="form-label">Bus Route</label>
                <select className="input" value={selectedRoute} onChange={e=>{ setSelectedRoute(e.target.value); setSelectedStop(0); }}>
                  {routes.map(r => <option key={r.id} value={r.id}>{r.routeName} ({r.routeCode})</option>)}
                </select>
              </div>
              <div className="form-group">
                <label className="form-label">Pickup & Drop Stop</label>
                <select className="input" value={selectedStop} onChange={e=>setSelectedStop(Number(e.target.value))}>
                  {(DS.getTransportRouteById(selectedRoute)?.stops || []).map((s, idx) => (
                    <option key={idx} value={idx}>{s.stopName} (Pickup: {s.pickupTime})</option>
                  ))}
                </select>
              </div>
              <div className="form-group">
                <label className="form-label">Annual Transit Fee (₹)</label>
                <input className="input" type="number" value={allocFee} onChange={e=>setAllocFee(e.target.value)} />
              </div>
            </Modal>
          )}
        </div>
      );
    }


function ImportCenterPage({ user }) {
      const [preview, setPreview] = useState([]);
      const [fileName, setFileName] = useState('');
      const [busy, setBusy] = useState(false);
      const [logs, setLogs] = useState(DS.getImportLogs());

      const normalizeRow = row => {
        const out = {};
        Object.keys(row || {}).forEach(k => {
          out[String(k).trim().toLowerCase().replace(/\s+/g, '')] = row[k];
        });
        return out;
      };

      const resolveClassId = v => {
        const x = String(v || '').trim();
        if (!x) return 'cls1';
        const byId = DS.getClassById(x);
        if (byId) return byId.id;
        return DS.getClasses().find(c => String(c.name).toLowerCase() === x.toLowerCase())?.id || 'cls1';
      };

      const resolveDeptId = v => {
        const x = String(v || '').trim();
        if (!x) return 'd1';
        const byId = DS.getDepartmentById(x);
        if (byId) return byId.id;
        return DS.getDepartments().find(d => String(d.name).toLowerCase() === x.toLowerCase() || String(d.code).toLowerCase() === x.toLowerCase())?.id || 'd1';
      };

      const downloadSampleCSV = () => {
        const sampleHeaders = 'Name,Phone,Class,Department,Semester,AdmissionYear,Roll,Guardian,GuardianPhone,Gender,DOB,Address\n';
        const sampleRows = [
          'Aarav Sharma,+91 98765 43210,CS-2024-A,Computer Science,1,2026,01,Ramesh Sharma,+91 98111 22233,Male,2005-04-12,"42 Park Avenue, Pune"',
          'Ananya Patel,+91 98222 33445,CS-2024-A,Computer Science,1,2026,02,Suresh Patel,+91 98222 44556,Female,2005-08-23,"15 Lake Road, Pune"',
          'Rohan Verma,+91 98333 44556,ME-2024-A,Mechanical Engineering,1,2026,03,Mahesh Verma,+91 98333 55667,Male,2004-11-15,"78 Hill View, Pune"'
        ].join('\n');

        const blob = new Blob([sampleHeaders + sampleRows], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.setAttribute('download', 'edutrack_students_sample_template.csv');
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        showToast('Sample CSV template downloaded!', 'success');
      };

      const parseFile = async (file) => {
        if (!file) return;
        setBusy(true);
        setFileName(file.name);
        try {
          let rows = [];
          const ext = file.name.toLowerCase().split('.').pop();
          if (ext === 'xlsx' || ext === 'xls') {
            if (!window.XLSX) throw new Error('Excel parser not loaded');
            const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
            const ws = wb.Sheets[wb.SheetNames[0]];
            rows = XLSX.utils.sheet_to_json(ws, { defval: '' });
          } else {
            const text = await file.text();
            const lines = text.split(/\r?\n/).filter(Boolean);
            const headers = lines.shift().split(',').map(x => x.trim().replace(/^"|"$/g, ''));
            rows = lines.map(line => {
              const vals = line.split(',').map(x => x.trim().replace(/^"|"$/g, ''));
              const o = {};
              headers.forEach((h, i) => o[h] = vals[i] || '');
              return o;
            });
          }
          const valid = rows.map(normalizeRow).filter(r => r.name && r.phone);
          setPreview(valid);
          showToast(`Parsed ${valid.length} valid student rows`, 'success');
        } catch (e) {
          showToast('Import read error: ' + e.message, 'error');
        } finally {
          setBusy(false);
        }
      };

      const importAll = () => {
        if (!preview.length) { showToast('No valid rows to import', 'warning'); return; }
        setBusy(true);
        setTimeout(() => {
          let success = 0, failed = 0;
          preview.forEach(row => {
            try {
              const data = {
                name: String(row.name).trim(),
                phone: String(row.phone).trim(),
                classId: resolveClassId(row.class),
                department: resolveDeptId(row.department),
                semester: Number(row.semester) || 1,
                admissionYear: Number(row.admissionyear) || new Date().getFullYear(),
                sequence: row.roll || row.sequence || '',
                guardian: row.guardian || '',
                guardianPhone: row.guardianphone || '',
                gender: row.gender || '',
                dob: row.dob || '',
                address: row.address || ''
              };
              DS.createStudentAccount(data);
              success++;
            } catch (e) {
              failed++;
            }
