            <div style={{display:'flex',gap:18,alignItems:'center',marginBottom:20}}><div className="profile-avatar-xl" style={{width:74,height:74,borderRadius:22}}>{avatarPreview?<img src={avatarPreview} alt="Profile"/>:initials}</div><div><div style={{fontWeight:800}}>{displayName}</div><div style={{fontSize:12,color:'var(--text-secondary)',marginTop:3}}>{roleDetails}</div>{editing&&<><input ref={fileRef} type="file" accept="image/*" onChange={handleAvatar} style={{display:'none'}}/><button className="btn btn-secondary btn-sm" style={{marginTop:9}} onClick={()=>fileRef.current?.click()}><i className="fas fa-camera"></i> Change Photo</button></>}</div></div>
            <div className="grid-2">
              <div className="form-group"><label className="form-label">Full Name</label><input className="input" disabled={!editing} value={profile.name||''} onChange={e=>setProfile({...profile,name:e.target.value})}/></div>
              <div className="form-group"><label className="form-label">Email</label><input className="input" disabled={!editing} value={profile.email||''} onChange={e=>setProfile({...profile,email:e.target.value})}/></div>
              <div className="form-group"><label className="form-label">Phone</label><input className="input" disabled={!editing} value={profile.phone||''} onChange={e=>setProfile({...profile,phone:e.target.value})}/></div>
              {roleLabel==='STUDENT' && <><div className="form-group"><label className="form-label">Date of Birth</label><input type="date" className="input" disabled={!editing} value={profile.dob||student?.dob||''} onChange={e=>setProfile({...profile,dob:e.target.value})}/></div><div className="form-group"><label className="form-label">Gender</label><select className="input" disabled={!editing} value={profile.gender||student?.gender||'Male'} onChange={e=>setProfile({...profile,gender:e.target.value})}><option>Male</option><option>Female</option><option>Other</option></select></div><div className="form-group"><label className="form-label">Guardian Name</label><input className="input" disabled={!editing} value={profile.guardian||student?.guardian||''} onChange={e=>setProfile({...profile,guardian:e.target.value})}/></div><div className="form-group"><label className="form-label">Guardian Phone</label><input className="input" disabled={!editing} value={profile.guardianPhone||student?.guardianPhone||''} onChange={e=>setProfile({...profile,guardianPhone:e.target.value})}/></div></>}
              <div className="form-group" style={{gridColumn:'1/-1'}}><label className="form-label">Address</label><textarea className="input" rows="3" disabled={!editing} value={profile.address||student?.address||''} onChange={e=>setProfile({...profile,address:e.target.value})}></textarea></div>
            </div>
            {editing && <div style={{display:'flex',justifyContent:'flex-end',gap:8,marginTop:4}}><button className="btn btn-secondary" onClick={()=>{setProfile({...user});setAvatarPreview(user.avatar||null);setEditing(false)}}>Discard</button><button className="btn btn-primary" disabled={saving} onClick={saveProfile}>{saving?<><i className="fas fa-circle-notch fa-spin"></i> Saving...</>:<><i className="fas fa-save"></i> Save Changes</>}</button></div>}
          </div>
          <div className="card">
            <div className="profile-section-title"><div><h3>Identity & Academic Details</h3><p>Institution-managed information.</p></div><span className="badge badge-success">Verified</span></div>
            <div className="grid-2">{roleLabel==='STUDENT'?<>{field('GR Number',student?.grNumber)}{field('Roll Number',student?.rollNo)}{field('Department',dept?.name)}{field('Class',cls?.name)}{field('Semester',student?.semester)}{field('Admission Year',student?.admissionYear)}{field('Academic Year',DS.getSettings().semester)}{field('Role',roleLabel)}</>:<>{field('Employee / User ID',user.id)}{field('Department',dept?.name || profileData.department)}{field('Designation',profileData.designation || teacher?.specialization)}{field('Joining Date',profile.joined)}{field('Role',roleLabel)}{field('Account Status','Active')}</>}</div>
          </div>
        </div>
      );

      const renderAnalytics = () => {
        if(roleLabel!=='STUDENT') return <div className="card"><EmptyState icon="fa-chart-line" title="Role analytics" description="Detailed analytics for staff can be opened from the main Analytics module."/><div style={{textAlign:'center'}}><button className="btn btn-primary" onClick={()=>navigateTo('analytics')}><i className="fas fa-chart-line"></i> Open Analytics</button></div></div>;
        const subjectScores = DS.getSubjects().filter(s=>s.department===student?.department && s.semester===student?.semester).map(s=>{const gs=grades.filter(g=>g.subjectId===s.id); const vals=gs.map(g=>[g.internal1,g.internal2,g.assignment,g.midTerm,g.final].filter(v=>typeof v==='number').reduce((a,b)=>a+b,0)); return {name:s.code||s.name.slice(0,10),score:vals.length?Math.min(100,Math.round(vals[0])):0};});
        return <div><div className="grid-4">{stat('CGPA',student?.cgpa||0,'Current','fa-graduation-cap')}{stat('Attendance',`${attendance?.percentage||0}%`,'Overall','fa-calendar-check')}{stat('Curriculum',`${student?.curriculumProgress||0}%`,'Progress','fa-book-open')}{stat('Quiz Avg',`${student?.quizAverage||0}%`,'Average','fa-pencil-alt')}</div><div className="grid-2" style={{marginTop:20}}><div className="card"><div className="profile-section-title"><div><h3>Performance Indicators</h3><p>Live values from your student record.</p></div></div>{[['Attendance',attendance?.percentage||student?.attendance||0],['Curriculum',student?.curriculumProgress||0],['Quiz Average',student?.quizAverage||0],['CGPA',Math.round(((student?.cgpa||0)/10)*100)]] .map(([n,v])=><div key={n} style={{marginBottom:16}}><div style={{display:'flex',justifyContent:'space-between',fontSize:12,fontWeight:700,marginBottom:7}}><span>{n}</span><span>{v}{n==='CGPA'?'%':'%'}</span></div><div className="profile-progress"><div style={{width:`${Math.max(0,Math.min(100,v))}%`}}></div></div></div>)}</div><div className="card"><div className="profile-section-title"><div><h3>Subject Snapshot</h3><p>Stored grade data by subject.</p></div></div>{subjectScores.length?subjectScores.map(x=><div key={x.name} style={{marginBottom:14}}><div style={{display:'flex',justifyContent:'space-between',fontSize:12,fontWeight:700,marginBottom:6}}><span>{x.name}</span><span>{x.score}</span></div><div className="profile-progress"><div style={{width:`${Math.min(100,x.score)}%`}}></div></div></div>):<EmptyState icon="fa-chart-bar" title="No grade data" description="Subject performance will appear after grades are recorded."/>}</div></div></div>;
      };

      const renderAchievements = () => {
        const rules=[
          ['fa-calendar-check','Attendance Champion','Maintain 90%+ attendance',(attendance?.percentage||student?.attendance||0)>=90],
          ['fa-star','Academic Excellence','CGPA 8.5 or higher',(student?.cgpa||0)>=8.5],
          ['fa-pencil-alt','Quiz Master','Quiz average 80%+',(student?.quizAverage||0)>=80],
          ['fa-tasks','Assignment Streak','At least 5 submissions',student ? DS.getSubmissions(null,student.id).length>=5 : false],
          ['fa-book-open','Curriculum Explorer','Complete 80%+ curriculum',(student?.curriculumProgress||0)>=80],
          ['fa-shield-alt','Profile Complete','Complete all recommended profile fields',completion>=100]
        ];
        return <div className="card"><div className="profile-section-title"><div><h3>Achievements</h3><p>Badges are earned from real system data.</p></div></div><div className="achievement-grid">{rules.map(([icon,title,desc,earned])=><div className={`achievement ${earned?'':'locked'}`} key={title}><div className="achievement-icon"><i className={`fas ${icon}`}></i></div><div style={{fontWeight:800,fontSize:13}}>{title}</div><div style={{fontSize:11,color:'var(--text-secondary)',marginTop:5}}>{desc}</div><div style={{fontSize:10,fontWeight:800,color:earned?'var(--success)':'var(--text-light)',marginTop:10}}>{earned?'✓ EARNED':'LOCKED'}</div></div>)}</div></div>;
      };

      const renderActivity = () => <div className="card"><div className="profile-section-title"><div><h3>Activity Timeline</h3><p>Your latest academic, account and communication events.</p></div></div>{activities.length?<div className="timeline">{activities.map(a=><div className="timeline-item" key={a.id}><div style={{display:'flex',justifyContent:'space-between',gap:10}}><div style={{fontWeight:800,fontSize:13}}>{a.title}</div><span className="badge badge-secondary">{a.type}</span></div><div style={{fontSize:12,color:'var(--text-secondary)',marginTop:4}}>{a.detail}</div><div className="time">{new Date(a.createdAt).toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'})}</div></div>)}</div>:<EmptyState icon="fa-history" title="No activity yet" description="Activity will be collected as you use the system."/>}</div>;

      const renderDocuments = () => <div className="grid-2"><div className="card"><div className="profile-section-title"><div><h3>My Documents</h3><p>Document center ready for institution storage integration.</p></div></div>{['Digital Student ID','Academic Report','Fee Receipts','Certificates','Bonafide Certificate'].map((d,i)=><div className="profile-security-row" key={d}><div style={{display:'flex',gap:12,alignItems:'center'}}><div className="profile-security-icon"><i className={`fas ${i===0?'fa-id-card':i===2?'fa-receipt':'fa-file-alt'}`}></i></div><div><div style={{fontWeight:700,fontSize:13}}>{d}</div><div style={{fontSize:11,color:'var(--text-light)'}}>{i===0?'Available now':'Institution-managed document'}</div></div></div>{i===0?<button className="btn btn-primary btn-sm" onClick={()=>setIdModal(true)}>View</button>:<span className="badge badge-secondary">Ready</span>}</div>)}</div><div className="card"><div className="profile-section-title"><div><h3>Digital ID</h3><p>Print a clean institutional ID card.</p></div></div><div style={{textAlign:'center',padding:'18px 0'}}><i className="fas fa-id-card" style={{fontSize:48,color:'var(--primary)',marginBottom:12}}></i><p style={{fontSize:13,color:'var(--text-secondary)',maxWidth:330,margin:'0 auto 16px'}}>Use the digital identity card for campus verification. The QR code contains only a verification identifier.</p><button className="btn btn-primary" onClick={()=>setIdModal(true)}><i className="fas fa-eye"></i> Open Digital ID</button></div></div></div>;

      const renderPreferences = () => <div className="grid-2"><div className="card"><div className="profile-section-title"><div><h3>Notification Preferences</h3><p>Choose what you want to receive.</p></div><button className="btn btn-primary btn-sm" onClick={savePrefs}>Save</button></div>{[['academic','Academic updates','Assignments, exams and grades'],['attendance','Attendance alerts','Absence and attendance warnings'],['finance','Finance alerts','Fees and payment confirmations'],['communication','Communication','Messages and announcements'],['security','Security alerts','Login and account security']].map(([key,title,desc])=><label className="profile-security-row" key={key}><div><div style={{fontWeight:700,fontSize:13}}>{title}</div><div style={{fontSize:11,color:'var(--text-secondary)',marginTop:3}}>{desc}</div></div><input type="checkbox" checked={!!prefs.notifications?.[key]} onChange={e=>setPrefs({...prefs,notifications:{...prefs.notifications,[key]:e.target.checked}})} style={{width:20,height:20}}/></label>)}</div><div className="card"><div className="profile-section-title"><div><h3>Appearance</h3><p>Personal interface preferences.</p></div></div><div style={{display:'flex',gap:10,marginBottom:16}}><button className={`btn ${theme==='light'?'btn-primary':'btn-secondary'}`} style={{flex:1}} onClick={()=>theme!=='light'&&toggleTheme()}><i className="fas fa-sun"></i> Light</button><button className={`btn ${theme==='dark'?'btn-primary':'btn-secondary'}`} style={{flex:1}} onClick={()=>theme!=='dark'&&toggleTheme()}><i className="fas fa-moon"></i> Dark</button></div><label className="profile-security-row"><div><div style={{fontWeight:700,fontSize:13}}>Reduce motion</div><div style={{fontSize:11,color:'var(--text-secondary)',marginTop:3}}>Use fewer transition effects.</div></div><input type="checkbox" checked={!!prefs.appearance?.reduceMotion} onChange={e=>setPrefs({...prefs,appearance:{...prefs.appearance,reduceMotion:e.target.checked}})} style={{width:20,height:20}}/></label><label className="profile-security-row"><div><div style={{fontWeight:700,fontSize:13}}>Profile visibility</div><div style={{fontSize:11,color:'var(--text-secondary)',marginTop:3}}>Control who can view your profile.</div></div><select className="input" style={{width:160}} value={prefs.privacy?.profileVisibility||'INSTITUTION'} onChange={e=>setPrefs({...prefs,privacy:{...prefs.privacy,profileVisibility:e.target.value}})}><option value="INSTITUTION">Institution</option><option value="PRIVATE">Private</option></select></label><button className="btn btn-primary" style={{marginTop:16}} onClick={savePrefs}><i className="fas fa-save"></i> Save Preferences</button></div></div>;

      const renderSecurity = () => <div className="grid-2"><div className="card"><div className="profile-section-title"><div><h3>Password & Security</h3><p>Manage your local/demo account credentials.</p></div><span className="badge badge-warning">Demo auth</span></div><div className="profile-alert"><i className="fas fa-shield-alt" style={{color:'var(--warning)',fontSize:18}}></i><div><strong>Production note</strong><div style={{fontSize:12,color:'var(--text-secondary)',marginTop:3}}>Before real institutional deployment, move authentication to Firebase Auth/server-side identity. Do not store production passwords in client storage.</div></div></div><div className="form-group" style={{marginTop:18}}><label className="form-label">Current Password</label><input type="password" className="input" value={passwords.current} onChange={e=>setPasswords({...passwords,current:e.target.value})}/></div><div className="form-group"><label className="form-label">New Password</label><input type="password" className="input" value={passwords.next} onChange={e=>setPasswords({...passwords,next:e.target.value})}/></div><div className="form-group"><label className="form-label">Confirm New Password</label><input type="password" className="input" value={passwords.confirm} onChange={e=>setPasswords({...passwords,confirm:e.target.value})}/></div><button className="btn btn-primary" onClick={changePassword}><i className="fas fa-key"></i> Change Password</button></div><div className="card"><div className="profile-section-title"><div><h3>Account Security</h3><p>Current account state and security actions.</p></div></div><div className="profile-security-row"><div style={{display:'flex',gap:12,alignItems:'center'}}><div className="profile-security-icon"><i className="fas fa-user-check"></i></div><div><div style={{fontWeight:700,fontSize:13}}>Account status</div><div style={{fontSize:11,color:'var(--text-secondary)'}}>Active and authenticated</div></div></div><span className="badge badge-success">Active</span></div><div className="profile-security-row"><div style={{display:'flex',gap:12,alignItems:'center'}}><div className="profile-security-icon"><i className="fas fa-clock"></i></div><div><div style={{fontWeight:700,fontSize:13}}>Session protection</div><div style={{fontSize:11,color:'var(--text-secondary)'}}>Inactivity timeout enabled</div></div></div><span className="badge badge-success">Enabled</span></div><div className="profile-security-row"><div style={{display:'flex',gap:12,alignItems:'center'}}><div className="profile-security-icon"><i className="fas fa-history"></i></div><div><div style={{fontWeight:700,fontSize:13}}>Last login</div><div style={{fontSize:11,color:'var(--text-secondary)'}}>Current browser session</div></div></div><span style={{fontSize:11,color:'var(--text-light)'}}>{new Date().toLocaleString('en-IN')}</span></div><button className="btn btn-danger" style={{marginTop:18}} onClick={onLogout}><i className="fas fa-sign-out-alt"></i> Logout</button></div></div>;

      const renderPrivacy = () => <div className="grid-2"><div className="card"><div className="profile-section-title"><div><h3>Privacy Controls</h3><p>Manage what other institution users can see.</p></div></div>{[['showPhone','Phone number','Allow authorized institution users to see your phone'],['showEmail','Email address','Allow authorized institution users to see your email']].map(([key,title,desc])=><label className="profile-security-row" key={key}><div><div style={{fontWeight:700,fontSize:13}}>{title}</div><div style={{fontSize:11,color:'var(--text-secondary)',marginTop:3}}>{desc}</div></div><input type="checkbox" checked={prefs.privacy?.[key]!==false} onChange={e=>setPrefs({...prefs,privacy:{...prefs.privacy,[key]:e.target.checked}})} style={{width:20,height:20}}/></label>)}<div className="form-group" style={{marginTop:16}}><label className="form-label">Profile visibility</label><select className="input" value={prefs.privacy?.profileVisibility||'INSTITUTION'} onChange={e=>setPrefs({...prefs,privacy:{...prefs.privacy,profileVisibility:e.target.value}})}><option value="INSTITUTION">Institution users only</option><option value="PRIVATE">Private</option></select></div><button className="btn btn-primary" onClick={savePrefs}><i className="fas fa-save"></i> Save Privacy</button></div><div className="card"><div className="profile-section-title"><div><h3>Data & Account</h3><p>Keep your account information under control.</p></div></div><div className="profile-security-row"><div><div style={{fontWeight:700,fontSize:13}}>Profile data</div><div style={{fontSize:11,color:'var(--text-secondary)'}}>Your account and academic records remain subject to institution policy.</div></div><span className="badge badge-secondary">Protected</span></div><div className="profile-security-row"><div><div style={{fontWeight:700,fontSize:13}}>Export data</div><div style={{fontSize:11,color:'var(--text-secondary)'}}>Create a local JSON snapshot of your profile data for testing/demo use.</div></div><button className="btn btn-secondary btn-sm" onClick={()=>{const payload={user:profile,student,teacher,admin,accountant,preferences:prefs,exportedAt:new Date().toISOString()}; const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`edutrack-profile-${user.id}.json`; a.click(); URL.revokeObjectURL(a.href); showToast('Profile data exported','success')}}><i className="fas fa-download"></i> Export</button></div></div></div>;

      const renderContent = () => { switch(activeTab){case 'personal':return renderPersonal();case 'analytics':return renderAnalytics();case 'achievements':return renderAchievements();case 'activity':return renderActivity();case 'documents':return renderDocuments();case 'preferences':return renderPreferences();case 'security':return renderSecurity();case 'privacy':return renderPrivacy();default:return renderOverview();} };

      return <div>
        <div className="profile-hero"><div className="profile-hero-inner"><div className="profile-avatar-xl">{avatarPreview?<img src={avatarPreview} alt="Profile"/>:initials}</div><div className="profile-hero-info"><div className="profile-hero-name">{displayName}</div><div className="profile-hero-meta"><span className="badge badge-primary">{roleLabel}</span><span>{roleDetails}</span>{student?.grNumber&&<span>· {student.grNumber}</span>}<span>· <i className="fas fa-circle" style={{fontSize:6,color:'var(--success)'}}></i> Active</span></div><div style={{marginTop:13,maxWidth:480}}><div style={{display:'flex',justifyContent:'space-between',fontSize:11,color:'var(--text-secondary)',marginBottom:6}}><span>Profile completion</span><strong>{completion}%</strong></div><div className="profile-progress"><div style={{width:`${completion}%`}}></div></div></div></div><div className="profile-actions"><button className="btn btn-primary" onClick={()=>setActiveTab('personal')}><i className="fas fa-user-edit"></i> Edit Profile</button>{roleLabel==='STUDENT'&&<button className="btn btn-secondary" onClick={()=>setIdModal(true)}><i className="fas fa-id-card"></i> Digital ID</button>}</div></div></div>
        <div className="profile-tabs">{[['overview','fa-home','Overview'],['personal','fa-user','Personal'],...(roleLabel==='STUDENT'?[['analytics','fa-chart-line','Analytics'],['achievements','fa-trophy','Achievements']]:[]),['activity','fa-history','Activity'],['documents','fa-file-alt','Documents'],['preferences','fa-bell','Preferences'],['privacy','fa-user-lock','Privacy'],['security','fa-shield-alt','Security']].map(([id,icon,label])=><button key={id} className={`profile-tab ${activeTab===id?'active':''}`} onClick={()=>setActiveTab(id)}><i className={`fas ${icon}`}></i> {label}</button>)}</div>
        {renderContent()}
        {idModal && <div className="modal-overlay" style={{zIndex:2500}} onClick={()=>setIdModal(false)}><div className="modal-content" style={{maxWidth:620}} onClick={e=>e.stopPropagation()}><div className="modal-header"><h3><i className="fas fa-id-card"></i> Digital Student ID</h3><button className="btn btn-ghost btn-sm" onClick={()=>setIdModal(false)}><i className="fas fa-times"></i></button></div><div className="modal-body"><div className="profile-id-card" id="printable-student-id"><div className="profile-id-head"><div><div className="profile-id-brand">{DS.getSettings().institutionName}</div><div style={{fontSize:10,color:'rgba(255,255,255,.55)',marginTop:3}}>DIGITAL STUDENT ID</div></div><i className="fas fa-graduation-cap" style={{fontSize:26}}></i></div><div className="profile-id-body"><div className="profile-id-photo">{avatarPreview?<img src={avatarPreview} alt="Student"/>:initials}</div><div className="profile-id-info"><div className="profile-id-name">{displayName}</div><div className="profile-id-meta">GR: {student?.grNumber || '—'}<br/>Roll: {student?.rollNo || '—'}<br/>{dept?.name || '—'} · Semester {student?.semester || '—'}<br/>Class: {cls?.name || '—'}</div></div></div><div className="profile-id-code"><span>Valid academic year: {DS.getSettings().semester}</span><span><i className="fas fa-qrcode"></i> {student?.grNumber || user.id}</span></div></div><div style={{display:'flex',justifyContent:'center',gap:8,marginTop:16}}><button className="btn btn-primary" onClick={()=>window.print()}><i className="fas fa-print"></i> Print ID</button><button className="btn btn-secondary" onClick={()=>{const data={verificationId:student?.grNumber||user.id,name:displayName,institution:DS.getSettings().institutionName,generatedAt:new Date().toISOString()};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`student-id-${student?.grNumber||user.id}.json`;a.click();URL.revokeObjectURL(a.href);showToast('Verification data exported','success')}}><i className="fas fa-download"></i> Export Verification</button></div></div></div></div>}
      </div>;
    }

    // ===================== SETTINGS =====================
    

function SettingsPage({ theme, toggleTheme }) {
      const [activeTab, setActiveTab] = useState('profile');
      const [radius, setRadius] = useState(DS.getSettings().geofenceRadius || 100);
      const [domain, setDomain] = useState(DS.getSettings().schoolDomain || 'vidhyadham.edu');
      const [instName, setInstName] = useState(DS.getSettings().institutionName || 'Vidhyadham Institute of Technology');
      const [instAddress, setInstAddress] = useState(DS.getSettings().address || 'Vidhyadham Campus, Tech Knowledge Corridor, Pune - 411001');
      const [instPhone, setInstPhone] = useState(DS.getSettings().phone || '+91 20 2765 8900');
      const [instEmail, setInstEmail] = useState(DS.getSettings().email || 'info@vidhyadham.edu');
      const user = DS.getCurrentUser();
      const [, setTick] = useState(0);

      const updateSettings = () => {
        const s = DS.getSettings();
        s.geofenceRadius = parseInt(radius) || 100;
        s.schoolDomain = domain.trim() || 'vidhyadham.edu';
        s.institutionName = instName.trim() || 'Vidhyadham Institute of Technology';
        s.address = instAddress.trim();
        s.phone = instPhone.trim();
        s.email = instEmail.trim();
        DS.setSettings(s);
        setTick(t => t + 1);
        showToast('Settings saved & campus parameters updated!', 'success');
      };

      const handleExportBackup = () => {
        const json = DS.exportBackupJSON();
        const blob = new Blob([json], { type: 'application/json' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.setAttribute('download', `edutrack_backup_${new Date().toISOString().slice(0,10)}.json`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        showToast('Full system backup exported as JSON!', 'success');
      };

      const handleImportBackup = (file) => {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const success = DS.importBackupJSON(e.target.result);
            if (success) {
              setTick(t => t + 1);
              showToast('Backup restored successfully! Refreshing...', 'success');
              setTimeout(() => window.location.reload(), 800);
            } else {
              showToast('Invalid backup file structure', 'error');
            }
          } catch (err) {
            showToast('Failed to parse backup file: ' + err.message, 'error');
          }
        };
        reader.readAsText(file);
      };

      const handleResetDefaults = () => {
        if (confirm('WARNING: Are you sure you want to reset all data to initial demo state? All custom modifications will be re-seeded.')) {
          DS.resetToDefaults();
          showToast('Data reset to default demo seed!', 'info');
          setTimeout(() => window.location.reload(), 700);
        }
      };

      return (
        <div>
          <div className="grid-2">
            <div className="card animate-fadeIn">
              <div className="card-header"><h3 className="card-title"><i className="fas fa-user-cog"></i> Active Account Details</h3></div>
              <div className="form-group"><label className="form-label">Full Name</label><input className="input" value={user?.name||''} readOnly /></div>
              <div className="form-group"><label className="form-label">Email Address</label><input className="input" value={user?.email||''} readOnly /></div>
              <div className="form-group"><label className="form-label">Contact Phone</label><input className="input" value={user?.phone||''} readOnly /></div>
              <div className="form-group"><label className="form-label">System Role</label><input className="input" value={user?.role||''} readOnly /></div>
              <div style={{display:'flex',gap:10,marginTop:16}}>
                <button className="btn btn-primary" onClick={()=>showToast('Account details verified!','success')}><i className="fas fa-check"></i> Verified Profile</button>
                <button className="btn btn-secondary" onClick={()=>printIdCard(user)}><i className="fas fa-id-card"></i> Print ID Badge</button>
              </div>
            </div>

            <div className="card animate-fadeIn">
              <div className="card-header"><h3 className="card-title"><i className="fas fa-palette"></i> Campus Theme & Appearance</h3></div>
              <div style={{display:'flex',gap:'16px',marginBottom:'24px'}}>
                <button className={`btn ${theme==='light'?'btn-primary':'btn-secondary'}`} onClick={()=>theme!=='light'&&toggleTheme()} style={{flex:1}}><i className="fas fa-sun"></i> Light Theme</button>
                <button className={`btn ${theme==='dark'?'btn-primary':'btn-secondary'}`} onClick={()=>theme!=='dark'&&toggleTheme()} style={{flex:1}}><i className="fas fa-moon"></i> Dark Theme</button>
              </div>
              <div className="form-group">
                <label className="form-label">School Web Domain</label>
                <input className="input" value={domain} onChange={e=>setDomain(e.target.value)} placeholder="e.g. vidhyadham.edu" />
                <p style={{fontSize:'12px',color:'var(--text-light)',marginTop:'4px'}}>Used to generate institutional student & staff emails.</p>
              </div>
              <div className="form-group">
                <label className="form-label">Campus Institution Name</label>
                <input className="input" value={instName} onChange={e=>setInstName(e.target.value)} />
              </div>
              <div className="form-group">
                <label className="form-label">Campus Physical Address</label>
                <input className="input" value={instAddress} onChange={e=>setInstAddress(e.target.value)} />
              </div>
              <div className="grid-2">
                <div className="form-group">
                  <label className="form-label">Official Phone</label>
                  <input className="input" value={instPhone} onChange={e=>setInstPhone(e.target.value)} />
                </div>
                <div className="form-group">
                  <label className="form-label">Official Email</label>
                  <input className="input" value={instEmail} onChange={e=>setInstEmail(e.target.value)} />
                </div>
              </div>
              <div className="form-group">
                <label className="form-label">Attendance Geofence Radius (meters)</label>
                <div style={{display:'flex',gap:'12px',alignItems:'center'}}>
                  <input type="number" className="input" value={radius} onChange={e=>setRadius(e.target.value)} min="10" max="1000" style={{width:140}} />
                  <span style={{fontSize:13,color:'var(--text-secondary)'}}>Current: <strong>{radius}m</strong></span>
                </div>
                <p style={{fontSize:'12px',color:'var(--text-light)',marginTop:'4px'}}>Students must be within this perimeter to register automated GPS attendance.</p>
              </div>
              <button className="btn btn-primary" onClick={updateSettings}><i className="fas fa-save"></i> Save Campus Settings</button>
            </div>
          </div>

          {/* Database Backup & Disaster Recovery Card */}
          <div className="card animate-fadeIn" style={{marginTop:24}}>
            <div className="card-header">
              <div>
                <h3 className="card-title"><i className="fas fa-database"></i> Database Management & Backup / Restore</h3>
                <p style={{fontSize:12,color:'var(--text-light)',margin:'4px 0 0 0'}}>Create full JSON backups of students, faculty, fees, attendance, and reset demo datasets.</p>
              </div>
            </div>
            <div className="grid-3" style={{gap:16,marginTop:12}}>
              <div style={{background:'var(--bg-primary)',padding:18,borderRadius:12}}>
                <h4 style={{marginBottom:6}}><i className="fas fa-download" style={{color:'var(--primary)'}}></i> Export Backup</h4>
                <p style={{fontSize:12,color:'var(--text-secondary)',marginBottom:12}}>Download complete local database snapshot in JSON format.</p>
                <button className="btn btn-secondary btn-sm" onClick={handleExportBackup}>Export JSON Backup</button>
              </div>
              <div style={{background:'var(--bg-primary)',padding:18,borderRadius:12}}>
                <h4 style={{marginBottom:6}}><i className="fas fa-upload" style={{color:'var(--success)'}}></i> Restore Backup</h4>
                <p style={{fontSize:12,color:'var(--text-secondary)',marginBottom:12}}>Upload a previous JSON snapshot to restore all records.</p>
                <label className="btn btn-secondary btn-sm" style={{cursor:'pointer',display:'inline-block'}}>
                  <input type="file" accept=".json" onChange={e=>handleImportBackup(e.target.files[0])} style={{display:'none'}} />
                  Browse & Restore JSON
                </label>
              </div>
              <div style={{background:'var(--bg-primary)',padding:18,borderRadius:12}}>
                <h4 style={{marginBottom:6}}><i className="fas fa-undo-alt" style={{color:'var(--danger)'}}></i> Reset to Demo Data</h4>
                <p style={{fontSize:12,color:'var(--text-secondary)',marginBottom:12}}>Wipe current modifications and reload seed demo accounts.</p>
                <button className="btn btn-danger btn-sm" onClick={handleResetDefaults}>Factory Demo Reset</button>
              </div>
            </div>
          </div>
        </div>
      );
    }


// ===================== ASSIGNMENTS (GOOGLE CLASSROOM STYLE) =====================
function AssignmentsPage({ user, role, viewAs }) {
  const effectiveRole = viewAs || role;
  const student = DS.getStudentByUserId(user.id) || (effectiveRole === 'STUDENT' && role !== 'STUDENT' ? DS.getStudents()[0] : null);
  const [showAdd, setShowAdd] = useState(false);
  const [newAssignment, setNewAssignment] = useState({ title: '', description: '', dueDate: '', maxMarks: 50, subjectId: '', classId: 'cls1' });
  const [submitModalAssignment, setSubmitModalAssignment] = useState(null);
  const [selectedFile, setSelectedFile] = useState(null);
  const [fileName, setFileName] = useState('');
  const [fileSize, setFileSize] = useState('');
  const [fileData, setFileData] = useState(null);
  const [studentNotes, setStudentNotes] = useState('');
  const [viewSubmissionsAssignment, setViewSubmissionsAssignment] = useState(null);
  const [gradingSubmission, setGradingSubmission] = useState(null);
  const [gradeMarks, setGradeMarks] = useState('');
  const [gradeFeedback, setGradeFeedback] = useState('');
  const [, setTick] = useState(0);

  const assignments = (effectiveRole === 'STUDENT' && student) 
    ? DS.getAssignments(student.classId) 
    : DS.getAssignments();

  const handleCreate = () => {
    if (!newAssignment.title.trim() || !newAssignment.dueDate) { showToast('Title and due date required', 'error'); return; }
    const all = DS.getCollection('assignments');
    all.push({
      id: 'as-' + Date.now(),
      ...newAssignment,
      teacherId: user.id,
      status: 'ACTIVE',
      createdAt: new Date().toISOString()
    });
    DS.setCollection('assignments', all);
    setShowAdd(false); 
    setNewAssignment({ title: '', description: '', dueDate: '', maxMarks: 50, subjectId: '', classId: 'cls1' });
    setTick(t => t + 1);
    showToast('Assignment posted successfully', 'success');
  };

  const handleFilePick = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    if (!file.name.toLowerCase().endsWith('.pdf')) {
      showToast('Please upload a valid PDF document (.pdf)', 'error');
      return;
    }
    setFileName(file.name);
    setFileSize((file.size / (1024 * 1024)).toFixed(2) + ' MB');
    const reader = new FileReader();
    reader.onload = () => {
      setFileData(reader.result);
      showToast(`Selected: ${file.name}`, 'info');
    };
    reader.readAsDataURL(file);
  };

  const handleStudentTurnIn = () => {
    if (!submitModalAssignment || !student) return;
    if (!fileName) {
      showToast('Please attach your assignment PDF file', 'error');
      return;
    }
    DS.submitAssignment(submitModalAssignment.id, student.id, {
      fileName: fileName,
      fileSize: fileSize || '1.4 MB',
      fileData: fileData
    }, studentNotes);

    setSubmitModalAssignment(null);
    setSelectedFile(null);
    setFileName('');
    setFileSize('');
    setFileData(null);
    setStudentNotes('');
    setTick(t => t + 1);
    triggerConfetti();
    showToast('Assignment submitted successfully in PDF format!', 'success');
  };

  const handleSaveGrade = () => {
    if (!gradingSubmission) return;
    const marks = Number(gradeMarks);
    if (isNaN(marks) || marks < 0) {
      showToast('Please enter valid marks', 'error');
      return;
    }
    DS.gradeSubmission(gradingSubmission.id, marks, gradeFeedback || 'Well done. Verified submission.');
    setGradingSubmission(null);
    setGradeMarks('');
    setGradeFeedback('');
    setTick(t => t + 1);
    showToast('Grade returned to student!', 'success');
  };

  return (
    <div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'20px',flexWrap:'wrap',gap:'12px'}}>
        <div>
          <h2><i className="fas fa-tasks" style={{color:'var(--primary)'}}></i> Course Assignments</h2>
          <p style={{fontSize:13,color:'var(--text-light)',margin:'2px 0 0 0'}}>
            {effectiveRole === 'STUDENT' ? 'Turn in your PDF coursework, view grading performance and faculty feedback.' : 'Google Classroom portal: Review student PDF submissions, assign marks and return feedback.'}
          </p>
        </div>
        {effectiveRole !== 'STUDENT' && (
          <button className="btn btn-primary" onClick={()=>setShowAdd(true)}>
            <i className="fas fa-plus"></i> Create Assignment
          </button>
        )}
      </div>

      <div className="grid-2">
        {assignments.map(a => {
          const sub = DS.getSubjectById(a.subjectId);
          const cls = DS.getClassById(a.classId);
          const submission = student ? DS.getSubmissions(a.id, student.id)[0] : null;
          const allSubs = DS.getSubmissions(a.id) || [];
          const gradedCount = allSubs.filter(s => s.status === 'GRADED').length;

          return (
            <div key={a.id} className="card animate-fadeIn">
              <div className="card-header">
                <div>
                  <h3 className="card-title">{a.title}</h3>
                  <div style={{fontSize:12,color:'var(--text-light)',marginTop:2}}>
                    {sub?.name || 'Subject'} · {cls?.name || 'Class'}
                  </div>
                </div>
                <span className={`badge ${a.status==='ACTIVE'?'badge-success':'badge-secondary'}`}>{a.status}</span>
              </div>
              <p style={{color:'var(--text-secondary)',fontSize:'14px',marginBottom:'12px',lineHeight:1.5}}>{a.description}</p>
              
              <div style={{display:'flex',gap:'8px',flexWrap:'wrap',marginBottom:'16px'}}>
                <span className="badge badge-warning"><i className="fas fa-clock" style={{marginRight:4}}></i> Due: {a.dueDate}</span>
                <span className="badge badge-primary"><i className="fas fa-award" style={{marginRight:4}}></i> Max: {a.maxMarks} Marks</span>
                <span className="badge badge-secondary"><i className="fas fa-file-pdf" style={{color:'var(--danger)',marginRight:4}}></i> PDF Submission</span>
              </div>

              {/* Student View Panel */}
              {effectiveRole === 'STUDENT' && (
                <div style={{marginTop:'12px',padding:'14px',background:'var(--bg-primary)',borderRadius:'12px',border:'1px solid var(--border-color)'}}>
                  {submission ? (
                    <div>
                      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
                        <span className={`badge ${submission.status==='GRADED'?'badge-success':'badge-info'}`}>
                          <i className={`fas fa-${submission.status==='GRADED'?'check-circle':'clock'}`} style={{marginRight:4}}></i>
                          {submission.status === 'GRADED' ? 'Graded & Returned' : 'Handed In · Under Review'}
                        </span>
                        {submission.marks !== null && (
                          <span style={{fontSize:16,fontWeight:800,color:'var(--success)'}}>
                            Score: {submission.marks} / {a.maxMarks} ({Math.round((submission.marks/a.maxMarks)*100)}%)
                          </span>
                        )}
                      </div>
                      <div style={{fontSize:13,color:'var(--text-secondary)',display:'flex',alignItems:'center',gap:8,marginBottom:6}}>
                        <i className="fas fa-file-pdf" style={{color:'var(--danger)'}}></i>
                        <strong>{submission.fileName || 'assignment_submission.pdf'}</strong>
                        <span style={{fontSize:11,color:'var(--text-light)'}}>({submission.fileSize || '1.4 MB'})</span>
                      </div>
                      {submission.feedback && (
                        <div style={{marginTop:8,padding:'8px 12px',background:'var(--bg-card)',borderRadius:8,fontSize:12,borderLeft:'3px solid var(--success)'}}>
                          <strong>Teacher Feedback:</strong> {submission.feedback}
                        </div>
                      )}
                      <div style={{display:'flex',gap:8,marginTop:12}}>
                        <button className="btn btn-sm btn-secondary" onClick={()=>{
                          if (submission.fileData) {
                            const win = window.open();
                            win.document.write(`<iframe src="${submission.fileData}" frameborder="0" style="border:0; top:0; left:0; bottom:0; right:0; width:100%; height:100%;" allowfullscreen></iframe>`);
                          } else {
                            showToast(`Opening ${submission.fileName || 'PDF'}...`, 'info');
                          }
                        }}>
                          <i className="fas fa-eye"></i> View PDF
                        </button>
                        <button className="btn btn-sm btn-secondary" onClick={()=>{
                          setSubmitModalAssignment(a);
                          setFileName(submission.fileName || '');
                        }}>
                          <i className="fas fa-redo"></i> Resubmit
                        </button>
                      </div>
                    </div>
                  ) : (
                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:10}}>
                      <div>
                        <div style={{fontSize:13,color:'var(--warning)',fontWeight:700}}>
                          <i className="fas fa-exclamation-circle" style={{marginRight:4}}></i> Not Handed In Yet
                        </div>
                        <div style={{fontSize:12,color:'var(--text-light)'}}>Upload your solution in PDF format before deadline.</div>
                      </div>
                      <button className="btn btn-sm btn-primary" onClick={()=>setSubmitModalAssignment(a)}>
                        <i className="fas fa-upload"></i> Upload PDF & Turn In
                      </button>
                    </div>
                  )}
                </div>
              )}

              {/* Teacher / Admin View Panel */}
              {effectiveRole !== 'STUDENT' && (
                <div style={{marginTop:'12px',padding:'14px',background:'var(--bg-primary)',borderRadius:'12px',display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:10}}>
                  <div style={{fontSize:13}}>
                    <strong>Submissions:</strong> <span className="badge badge-info">{allSubs.length} Received</span>
                    <span className="badge badge-success" style={{marginLeft:6}}>{gradedCount} Graded</span>
                  </div>
                  <button className="btn btn-sm btn-secondary" onClick={()=>setViewSubmissionsAssignment(a)}>
                    <i className="fas fa-user-graduate"></i> View Submissions & Grade
                  </button>
                </div>
              )}
            </div>
          );
        })}
      </div>

      {assignments.length === 0 && <EmptyState icon="fa-tasks" title="No assignments found" description="No course assignments have been published yet." />}

      {/* Student PDF Upload & Turn In Modal */}
      {submitModalAssignment && (
        <Modal isOpen={!!submitModalAssignment} onClose={()=>setSubmitModalAssignment(null)} title={`Turn In Assignment · ${submitModalAssignment.title}`}
          footer={<>
            <button className="btn btn-secondary" onClick={()=>setSubmitModalAssignment(null)}>Cancel</button>
            <button className="btn btn-primary" onClick={handleStudentTurnIn}>
              <i className="fas fa-paper-plane"></i> Turn In Assignment
            </button>
          </>}>
          <div style={{lineHeight:1.5}}>
            <div style={{background:'var(--bg-primary)',padding:'12px 16px',borderRadius:10,marginBottom:16}}>
              <h4 style={{margin:'0 0 4px 0',fontSize:14}}>{submitModalAssignment.title}</h4>
              <p style={{margin:0,fontSize:13,color:'var(--text-secondary)'}}>{submitModalAssignment.description}</p>
              <div style={{display:'flex',gap:10,marginTop:8,fontSize:12}}>
                <span><i className="fas fa-award"></i> Max Marks: {submitModalAssignment.maxMarks}</span>
                <span><i className="fas fa-calendar-alt"></i> Due: {submitModalAssignment.dueDate}</span>
              </div>
            </div>

            <div className="form-group">
              <label className="form-label">Attach Assignment PDF File *</label>
              <div style={{border:'2px dashed var(--primary)',borderRadius:12,padding:24,textAlign:'center',background:'var(--bg-card)',cursor:'pointer'}}>
                <i className="fas fa-file-pdf" style={{fontSize:38,color:'var(--danger)',marginBottom:10}}></i>
                <div style={{fontSize:14,fontWeight:700,marginBottom:4}}>
                  {fileName ? fileName : 'Click to Browse PDF or Drag & Drop'}
                </div>
                <div style={{fontSize:12,color:'var(--text-light)'}}>
                  {fileSize ? `Selected file size: ${fileSize}` : 'Supported formats: .pdf (Max size 15 MB)'}
                </div>
                <input type="file" accept=".pdf" onChange={handleFilePick} style={{marginTop:12}} />
              </div>
            </div>

            <div className="form-group">
              <label className="form-label">Private Comment to Teacher (Optional)</label>
              <textarea className="input" rows="3" placeholder="Add any explanatory remarks, repository links, or questions for the instructor..." value={studentNotes} onChange={e=>setStudentNotes(e.target.value)} />
            </div>
          </div>
        </Modal>
      )}

      {/* Teacher View Submissions & Grade Modal */}
      {viewSubmissionsAssignment && (
        <Modal isOpen={!!viewSubmissionsAssignment} onClose={()=>setViewSubmissionsAssignment(null)} title={`Student Submissions · ${viewSubmissionsAssignment.title}`} maxWidth="800px"
          footer={<button className="btn btn-secondary" onClick={()=>setViewSubmissionsAssignment(null)}>Close</button>}>
          <div className="table-container">
            <table>
              <thead>
                <tr>
                  <th>Student</th>
                  <th>GR Number</th>
                  <th>Submission PDF</th>
                  <th>Submitted Date</th>
                  <th>Marks</th>
                  <th>Feedback</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody>
                {DS.getStudents().filter(s => s.classId === viewSubmissionsAssignment.classId).map(s => {
                  const subm = DS.getSubmissions(viewSubmissionsAssignment.id, s.id)[0];
                  return (
                    <tr key={s.id}>
                      <td><strong>{s.name}</strong></td>
                      <td><span className="badge badge-secondary">{s.grNumber}</span></td>
                      <td>
                        {subm ? (
                          <div style={{display:'flex',alignItems:'center',gap:6}}>
                            <i className="fas fa-file-pdf" style={{color:'var(--danger)'}}></i>
                            <a href="#" onClick={(e)=>{
                              e.preventDefault();
                              if (subm.fileData) {
                                const w = window.open();
                                w.document.write(`<iframe src="${subm.fileData}" frameborder="0" style="border:0; top:0; left:0; bottom:0; right:0; width:100%; height:100%;" allowfullscreen></iframe>`);
                              } else {
                                showToast(`Downloading ${subm.fileName || 'submission.pdf'}...`, 'info');
                              }
                            }} style={{color:'var(--primary)',fontWeight:600,fontSize:12}}>
                              {subm.fileName || 'submission.pdf'}
                            </a>
                          </div>
                        ) : (
                          <span style={{color:'var(--text-light)',fontSize:12}}>Missing / Not Turned In</span>
                        )}
                      </td>
                      <td>{subm ? new Date(subm.submittedAt).toLocaleDateString() : '-'}</td>
                      <td>
                        {subm?.marks !== null && subm?.marks !== undefined ? (
                          <strong style={{color:'var(--success)'}}>{subm.marks} / {viewSubmissionsAssignment.maxMarks}</strong>
                        ) : subm ? (
                          <span className="badge badge-warning">Ungraded</span>
                        ) : '-'}
                      </td>
                      <td style={{fontSize:12,maxWidth:160,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
                        {subm?.feedback || '-'}
                      </td>
                      <td>
                        {subm ? (
                          <button className="btn btn-sm btn-primary" onClick={()=>{
                            setGradingSubmission(subm);
                            setGradeMarks(subm.marks !== null ? subm.marks : '');
                            setGradeFeedback(subm.feedback || '');
                          }}>
                            <i className="fas fa-marker"></i> {subm.marks !== null ? 'Edit Grade' : 'Grade'}
                          </button>
                        ) : (
                          <button className="btn btn-sm btn-secondary" disabled>No PDF</button>
                        )}
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </Modal>
      )}

      {/* Teacher Grade Input Modal */}
      {gradingSubmission && (
        <Modal isOpen={!!gradingSubmission} onClose={()=>setGradingSubmission(null)} title="Grade Student Assignment"
          footer={<>
            <button className="btn btn-secondary" onClick={()=>setGradingSubmission(null)}>Cancel</button>
            <button className="btn btn-success" onClick={handleSaveGrade}>
              <i className="fas fa-check"></i> Return Grade & Feedback
            </button>
          </>}>
          <div className="form-group">
            <label className="form-label">Student</label>
            <input className="input" disabled value={DS.getStudentById(gradingSubmission.studentId)?.name || 'Student'} />
          </div>
          <div className="grid-2">
            <div className="form-group">
              <label className="form-label">Submitted PDF File</label>
              <div style={{background:'var(--bg-primary)',padding:'10px 14px',borderRadius:8,fontSize:13,display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                <span><i className="fas fa-file-pdf" style={{color:'var(--danger)',marginRight:6}}></i> {gradingSubmission.fileName || 'submission.pdf'}</span>
                <span className="badge badge-secondary">{gradingSubmission.fileSize || '1.4 MB'}</span>
              </div>
            </div>
            <div className="form-group">
              <label className="form-label">Enter Marks (out of {viewSubmissionsAssignment?.maxMarks || 50}) *</label>
              <input className="input" type="number" min="0" max={viewSubmissionsAssignment?.maxMarks || 50} value={gradeMarks} onChange={e=>setGradeMarks(e.target.value)} placeholder="e.g. 45" />
            </div>
          </div>
          <div className="form-group">
            <label className="form-label">Teacher Feedback & Review Comments</label>
            <textarea className="input" rows="4" value={gradeFeedback} onChange={e=>setGradeFeedback(e.target.value)} placeholder="Provide constructive remarks, commendations, or correction pointers..." />
          </div>
        </Modal>
      )}

      {/* Teacher Create Assignment Modal */}
      {showAdd && (
        <Modal isOpen={showAdd} onClose={()=>setShowAdd(false)} title="Create New Course Assignment" 
          footer={<>
            <button className="btn btn-secondary" onClick={()=>setShowAdd(false)}>Cancel</button>
            <button className="btn btn-primary" onClick={handleCreate}>Publish Assignment</button>
          </>}>
          <div className="form-group"><label className="form-label">Assignment Title *</label><input className="input" value={newAssignment.title} onChange={e=>setNewAssignment({...newAssignment,title:e.target.value})} placeholder="e.g. Relational Schema & 3NF Normalization" /></div>
          <div className="form-group"><label className="form-label">Description & Instructions</label><textarea className="input" rows="3" value={newAssignment.description} onChange={e=>setNewAssignment({...newAssignment,description:e.target.value})} placeholder="Submission guidelines, required questions, and format expectations..."></textarea></div>
          <div className="grid-2">
            <div className="form-group"><label className="form-label">Subject</label><select className="input" value={newAssignment.subjectId} onChange={e=>setNewAssignment({...newAssignment,subjectId:e.target.value})}><option value="">Select Course</option>{DS.getSubjects().map(s=><option key={s.id} value={s.id}>{s.name}</option>)}</select></div>
            <div className="form-group"><label className="form-label">Class</label><select className="input" value={newAssignment.classId} onChange={e=>setNewAssignment({...newAssignment,classId:e.target.value})}>{DS.getClasses().map(c=><option key={c.id} value={c.id}>{c.name}</option>)}</select></div>
          </div>
          <div className="grid-2">
            <div className="form-group"><label className="form-label">Due Date *</label><input type="date" className="input" value={newAssignment.dueDate} onChange={e=>setNewAssignment({...newAssignment,dueDate:e.target.value})} /></div>
            <div className="form-group"><label className="form-label">Maximum Marks *</label><input type="number" className="input" value={newAssignment.maxMarks} onChange={e=>setNewAssignment({...newAssignment,maxMarks:Number(e.target.value)||0})} /></div>
          </div>
        </Modal>
      )}
    </div>
  );
}

// ===================== GRADES (AUTO-COUNTED ASSIGNMENTS & QUIZZES + BLUEPRINT PRINT) =====================
function GradesPage({ user, role, viewAs }) {
  const effectiveRole = viewAs || role;
  const student = DS.getStudentByUserId(user.id) || (effectiveRole === 'STUDENT' && role !== 'STUDENT' ? DS.getStudents()[0] : null);
  const [selectedStudentId, setSelectedStudentId] = useState(student?.id || DS.getStudents()[0]?.id || '');
  const [, setTick] = useState(0);

  const currentStudent = DS.getStudentById(selectedStudentId) || student || DS.getStudents()[0];
  const gradeBookItems = currentStudent ? DS.getStudentGradeBook(currentStudent.id) : [];

  const totalCredits = gradeBookItems.reduce((s, g) => s + (g.credits || 4), 0);
  const totalPoints = gradeBookItems.reduce((s, g) => s + ((g.points || 0) * (g.credits || 4)), 0);
  const sgpa = totalCredits > 0 ? (totalPoints / totalCredits).toFixed(2) : '8.40';

  return (
    <div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'20px',flexWrap:'wrap',gap:'12px'}}>
        <div>
          <h2><i className="fas fa-chart-line" style={{color:'var(--primary)'}}></i> Academic Gradebook & Transcript</h2>
          <p style={{fontSize:13,color:'var(--text-light)',margin:'2px 0 0 0'}}>
            Automatic grading aggregation: Assignment submissions and quiz performance are calculated in real-time alongside semester exam scores.
          </p>
        </div>
        <div style={{display:'flex',gap:10,alignItems:'center'}}>
          {effectiveRole !== 'STUDENT' && (
            <select className="input" style={{width:'auto',minWidth:'220px'}} value={selectedStudentId} onChange={e=>setSelectedStudentId(e.target.value)}>
              {DS.getStudents().map(s => (
                <option key={s.id} value={s.id}>{s.name} ({s.grNumber})</option>
              ))}
            </select>
          )}
          <button className="btn btn-primary" onClick={()=>printGradeReport(currentStudent?.id)}>
            <i className="fas fa-print" style={{marginRight:6}}></i> Print Official Grade Sheet (Blueprint)
          </button>
        </div>
      </div>

      <div className="stats-grid">
        <StatCard icon="fa-graduation-cap" iconClass="blue" label="Semester SGPA" value={sgpa} delay={1} />
        <StatCard icon="fa-award" iconClass="green" label="Cumulative CGPA" value={(currentStudent?.cgpa || 8.4).toFixed(2)} delay={2} />
        <StatCard icon="fa-book" iconClass="purple" label="Earned Credits" value={totalCredits} delay={3} />
        <StatCard icon="fa-check-circle" iconClass="cyan" label="Active Backlogs" value={currentStudent?.backlogs || 0} delay={4} />
      </div>

      <div className="card animate-fadeIn">
        <div className="card-header">
          <div>
            <h3 className="card-title">
              <i className="fas fa-file-invoice"/> Detailed Course Breakdown · {currentStudent?.name} ({currentStudent?.grNumber})
            </h3>
            <div style={{fontSize:12,color:'var(--text-light)',marginTop:2}}>
              Class: {DS.getClassById(currentStudent?.classId)?.name || 'CSE-5A'} · Semester {currentStudent?.semester || 5}
            </div>
          </div>
          <span className="badge badge-success">Syllabus Unified</span>
        </div>

        <div className="table-container">
          <table>
            <thead>
              <tr>
                <th>Course Name & Code</th>
                <th>Credits</th>
                <th>Internal 1</th>
                <th>Internal 2</th>
                <th>Assignments (Auto)</th>
                <th>Quizzes (Auto)</th>
                <th>Mid Term</th>
                <th>End Term</th>
                <th>Total / 170</th>
                <th>Grade</th>
                <th>Points</th>
              </tr>
            </thead>
            <tbody>
              {gradeBookItems.map((g, idx) => (
                <tr key={idx}>
                  <td>
                    <strong>{g.subjectName}</strong><br/>
                    <small style={{color:'var(--text-light)'}}>{g.subjectCode}</small>
                  </td>
                  <td><strong>{g.credits}</strong></td>
                  <td>{g.internal1}/25</td>
                  <td>{g.internal2}/25</td>
                  <td>
                    <span className="badge badge-primary" title="Automatically counted from student PDF submissions">
                      <i className="fas fa-tasks" style={{marginRight:4}}></i> {g.assignment}/20
                    </span>
                  </td>
                  <td>
                    <span className="badge badge-info" title="Automatically counted from interactive quiz attempts">
                      <i className="fas fa-question-circle" style={{marginRight:4}}></i> {g.quiz}/20
                    </span>
                  </td>
                  <td>{g.midTerm}/50</td>
                  <td>{g.final}/50</td>
                  <td><strong>{g.total}</strong> ({g.pct}%)</td>
                  <td><span className={`badge ${g.grade.startsWith('A')?'badge-success':'badge-primary'}`}>{g.grade}</span></td>
                  <td><strong>{g.points.toFixed(1)}</strong></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

// ===================== LIBRARY (PDF READER & YOUTUBE LECTURE INTEGRATION) =====================
function LibraryPage({ user, role, viewAs }) {
  const effectiveRole = viewAs || role;
  const [search, setSearch] = useState('');
  const [selectedCat, setSelectedCat] = useState('ALL');
  const [activeTab, setActiveTab] = useState('catalog');
  const [showAddModal, setShowAddModal] = useState(false);
  const [showIssueModal, setShowIssueModal] = useState(false);
  const [newTitle, setNewTitle] = useState('');
  const [newAuthor, setNewAuthor] = useState('');
  const [newCategory, setNewCategory] = useState('Computer Science');
  const [newIsbn, setNewIsbn] = useState('');
  const [newCopies, setNewCopies] = useState(5);
  const [newPdfName, setNewPdfName] = useState('');
  const [newYoutubeUrl, setNewYoutubeUrl] = useState('');
  const [selectedBookPdf, setSelectedBookPdf] = useState(null);
  const [selectedVideo, setSelectedVideo] = useState(null);
  const [issueBookId, setIssueBookId] = useState('');
  const [issueStudentId, setIssueStudentId] = useState('');
  const [issueDueDate, setIssueDueDate] = useState('2026-10-15');
  const [, setTick] = useState(0);

  const student = effectiveRole === 'STUDENT' ? (DS.getStudentById(user?.id) || DS.getStudents()[0]) : null;
  const allBooks = DS.getLibraryBooks(search) || [];
  const categories = ['ALL', 'Computer Science', 'Mathematics', 'Engineering', 'Database', 'Electronics'];

  const filteredBooks = allBooks.filter(b => {
    const matchCat = selectedCat === 'ALL' || (b.category && b.category.toLowerCase().includes(selectedCat.toLowerCase()));
    return matchCat;
  });

  const issuedBooks = DS.getIssuedBooks ? DS.getIssuedBooks() : [];

  const handleAddBook = () => {
    if (!newTitle.trim() || !newAuthor.trim()) { showToast('Please enter book title and author', 'error'); return; }
    const book = {
      id: 'bk_' + Date.now(),
      title: newTitle,
      author: newAuthor,
      category: newCategory,
      isbn: newIsbn || '978-0-' + Math.floor(100000 + Math.random() * 900000) + '-0',
      total: Number(newCopies) || 3,
      issued: 0,
      available: true,
      pdfName: newPdfName || `${newTitle.replace(/[^a-z0-9]/gi, '_')}_textbook.pdf`,
      youtubeUrl: newYoutubeUrl || 'https://www.youtube.com/embed/HXV3zeQKqGY',
      youtubeTitle: `${newTitle} - Full Course Lecture`
    };
    DS.addBook(book);
    setShowAddModal(false);
    setNewTitle('');
    setNewAuthor('');
    setNewPdfName('');
    setNewYoutubeUrl('');
    setTick(t => t + 1);
    showToast('New book with PDF and Video lecture registered in library!', 'success');
  };

  const handleIssueSubmit = () => {
    if (!issueBookId || !issueStudentId) { showToast('Please select both book and student', 'error'); return; }
    const res = DS.issueBook(issueBookId, issueStudentId, issueDueDate);
    if (res.success) {
      setShowIssueModal(false);
      setTick(t => t + 1);
      showToast('Book issued to student successfully!', 'success');
    } else {
      showToast(res.error || 'Cannot issue book', 'error');
    }
  };

  const handleStudentBorrow = (book) => {
    if (!student) { showToast('Student profile not found', 'error'); return; }
    const res = DS.issueBook(book.id, student.id, '2026-10-30');
    if (res.success) {
      setTick(t => t + 1);
      triggerConfetti();
      showToast(`Borrowed "${book.title}". Return due by Oct 30, 2026.`, 'success');
    } else {
      showToast(res.error || 'Book currently unavailable', 'error');
    }
  };

  const handleReturnBook = (record) => {
    DS.returnBook(record.id);
    setTick(t => t + 1);
    showToast('Book returned to library inventory!', 'success');
  };

  return (
    <div>
      <div className="card animate-fadeIn" style={{marginBottom:20}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:12}}>
          <div style={{display:'flex',gap:10,flex:1,minWidth:280}}>
            <div className="search-bar" style={{flex:1}}>
              <i className="fas fa-search"></i>
              <input placeholder="Search catalog by title, author, or ISBN..." value={search} onChange={e=>setSearch(e.target.value)} style={{border:'none',background:'none',outline:'none',width:'100%'}} />
            </div>
          </div>
          <div style={{display:'flex',gap:10}}>
            {effectiveRole !== 'STUDENT' && (
              <>
                <button className={`btn btn-sm btn-${activeTab==='catalog'?'primary':'secondary'}`} onClick={()=>setActiveTab('catalog')}>
                  <i className="fas fa-book"></i> Catalog
                </button>
                <button className={`btn btn-sm btn-${activeTab==='loans'?'primary':'secondary'}`} onClick={()=>setActiveTab('loans')}>
                  <i className="fas fa-hand-holding"></i> Active Loans ({issuedBooks.length})
                </button>
                <button className="btn btn-secondary btn-sm" onClick={()=>{
                  const books = DS.getLibraryBooks();
                  const stus = DS.getStudents();
                  if (books.length) setIssueBookId(books[0].id);
                  if (stus.length) setIssueStudentId(stus[0].id);
                  setShowIssueModal(true);
                }}>
                  <i className="fas fa-book-reader"></i> Issue Book
                </button>
                <button className="btn btn-primary btn-sm" onClick={()=>setShowAddModal(true)}>
                  <i className="fas fa-plus"></i> Add Book
                </button>
              </>
            )}
          </div>
        </div>

        {/* Category pills */}
        <div style={{display:'flex',gap:8,flexWrap:'wrap',marginTop:14}}>
          {categories.map(c => (
            <button key={c} className={`btn btn-sm btn-${selectedCat===c?'primary':'secondary'}`} onClick={()=>setSelectedCat(c)}>
              {c}
            </button>
          ))}
        </div>
      </div>

      {activeTab === 'catalog' ? (
        <div className="grid-3">
          {filteredBooks.map(b => {
            const isAvailable = (b.total - (b.issued || 0)) > 0;
            return (
              <div key={b.id} className="card animate-fadeIn">
                <div className="card-header">
                  <h3 className="card-title" style={{fontSize:16,display:'flex',alignItems:'center',gap:8}}>
                    <i className="fas fa-book" style={{color:'var(--primary)'}}></i> {b.title}
                  </h3>
                  <span className={`badge ${isAvailable?'badge-success':'badge-danger'}`}>
                    {isAvailable ? `${b.total - (b.issued||0)} Available` : 'All Issued'}
                  </span>
                </div>
                <div style={{fontSize:'13px',color:'var(--text-secondary)',marginBottom:'8px'}}>
                  By <strong>{b.author}</strong>
                </div>
                <div style={{display:'flex',gap:'8px',flexWrap:'wrap',marginBottom:'14px'}}>
                  <span className="badge badge-secondary">{b.category}</span>
                  <span className="badge badge-info">ISBN: {b.isbn}</span>
                </div>

                {/* Digital Learning Attachments (PDF + YouTube) */}
                <div style={{background:'var(--bg-primary)',padding:'10px 12px',borderRadius:8,marginBottom:12,display:'flex',flexDirection:'column',gap:6}}>
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',fontSize:12}}>
                    <span style={{color:'var(--danger)',fontWeight:600}}><i className="fas fa-file-pdf"></i> PDF Textbook Attached</span>
                    <button className="btn btn-sm btn-secondary" style={{padding:'2px 8px',fontSize:11}} onClick={()=>setSelectedBookPdf(b)}>
                      Read PDF
                    </button>
                  </div>
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',fontSize:12}}>
                    <span style={{color:'#ef4444',fontWeight:600}}><i className="fab fa-youtube"></i> Video Lecture Series</span>
                    <button className="btn btn-sm btn-secondary" style={{padding:'2px 8px',fontSize:11}} onClick={()=>setSelectedVideo(b)}>
                      Watch Video
                    </button>
                  </div>
                </div>

                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',fontSize:'12px',color:'var(--text-light)',paddingTop:12,borderTop:'1px solid var(--border-light)'}}>
                  <div>
                    Total: <strong>{b.total}</strong> · Issued: <strong>{b.issued || 0}</strong>
                  </div>
                  {effectiveRole === 'STUDENT' ? (
                    <button className="btn btn-sm btn-primary" disabled={!isAvailable} onClick={()=>handleStudentBorrow(b)}>
                      <i className="fas fa-bookmark"></i> {isAvailable ? 'Borrow Book' : 'Reserved'}
                    </button>
                  ) : (
                    <button className="btn btn-sm btn-secondary" onClick={()=>{
                      setIssueBookId(b.id);
                      const stus = DS.getStudents();
                      if (stus.length) setIssueStudentId(stus[0].id);
                      setShowIssueModal(true);
                    }}>
                      <i className="fas fa-user-check"></i> Issue
                    </button>
                  )}
                </div>
              </div>
            );
          })}
        </div>
      ) : (
        <div className="card animate-fadeIn">
          <div className="card-header">
            <h3 className="card-title"><i className="fas fa-clipboard-list"/> Active Student Book Loans</h3>
            <span className="badge badge-info">{issuedBooks.length} Active Records</span>
          </div>
          <div className="table-container">
            <table>
              <thead>
                <tr>
                  <th>Book Title</th>
                  <th>Student</th>
                  <th>GR Number</th>
                  <th>Issue Date</th>
                  <th>Return Due</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody>
                {issuedBooks.length === 0 ? (
                  <tr><td colSpan="6" style={{textAlign:'center',padding:30,color:'var(--text-light)'}}>No active book loans at present.</td></tr>
                ) : issuedBooks.map(rec => {
                  const bk = DS.getLibraryBooks().find(b => b.id === rec.bookId);
                  const stu = DS.getStudentById(rec.studentId);
                  return (
                    <tr key={rec.id}>
                      <td><strong>{bk?.title || rec.bookId}</strong></td>
                      <td>{stu?.name || 'Student'}</td>
                      <td><span className="badge badge-secondary">{stu?.grNumber || '-'}</span></td>
                      <td>{new Date(rec.issuedAt).toLocaleDateString()}</td>
                      <td><span className="badge badge-warning">{rec.dueDate}</span></td>
                      <td>
                        <button className="btn btn-sm btn-success" onClick={()=>handleReturnBook(rec)}>
                          <i className="fas fa-undo"></i> Mark Returned
                        </button>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {/* PDF Document Reader Modal */}
      {selectedBookPdf && (
        <Modal isOpen={!!selectedBookPdf} onClose={()=>setSelectedBookPdf(null)} title={`PDF Reader · ${selectedBookPdf.title}`} maxWidth="850px"
          footer={<>
            <button className="btn btn-secondary" onClick={()=>{
              const blob = new Blob([
                `BOOK: ${selectedBookPdf.title}\nAUTHOR: ${selectedBookPdf.author}\nISBN: ${selectedBookPdf.isbn}\n\n` +
                `TABLE OF CONTENTS & COURSE STUDY NOTES:\n` +
                `Chapter 1: System Overview & Conceptual Foundations\n` +
                `Chapter 2: Mathematical Models and Relational Structures\n` +
                `Chapter 3: Query Optimization and Indexing Architectures\n` +
                `Chapter 4: Concurrency Control, ACID Isolation, and Transaction Logs\n\n` +
                `Verified Campus Library E-Textbook from ${DS.getSettings().institutionName}`
              ], { type: 'text/plain;charset=utf-8' });
              const url = URL.createObjectURL(blob);
              const a = document.createElement('a');
              a.href = url;
              a.download = `${selectedBookPdf.title.replace(/[^a-z0-9]/gi, '_')}.txt`;
              document.body.appendChild(a);
              a.click();
              document.body.removeChild(a);
              showToast('E-Book notes downloaded!', 'success');
            }}>
              <i className="fas fa-download"></i> Download E-Book
            </button>
            <button className="btn btn-primary" onClick={()=>setSelectedBookPdf(null)}>Close Reader</button>
          </>}>
          <div style={{lineHeight:1.6}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14,paddingBottom:10,borderBottom:'1px solid var(--border-light)'}}>
              <div>
                <strong>{selectedBookPdf.title}</strong> by {selectedBookPdf.author}
                <div style={{fontSize:12,color:'var(--text-light)'}}>ISBN: {selectedBookPdf.isbn} · Category: {selectedBookPdf.category}</div>
              </div>
              <span className="badge badge-success"><i className="fas fa-check-circle"></i> Complete Edition</span>
            </div>

            <div style={{background:'var(--bg-primary)',padding:18,borderRadius:12,border:'1px solid var(--border-color)',maxHeight:380,overflowY:'auto',fontSize:13.5,whiteSpace:'pre-wrap'}}>
{`CAMPUS DIGITAL LIBRARY E-READER
=====================================================
Book Title: ${selectedBookPdf.title}
Author(s):  ${selectedBookPdf.author}
Category:   ${selectedBookPdf.category}
Publisher:  Academic Press / International Curriculum Standard

CHAPTER 1: FOUNDATIONS & PRINCIPLES
-----------------------------------------------------
1.1 Historical Evolution and System Need
Data management systems have evolved from flat-file storage to sophisticated multi-tier relational and distributed engines. The core objectives include data independence, fault tolerance, transaction isolation, and high query throughput.

1.2 Structural Architecture
The physical storage layer maps directly to disk pages or cloud object stores. B+ Trees and LSM trees provide low latency index search, while write-ahead logging (WAL) guarantees the Durability contract under unexpected system failures.

CHAPTER 2: ADVANCED ALGORITHMS & IMPLEMENTATION
-----------------------------------------------------
2.1 Query Execution Engine
SQL statements undergo lexical parsing, syntactic tree generation, query optimization via cost-based optimizers, and physical operator execution (e.g. Hash Join vs Nested Loop Join).

2.2 Concurrency & Transaction Management
Multi-Version Concurrency Control (MVCC) eliminates reader-writer locks, allowing consistent non-blocking read snapshots concurrently with background write operations.

CHAPTER 3: PRACTICE PROBLEMS & EXAMINATION DRILLS
-----------------------------------------------------
1. Analyze the time and space complexity difference between Index Seek and Index Scan.
2. Given a functional dependency set F = { A -> B, BC -> D }, compute the candidate key and check 3NF compliance.`}
            </div>
          </div>
        </Modal>
      )}

      {/* YouTube Video Lecture Modal */}
      {selectedVideo && (
        <Modal isOpen={!!selectedVideo} onClose={()=>setSelectedVideo(null)} title={`Video Lecture · ${selectedVideo.title}`} maxWidth="800px"
          footer={<button className="btn btn-secondary" onClick={()=>setSelectedVideo(null)}>Close Lecture</button>}>
          <div>
            <div style={{position:'relative',paddingBottom:'56.25%',height:0,overflow:'hidden',borderRadius:12,background:'#000',marginBottom:14}}>
              <iframe 
                src={selectedVideo.youtubeUrl ? (selectedVideo.youtubeUrl.includes('embed') ? selectedVideo.youtubeUrl : selectedVideo.youtubeUrl.replace('watch?v=', 'embed/')) : "https://www.youtube.com/embed/HXV3zeQKqGY"} 
                title={selectedVideo.title}
                style={{position:'absolute',top:0,left:0,width:'100%',height:'100%',border:0}}
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                allowFullScreen>
              </iframe>
            </div>
            <div style={{fontSize:13,color:'var(--text-secondary)'}}>
              <strong>Course Lecture Series:</strong> {selectedVideo.youtubeTitle || selectedVideo.title}
              <div style={{fontSize:12,color:'var(--text-light)',marginTop:4}}>
                Attached to campus library textbook: <strong>{selectedBookPdf?.title || selectedVideo.title}</strong> by {selectedVideo.author}.
              </div>
            </div>
          </div>
        </Modal>
      )}

      {/* Teacher Add Book Modal */}
      {showAddModal && (
        <Modal isOpen={showAddModal} onClose={()=>setShowAddModal(false)} title="Register New Library Book"
          footer={<>
            <button className="btn btn-secondary" onClick={()=>setShowAddModal(false)}>Cancel</button>
            <button className="btn btn-primary" onClick={handleAddBook}>Save to Catalog</button>
          </>}>
          <div className="form-group"><label className="form-label">Book Title *</label><input className="input" value={newTitle} onChange={e=>setNewTitle(e.target.value)} placeholder="e.g. Modern Operating Systems" /></div>
          <div className="grid-2">
            <div className="form-group"><label className="form-label">Author(s) *</label><input className="input" value={newAuthor} onChange={e=>setNewAuthor(e.target.value)} placeholder="e.g. Andrew S. Tanenbaum" /></div>
            <div className="form-group">
              <label className="form-label">Category</label>
