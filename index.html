          });
          const log = {
            id: `log-${Date.now()}`,
            total: preview.length,
            success,
            failed,
            timestamp: new Date().toISOString(),
            fileName: fileName || 'manual_import.csv'
          };
          DS.addImportLog(log);
          setLogs(DS.getImportLogs());
          setPreview([]);
          setBusy(false);
          showToast(`Import completed: ${success} onboarded · ${failed} failed`, success ? 'success' : 'error');
          triggerConfetti();
        }, 600);
      };

      return (
        <div>
          <div className="card card-gradient animate-fadeIn" style={{marginBottom:20}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:14}}>
              <div>
                <h2>Bulk Student Import & Enrollment Center</h2>
                <p style={{opacity:.85,marginTop:6}}>Excel / CSV → validation → automatic GR numbering → institutional email → student account creation.</p>
              </div>
              <button className="btn btn-secondary btn-sm" onClick={downloadSampleCSV}>
                <i className="fas fa-file-download"></i> Download Sample CSV
              </button>
            </div>
          </div>

          <div className="card">
            <div className="upload-zone" style={{border:'2px dashed var(--border-color)',padding:36,borderRadius:16,textAlign:'center',background:'var(--bg-primary)'}}>
              <i className="fas fa-file-excel" style={{fontSize:48,color:'var(--primary)',marginBottom:14}}/>
              <h3>Drop Excel / CSV or Click to Browse</h3>
              <p style={{color:'var(--text-secondary)',fontSize:13,marginTop:6,maxWidth:520,margin:'6px auto 14px auto'}}>
                Required columns: <strong>Name</strong>, <strong>Phone</strong> · Optional: Class, Department, Semester, Roll, Guardian, Address
              </p>
              <input type="file" accept=".csv,.xlsx,.xls" onChange={e=>parseFile(e.target.files[0])} style={{cursor:'pointer'}} />
            </div>

            {preview.length > 0 && (
              <div style={{marginTop:20}} className="animate-fadeIn">
                <div className="card-header">
                  <h3 className="card-title">Preview · {preview.length} Valid Student Records</h3>
                  <button className="btn btn-success" onClick={importAll} disabled={busy}>
                    {busy ? <><i className="fas fa-spinner fa-spin"></i> Enrolling...</> : <><i className="fas fa-user-check"></i> Enroll All {preview.length} Students</>}
                  </button>
                </div>
                <div className="table-container" style={{maxHeight:340}}>
                  <table>
                    <thead>
                      <tr>
                        {Object.keys(preview[0]).map(k => <th key={k}>{k}</th>)}
                      </tr>
                    </thead>
                    <tbody>
                      {preview.slice(0, 25).map((r, i) => (
                        <tr key={i}>
                          {Object.values(r).map((v, j) => <td key={j}>{String(v)}</td>)}
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}
          </div>

          <div className="card" style={{marginTop:20}}>
            <div className="card-header">
              <h3 className="card-title"><i className="fas fa-history"/> Import Audit History</h3>
              <span className="badge badge-secondary">{logs.length} Logs</span>
            </div>
            <div className="table-container">
              <table>
                <thead>
                  <tr>
                    <th>Timestamp</th>
                    <th>File Name</th>
                    <th>Total Rows</th>
                    <th>Successfully Provisioned</th>
                    <th>Failed Rows</th>
                  </tr>
                </thead>
                <tbody>
                  {logs.map(l => (
                    <tr key={l.id}>
                      <td>{new Date(l.timestamp).toLocaleString()}</td>
                      <td><strong>{l.fileName}</strong></td>
                      <td>{l.total}</td>
                      <td><span className="badge badge-success">{l.success}</span></td>
                      <td><span className={`badge ${l.failed>0?'badge-danger':'badge-secondary'}`}>{l.failed}</span></td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }


function AIAssistantPage({ user }) {
      const [query, setQuery] = useState('');
      const [messages, setMessages] = useState([
        { 
          role: 'ai', 
          content: "Hello! I'm your AI Academic Research & Study Mentor.\n\nI am grounded in your engineering curriculum and textbook syllabi. Ask me about:\n\n• SQL queries, Joins (INNER, LEFT, RIGHT), and indexing strategies\n• Database normalization (1NF, 2NF, 3NF, BCNF) with solved schemas\n• Cloud computing architecture (IaaS, PaaS, SaaS, AWS core)\n• Operating system CPU scheduling & Deadlock Banker's Algorithm\n• 2-Week Semester Exam preparation schedules and strategy\n\nSelect any suggested topic chip below or type your question!",
          sources: [{ title: 'Campus Academic Knowledge Base', topic: 'Engineering Core Curriculum' }]
        }
      ]);
      const [loading, setLoading] = useState(false);
      const chatEndRef = useRef(null);

      useEffect(() => { chatEndRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [messages]);

      const askQuestion = (customQuery = null) => {
        const textToAsk = (typeof customQuery === 'string' ? customQuery : query).trim();
        if (!textToAsk) { showToast('Please enter an academic query', 'warning'); return; }
        if (textToAsk.length > 600) { showToast('Query too long (max 600 chars)', 'warning'); return; }

        setMessages(prev => [...prev, { role: 'user', content: textToAsk }]);
        setLoading(true); 
        if (!customQuery) setQuery('');

        setTimeout(() => {
          try {
            const res = DS.askAI(textToAsk);
            setMessages(prev => [...prev, { role: 'ai', content: res.answer, sources: res.sources || [] }]);
          } catch (err) {
            setMessages(prev => [...prev, { role: 'ai', content: 'An error occurred while retrieving academic notes. Please try again.' }]);
            showToast('AI response lookup failed', 'error');
          }
          setLoading(false);
        }, 650);
      };

      const copyToClipboard = (text) => {
        navigator.clipboard.writeText(text);
        showToast('Code snippet copied to clipboard!', 'success');
      };

      const promptChips = [
        'SQL Joins & Syntax',
        'Normalization (1NF to BCNF)',
        'Cloud Computing (IaaS/PaaS/SaaS)',
        'CPU Scheduling (Round Robin/SJF)',
        '2-Week Exam Study Plan',
        'ACID Transactions & Locking'
      ];

      return (
        <div className="card animate-fadeIn" style={{minHeight:'650px',display:'flex',flexDirection:'column'}}>
          <div className="card-header">
            <div>
              <h3 className="card-title"><i className="fas fa-robot" style={{color:'var(--primary)'}}></i> AI Academic Study Mentor</h3>
              <p style={{fontSize:12,color:'var(--text-light)',margin:'2px 0 0 0'}}>Instant conceptual explanations, syntax examples, and examination preparation.</p>
            </div>
            <div style={{display:'flex',gap:8,alignItems:'center'}}>
              <span className="badge badge-success"><i className="fas fa-circle" style={{fontSize:8,marginRight:4}}></i> Model Ready</span>
              <button className="btn btn-secondary btn-sm" onClick={()=>{
                setMessages([{ role: 'ai', content: "Chat refreshed. How can I help you with your coursework today?", sources: [] }]);
                showToast('Chat history cleared', 'info');
              }} title="Clear conversation history">
                <i className="fas fa-trash-alt"></i> Clear
              </button>
            </div>
          </div>

          <div style={{flex:1,overflowY:'auto',maxHeight:'520px',marginBottom:'16px',padding:'12px'}}>
            {messages.map((msg, i) => (
              <div key={i} className={`chat-message ${msg.role}`}>
                <div className={`avatar ${msg.role}`}>
                  {msg.role === 'ai' ? <i className="fas fa-brain"></i> : user?.name?.charAt(0) || 'U'}
                </div>
                <div className="bubble" style={{maxWidth:'82%',lineHeight:1.6}}>
                  {msg.content.split('\n').map((line, li) => {
                    if (line.startsWith('### ')) {
                      return <h4 key={li} style={{margin:'8px 0 4px 0',color:'var(--primary)',fontSize:15}}>{line.replace('### ', '')}</h4>;
                    }
                    if (line.startsWith('* **') || line.startsWith('• **')) {
                      return <div key={li} style={{marginBottom:4,paddingLeft:4}}>{line}</div>;
                    }
                    if (line.includes('SELECT ') || line.includes('FROM ') || line.includes('JOIN ')) {
                      return (
                        <div key={li} style={{position:'relative',background:'#0f172a',color:'#38bdf8',padding:'10px 14px',borderRadius:8,fontFamily:'monospace',fontSize:12,margin:'8px 0'}}>
                          <code>{line}</code>
                          <button onClick={()=>copyToClipboard(line)} style={{position:'absolute',right:8,top:6,background:'rgba(255,255,255,0.15)',border:'none',color:'white',borderRadius:4,padding:'2px 8px',cursor:'pointer',fontSize:10}}>
                            <i className="fas fa-copy"></i> Copy
                          </button>
                        </div>
                      );
                    }
                    return <div key={li} style={{marginBottom: line ? 2 : 6}}>{line}</div>;
                  })}

                  {msg.sources && msg.sources.length > 0 && (
                    <div style={{marginTop:10,paddingTop:8,borderTop:'1px solid var(--border-color)',display:'flex',gap:8,flexWrap:'wrap'}}>
                      {msg.sources.map((s, si) => (
                        <span key={si} className="badge badge-secondary" style={{fontSize:11}}>
                          <i className="fas fa-bookmark" style={{color:'var(--primary)',marginRight:4}}></i> {s.title}
                        </span>
                      ))}
                    </div>
                  )}
                </div>
              </div>
            ))}

            {loading && (
              <div className="chat-message ai">
                <div className="avatar ai"><i className="fas fa-brain fa-spin"></i></div>
                <div className="bubble">
                  <div className="typing-indicator"><span></span><span></span><span></span></div>
                </div>
              </div>
            )}
            <div ref={chatEndRef}></div>
          </div>

          {/* Quick Query Chips */}
          <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:12}}>
            {promptChips.map(chip => (
              <button key={chip} className="btn btn-secondary btn-sm" style={{fontSize:12,borderRadius:20,padding:'4px 12px'}} onClick={()=>askQuestion(chip)}>
                <i className="fas fa-sparkles" style={{color:'var(--primary)',marginRight:4}}></i> {chip}
              </button>
            ))}
          </div>

          <div style={{display:'flex',gap:8,padding:8,background:'var(--bg-primary)',borderRadius:14,border:'1.5px solid var(--border-color)'}}>
            <input 
              className="input" 
              style={{border:'none',background:'transparent',boxShadow:'none',flex:1}} 
              placeholder="Ask a technical or syllabus question (e.g. Compare 2NF and 3NF, write an INNER JOIN query)..." 
              value={query} 
              onChange={e=>setQuery(e.target.value)} 
              onKeyDown={e=>e.key==='Enter' && askQuestion()} 
            />
            <button className="btn btn-primary" onClick={()=>askQuestion()} disabled={loading} style={{borderRadius:10,padding:'0 18px'}}>
              <i className="fas fa-paper-plane" style={{marginRight:6}}></i> Ask
            </button>
          </div>
        </div>
      );
    }

    // ===================== ACTION CENTER =====================
    

function ActionCenterPage({ user }) {
      const [suggestions, setSuggestions] = useState([]);
      const [interventions, setInterventions] = useState([]);
      const [filter, setFilter] = useState('ALL');

      useEffect(() => {
        const all=DS.getStudents() || []; let s=[]; all.forEach(st=>{ s.push(...DS.generateAISuggestions(st.id)); });
        setSuggestions(s || []); setInterventions(DS.getInterventions() || []);
      }, []);

      const handleAction = (action, studentId) => {
        if (action==='Assign practice') {
          const student=DS.getStudentById(studentId);
          const newInt=DS.addIntervention({ studentId, studentName:student?.name||'Student', teacherId:user?.id||'t1', reason:'Practice assigned by teacher', suggestedAction:'Practice work', actionTaken:'Assigned practice', evidence:'Teacher intervention' });
          setInterventions(prev=>[...prev,newInt]); showToast('Practice assigned successfully','success');
        } else if (action==='Complete demo flow') {
          const student = DS.getStudentById(studentId);
          if (student) {
            const attempt = DS.getQuizAttempts(studentId).find(a=>a.quizId==='q1');
            if (attempt) { attempt.score = 78; }
            const all = DS.getQuizAttempts(studentId);
            const avg = all.length>0?Math.round(all.reduce((s,a)=>s+a.score,0)/all.length):0;
            DS.updateStudent(studentId, { quizAverage: avg, attendance: Math.min(100, (student.attendance||0) + 8) });
            const intervention = DS.getInterventions(studentId).find(i=>i.studentId===studentId);
            if (intervention) { DS.updateIntervention(intervention.id, { status:'COMPLETED', afterScore:78, completedAt:new Date().toISOString() }); }
            DS.addNotification({ id:`n-${Date.now()}`, userId:student.userId, title:'Great Improvement!', message:'Your SQL JOIN score improved to 78%! Keep it up!', type:'SUCCESS', read:false, link:'#quiz', createdAt:new Date().toISOString() });
            showToast('Demo completed! Student improved significantly','success');
            setInterventions(DS.getInterventions() || []);
            const allSt=DS.getStudents(); let s=[]; allSt.forEach(st=>{ s.push(...DS.generateAISuggestions(st.id)); }); setSuggestions(s || []);
          }
        } else showToast(`Action: ${action}`,'info');
      };

      const filtered = filter==='ALL' ? suggestions : suggestions.filter(s=>s.priority===filter);

      return (
        <div>
          <div className="card card-gradient animate-fadeIn" style={{marginBottom:'24px'}}>
            <h2 style={{fontSize:'24px',marginBottom:'8px'}}><i className="fas fa-bullhorn"></i> Action Center</h2>
            <p style={{opacity:0.8,fontSize:'15px'}}>Data → Insight → Action → Result. AI-powered intervention tracking.</p>
          </div>
          <div className="stats-grid">
            <StatCard icon="fa-exclamation-circle" iconClass="red" label="Critical" value={suggestions.filter(s=>s.priority==='CRITICAL').length} delay={1} />
            <StatCard icon="fa-exclamation-triangle" iconClass="orange" label="Attention" value={suggestions.filter(s=>s.priority==='ATTENTION').length} delay={2} />
            <StatCard icon="fa-check-circle" iconClass="green" label="Resolved" value={interventions.filter(i=>i.status==='COMPLETED').length} delay={3} />
            <StatCard icon="fa-spinner" iconClass="blue" label="In Progress" value={interventions.filter(i=>i.status==='IN_PROGRESS').length} delay={4} />
          </div>
          <div className="tabs">
            <button className={`tab ${filter==='ALL'?'active':''}`} onClick={()=>setFilter('ALL')}>All ({suggestions.length})</button>
            <button className={`tab ${filter==='CRITICAL'?'active':''}`} onClick={()=>setFilter('CRITICAL')}>Critical ({suggestions.filter(s=>s.priority==='CRITICAL').length})</button>
            <button className={`tab ${filter==='ATTENTION'?'active':''}`} onClick={()=>setFilter('ATTENTION')}>Attention ({suggestions.filter(s=>s.priority==='ATTENTION').length})</button>
          </div>
          <div className="card animate-fadeIn">
            <div className="card-header"><h3 className="card-title">AI Recommendations</h3></div>
            {filtered.length>0 ? filtered.map((s,i)=> (
              <div key={i} className={`action-card ${s.priority==='CRITICAL'?'critical':'attention'}`}>
                <div className="action-header"><strong>{s.studentName}</strong><span className={`badge ${s.priority==='CRITICAL'?'badge-danger':'badge-warning'}`}>{s.priority}</span></div>
                <div className="action-reason">{s.reason}</div>
                <div className="action-evidence">{s.evidence}</div>
                <div className="action-buttons">
                  <button className="btn btn-sm btn-primary" onClick={()=>handleAction('Assign practice',s.studentId)}><i className="fas fa-check"></i> Assign Practice</button>
                  <button className="btn btn-sm btn-secondary" onClick={()=>showToast(`Message sent to ${s.studentName}`,'success')}><i className="fas fa-envelope"></i> Message</button>
                  {s.studentName==='Aarav Shah' && <button className="btn btn-sm btn-success" onClick={()=>handleAction('Complete demo flow',s.studentId)}><i className="fas fa-rocket"></i> Simulate Improvement</button>}
                </div>
              </div>
            )) : <EmptyState icon="fa-check-circle" title="All clear!" description="No students match the selected filter." />}
          </div>
          <div className="card animate-fadeIn" style={{marginTop:'24px'}}>
            <div className="card-header"><h3 className="card-title">Intervention History</h3></div>
            <div className="table-container">
              <table><thead><tr><th>Student</th><th>Action</th><th>Status</th><th>Before</th><th>After</th></tr></thead>
              <tbody>{interventions.map(i=> (
                <tr key={i.id}><td className="td-name"><div className="td-avatar">{i.studentName.charAt(0)}</div><div className="td-info"><span className="name">{i.studentName}</span></div></td>
                <td>{i.actionTaken||i.suggestedAction}</td>
                <td><span className={`badge ${i.status==='COMPLETED'?'badge-success':i.status==='IN_PROGRESS'?'badge-primary':'badge-warning'}`}>{i.status}</span></td>
                <td>{i.beforeScore||'N/A'}</td><td>{i.afterScore||'Pending'}</td></tr>
              ))}</tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    // ===================== ANALYTICS =====================
    

function AnalyticsPage({ role, viewAs }) {
      const effectiveRole = viewAs || role;
      const [chartType, setChartType] = useState('performance');
      const chartRef1 = useRef(null);
      const chartRef2 = useRef(null);
      const chartInstance1 = useRef(null);
      const chartInstance2 = useRef(null);

      useEffect(() => {
        if (chartRef1.current) {
          if (chartInstance1.current) chartInstance1.current.destroy();
          const ctx = chartRef1.current.getContext('2d');
          const students = DS.getStudents() || [];
          chartInstance1.current = new Chart(ctx, {
            type: chartType==='performance'?'bar':'line',
            data: { labels: students.map(s=>s.name.split(' ')[0]), datasets: [
              { label:'Attendance %', data: students.map(s=>s.attendance||0), backgroundColor:'rgba(99,102,241,0.7)', borderColor:'#6366f1', borderWidth:2, borderRadius:6 },
              { label:'Quiz Avg %', data: students.map(s=>s.quizAverage||0), backgroundColor:'rgba(16,185,129,0.7)', borderColor:'#10b981', borderWidth:2, borderRadius:6 }
            ]},
            options: { responsive:true, plugins:{legend:{position:'top',labels:{font:{family:'Inter'}}}}, scales:{y:{beginAtZero:true,max:100,grid:{color:'var(--border-color)'}}}, animation:{duration:1000,easing:'easeOutQuart'} }
          });
        }
        if (chartRef2.current) {
          if (chartInstance2.current) chartInstance2.current.destroy();
          const ctx = chartRef2.current.getContext('2d');
          const students = DS.getStudents() || [];
          const ranges = {'90-100':0,'80-89':0,'70-79':0,'60-69':0,'Below 60':0};
          students.forEach(s=>{ const avg=s.quizAverage||0; if(avg>=90) ranges['90-100']++; else if(avg>=80) ranges['80-89']++; else if(avg>=70) ranges['70-79']++; else if(avg>=60) ranges['60-69']++; else ranges['Below 60']++; });
          chartInstance2.current = new Chart(ctx, {
            type: 'doughnut',
            data: { labels: Object.keys(ranges), datasets: [{ data: Object.values(ranges), backgroundColor:['#10b981','#6366f1','#f59e0b','#ef4444','#94a3b8'], borderWidth:0 }] },
            options: { responsive:true, plugins:{legend:{position:'right'}}, cutout:'65%', animation:{animateScale:true,animateRotate:true} }
          });
        }
        return () => { if(chartInstance1.current) chartInstance1.current.destroy(); if(chartInstance2.current) chartInstance2.current.destroy(); };
      }, [chartType]);

      const students = DS.getStudents();
      const avgAttendance = students.length>0?Math.round(students.reduce((s,a)=>s+(a.attendance||0),0)/students.length):0;
      const avgQuiz = students.length>0?Math.round(students.reduce((s,a)=>s+(a.quizAverage||0),0)/students.length):0;
      const avgCgpa = students.length>0?(students.reduce((s,a)=>s+(a.cgpa||0),0)/students.length).toFixed(2):'0.00';

      return (
        <div>
          <div className="stats-grid">
            <StatCard icon="fa-calendar-check" iconClass="green" label="Avg Attendance" value={avgAttendance} suffix="%" delay={1} />
            <StatCard icon="fa-pencil-alt" iconClass="purple" label="Avg Quiz" value={avgQuiz} suffix="%" delay={2} />
            <StatCard icon="fa-chart-line" iconClass="blue" label="Avg CGPA" value={avgCgpa} delay={3} />
            <StatCard icon="fa-users" iconClass="orange" label="Total Students" value={students.length} delay={4} />
          </div>
          <div className="grid-2">
            <div className="card animate-fadeIn stagger-2">
              <div className="card-header"><h3 className="card-title">Performance Comparison</h3>
                <select className="input" style={{width:'auto',fontSize:'12px'}} value={chartType} onChange={e=>setChartType(e.target.value)}>
                  <option value="performance">Bar Chart</option><option value="trend">Line Chart</option>
                </select>
              </div>
              <canvas ref={chartRef1} height="250"></canvas>
            </div>
            <div className="card animate-fadeIn stagger-3">
              <div className="card-header"><h3 className="card-title">Score Distribution</h3></div>
              <canvas ref={chartRef2} height="250"></canvas>
            </div>
          </div>
          <div className="card animate-fadeIn stagger-4" style={{marginTop:'24px'}}>
            <div className="card-header"><h3 className="card-title">Detailed Statistics</h3></div>
            <div className="table-container">
              <table><thead><tr><th>Student</th><th>GR</th><th>Attendance</th><th>Quiz Avg</th><th>CGPA</th><th>Backlogs</th><th>Risk Level</th></tr></thead>
              <tbody>{students.map(s=> {
                const risk = s.attendance<75 || s.quizAverage<60 || s.cgpa<7 ? 'HIGH' : s.attendance<85 || s.quizAverage<75 ? 'MEDIUM' : 'LOW';
                return <tr key={s.id}><td className="td-name"><div className="td-avatar">{s.name.charAt(0)}</div><div className="td-info"><span className="name">{s.name}</span><span className="sub">{s.rollNo}</span></div></td>
                <td><span className="badge badge-primary" style={{fontSize:'10px'}}>{s.grNumber}</span></td>
                <td><div className="progress-bar" style={{width:'60px',display:'inline-block',marginRight:'8px',verticalAlign:'middle'}}><div className={`fill ${s.attendance>80?'success':s.attendance>70?'warning':'danger'}`} style={{width:`${s.attendance}%`}}></div></div>{s.attendance}%</td>
                <td>{s.quizAverage}%</td><td>{s.cgpa}</td><td>{s.backlogs}</td>
                <td><span className={`badge ${risk==='HIGH'?'badge-danger':risk==='MEDIUM'?'badge-warning':'badge-success'}`}>{risk}</span></td></tr>;
              })}</tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    // ===================== STUDENTS =====================
    

function StudentsPage({ onModal, role, viewAs }) {
      const effectiveRole = viewAs || role;
      const [search, setSearch] = useState('');
      const [dept, setDept] = useState('ALL');
      const [statusFilter, setStatusFilter] = useState('ALL');
      const [showAdd, setShowAdd] = useState(false);
      const [form, setForm] = useState({
        name: '', phone: '', classId: 'cls1', department: 'd1', semester: 5,
        admissionYear: new Date().getFullYear(), sequence: '', guardian: '',
        guardianPhone: '', gender: '', dob: '', address: ''
      });
      const [created, setCreated] = useState(null);
      const [, setTick] = useState(0);

      const allStudents = DS.getStudents() || [];
      const students = allStudents.filter(s => {
        const matchesSearch = !search || [s.name, s.rollNo, s.grNumber, s.email].join(' ').toLowerCase().includes(search.toLowerCase());
        const matchesDept = dept === 'ALL' || s.department === dept;
        const matchesStatus = statusFilter === 'ALL' ||
          (statusFilter === 'AT_RISK' && s.attendance < 75) ||
          (statusFilter === 'GOOD' && s.attendance >= 75) ||
          (statusFilter === 'FEES_DUE' && DS.getTotalPending(s.id) > 0);
        return matchesSearch && matchesDept && matchesStatus;
      });

      const submit = () => {
        try {
          const r = DS.createStudentAccount(form);
          setCreated(r);
          setTick(t => t + 1);
          showToast(`Student created · ${r.student.grNumber}`, 'success');
          triggerConfetti();
        } catch (e) {
          showToast(e.message, 'error');
        }
      };

      const exportStudentsCSV = () => {
        const headers = ['GR Number', 'Roll No', 'Name', 'Email', 'Class', 'Department', 'Semester', 'Phone', 'Attendance %', 'Quiz Avg %', 'CGPA', 'Pending Fees (₹)'];
        const rows = students.map(s => [
          s.grNumber,
          s.rollNo,
          `"${s.name}"`,
          s.email,
          `"${DS.getClassById(s.classId)?.name || s.classId}"`,
          `"${DS.getDepartmentById(s.department)?.name || s.department}"`,
          s.semester,
          s.phone,
          s.attendance,
          s.quizAverage,
          s.cgpa || 0,
          DS.getTotalPending(s.id)
        ]);
        const csvContent = 'data:text/csv;charset=utf-8,' + [headers.join(','), ...rows.map(e => e.join(','))].join('\n');
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement('a');
        link.setAttribute('href', encodedUri);
        link.setAttribute('download', `students_directory_${new Date().toISOString().slice(0,10)}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        showToast('Student directory exported to CSV!', 'success');
      };

      return (
        <div>
          <div className="card animate-fadeIn" style={{marginBottom:20}}>
            <div style={{display:'flex',gap:12,flexWrap:'wrap',alignItems:'center',justifyContent:'space-between'}}>
              <div style={{display:'flex',gap:10,flex:1,minWidth:300,flexWrap:'wrap'}}>
                <input className="input" style={{flex:1,minWidth:180}} placeholder="Search name, GR, roll, email..." value={search} onChange={e=>setSearch(e.target.value)} />
                <select className="input" style={{width:'auto'}} value={dept} onChange={e=>setDept(e.target.value)}>
                  <option value="ALL">All Departments</option>
                  {DS.getDepartments().map(d => <option key={d.id} value={d.id}>{d.name}</option>)}
                </select>
                <select className="input" style={{width:'auto'}} value={statusFilter} onChange={e=>setStatusFilter(e.target.value)}>
                  <option value="ALL">All Statuses</option>
                  <option value="AT_RISK">⚠️ Low Attendance (&lt;75%)</option>
                  <option value="GOOD">✓ Good Standing (≥75%)</option>
                  <option value="FEES_DUE">₹ Outstanding Fees</option>
                </select>
              </div>
              <div style={{display:'flex',gap:10}}>
                <button className="btn btn-secondary btn-sm" onClick={exportStudentsCSV}>
                  <i className="fas fa-file-csv"></i> Export CSV
                </button>
                <button className="btn btn-primary btn-sm" onClick={()=>{ setCreated(null); setShowAdd(true); }}>
                  <i className="fas fa-user-plus"/> Add Student
                </button>
              </div>
            </div>
          </div>

          <div className="card">
            <div className="card-header">
              <h3 className="card-title">Student Directory & Master Registry</h3>
              <span className="badge badge-primary">{students.length} of {allStudents.length} Students</span>
            </div>
            <div className="table-container">
              <table>
                <thead>
                  <tr>
                    <th>Student</th>
                    <th>GR Number</th>
                    <th>Roll</th>
                    <th>Class</th>
                    <th>Attendance</th>
                    <th>Quiz Avg</th>
                    <th>CGPA</th>
                    <th>Fee Status</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody>
                  {students.length === 0 ? (
                    <tr><td colSpan="9" style={{textAlign:'center',padding:30,color:'var(--text-light)'}}>No matching students found.</td></tr>
                  ) : students.map(s => {
                    const pendingFee = DS.getTotalPending(s.id);
                    return (
                      <tr key={s.id}>
                        <td className="td-name">
                          <div className="td-avatar">{s.name.charAt(0)}</div>
                          <div className="td-info">
                            <span className="name">{s.name}</span>
                            <span className="sub">{DS.getDepartmentById(s.department)?.code || s.department}</span>
                          </div>
                        </td>
                        <td><span className="badge badge-primary">{s.grNumber}</span></td>
                        <td><strong>{s.rollNo}</strong></td>
                        <td>{DS.getClassById(s.classId)?.name || '-'}</td>
                        <td>
                          <span className={`badge ${s.attendance >= 75 ? 'badge-success' : 'badge-danger'}`}>
                            {s.attendance}%
                          </span>
                        </td>
                        <td><span className="badge badge-secondary">{s.quizAverage}%</span></td>
                        <td><strong>{s.cgpa || 0}</strong></td>
                        <td>
                          <span className={`badge ${pendingFee > 0 ? 'badge-warning' : 'badge-success'}`}>
                            {pendingFee > 0 ? `₹${pendingFee.toLocaleString('en-IN')} Due` : 'Paid ✓'}
                          </span>
                        </td>
                        <td>
                          <div style={{display:'flex',gap:6}}>
                            <button className="btn btn-sm btn-secondary" title="View 360° Profile" onClick={()=>{
                              if (typeof onModal === 'function') {
                                onModal({
                                  isOpen: true,
                                  title: `${s.name} · Student 360° Profile`,
                                  onClose: () => onModal(null),
                                  children: (
                                    <div>
                                      <div className="profile-hero" style={{marginBottom:16}}>
                                        <div className="profile-hero-inner">
                                          <div className="profile-hero-avatar" style={{width:64,height:64,borderRadius:'50%',background:'var(--primary-gradient)',display:'flex',alignItems:'center',justifyContent:'center',color:'#fff',fontSize:26,fontWeight:800}}>
                                            {s.name.charAt(0)}
                                          </div>
                                          <div>
                                            <h3 style={{margin:0}}>{s.name}</h3>
                                            <div style={{fontSize:13,color:'var(--text-secondary)'}}>GR: {s.grNumber} · Roll: {s.rollNo} · {DS.getClassById(s.classId)?.name}</div>
                                          </div>
                                        </div>
                                      </div>
                                      <div className="grid-2" style={{fontSize:13,gap:12}}>
                                        <div><label className="form-label">Email</label><strong>{s.email}</strong></div>
                                        <div><label className="form-label">Phone</label><strong>{s.phone}</strong></div>
                                        <div><label className="form-label">Guardian</label><strong>{s.guardian || 'N/A'} ({s.guardianPhone || 'N/A'})</strong></div>
                                        <div><label className="form-label">Date of Birth</label><strong>{s.dob || 'N/A'}</strong></div>
                                        <div><label className="form-label">Gender</label><strong>{s.gender || 'N/A'}</strong></div>
                                        <div><label className="form-label">Address</label><strong>{s.address || 'N/A'}</strong></div>
                                      </div>
                                      <div style={{marginTop:16,display:'flex',gap:10}}>
                                        <button className="btn btn-secondary btn-sm" onClick={()=>printIdCard(s)}>
                                          <i className="fas fa-id-card"></i> Print Student ID Card
                                        </button>
                                      </div>
                                    </div>
                                  )
                                });
                              }
                            }}>
                              <i className="fas fa-eye"/>
                            </button>
                            <button className="btn btn-sm btn-secondary" title="Print ID Card" onClick={()=>printIdCard(s)}>
                              <i className="fas fa-id-card"/>
                            </button>
                          </div>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>

          {showAdd && (
            <Modal isOpen={showAdd} onClose={()=>setShowAdd(false)} title="Add Student & Issue Institutional Credentials"
              footer={created ? (
                <button className="btn btn-primary" onClick={()=>setShowAdd(false)}>Done</button>
              ) : (
                <>
                  <button className="btn btn-secondary" onClick={()=>setShowAdd(false)}>Cancel</button>
                  <button className="btn btn-primary" onClick={submit}>Create Student</button>
                </>
              )}>
              {created ? (
                <div className="card card-gradient">
                  <h3>Account Created ✓</h3>
                  <p style={{marginTop:10}}>Student: <strong>{created.student.name}</strong></p>
                  <p>GR Number: <strong>{created.student.grNumber}</strong></p>
                  <p>Email: <strong>{created.user.email}</strong></p>
                  <p>Initial Password: <strong>{created.user.password}</strong></p>
                  <p style={{marginTop:12,fontSize:12,opacity:.85}}>Credentials provisioned in secure institutional local storage.</p>
                </div>
              ) : (
                <div className="grid-2">
                  <div className="form-group"><label className="form-label">Full Name *</label><input className="input" value={form.name} onChange={e=>setForm({...form,name:e.target.value})} placeholder="e.g. Yash Patel"/></div>
                  <div className="form-group"><label className="form-label">Phone *</label><input className="input" value={form.phone} onChange={e=>setForm({...form,phone:e.target.value})} placeholder="+91 98000 12345"/></div>
                  <div className="form-group"><label className="form-label">Admission Year *</label><input type="number" className="input" value={form.admissionYear} onChange={e=>setForm({...form,admissionYear:e.target.value})}/></div>
                  <div className="form-group"><label className="form-label">Roll / Sequence (optional)</label><input type="number" className="input" placeholder="042" value={form.sequence} onChange={e=>setForm({...form,sequence:e.target.value})}/></div>
                  <div className="form-group"><label className="form-label">Department</label><select className="input" value={form.department} onChange={e=>setForm({...form,department:e.target.value})}>{DS.getDepartments().map(d=><option key={d.id} value={d.id}>{d.name}</option>)}</select></div>
                  <div className="form-group"><label className="form-label">Class</label><select className="input" value={form.classId} onChange={e=>setForm({...form,classId:e.target.value})}>{DS.getClasses().map(c=><option key={c.id} value={c.id}>{c.name}</option>)}</select></div>
                  <div className="form-group"><label className="form-label">Semester</label><input type="number" className="input" value={form.semester} onChange={e=>setForm({...form,semester:e.target.value})}/></div>
                  <div className="form-group"><label className="form-label">Gender</label><select className="input" value={form.gender} onChange={e=>setForm({...form,gender:e.target.value})}><option value="">Select</option><option>Male</option><option>Female</option><option>Other</option></select></div>
                  <div className="form-group"><label className="form-label">Guardian Name</label><input className="input" value={form.guardian} onChange={e=>setForm({...form,guardian:e.target.value})}/></div>
                  <div className="form-group"><label className="form-label">Guardian Phone</label><input className="input" value={form.guardianPhone} onChange={e=>setForm({...form,guardianPhone:e.target.value})}/></div>
                  <div className="form-group"><label className="form-label">Date of Birth</label><input type="date" className="input" value={form.dob} onChange={e=>setForm({...form,dob:e.target.value})}/></div>
                  <div className="form-group"><label className="form-label">Residential Address</label><input className="input" value={form.address} onChange={e=>setForm({...form,address:e.target.value})}/></div>
                  <div style={{gridColumn:'1/-1',padding:14,borderRadius:12,background:'var(--bg-primary)',color:'var(--text-secondary)',fontSize:12}}>
                    <i className="fas fa-magic" style={{color:'var(--primary)'}}/> The system will automatically create <strong>GRYYYYNNN</strong>, an institutional email like <strong>name@{DS.getSettings().schoolDomain}</strong>, and initial password equal to the GR number.
                  </div>
                </div>
              )}
            </Modal>
          )}
        </div>
      );
    }


function TeachersPage() {
      const [showAdd, setShowAdd] = useState(false);
      const [showMsg, setShowMsg] = useState(null);
      const [msgText, setMsgText] = useState('');
      const [form, setForm] = useState({
        name: '', department: 'd1', qualification: 'Ph.D. in Computer Science',
        experience: 8, specialization: 'Distributed Systems & Database Engineering',
        subjects: ['sub1', 'sub2']
      });
      const [, setTick] = useState(0);

      const handleAddTeacher = () => {
        if (!form.name.trim()) { showToast('Please enter faculty name', 'error'); return; }
        const newTeacher = {
          id: 'tch_' + Date.now(),
          name: form.name,
          department: form.department,
          qualification: form.qualification,
          experience: Number(form.experience) || 5,
          specialization: form.specialization,
          subjects: form.subjects,
          email: form.name.toLowerCase().replace(/\s+/g, '.') + '@' + DS.getSettings().schoolDomain,
          phone: '+91 98111 ' + Math.floor(10000 + Math.random() * 90000)
        };
        DS.addTeacher(newTeacher);
        setShowAdd(false);
        setForm({ name: '', department: 'd1', qualification: 'Ph.D. in Computer Science', experience: 8, specialization: 'Distributed Systems', subjects: ['sub1'] });
        setTick(t => t + 1);
        showToast('Faculty member added to directory!', 'success');
      };

      const handleSendMessage = () => {
        if (!msgText.trim()) { showToast('Please enter a message', 'error'); return; }
        DS.sendMessage({
          fromId: 'admin1',
          fromName: 'Administrator',
          toId: showMsg.id,
          toName: showMsg.name,
          subject: 'Administrative Inquiry',
          body: msgText,
          timestamp: new Date().toISOString()
        });
        setShowMsg(null);
        setMsgText('');
        showToast(`Message dispatched to ${showMsg.name}`, 'success');
      };

      const teachers = DS.getTeachers() || [];

      return (
        <div>
          <div className="card animate-fadeIn" style={{marginBottom:'24px'}}>
            <div className="card-header">
              <div>
                <h3 className="card-title"><i className="fas fa-chalkboard-teacher"/> Faculty & Department Directory</h3>
                <p style={{fontSize:12,color:'var(--text-light)',margin:'4px 0 0 0'}}>Distinguished professors, associate faculty, and lab instructors.</p>
              </div>
              <button className="btn btn-primary btn-sm" onClick={()=>setShowAdd(true)}>
                <i className="fas fa-plus"></i> Add Faculty Member
              </button>
            </div>
          </div>

          <div className="grid-2">
            {teachers.map(t => (
              <div key={t.id} className="card animate-fadeIn">
                <div style={{display:'flex',gap:'16px',alignItems:'flex-start'}}>
                  <div style={{width:'56px',height:'56px',borderRadius:'50%',background:'var(--primary-gradient)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'22px',color:'white',fontWeight:700,flexShrink:0}}>
                    {t.name.charAt(0)}
                  </div>
                  <div style={{flex:1}}>
                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
                      <div>
                        <h4 style={{fontWeight:700,marginBottom:'4px'}}>{t.name}</h4>
                        <p style={{fontSize:'13px',color:'var(--text-secondary)',marginBottom:'8px'}}>{t.qualification}</p>
                      </div>
                      <button className="btn btn-sm btn-secondary" onClick={()=>setShowMsg(t)} title="Send Message">
                        <i className="fas fa-envelope"></i> Message
                      </button>
                    </div>
                    <div style={{display:'flex',gap:'8px',flexWrap:'wrap',marginBottom:'12px'}}>
                      <span className="badge badge-secondary">{DS.getDepartmentById(t.department)?.name || t.department}</span>
                      <span className="badge badge-info">{t.experience} years exp</span>
                    </div>
                    <div style={{fontSize:'13px',color:'var(--text-light)'}}><i className="fas fa-lightbulb"></i> {t.specialization}</div>
                    <div style={{marginTop:'12px',paddingTop:'12px',borderTop:'1px solid var(--border-light)',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                      <span style={{fontSize:'12px',color:'var(--text-secondary)'}}>
                        Subjects: {(t.subjects||[]).map(sid=>DS.getSubjectById(sid)?.code || sid).join(', ')}
                      </span>
                      <button className="btn btn-sm btn-secondary" onClick={()=>printIdCard({ name: t.name, grNumber: 'FAC-' + t.id.slice(-3), department: t.department, role: 'FACULTY' })} title="Print Faculty ID">
                        <i className="fas fa-id-card"></i> ID Card
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            ))}
          </div>

          {/* Add Teacher Modal */}
          {showAdd && (
            <Modal isOpen={showAdd} onClose={()=>setShowAdd(false)} title="Add Faculty Member"
              footer={<>
                <button className="btn btn-secondary" onClick={()=>setShowAdd(false)}>Cancel</button>
                <button className="btn btn-primary" onClick={handleAddTeacher}>Add Faculty</button>
              </>}>
              <div className="form-group">
                <label className="form-label">Faculty Full Name</label>
                <input className="input" value={form.name} onChange={e=>setForm({...form, name:e.target.value})} placeholder="e.g. Dr. Sunita Rao" />
              </div>
              <div className="grid-2">
                <div className="form-group">
                  <label className="form-label">Department</label>
                  <select className="input" value={form.department} onChange={e=>setForm({...form, department:e.target.value})}>
                    {DS.getDepartments().map(d => <option key={d.id} value={d.id}>{d.name}</option>)}
                  </select>
                </div>
                <div className="form-group">
                  <label className="form-label">Experience (Years)</label>
                  <input className="input" type="number" value={form.experience} onChange={e=>setForm({...form, experience:e.target.value})} />
                </div>
              </div>
              <div className="form-group">
                <label className="form-label">Educational Qualification</label>
                <input className="input" value={form.qualification} onChange={e=>setForm({...form, qualification:e.target.value})} placeholder="e.g. Ph.D., M.Tech IIT Bombay" />
              </div>
              <div className="form-group">
                <label className="form-label">Core Specialization</label>
                <input className="input" value={form.specialization} onChange={e=>setForm({...form, specialization:e.target.value})} placeholder="e.g. Machine Learning, Cloud Architecture" />
              </div>
            </Modal>
          )}

          {/* Send Message Modal */}
          {showMsg && (
            <Modal isOpen={!!showMsg} onClose={()=>setShowMsg(null)} title={`Send Message to ${showMsg.name}`}
              footer={<>
                <button className="btn btn-secondary" onClick={()=>setShowMsg(null)}>Cancel</button>
                <button className="btn btn-primary" onClick={handleSendMessage}><i className="fas fa-paper-plane"></i> Send</button>
              </>}>
              <div className="form-group">
                <label className="form-label">Recipient</label>
                <input className="input" disabled value={`${showMsg.name} (${DS.getDepartmentById(showMsg.department)?.name})`} />
              </div>
              <div className="form-group">
                <label className="form-label">Message Content</label>
                <textarea className="input" style={{minHeight:120}} value={msgText} onChange={e=>setMsgText(e.target.value)} placeholder="Type your academic or administrative notice here..." />
              </div>
            </Modal>
          )}
        </div>
      );
    }


function ClassesPage() {
      const [showAddClass, setShowAddClass] = useState(false);
      const [selectedRosterClass, setSelectedRosterClass] = useState(null);
      const [className, setClassName] = useState('');
      const [classDept, setClassDept] = useState('d1');
      const [classSem, setClassSem] = useState(5);
      const [classSection, setClassSection] = useState('A');
      const [classCapacity, setClassCapacity] = useState(60);
      const [, setTick] = useState(0);

      const handleAddClass = () => {
        if (!className.trim()) { showToast('Please enter class title', 'error'); return; }
        const newC = {
          id: 'cls_' + Date.now(),
          name: className,
          department: classDept,
          semester: Number(classSem) || 1,
          section: classSection,
          capacity: Number(classCapacity) || 60
        };
        DS.addClass(newC);
        setShowAddClass(false);
        setClassName('');
        setTick(t => t + 1);
        showToast('Class created successfully!', 'success');
      };

      const classes = DS.getClasses() || [];

      return (
        <div>
          <div className="card animate-fadeIn" style={{marginBottom:24}}>
            <div className="card-header">
              <div>
                <h3 className="card-title"><i className="fas fa-university"/> Academic Classes & Batches</h3>
                <p style={{fontSize:12,color:'var(--text-light)',margin:'4px 0 0 0'}}>Manage student sections, enrolled cohort strength, and attendance averages.</p>
              </div>
              <button className="btn btn-primary btn-sm" onClick={()=>setShowAddClass(true)}>
                <i className="fas fa-plus"></i> Create New Class
              </button>
            </div>
          </div>

          <div className="grid-2">
            {classes.map(c => {
              const students = DS.getStudents().filter(s => s.classId === c.id);
              const avgAtt = students.length ? Math.round(students.reduce((s, a) => s + (a.attendance || 0), 0) / students.length) : 0;
              return (
                <div key={c.id} className="card animate-fadeIn">
                  <div className="card-header">
                    <div>
                      <h3 className="card-title">{c.name}</h3>
                      <span className="badge badge-secondary" style={{marginTop:4}}>Section {c.section || 'A'} · {DS.getDepartmentById(c.department)?.code}</span>
                    </div>
                    <span className="badge badge-primary">Semester {c.semester}</span>
                  </div>
                  <div className="grid-2" style={{gap:'12px',marginBottom:'14px'}}>
                    <div style={{padding:'16px',background:'var(--bg-primary)',borderRadius:'12px',textAlign:'center'}}>
                      <div style={{fontSize:'28px',fontWeight:800,color:'var(--primary)'}}>{students.length} / {c.capacity || 60}</div>
                      <div style={{fontSize:'12px',color:'var(--text-secondary)'}}>Students Enrolled</div>
                    </div>
                    <div style={{padding:'16px',background:'var(--bg-primary)',borderRadius:'12px',textAlign:'center'}}>
                      <div style={{fontSize:'28px',fontWeight:800,color:avgAtt>=75?'var(--success)':'var(--danger)'}}>{avgAtt}%</div>
                      <div style={{fontSize:'12px',color:'var(--text-secondary)'}}>Cohort Avg Attendance</div>
                    </div>
                  </div>
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',paddingTop:'12px',borderTop:'1px solid var(--border-light)'}}>
                    <div style={{fontSize:'13px',color:'var(--text-secondary)'}}>
                      Department: <strong>{DS.getDepartmentById(c.department)?.name || c.department}</strong>
                    </div>
                    <button className="btn btn-sm btn-secondary" onClick={()=>setSelectedRosterClass(c)}>
                      <i className="fas fa-users"></i> View Class Roster
                    </button>
                  </div>
                </div>
              );
            })}
          </div>

          {/* Add Class Modal */}
          {showAddClass && (
            <Modal isOpen={showAddClass} onClose={()=>setShowAddClass(false)} title="Create New Academic Class / Batch"
              footer={<>
                <button className="btn btn-secondary" onClick={()=>setShowAddClass(false)}>Cancel</button>
                <button className="btn btn-primary" onClick={handleAddClass}>Create Class</button>
              </>}>
              <div className="form-group">
                <label className="form-label">Class Name / Code</label>
                <input className="input" value={className} onChange={e=>setClassName(e.target.value)} placeholder="e.g. CS-2024-C" />
              </div>
              <div className="grid-2">
                <div className="form-group">
                  <label className="form-label">Department</label>
                  <select className="input" value={classDept} onChange={e=>setClassDept(e.target.value)}>
                    {DS.getDepartments().map(d => <option key={d.id} value={d.id}>{d.name}</option>)}
                  </select>
                </div>
                <div className="form-group">
                  <label className="form-label">Semester</label>
                  <input className="input" type="number" min="1" max="8" value={classSem} onChange={e=>setClassSem(e.target.value)} />
                </div>
              </div>
              <div className="grid-2">
                <div className="form-group">
                  <label className="form-label">Section</label>
                  <input className="input" value={classSection} onChange={e=>setClassSection(e.target.value)} placeholder="A, B, C" />
                </div>
                <div className="form-group">
                  <label className="form-label">Capacity (Max Students)</label>
                  <input className="input" type="number" value={classCapacity} onChange={e=>setClassCapacity(e.target.value)} />
                </div>
              </div>
            </Modal>
          )}

          {/* View Class Roster Modal */}
          {selectedRosterClass && (
            <Modal isOpen={!!selectedRosterClass} onClose={()=>setSelectedRosterClass(null)} title={`${selectedRosterClass.name} · Student Enrollment Roster`}
              footer={<button className="btn btn-primary" onClick={()=>setSelectedRosterClass(null)}>Close</button>}>
              {(() => {
                const roster = DS.getStudents().filter(s => s.classId === selectedRosterClass.id);
                return roster.length === 0 ? (
                  <div style={{textAlign:'center',padding:24,color:'var(--text-light)'}}>No students enrolled in this class yet.</div>
                ) : (
                  <div className="table-container" style={{maxHeight:340}}>
                    <table>
                      <thead>
                        <tr>
                          <th>Roll</th>
                          <th>GR</th>
                          <th>Student Name</th>
                          <th>Attendance</th>
                          <th>CGPA</th>
                          <th>Contact</th>
                        </tr>
                      </thead>
                      <tbody>
                        {roster.map(s => (
                          <tr key={s.id}>
                            <td><strong>{s.rollNo}</strong></td>
                            <td><span className="badge badge-primary">{s.grNumber}</span></td>
                            <td><strong>{s.name}</strong></td>
                            <td><span className={`badge ${s.attendance>=75?'badge-success':'badge-danger'}`}>{s.attendance}%</span></td>
                            <td>{s.cgpa || '-'}</td>
                            <td>{s.phone}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                );
              })()}
            </Modal>
          )}
        </div>
      );
    }


function MessagesPage({ user }) {
      const [messages, setMessages] = useState(DS.getMessages(user.id) || []);
      const [composeOpen, setComposeOpen] = useState(false);
      const [newMsg, setNewMsg] = useState({to:'', subject:'', content:''});

      const sendMessage = () => {
        if (!newMsg.to) { showToast('Please select a recipient','error','Validation Error'); return; }
        if (!newMsg.subject.trim()) { showToast('Subject is required','error','Validation Error'); return; }
        if (!newMsg.content.trim()) { showToast('Message content is required','error','Validation Error'); return; }
        if (newMsg.subject.length > 150) { showToast('Subject must be under 150 characters','error'); return; }
        if (newMsg.content.length > 2000) { showToast('Message must be under 2000 characters','error'); return; }
        DS.addMessage({ id:`m-${Date.now()}`, from:user.id, to:newMsg.to, subject:newMsg.subject.trim(), content:newMsg.content.trim(), timestamp:new Date().toISOString(), read:false });
        setMessages(DS.getMessages(user.id)); setComposeOpen(false); setNewMsg({to:'',subject:'',content:''});
        showToast('Message sent successfully','success');
      };

      return (
        <div>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'24px'}}>
            <h2 style={{fontSize:'20px',fontWeight:800}}>Messages</h2>
            <button className="btn btn-primary" onClick={()=>setComposeOpen(true)}><i className="fas fa-plus"></i> Compose</button>
          </div>
          <div className="card animate-fadeIn">
            {messages.length>0 ? messages.map(m=> {
              const isSent = m.from === user.id;
              const other = isSent ? DS.getUserById(m.to) : DS.getUserById(m.from);
              return (
                <div key={m.id} style={{padding:'16px',borderBottom:'1px solid var(--border-light)',display:'flex',gap:'14px',alignItems:'flex-start'}}>
                  <div style={{width:'40px',height:'40px',borderRadius:'50%',background:'var(--primary-gradient)',display:'flex',alignItems:'center',justifyContent:'center',color:'white',fontWeight:700,flexShrink:0}}>{other?.name.charAt(0)}</div>
                  <div style={{flex:1}}>
                    <div style={{display:'flex',justifyContent:'space-between',marginBottom:'4px'}}>
                      <span style={{fontWeight:700}}>{isSent?'To: ':'From: '}{other?.name}</span>
                      <span style={{fontSize:'12px',color:'var(--text-light)'}}>{new Date(m.timestamp).toLocaleString()}</span>
                    </div>
                    <div style={{fontWeight:600,marginBottom:'4px'}}>{m.subject}</div>
                    <div style={{fontSize:'13px',color:'var(--text-secondary)'}}>{m.content}</div>
                  </div>
                </div>
              );
            }) : <EmptyState icon="fa-envelope-open" title="No messages" description="Your inbox is empty" />}
          </div>
          {composeOpen && (
            <Modal isOpen={composeOpen} onClose={()=>setComposeOpen(false)} title="Compose Message" footer={<><button className="btn btn-secondary" onClick={()=>setComposeOpen(false)}>Cancel</button><button className="btn btn-primary" onClick={sendMessage}><i className="fas fa-paper-plane"></i> Send</button></>}>
              <div className="form-group"><label className="form-label">To</label><select className="input" value={newMsg.to} onChange={e=>setNewMsg({...newMsg,to:e.target.value})}><option value="">Select recipient</option>{DS.getUsers().filter(u=>u.id!==user.id).map(u=><option key={u.id} value={u.id}>{u.name} ({u.role})</option>)}</select></div>
              <div className="form-group"><label className="form-label">Subject</label><input className="input" value={newMsg.subject} onChange={e=>setNewMsg({...newMsg,subject:e.target.value})} placeholder="Enter subject" /></div>
              <div className="form-group"><label className="form-label">Message</label><textarea className="input" rows="4" value={newMsg.content} onChange={e=>setNewMsg({...newMsg,content:e.target.value})} placeholder="Type your message..." style={{resize:'vertical'}}></textarea></div>
            </Modal>
          )}
        </div>
      );
    }

    // ===================== ANNOUNCEMENTS =====================
    

function AnnouncementsPage({ user, role, viewAs }) {
      const effectiveRole = viewAs || role;
      const [showAdd, setShowAdd] = useState(false);
      const [newAnn, setNewAnn] = useState({title:'', content:'', priority:'MEDIUM', audience:'ALL'});
      const announcements = DS.getAnnouncements() || [];

      const createAnnouncement = () => {
        if (!newAnn.title.trim() || !newAnn.content.trim()) { showToast('Title and content are required','error','Validation Error'); return; }
        if (newAnn.title.length > 200) { showToast('Title must be under 200 characters','error'); return; }
        if (newAnn.content.length > 2000) { showToast('Content must be under 2000 characters','error'); return; }
        DS.addAnnouncement({ id:`an-${Date.now()}`, ...newAnn, createdAt:new Date().toISOString(), createdBy:user.id });
        setShowAdd(false); setNewAnn({title:'',content:'',priority:'MEDIUM',audience:'ALL'});
        showToast('Announcement published','success');
      };

      return (
        <div>
          {(effectiveRole==='ADMIN' || effectiveRole==='TEACHER') && (
            <div style={{display:'flex',justifyContent:'flex-end',marginBottom:'24px'}}>
              <button className="btn btn-primary" onClick={()=>setShowAdd(true)}><i className="fas fa-plus"></i> New Announcement</button>
            </div>
          )}
          <div className="grid-2">{announcements.map(a=> (
            <div key={a.id} className="card animate-fadeIn">
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:'12px'}}>
                <span className={`badge ${a.priority==='HIGH'?'badge-danger':'badge-info'}`}>{a.priority}</span>
                <span className="badge badge-secondary">{a.audience}</span>
              </div>
              <h3 style={{fontSize:'18px',fontWeight:700,marginBottom:'8px'}}>{a.title}</h3>
              <p style={{color:'var(--text-secondary)',fontSize:'14px',lineHeight:'1.6',marginBottom:'16px'}}>{a.content}</p>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',fontSize:'12px',color:'var(--text-light)'}}>
                <span><i className="fas fa-user"></i> {DS.getUserById(a.createdBy)?.name}</span>
                <span><i className="fas fa-clock"></i> {new Date(a.createdAt).toLocaleDateString()}</span>
              </div>
            </div>
          ))}</div>
          {showAdd && (
            <Modal isOpen={showAdd} onClose={()=>setShowAdd(false)} title="New Announcement" footer={<><button className="btn btn-secondary" onClick={()=>setShowAdd(false)}>Cancel</button><button className="btn btn-primary" onClick={createAnnouncement}><i className="fas fa-bullhorn"></i> Publish</button></>}>
              <div className="form-group"><label className="form-label">Title</label><input className="input" value={newAnn.title} onChange={e=>setNewAnn({...newAnn,title:e.target.value})} placeholder="Announcement title" /></div>
              <div className="form-group"><label className="form-label">Content</label><textarea className="input" rows="4" value={newAnn.content} onChange={e=>setNewAnn({...newAnn,content:e.target.value})} placeholder="Announcement details..." style={{resize:'vertical'}}></textarea></div>
              <div className="grid-2">
                <div className="form-group"><label className="form-label">Priority</label><select className="input" value={newAnn.priority} onChange={e=>setNewAnn({...newAnn,priority:e.target.value})}><option>HIGH</option><option>MEDIUM</option><option>LOW</option></select></div>
                <div className="form-group"><label className="form-label">Audience</label><select className="input" value={newAnn.audience} onChange={e=>setNewAnn({...newAnn,audience:e.target.value})}><option value="ALL">Everyone</option><option value="STUDENT">Students</option><option value="TEACHER">Teachers</option></select></div>
              </div>
            </Modal>
          )}
        </div>
      );
    }

    // ===================== USER PROFILE / ACCOUNT CENTER =====================
    

function ProfilePage({ user, role, theme, toggleTheme, navigateTo, onLogout }) {
      const [activeTab, setActiveTab] = useState('overview');
      const [editing, setEditing] = useState(false);
      const [saving, setSaving] = useState(false);
      const [profile, setProfile] = useState({ ...user });
      const [avatarPreview, setAvatarPreview] = useState(user?.avatar || null);
      const [prefs, setPrefs] = useState(DS.getProfilePreferences(user.id));
      const [passwords, setPasswords] = useState({current:'',next:'',confirm:''});
      const [idModal, setIdModal] = useState(false);
      const fileRef = useRef(null);

      const student = DS.getStudentByUserId(user.id);
      const teacher = DS.getTeacherByUserId(user.id);
      const admin = DS.getAdminByUserId(user.id);
      const accountant = DS.getCollection('accountants').find(a=>a.userId===user.id);
      const dept = student ? DS.getDepartmentById(student.department) : teacher ? DS.getDepartmentById(teacher.department) : null;
      const cls = student ? DS.getClassById(student.classId) : null;
      const attendance = student ? DS.getAttendanceStats(student.id) : null;
      const fees = student ? DS.getFeeTransactions({studentId:student.id,status:'SUCCESS'}) : [];
      const pendingFees = student ? DS.getTotalPending(student.id) : 0;
      const library = student ? DS.getLibraryBooks().filter(b=>b.borrowedBy===student.id || b.studentId===student.id || b.issuedTo===student.id) : [];
      const transport = student ? DS.getTransportAllocations(student.id) : [];
      const assignments = student ? DS.getAssignments(student.classId).filter(a=>DS.getSubmissions(a.id,student.id).length===0) : [];
      const grades = student ? DS.getGrades(student.id) : [];
      const attempts = student ? DS.getQuizAttempts(student.id) : [];
      const complaints = DS.getComplaints().filter(c=>c.filedBy===user.id);
      const notifications = DS.getNotifications(user.id);
      const customActivity = DS.getActivities(user.id);

      const profileData = student || teacher || admin || accountant || {};
      const displayName = profile.name || user.name || 'User';
      const initials = displayName.split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase() || 'U';
      const roleLabel = role || user.role || 'USER';
      const roleDetails = roleLabel==='STUDENT' ? `${dept?.name || 'Student'} · ${cls?.name || 'Academic Program'}` : roleLabel==='TEACHER' ? `${dept?.name || 'Faculty'} · ${teacher?.specialization || teacher?.designation || 'Faculty'}` : roleLabel==='ADMIN' ? `${admin?.department || 'Administration'} · ${admin?.designation || 'Administrator'}` : `${accountant?.department || 'Finance'} · ${accountant?.designation || 'Accountant'}`;

      const completionFields = roleLabel==='STUDENT' ? [profile.name,profile.email,profile.phone,profile.avatar||avatarPreview,student?.dob,student?.address,student?.guardian,student?.guardianPhone] : [profile.name,profile.email,profile.phone,profile.avatar||avatarPreview,profile.joined];
      const completion = Math.round(completionFields.filter(Boolean).length / completionFields.length * 100);

      const activities = useMemo(() => {
        const items = [...customActivity];
        if (student) {
          DS.getAttendance(student.id).slice(0,4).forEach(a=>items.push({id:`att-${a.id}`,type:'attendance',title:'Attendance record updated',detail:`${a.status}${a.method ? ' · '+a.method : ''}`,createdAt:a.timestamp || a.date}));
          DS.getQuizAttempts(student.id).slice(0,3).forEach(a=>items.push({id:`quiz-${a.id}`,type:'quiz',title:'Quiz attempt recorded',detail:`Score: ${a.score}${a.total ? '/'+a.total : ''}`,createdAt:a.date}));
          DS.getSubmissions(null,student.id).slice(0,3).forEach(a=>items.push({id:`sub-${a.id}`,type:'assignment',title:'Assignment submitted',detail:a.fileName || a.status || 'Submission',createdAt:a.submittedAt}));
          fees.slice(0,3).forEach(a=>items.push({id:`fee-${a.id}`,type:'fee',title:'Fee payment recorded',detail:`₹${Number(a.amountPaid||0).toLocaleString('en-IN')}`,createdAt:a.paidAt}));
        }
        notifications.slice(0,3).forEach(n=>items.push({id:`notif-${n.id}`,type:'notification',title:n.title,detail:n.message,createdAt:n.createdAt}));
        return items.filter(x=>x.createdAt).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)).slice(0,8);
      }, [student, customActivity.length, notifications.length, fees.length]);

      const saveProfile = () => {
        if (!profile.name.trim()) return showToast('Full name is required','error');
        if (profile.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(profile.email)) return showToast('Please enter a valid email','error');
        if (profile.phone && profile.phone.replace(/\D/g,'').length < 10) return showToast('Phone number must contain at least 10 digits','error');
        setSaving(true);
        setTimeout(()=>{
          const updated = DS.updateCurrentUser(user.id,{name:profile.name.trim(),email:profile.email.trim(),phone:profile.phone.trim(),avatar:avatarPreview || null});
          if (student) DS.updateStudent(student.id,{name:profile.name.trim(),dob:profile.dob || student.dob,address:profile.address || student.address,gender:profile.gender || student.gender,guardian:profile.guardian || student.guardian,guardianPhone:profile.guardianPhone || student.guardianPhone});
          DS.addActivity(user.id,'profile','Profile updated','Personal information was updated');
          setProfile({...updated}); setEditing(false); setSaving(false); showToast('Profile updated successfully','success');
          window.dispatchEvent(new Event('edutrack-profile-updated'));
        },350);
      };

      const handleAvatar = e => {
        const file=e.target.files?.[0]; if(!file) return;
        if(!file.type.startsWith('image/')) return showToast('Please choose an image file','error');
        if(file.size>2*1024*1024) return showToast('Profile photo must be 2 MB or smaller','error');
        const reader=new FileReader(); reader.onload=ev=>{setAvatarPreview(ev.target.result); setEditing(true);}; reader.readAsDataURL(file);
      };

      const savePrefs = () => { DS.saveProfilePreferences(user.id,prefs); showToast('Preferences saved','success'); };
      const changePassword = () => {
        if (!passwords.current || !passwords.next || !passwords.confirm) return showToast('Complete all password fields','error');
        if (passwords.current !== user.password) return showToast('Current password is incorrect','error');
        if (passwords.next.length < 8) return showToast('New password must be at least 8 characters','error');
        if (passwords.next !== passwords.confirm) return showToast('New passwords do not match','error');
        DS.updateCurrentUser(user.id,{password:passwords.next}); DS.addActivity(user.id,'security','Password changed','Account password was updated'); setPasswords({current:'',next:'',confirm:''}); showToast('Password changed successfully','success');
      };

      const field = (label,value,extra='') => <div className="profile-field"><div className="field-label">{label}</div><div className="field-value">{value || 'Not provided'} {extra}</div></div>;
      const stat = (label,value,sub,icon) => <div className="profile-stat"><div style={{display:'flex',justifyContent:'space-between',gap:8}}><div><div className="label">{label}</div><div className="value">{value}</div><div className="sub">{sub}</div></div><i className={`fas ${icon}`} style={{color:'var(--primary)',fontSize:20,marginTop:3}}></i></div></div>;

      const renderOverview = () => (
        <div>
          <div className="grid-4" style={{marginBottom:20}}>
            {roleLabel==='STUDENT' ? <>
              {stat('Attendance',`${attendance?.percentage||student?.attendance||0}%`,'Overall attendance','fa-calendar-check')}
              {stat('CGPA',student?.cgpa ?? 0,'Current academic score','fa-graduation-cap')}
              {stat('Quiz Average',`${student?.quizAverage||0}%`,'Assessment average','fa-pencil-alt')}
              {stat('Backlogs',student?.backlogs||0,'Active backlogs','fa-exclamation-triangle')}
            </> : <>
              {stat('Role',roleLabel,'Access level','fa-user-shield')}
              {stat('Department',dept?.code || profileData.department || '—','Department','fa-building')}
              {stat('Joined',profile.joined || '—','Institution date','fa-calendar')}
              {stat('Status','Active','Account status','fa-circle-check')}
            </>}
          </div>
          <div className="grid-2">
            <div className="card animate-fadeIn">
              <div className="profile-section-title"><div><h3>Profile Completion</h3><p>Complete your account for a better experience.</p></div><div className="profile-completion-ring" style={{'--progress':`${completion}%`}}><span>{completion}%</span></div></div>
              <div className="profile-progress"><div style={{width:`${completion}%`}}></div></div>
              <div style={{marginTop:14,fontSize:12,color:'var(--text-secondary)'}}>{completion>=100?'Your profile is complete.':`${completionFields.filter(Boolean).length} of ${completionFields.length} recommended fields completed.`}</div>
            </div>
            <div className="card animate-fadeIn">
              <div className="profile-section-title"><div><h3>Quick Access</h3><p>Jump to your most-used modules.</p></div></div>
              <div style={{display:'flex',flexWrap:'wrap',gap:8}}>
                {roleLabel==='STUDENT' && <><button className="btn btn-secondary btn-sm" onClick={()=>navigateTo('grades')}><i className="fas fa-chart-bar"></i> Grades</button><button className="btn btn-secondary btn-sm" onClick={()=>navigateTo('fees')}><i className="fas fa-rupee-sign"></i> Fees</button><button className="btn btn-secondary btn-sm" onClick={()=>navigateTo('library')}><i className="fas fa-book"></i> Library</button><button className="btn btn-secondary btn-sm" onClick={()=>navigateTo('transport')}><i className="fas fa-bus"></i> Transport</button></>}
                <button className="btn btn-secondary btn-sm" onClick={()=>navigateTo('messages')}><i className="fas fa-envelope"></i> Messages</button>
                <button className="btn btn-secondary btn-sm" onClick={()=>setActiveTab('security')}><i className="fas fa-shield-alt"></i> Security</button>
              </div>
            </div>
          </div>
          {roleLabel==='STUDENT' && <>
            <div className="grid-4" style={{marginTop:20}}>
              {stat('Pending Fees',`₹${pendingFees.toLocaleString('en-IN')}`,'Outstanding amount','fa-wallet')}
              {stat('Pending Assignments',assignments.length,'Not submitted','fa-tasks')}
              {stat('Quiz Attempts',attempts.length,'Recorded attempts','fa-pencil-alt')}
              {stat('Complaints',complaints.length,'Filed by you','fa-exclamation-circle')}
            </div>
            <div className="grid-2" style={{marginTop:20}}>
              <div className="card"><div className="profile-section-title"><div><h3>Academic Snapshot</h3><p>Current performance from your UMS records.</p></div></div><div className="grid-2">{field('Department',dept?.name)}{field('Class',cls?.name)}{field('Semester',student?.semester)}{field('Curriculum Progress',`${student?.curriculumProgress||0}%`)}{field('Quiz Average',`${student?.quizAverage||0}%`)}{field('Academic Status',(student?.backlogs||0)>0?'Needs Attention':'Good Standing')}</div></div>
              <div className="card"><div className="profile-section-title"><div><h3>Recent Activity</h3><p>Your latest account and academic activity.</p></div><button className="btn btn-ghost btn-sm" onClick={()=>setActiveTab('activity')}>View all</button></div>{activities.length?<div className="timeline">{activities.slice(0,5).map(a=><div className="timeline-item" key={a.id}><div style={{fontWeight:700,fontSize:13}}>{a.title}</div><div style={{fontSize:12,color:'var(--text-secondary)',marginTop:3}}>{a.detail}</div><div className="time">{new Date(a.createdAt).toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'})}</div></div>)}</div>:<EmptyState icon="fa-history" title="No recent activity" description="Your recent account activity will appear here."/>}</div>
            </div>
          </>}
        </div>
      );

      const renderPersonal = () => (
        <div className="grid-2">
          <div className="card">
            <div className="profile-section-title"><div><h3>Personal Information</h3><p>Manage the information you are allowed to edit.</p></div><button className="btn btn-primary btn-sm" onClick={()=>setEditing(!editing)}><i className={`fas ${editing?'fa-times':'fa-pen'}`}></i> {editing?'Cancel':'Edit Profile'}</button></div>
