<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#6366f1">
  <title>EDUTrack Pro v5.0 · Digital Campus ERP</title>
  
  <!-- Firebase SDK (v8 Compat for CDN usage) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  
  <!-- React 18 -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js"></script>
  
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  
  <style>
    :root {
      --primary: #6366f1; --primary-dark: #4f46e5; --primary-light: #818cf8;
      --primary-gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #a855f7 100%);
      --secondary: #0ea5e9; --success: #10b981; --warning: #f59e0b; --danger: #ef4444; --info: #3b82f6;
      --bg-primary: #f8fafc; --bg-secondary: #ffffff; --bg-sidebar: #0f172a;
      --bg-card: #ffffff; --bg-glass: rgba(255,255,255,0.7);
      --text-primary: #0f172a; --text-secondary: #475569; --text-light: #94a3b8;
      --border-color: #e2e8f0; --border-light: #f1f5f9;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.04); --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
      --shadow-lg: 0 12px 24px rgba(0,0,0,0.12); --shadow-xl: 0 24px 48px rgba(0,0,0,0.18);
      --shadow-glow: 0 0 40px rgba(99,102,241,0.15);
      --radius: 14px; --radius-lg: 20px; --radius-full: 9999px;
      --sidebar-width: 280px; --sidebar-collapsed: 72px; --topbar-height: 76px;
      --transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      --transition-bounce: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    [data-theme="dark"] {
      --bg-primary: #020617; --bg-secondary: #0f172a; --bg-sidebar: #020617;
      --bg-card: #1e293b; --bg-glass: rgba(15,23,42,0.7);
      --text-primary: #f8fafc; --text-secondary: #94a3b8; --text-light: #64748b;
      --border-color: #334155; --border-light: #1e293b;
      --shadow-glow: 0 0 40px rgba(99,102,241,0.25);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Inter',sans-serif; background:var(--bg-primary); color:var(--text-primary); transition:var(--transition); overflow:hidden; height:100vh; }
    ::-webkit-scrollbar { width:5px; height:5px; }
    ::-webkit-scrollbar-track { background:transparent; }
    ::-webkit-scrollbar-thumb { background:var(--primary-light); border-radius:var(--radius-full); }
    ::-webkit-scrollbar-thumb:hover { background:var(--primary); }

    @keyframes fadeIn { from { opacity:0; transform:translateY(20px) scale(0.98); } to { opacity:1; transform:translateY(0) scale(1); } }
    @keyframes fadeInLeft { from { opacity:0; transform:translateX(-30px); } to { opacity:1; transform:translateX(0); } }
    @keyframes scaleIn { from { opacity:0; transform:scale(0.9); } to { opacity:1; transform:scale(1); } }
    @keyframes slideUp { from { transform:translateY(100%); opacity:0; } to { transform:translateY(0); opacity:1; } }
    @keyframes pulse-glow { 0%,100% { box-shadow:0 0 0 0 rgba(99,102,241,0.4); } 50% { box-shadow:0 0 0 12px rgba(99,102,241,0); } }
    @keyframes float { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-8px); } }
    @keyframes shimmer { 0% { background-position:-200% 0; } 100% { background-position:200% 0; } }
    @keyframes gradient-shift { 0% { background-position:0% 50%; } 50% { background-position:100% 50%; } 100% { background-position:0% 50%; } }
    @keyframes typingBounce { 0%,80%,100% { transform:scale(0); } 40% { transform:scale(1); } }
    @keyframes spin-slow { from { transform:rotate(0deg); } to { transform:rotate(360deg); } }
    @keyframes confetti-fall { 0% { transform:translateY(-100vh) rotate(0deg); opacity:1; } 100% { transform:translateY(100vh) rotate(720deg); opacity:0; } }
    @keyframes ripple { 0% { transform:scale(0); opacity:0.5; } 100% { transform:scale(4); opacity:0; } }
    @keyframes scan-line { 0% { top:0; } 100% { top:100%; } }

    .animate-fadeIn { animation:fadeIn 0.5s cubic-bezier(0.4,0,0.2,1) forwards; }
    .animate-scaleIn { animation:scaleIn 0.4s cubic-bezier(0.34,1.56,0.64,1) forwards; }
    .animate-float { animation:float 3s ease-in-out infinite; }
    .stagger-1 { animation-delay:0.05s; opacity:0; animation-fill-mode:forwards; }
    .stagger-2 { animation-delay:0.1s; opacity:0; animation-fill-mode:forwards; }
    .stagger-3 { animation-delay:0.15s; opacity:0; animation-fill-mode:forwards; }
    .stagger-4 { animation-delay:0.2s; opacity:0; animation-fill-mode:forwards; }
    .stagger-5 { animation-delay:0.25s; opacity:0; animation-fill-mode:forwards; }

    .hidden { display:none !important; }
    .flex { display:flex; } .flex-col { flex-direction:column; } .items-center { align-items:center; } .justify-between { justify-content:space-between; } .justify-center { justify-content:center; }
    .gap-1 { gap:4px; } .gap-2 { gap:8px; } .gap-3 { gap:12px; } .gap-4 { gap:16px; } .gap-6 { gap:24px; }
    .w-full { width:100%; } .h-full { height:100%; } .text-center { text-align:center; } .relative { position:relative; }

    .btn {
      display:inline-flex; align-items:center; justify-content:center; gap:8px;
      padding:10px 20px; border:none; border-radius:var(--radius); font-weight:600; font-size:13px;
      cursor:pointer; transition:var(--transition); text-decoration:none; position:relative; overflow:hidden;
      font-family:'Inter',sans-serif; letter-spacing:0.2px;
    }
    .btn::after {
      content:''; position:absolute; inset:0; background:radial-gradient(circle, rgba(255,255,255,0.3) 0%, transparent 70%);
      opacity:0; transition:opacity 0.3s; pointer-events:none;
    }
    .btn:active::after { opacity:1; transform:scale(2); transition:0s; }
    .btn-primary { background:var(--primary-gradient); color:white; box-shadow:0 4px 14px rgba(99,102,241,0.35); }
    .btn-primary:hover { transform:translateY(-2px); box-shadow:0 8px 24px rgba(99,102,241,0.45); }
    .btn-secondary { background:var(--bg-secondary); color:var(--text-primary); border:1.5px solid var(--border-color); }
    .btn-secondary:hover { background:var(--border-light); transform:translateY(-1px); }
    .btn-success { background:linear-gradient(135deg,#10b981,#059669); color:white; box-shadow:0 4px 14px rgba(16,185,129,0.3); }
    .btn-success:hover { transform:translateY(-2px); box-shadow:0 8px 24px rgba(16,185,129,0.4); }
    .btn-danger { background:linear-gradient(135deg,#ef4444,#dc2626); color:white; }
    .btn-warning { background:linear-gradient(135deg,#f59e0b,#d97706); color:white; }
    .btn-ghost { background:transparent; color:var(--text-secondary); }
    .btn-ghost:hover { background:var(--bg-primary); color:var(--text-primary); }
    .btn-sm { padding:6px 14px; font-size:12px; border-radius:10px; } .btn-lg { padding:14px 28px; font-size:15px; } .btn-block { width:100%; }
    .btn-icon { width:40px; height:40px; padding:0; border-radius:12px; }
    .btn:disabled { opacity:0.5; cursor:not-allowed; transform:none !important; }

    .card {
      background:var(--bg-card); border-radius:var(--radius-lg); padding:24px;
      box-shadow:var(--shadow-sm); border:1px solid var(--border-color); transition:var(--transition); position:relative; overflow:hidden;
    }
    .card::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; background:var(--primary-gradient); opacity:0; transition:opacity 0.3s; }
    .card:hover { box-shadow:var(--shadow-lg); transform:translateY(-2px); }
    .card:hover::before { opacity:1; }
    .card-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
    .card-title { font-size:16px; font-weight:700; color:var(--text-primary); display:flex; align-items:center; gap:10px; }
    .card-title i { color:var(--primary); font-size:18px; }
    .card-gradient { background:var(--primary-gradient); color:white; border:none; box-shadow:var(--shadow-glow); }
    .card-gradient .card-title { color:white; }

    .badge { display:inline-flex; align-items:center; gap:4px; padding:5px 12px; border-radius:var(--radius-full); font-size:11px; font-weight:700; letter-spacing:0.3px; }
    .badge-success { background:#d1fae5; color:#065f46; } .badge-warning { background:#fef3c7; color:#92400e; }
    .badge-danger { background:#fee2e2; color:#991b1b; } .badge-info { background:#dbeafe; color:#1e40af; }
    .badge-primary { background:#e0e7ff; color:#3730a3; } .badge-secondary { background:#f1f5f9; color:#475569; }
    .badge-dark { background:#1e293b; color:#f8fafc; }
    .badge-gold { background:#fef3c7; color:#78350f; }
    [data-theme="dark"] .badge-success { background:#065f46; color:#d1fae5; }
    [data-theme="dark"] .badge-warning { background:#92400e; color:#fef3c7; }
    [data-theme="dark"] .badge-danger { background:#991b1b; color:#fee2e2; }
    [data-theme="dark"] .badge-info { background:#1e40af; color:#dbeafe; }
    [data-theme="dark"] .badge-primary { background:#3730a3; color:#e0e7ff; }
    [data-theme="dark"] .badge-gold { background:#78350f; color:#fef3c7; }

    .input {
      width:100%; padding:12px 16px; border:1.5px solid var(--border-color); border-radius:var(--radius);
      font-family:'Inter',sans-serif; font-size:14px; background:var(--bg-primary); color:var(--text-primary);
      transition:var(--transition); outline:none;
    }
    .input:focus { border-color:var(--primary); box-shadow:0 0 0 4px rgba(99,102,241,0.1); }
    .input:disabled { background:var(--border-light); color:var(--text-light); cursor:not-allowed; }
    .form-label { display:block; font-size:12px; font-weight:600; color:var(--text-secondary); margin-bottom:6px; text-transform:uppercase; letter-spacing:0.5px; }
    .form-group { margin-bottom:16px; }
    textarea.input { resize:vertical; min-height:80px; }

    .login-container {
      min-height:100vh; display:flex; align-items:center; justify-content:center;
      background:linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #312e81 100%);
      padding:20px; position:relative; overflow:hidden;
    }
    .login-bg-pattern { position:absolute; inset:0; opacity:0.05; background-image:radial-gradient(circle at 1px 1px, white 1px, transparent 0); background-size:40px 40px; }
    .login-orbs { position:absolute; width:600px; height:600px; border-radius:50%; background:radial-gradient(circle, rgba(99,102,241,0.3) 0%, transparent 70%); filter:blur(60px); animation:float 6s ease-in-out infinite; }
    .login-orbs:nth-child(1) { top:-200px; left:-200px; }
    .login-orbs:nth-child(2) { bottom:-200px; right:-200px; background:radial-gradient(circle, rgba(168,85,247,0.3) 0%, transparent 70%); animation-delay:3s; }
    .login-box {
      background:rgba(255,255,255,0.03); backdrop-filter:blur(20px); border:1px solid rgba(255,255,255,0.08);
      border-radius:var(--radius-lg); padding:48px; max-width:440px; width:100%;
      box-shadow:0 25px 50px -12px rgba(0,0,0,0.5); position:relative; z-index:1;
    }
    .login-box .logo { text-align:center; margin-bottom:36px; }
    .login-box .logo .logo-icon { width:64px; height:64px; border-radius:20px; background:var(--primary-gradient); display:inline-flex; align-items:center; justify-content:center; font-size:28px; color:white; margin-bottom:16px; box-shadow:0 8px 24px rgba(99,102,241,0.4); animation:float 3s ease-in-out infinite; }
    .login-box .logo h1 { font-size:30px; font-weight:800; color:white; font-family:'Space Grotesk',sans-serif; letter-spacing:-0.5px; }
    .login-box .logo p { color:rgba(255,255,255,0.5); font-size:14px; margin-top:4px; }
    .login-box .role-selector { display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:10px; margin-bottom:24px; }
    .login-box .role-btn { padding:14px 8px; border:1.5px solid rgba(255,255,255,0.1); border-radius:var(--radius); background:rgba(255,255,255,0.03); cursor:pointer; text-align:center; transition:var(--transition); font-size:12px; font-weight:600; color:rgba(255,255,255,0.5); }
    .login-box .role-btn:hover { border-color:rgba(99,102,241,0.5); background:rgba(99,102,241,0.1); color:white; transform:translateY(-2px); }
    .login-box .role-btn.active { border-color:var(--primary); background:rgba(99,102,241,0.15); color:white; box-shadow:0 0 20px rgba(99,102,241,0.2); }
    .login-box .role-btn i { display:block; font-size:22px; margin-bottom:6px; }
    .login-box .form-group label { color:rgba(255,255,255,0.6); font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:8px; display:block; }
    .login-box .input { background:rgba(255,255,255,0.05); border-color:rgba(255,255,255,0.1); color:white; }
    .login-box .input:focus { border-color:var(--primary-light); box-shadow:0 0 0 4px rgba(99,102,241,0.15); }
    .login-box .input::placeholder { color:rgba(255,255,255,0.25); }

    .app-container { display:flex; height:100vh; overflow:hidden; }
    .sidebar { width:var(--sidebar-width); background:var(--bg-sidebar); color:white; display:flex; flex-direction:column; flex-shrink:0; transition:var(--transition); overflow-y:auto; overflow-x:hidden; z-index:100; position:relative; border-right:1px solid rgba(255,255,255,0.04); }
    .sidebar-brand { padding:24px; border-bottom:1px solid rgba(255,255,255,0.06); display:flex; align-items:center; gap:12px; }
    .sidebar-brand .brand-icon { width:42px; height:42px; border-radius:14px; background:var(--primary-gradient); display:flex; align-items:center; justify-content:center; font-size:20px; box-shadow:0 4px 12px rgba(99,102,241,0.3); flex-shrink:0; }
    .sidebar-brand h2 { font-size:20px; font-weight:800; font-family:'Space Grotesk',sans-serif; background:linear-gradient(135deg,#818cf8,#c4b5fd); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    .sidebar-brand small { font-size:10px; color:rgba(255,255,255,0.35); font-weight:500; letter-spacing:0.5px; }
    .sidebar-nav { flex:1; padding:16px 12px; }
    .sidebar-nav .nav-section { font-size:9px; text-transform:uppercase; letter-spacing:1.5px; color:rgba(255,255,255,0.25); padding:20px 16px 8px; font-weight:700; }
    .sidebar-nav .nav-item { display:flex; align-items:center; gap:12px; padding:11px 16px; border-radius:12px; color:rgba(255,255,255,0.5); cursor:pointer; transition:var(--transition); text-decoration:none; font-size:13px; font-weight:600; margin-bottom:2px; position:relative; }
    .sidebar-nav .nav-item:hover { background:rgba(255,255,255,0.05); color:white; }
    .sidebar-nav .nav-item.active { background:linear-gradient(135deg, rgba(99,102,241,0.2), rgba(139,92,246,0.15)); color:white; box-shadow:0 2px 8px rgba(99,102,241,0.15); }
    .sidebar-nav .nav-item.active::before { content:''; position:absolute; left:0; top:50%; transform:translateY(-50%); width:3px; height:20px; background:var(--primary-light); border-radius:0 4px 4px 0; }
    .sidebar-nav .nav-item i { width:22px; text-align:center; font-size:17px; transition:transform 0.3s; }
    .sidebar-nav .nav-item:hover i { transform:scale(1.1); }
    .sidebar-nav .nav-item .nav-badge { margin-left:auto; background:var(--danger); color:white; font-size:9px; font-weight:700; padding:2px 7px; border-radius:var(--radius-full); min-width:18px; text-align:center; }
    .sidebar-footer { padding:16px; border-top:1px solid rgba(255,255,255,0.06); display:flex; align-items:center; gap:12px; margin:12px; border-radius:var(--radius); background:rgba(255,255,255,0.03); transition:var(--transition); }
    .sidebar-footer:hover { background:rgba(255,255,255,0.05); }
    .sidebar-footer .avatar { width:38px; height:38px; border-radius:50%; background:var(--primary-gradient); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; color:white; flex-shrink:0; border:2px solid rgba(255,255,255,0.1); }
    .sidebar-footer .user-info { flex:1; min-width:0; }
    .sidebar-footer .user-info .name { font-size:13px; font-weight:700; color:white; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .sidebar-footer .user-info .role { font-size:10px; color:rgba(255,255,255,0.4); font-weight:500; text-transform:uppercase; letter-spacing:0.5px; }
    .sidebar-footer .theme-btn { width:32px; height:32px; border-radius:10px; border:none; background:rgba(255,255,255,0.08); color:rgba(255,255,255,0.6); cursor:pointer; display:flex; align-items:center; justify-content:center; transition:var(--transition); font-size:14px; }
    .sidebar-footer .theme-btn:hover { background:rgba(255,255,255,0.15); color:white; transform:rotate(20deg); }

    .main-content { flex:1; display:flex; flex-direction:column; overflow:hidden; position:relative; }
    .topbar { height:var(--topbar-height); background:var(--bg-secondary); border-bottom:1px solid var(--border-color); display:flex; align-items:center; justify-content:space-between; padding:0 28px; flex-shrink:0; backdrop-filter:blur(12px); z-index:50; }
    .topbar-left { display:flex; align-items:center; gap:16px; }
    .topbar-left .menu-toggle { display:none; background:none; border:none; font-size:22px; color:var(--text-primary); cursor:pointer; width:40px; height:40px; border-radius:12px; transition:var(--transition); }
    .topbar-left .menu-toggle:hover { background:var(--bg-primary); }
    .topbar-left .page-title { font-size:20px; font-weight:800; font-family:'Space Grotesk',sans-serif; letter-spacing:-0.3px; }
    .topbar-right { display:flex; align-items:center; gap:14px; }
    .topbar-right .search-bar { display:flex; align-items:center; background:var(--bg-primary); border:1.5px solid var(--border-color); border-radius:var(--radius-full); padding:8px 18px; gap:10px; transition:var(--transition); width:280px; }
    .topbar-right .search-bar:focus-within { border-color:var(--primary); box-shadow:0 0 0 4px rgba(99,102,241,0.08); width:320px; }
    .topbar-right .search-bar input { border:none; background:none; outline:none; font-family:'Inter',sans-serif; font-size:13px; color:var(--text-primary); width:100%; }
    .topbar-right .search-bar i { color:var(--text-light); font-size:14px; }
    .topbar-right .icon-btn { width:42px; height:42px; border-radius:12px; border:none; background:var(--bg-primary); color:var(--text-secondary); cursor:pointer; transition:var(--transition-bounce); display:flex; align-items:center; justify-content:center; position:relative; font-size:17px; border:1.5px solid var(--border-color); }
    .topbar-right .icon-btn:hover { background:var(--primary); color:white; border-color:var(--primary); transform:translateY(-2px) scale(1.05); box-shadow:0 4px 12px rgba(99,102,241,0.3); }
    .topbar-right .icon-btn .badge-dot { position:absolute; top:8px; right:8px; width:9px; height:9px; background:var(--danger); border-radius:50%; border:2px solid var(--bg-secondary); box-shadow:0 0 0 2px var(--danger); animation:pulse-glow 2s infinite; }
    .view-switcher { display:flex; align-items:center; gap:8px; padding:6px 12px; background:var(--bg-primary); border:1.5px solid var(--border-color); border-radius:var(--radius-full); font-size:12px; font-weight:600; }
    .view-switcher select { border:none; background:none; outline:none; font-family:'Inter',sans-serif; font-size:12px; font-weight:700; color:var(--primary); cursor:pointer; }

    .page-content { flex:1; overflow-y:auto; padding:28px; }

    .stats-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:20px; margin-bottom:28px; }
    .stat-card { background:var(--bg-card); border-radius:var(--radius-lg); padding:24px; border:1px solid var(--border-color); transition:var(--transition); position:relative; overflow:hidden; }
    .stat-card:hover { transform:translateY(-4px); box-shadow:var(--shadow-lg); }
    .stat-card .stat-icon { width:48px; height:48px; border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:20px; margin-bottom:16px; transition:transform 0.3s; }
    .stat-card:hover .stat-icon { transform:scale(1.1) rotate(-5deg); }
    .stat-card .stat-icon.purple { background:linear-gradient(135deg,#e0e7ff,#c7d2fe); color:#4338ca; }
    .stat-card .stat-icon.blue { background:linear-gradient(135deg,#dbeafe,#bfdbfe); color:#1d4ed8; }
    .stat-card .stat-icon.green { background:linear-gradient(135deg,#d1fae5,#a7f3d0); color:#047857; }
    .stat-card .stat-icon.orange { background:linear-gradient(135deg,#fef3c7,#fde68a); color:#b45309; }
    .stat-card .stat-icon.red { background:linear-gradient(135deg,#fee2e2,#fecaca); color:#b91c1c; }
    .stat-card .stat-icon.pink { background:linear-gradient(135deg,#fce7f3,#fbcfe8); color:#be185d; }

    /* ===================== v5 ENHANCEMENTS ===================== */

    .fee-select-row:hover{transform:translateX(2px);box-shadow:var(--shadow-sm)}

    .source-chip{display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border-radius:10px;background:var(--bg-primary);border:1px solid var(--border-color);font-size:11px;font-weight:700}
    .automation-card{border:1px solid rgba(99,102,241,.22);background:linear-gradient(135deg,rgba(99,102,241,.08),rgba(168,85,247,.04));border-radius:16px;padding:18px}
    .status-dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px;background:var(--success)}
    @media(max-width:900px){.quiz-builder-grid{grid-template-columns:1fr}}

<base target="_blank">

<body>
  <div id="root"></div>
  <div id="toast-container" class="toast-container"></div>
  <div id="notif-panel" class="notif-panel">
    <div class="notif-header"><h3><i class="fas fa-bell" style="color:var(--primary)"></i> Notifications</h3><button class="btn btn-ghost btn-sm" onclick="closeNotifications()"><i class="fas fa-times"></i></button></div>
    <div id="notif-list"></div>
  </div>
  <div id="overlay" class="modal-overlay" style="display:none;z-index:999" onclick="closeNotifications()"></div>
  <div id="confetti-container" class="confetti-container"></div>

  
  <script type="text/babel">

    const { useState, useEffect, useRef, useCallback, useMemo } = React;

    // ===================== FIREBASE CONFIG =====================
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "your-project.firebaseapp.com",
      projectId: "your-project-id",
      storageBucket: "your-project.appspot.com",
      messagingSenderId: "123456789",
      appId: "1:123456789:web:abcdef123456"
    };

    // ===================== DATA SERVICE =====================
    class DataService {
      constructor() {
        this.useFirebase = false;
        this.db = null;
        this.init();
      }

      init() {
        try {
          if (typeof firebase !== 'undefined' && firebaseConfig.apiKey !== 'YOUR_API_KEY') {
            firebase.initializeApp(firebaseConfig);
            this.db = firebase.firestore();
            this.useFirebase = true;
            console.log('✅ Firebase connected');
          }
        } catch (e) {
          console.log('📦 Using local persistence');
        }
        this.ensureLocalData();
      }

      ensureLocalData() {
        const keys = [
          'users','students','teachers','admins','accountants','attendance','curriculum',
          'activities','quizzes','quizAttempts','interventions','notifications',
          'attendanceSessions','complaints','knowledgeDocs','subjects','timetable',
          'classes','departments','assignments','submissions','messages','events',
          'fees','library','libraryIssues','grades','announcements','academicCalendar',
          'settings','feeStructures','feeTransactions','transportRoutes','transportVehicles',
          'transportDrivers','transportAllocations','importLogs','profilePreferences',
          'profileActivity','questionBank','academicMaterials','quizAutomation'
        ];
        keys.forEach(k => {
          if (!localStorage.getItem(`edutrack_${k}`)) {
            localStorage.setItem(`edutrack_${k}`, JSON.stringify([]));
          }
        });
        if (!localStorage.getItem('edutrack_settings_obj')) {
          localStorage.setItem('edutrack_settings_obj', JSON.stringify({ 
            institutionName: 'Vidhyadham Institute', 
            schoolDomain: 'vidhyadham.edu',
            semester: 'Fall 2026', 
            geofenceRadius: 100 
          }));
        }
      }

      getCollection(name) {
        const data = localStorage.getItem(`edutrack_${name}`);
        return data ? JSON.parse(data) : [];
      }
      setCollection(name, data) {
        localStorage.setItem(`edutrack_${name}`, JSON.stringify(data));
      }
      getSettings() {
        const s = localStorage.getItem('edutrack_settings_obj');
        return s ? JSON.parse(s) : { institutionName: 'Vidhyadham Institute', schoolDomain: 'vidhyadham.edu', semester: 'Fall 2026', geofenceRadius: 100 };
      }
      setSettings(data) {
        localStorage.setItem('edutrack_settings_obj', JSON.stringify(data));
      }

      exportAllDataJSON() {
        const dump = {};
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (k.startsWith('edutrack_')) {
            try {
              dump[k] = JSON.parse(localStorage.getItem(k));
            } catch (e) {
              dump[k] = localStorage.getItem(k);
            }
          }
        }
        return JSON.stringify(dump, null, 2);
      }

      importAllDataJSON(jsonStr) {
        try {
          const data = JSON.parse(jsonStr);
          Object.keys(data).forEach(k => {
            if (k.startsWith('edutrack_')) {
              localStorage.setItem(k, typeof data[k] === 'string' ? data[k] : JSON.stringify(data[k]));
            }
          });
          ensureDemoAccounts();
          return { success: true };
        } catch (e) {
          return { success: false, error: e.message };
        }
      }

      resetDatabase() {
        const keys = Object.keys(localStorage).filter(k => k.startsWith('edutrack_'));
        keys.forEach(k => localStorage.removeItem(k));
        this.ensureLocalData();
        seedDatabase(true);
        ensureDemoAccounts();
      }

      // GR & Email Generation
      generateGRNumber(year, sequence) {
        return `GR${year}${sequence.toString().padStart(3, '0')}`;
      }
      generateEmail(name) { return this.generateUniqueEmail(name); }
      getNextGRSequence(year) {
        const students = this.getStudents();
        const yearStr = year.toString();
        const sameYear = students.filter(s => s.grNumber && s.grNumber.startsWith(`GR${yearStr}`));
        let maxSeq = 0;
        sameYear.forEach(s => {
          const seq = parseInt(s.grNumber.slice(-3));
          if (!isNaN(seq) && seq > maxSeq) maxSeq = seq;
        });
        return maxSeq + 1;
      }

      generateUniqueEmail(name, excludeUserId=null) {
        const settings = this.getSettings();
        const domain = (settings.schoolDomain || 'vidhyadham.edu').trim().toLowerCase().replace(/^@/, '');
        const base = (name || 'student').toLowerCase().replace(/[^a-z0-9]/g, '');
        let candidate = `${base}@${domain}`;
        const users = this.getUsers();
        let n = 2;
        while (users.some(u => u.email && u.email.toLowerCase() === candidate && u.id !== excludeUserId)) {
          candidate = `${base}${n}@${domain}`; n++;
        }
        return candidate;
      }

      createStudentAccount(data) {
        const year = parseInt(data.admissionYear) || new Date().getFullYear();
        let seq = parseInt(data.sequence);
        if (!seq || seq < 1 || seq > 999) seq = this.getNextGRSequence(year);
        let grNumber = this.generateGRNumber(year, seq);
        while (this.getStudentByGR(grNumber)) { seq++; grNumber = this.generateGRNumber(year, seq); }
        const name = (data.name || '').trim();
        if (!name) throw new Error('Student name is required');
        const email = this.generateUniqueEmail(name);
        const userId = `u-${Date.now()}-${Math.random().toString(36).slice(2,7)}`;
        const studentId = `s-${Date.now()}-${Math.random().toString(36).slice(2,7)}`;
        const user = { id:userId, name, email, role:'STUDENT', password:grNumber, avatar:null, phone:data.phone || '', joined:new Date().toISOString().split('T')[0], mustChangePassword:false };
        const student = { 
          id:studentId, userId, grNumber, name, rollNo:data.rollNo || String(seq).padStart(3,'0'), 
          classId:data.classId || 'cls1', department:data.department || 'd1', semester:parseInt(data.semester)||1, 
          attendance:85, curriculumProgress:75, quizAverage:75, cgpa:7.5, backlogs:0, 
          gender:data.gender||'Male', dob:data.dob||'', address:data.address||'', 
          guardian:data.guardian||'', guardianPhone:data.guardianPhone||'', admissionYear:year, 
          createdAt:new Date().toISOString() 
        };
        this.addUser(user); this.addStudent(student);
        return {user, student};
      }

      getFeeHeadDue(studentId, head) {
        const student = this.getStudentById(studentId); if (!student) return 0;
        const fs = this.getFeeStructureByClass(student.classId, student.semester);
        const fh = fs?.feeHeads?.find(x=>x.head===head);
        if (!fh) return 0;
        const paid = this.getFeeTransactions({studentId}).filter(t=> (t.feeHead===head || (Array.isArray(t.feeHeads) && t.feeHeads.includes(head))) && t.status==='SUCCESS').reduce((s,t)=>s+(Number(t.amountPaid)||0),0);
        return Math.max(0, Number(fh.amount||0)-paid);
      }

      getFeeHeadBalances(studentId) {
        const student = this.getStudentById(studentId); 
        const fs = student ? this.getFeeStructureByClass(student.classId, student.semester) : null;
        if (!fs) return [];
        return (fs.feeHeads||[]).map(fh => {
          const paid = this.getFeeTransactions({studentId}).filter(t => (t.feeHead===fh.head || (Array.isArray(t.feeHeads) && t.feeHeads.includes(fh.head))) && t.status==='SUCCESS').reduce((s,t)=>s+(Number(t.amountPaid)||0),0);
          return {
            ...fh,
            paid,
            due: Math.max(0, Number(fh.amount||0) - paid)
          };
        });
      }

      nextReceiptNumber() {
        const year = new Date().getFullYear(); 
        const txs = this.getFeeTransactions();
        let max = 0; 
        txs.forEach(t => { 
          const m = String(t.receiptNumber||'').match(/(\d{5,8})$/); 
          if (m) max = Math.max(max, parseInt(m[1])); 
        });
        return `RCP${year}${String(max + 1).padStart(6, '0')}`;
      }

      recordFeePayment(data) {
        const receiptNumber = this.nextReceiptNumber();
        const tx = {
          id: `ft-${Date.now()}-${Math.random().toString(36).slice(2,7)}`,
          receiptNumber,
          paidAt: new Date().toISOString(),
          status: 'SUCCESS',
          ...data
        };
        const txs = this.getFeeTransactions();
        txs.push(tx);
        this.setCollection('feeTransactions', txs);
        return tx;
      }

      getUsers() { return this.getCollection('users'); }
      getUserById(id) { return this.getUsers().find(u => u.id === id); }
      getUserByEmail(email) { return this.getUsers().find(u => u.email.toLowerCase() === email.toLowerCase()); }
      addUser(user) { const users = this.getUsers(); users.push(user); this.setCollection('users', users); return user; }
      updateUser(id, data) { 
        const users = this.getUsers(); 
        const idx = users.findIndex(u => u.id === id); 
        if (idx !== -1) { 
          users[idx] = { ...users[idx], ...data }; 
          this.setCollection('users', users); 
          const current = this.getCurrentUser(); 
          if (current && current.id === id) localStorage.setItem('edutrack_currentUser', JSON.stringify(users[idx])); 
        } 
        return users[idx]; 
      }
      getProfilePreferences(userId) { 
        const all = this.getCollection('profilePreferences'); 
        return all.find(p => p.userId === userId) || { userId, notifications:{academic:true,attendance:true,finance:true,communication:true,security:true}, privacy:{showPhone:true,showEmail:true,profileVisibility:'INSTITUTION'}, appearance:{density:'comfortable',reduceMotion:false} }; 
      }
      saveProfilePreferences(userId, data) { 
        const all = this.getCollection('profilePreferences'); 
        const idx = all.findIndex(p => p.userId === userId); 
        const next = { ...(idx >= 0 ? all[idx] : {userId}), ...data, userId, updatedAt:new Date().toISOString() }; 
        if (idx >= 0) all[idx]=next; else all.push(next); 
        this.setCollection('profilePreferences', all); 
        return next; 
      }
      addActivity(userId, type, title, detail='') { 
        const all = this.getCollection('profileActivity'); 
        all.push({id:`act-${Date.now()}-${Math.random().toString(36).slice(2,7)}`,userId,type,title,detail,createdAt:new Date().toISOString()}); 
        this.setCollection('profileActivity', all); 
      }
      getActivities(userId) { return this.getCollection('profileActivity').filter(a=>a.userId===userId).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)); }
      updateCurrentUser(userId, data) { 
        const updated = this.updateUser(userId, data); 
        if(updated) { localStorage.setItem('edutrack_currentUser', JSON.stringify(updated)); } 
        return updated; 
      }

      getStudents() { return this.getCollection('students'); }
      getStudentById(id) { return this.getStudents().find(s => s.id === id); }
      getStudentByUserId(uid) { return this.getStudents().find(s => s.userId === uid); }
      getStudentByGR(gr) { return this.getStudents().find(s => s.grNumber === gr); }
      addStudent(student) { 
        const students = this.getStudents(); 
        if (!student.grNumber) {
          const year = student.admissionYear || new Date().getFullYear();
          const seq = this.getNextGRSequence(year);
          student.grNumber = this.generateGRNumber(year, seq);
        }
        students.push(student); 
        this.setCollection('students', students); 
        return student; 
      }
      updateStudent(id, data) { 
        const students = this.getStudents(); 
        const idx = students.findIndex(s => s.id === id); 
        if (idx !== -1) { 
          students[idx] = { ...students[idx], ...data }; 
          this.setCollection('students', students); 
        } 
        return students[idx]; 
      }

      getTeachers() { return this.getCollection('teachers'); }
      getTeacherByUserId(uid) { return this.getTeachers().find(t => t.userId === uid); }
      getTeacherById(id) { return this.getTeachers().find(t => t.id === id); }
      addTeacher(teacher, user = null) { 
        if (user) {
          this.addUser(user);
        }
        const teachers = this.getTeachers(); 
        teachers.push(teacher); 
        this.setCollection('teachers', teachers); 
        return teacher; 
      }

      getAdmins() { return this.getCollection('admins'); }
      getAdminByUserId(uid) { return this.getAdmins().find(a => a.userId === uid); }

      getDepartments() { return this.getCollection('departments'); }
      getDepartmentById(id) { return this.getDepartments().find(d => d.id === id); }

      getClasses() { return this.getCollection('classes'); }
      getClassById(id) { return this.getClasses().find(c => c.id === id); }
      addClass(cls) {
        const classes = this.getClasses();
        classes.push(cls);
        this.setCollection('classes', classes);
        return cls;
      }

      getSubjects() { return this.getCollection('subjects'); }
      getSubjectById(id) { return this.getSubjects().find(s => s.id === id); }
      addSubject(sub) {
        const subs = this.getSubjects();
        subs.push(sub);
        this.setCollection('subjects', subs);
        return sub;
      }

      getAttendance(studentId, subjectId, date) {
        let r = this.getCollection('attendance').filter(a => a.studentId === studentId);
        if (subjectId) r = r.filter(a => a.subjectId === subjectId);
        if (date) r = r.filter(a => a.date === date);
        return r.sort((a, b) => new Date(b.date) - new Date(a.date));
      }
      getAttendanceStats(studentId) {
        const records = this.getCollection('attendance').filter(a => a.studentId === studentId);
        const total = records.length;
        const present = records.filter(a => a.status === 'PRESENT').length;
        const late = records.filter(a => a.status === 'LATE').length;
        const absent = records.filter(a => a.status === 'ABSENT').length;
        return { total, present, late, absent, percentage: total > 0 ? Math.round(((present + late * 0.5) / total) * 100) : 0 };
      }
      markAttendance(studentId, subjectId, date, status, markedBy, method = 'MANUAL', location = null) {
        const records = this.getCollection('attendance');
        const existing = records.find(a => a.studentId === studentId && a.subjectId === subjectId && a.date === date);
        if (existing) {
          existing.status = status; existing.markedBy = markedBy; existing.method = method; existing.location = location;
          this.setCollection('attendance', records);
        } else {
          const record = { id: `att-${Date.now()}-${Math.random().toString(36).substr(2,9)}`, studentId, subjectId, date, status, timestamp: new Date().toISOString(), markedBy, method, location };
          records.push(record);
          this.setCollection('attendance', records);
        }
        const student = this.getStudentById(studentId);
        if (student) { 
          const stats = this.getAttendanceStats(studentId); 
          student.attendance = stats.percentage || 0; 
          this.updateStudent(studentId, { attendance: student.attendance }); 
        }
        return existing || records[records.length - 1];
      }

      getAttendanceSessions() { return this.getCollection('attendanceSessions'); }
      getActiveAttendanceSessions(classId) {
        const now = new Date().toISOString();
        return this.getAttendanceSessions().filter(s => {
          if (s.status !== 'ACTIVE') return false;
          if (new Date(s.otpExpiresAt) < new Date(now)) return false;
          if (classId && s.classId !== classId) return false;
          return true;
        });
      }
      createAttendanceSession(data) {
        const sessions = this.getAttendanceSessions();
        const session = { id: `ses-${Date.now()}`, ...data, status: 'ACTIVE', createdAt: new Date().toISOString() };
        sessions.push(session);
        this.setCollection('attendanceSessions', sessions);
        return session;
      }
      updateAttendanceSession(id, data) {
        const sessions = this.getAttendanceSessions();
        const idx = sessions.findIndex(s => s.id === id);
        if (idx !== -1) { sessions[idx] = { ...sessions[idx], ...data }; this.setCollection('attendanceSessions', sessions); }
        return sessions[idx];
      }

      getComplaints() { return this.getCollection('complaints'); }
      getComplaintById(id) { return this.getComplaints().find(c => c.id === id); }
      addComplaint(complaint) { const complaints = this.getComplaints(); complaints.push(complaint); this.setCollection('complaints', complaints); return complaint; }
      updateComplaint(id, data) { const complaints = this.getComplaints(); const idx = complaints.findIndex(c => c.id === id); if (idx !== -1) { complaints[idx] = { ...complaints[idx], ...data }; this.setCollection('complaints', complaints); } return complaints[idx]; }

      getCurriculum(subjectId) { return this.getCollection('curriculum').filter(c => !subjectId || c.subjectId === subjectId).sort((a, b) => a.unit - b.unit || a.order - b.order); }
      toggleTopicCompletion(topicId, completed) {
        const currs = this.getCollection('curriculum');
        const topic = currs.find(c => c.id === topicId);
        if (topic) {
          topic.completed = completed;
          this.setCollection('curriculum', currs);
          // Recalculate average progress for students
          const subjectTopics = currs.filter(c => c.subjectId === topic.subjectId);
          const done = subjectTopics.filter(c => c.completed).length;
          const prog = subjectTopics.length ? Math.round((done / subjectTopics.length) * 100) : 0;
          this.getStudents().forEach(s => {
            this.updateStudent(s.id, { curriculumProgress: prog });
          });
        }
        return topic;
      }
      addCurriculumTopic(arg1, arg2) {
        let topic = arg2 ? { ...arg2, subjectId: arg1 } : arg1;
        const currs = this.getCollection('curriculum');
        const newTopic = { 
          id: topic.id || `c-${Date.now()}`, 
          completed: false, 
          resources: topic.resources || 3, 
          notes: topic.notes || 'Full study notes and lecture handout covering core definitions, architectural diagrams, practical code examples, and review questions.',
          materials: topic.materials || [
            { title: 'Lecture Notes (PDF)', type: 'PDF', size: '2.4 MB' },
            { title: 'Practice Problems & Solutions', type: 'DOC', size: '1.1 MB' }
          ],
          ...topic 
        };
        currs.push(newTopic);
        this.setCollection('curriculum', currs);
        return newTopic;
      }
      updateCurriculumTopic(arg1, arg2, arg3) {
        const topicId = arg3 ? arg2 : arg1;
        const data = arg3 ? arg3 : arg2;
        const currs = this.getCollection('curriculum');
        const idx = currs.findIndex(c => c.id === topicId);
        if (idx !== -1) {
          currs[idx] = { ...currs[idx], ...data };
          this.setCollection('curriculum', currs);
          return currs[idx];
        }
        return null;
      }

      addAcademicMaterial(material) { const a=this.getCollection('academicMaterials'); a.push(material); this.setCollection('academicMaterials',a); return material; }
      getAcademicMaterials(filters={}) { let a=this.getCollection('academicMaterials'); if(filters.teacherId) a=a.filter(x=>x.teacherId===filters.teacherId); if(filters.subjectId) a=a.filter(x=>x.subjectId===filters.subjectId); return a.sort((x,y)=>new Date(y.createdAt)-new Date(x.createdAt)); }
      getQuestionBank(filters={}) { let q=this.getCollection('questionBank'); if(filters.subjectId) q=q.filter(x=>x.subjectId===filters.subjectId); if(filters.topic) q=q.filter(x=>String(x.topic||'').toLowerCase().includes(String(filters.topic).toLowerCase())); return q; }
      addQuestionBankItems(items) { const q=this.getCollection('questionBank'); q.push(...items); this.setCollection('questionBank',q); return items; }

      getStudentGradeBook(studentId) {
        const student = this.getStudentById(studentId);
        if (!student) return [];
        const subjects = this.getSubjects().filter(s => s.semester === (student.semester || 5));
        const assignments = this.getCollection('assignments');
        const submissions = this.getSubmissions(null, studentId);
        const quizzes = this.getCollection('quizzes');
        const attempts = this.getQuizAttempts(studentId);
        const storedGrades = this.getGrades(studentId);

        return subjects.map(sub => {
          const subAssignments = assignments.filter(a => a.subjectId === sub.id);
          let assignScore = 0;
          let assignMax = 0;
          subAssignments.forEach(a => {
            const subm = submissions.find(s => s.assignmentId === a.id && s.status === 'GRADED');
            if (subm && subm.marks !== null) {
              assignScore += subm.marks;
              assignMax += (a.maxMarks || 50);
            }
          });
          const assignmentAvg = assignMax > 0 ? Math.round((assignScore / assignMax) * 20) : 18;

          const subQuizzes = quizzes.filter(q => q.subjectId === sub.id);
          let quizScore = 0;
          let quizMax = 0;
          subQuizzes.forEach(q => {
            const att = attempts.find(at => at.quizId === q.id);
            if (att) {
              quizScore += att.score;
              quizMax += att.total;
            }
          });
          const quizAvg = quizMax > 0 ? Math.round((quizScore / quizMax) * 20) : 17;

          const existing = storedGrades.find(g => g.subjectId === sub.id) || {};
          const internal1 = existing.internal1 ?? 18;
          const internal2 = existing.internal2 ?? 19;
          const midTerm = existing.midTerm ?? 32;
          const finalExam = existing.final ?? 42;
          const total = internal1 + internal2 + assignmentAvg + quizAvg + midTerm + finalExam;
          const pct = Math.round((total / 170) * 100);
          let grade = 'A';
          let points = 9.0;
          if (pct >= 90) { grade = 'A+'; points = 10.0; }
          else if (pct >= 80) { grade = 'A'; points = 9.0; }
          else if (pct >= 70) { grade = 'B+'; points = 8.0; }
          else if (pct >= 60) { grade = 'B'; points = 7.0; }
          else if (pct >= 50) { grade = 'C'; points = 6.0; }
          else { grade = 'F'; points = 0.0; }

          return {
            subjectId: sub.id,
            subjectName: sub.name,
            subjectCode: sub.code,
            credits: sub.credits || 4,
            internal1,
            internal2,
            assignment: assignmentAvg,
            quiz: quizAvg,
            midTerm,
            final: finalExam,
            total,
            pct,
            grade,
            points
          };
        });
      }

        book.available = book.issued < book.total;
        this.setCollection('library', books);

        const issues = this.getCollection('libraryIssues');

      getTotalCollected(filters = {}) {

          .filter(t => t.status === 'SUCCESS')
          .reduce((sum, t) => sum + (Number(t.amountPaid) || 0), 0);
      }
      getTotalPaid(studentId) {
        return this.getFeeTransactions({ studentId })
          .filter(t => t.status === 'SUCCESS')
          .reduce((sum, t) => sum + (Number(t.amountPaid) || 0), 0);
      }
      getTotalPending(studentId) {
        const student = this.getStudentById(studentId);
        if (!student) return 0;
        const fs = this.getFeeStructureByClass(student.classId, student.semester);
        if (!fs) return 0;
        const paid = this.getTotalPaid(studentId);
        return Math.max(0, (Number(fs.totalAmount) || 0) - paid);
      }
      payFee(studentId, amount, mode = 'UPI', heads = ['Tuition Fee']) {
        const student = this.getStudentById(studentId);
        const receiptNumber = this.nextReceiptNumber();
        const tx = {
          id: `ft-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`,
          receiptNumber,
          transactionId: `TXN${Date.now()}${Math.floor(Math.random() * 1000)}`,
          studentId,
          grNumber: student?.grNumber || 'GR2026036',
          academicYear: '2026-27',
          semester: student?.semester || 5,
          feeHeads: Array.isArray(heads) ? heads : [heads],
          feeHead: Array.isArray(heads) ? heads[0] : heads,
          amountPaid: Number(amount) || 0,
          paymentMode: mode,
          status: 'SUCCESS',
          paidAt: new Date().toISOString(),
          remarks: `Fee payment verified via ${mode}`
        };
        this.addFeeTransaction(tx);
        return tx;
      }

    // ===================== TOAST & NOTIFICATIONS =====================
    function showToast(message, type='info', title=null) {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const toast = document.createElement('div');
      toast.className = `toast toast-${type}`;
      const icons = { success:'fa-check-circle', error:'fa-exclamation-circle', warning:'fa-exclamation-triangle', info:'fa-info-circle' };
      const titles = { success:'Success', error:'Error', warning:'Warning', info:'Notification' };
      toast.innerHTML = `
        <div class="toast-icon"><i class="fas ${icons[type]||icons.info}"></i></div>
        <div class="toast-content"><div class="toast-title">${title || titles[type] || 'Notification'}</div><div class="toast-desc">${message}</div></div>
        <button class="toast-close" onclick="this.parentElement.remove()"><i class="fas fa-times"></i></button>
      `;
      container.appendChild(toast);
      setTimeout(() => { 
        toast.style.opacity='0'; 
        toast.style.transform='translateX(100px)'; 
        setTimeout(()=>toast.remove(),300); 
      }, 4500);
    }

    function openNotifications() {
      const panel = document.getElementById('notif-panel');
      const overlay = document.getElementById('overlay');
      if (!panel || !overlay) return;
      panel.classList.add('open');
      overlay.style.display='flex';
      const list = document.getElementById('notif-list');
      const user = DS.getCurrentUser();
      if (!user) return;
      const notifs = DS.getNotifications(user.id) || [];
      if (notifs.length===0) { 
        list.innerHTML='<div class="empty-state"><div class="empty-icon"><i class="fas fa-bell-slash"></i></div><h4>No notifications</h4><p>You are all caught up!</p></div>'; 
        return; 
      }
      list.innerHTML = notifs.map(n => `
        <div class="notif-item ${n.read?'':'unread'}" onclick="markNotification('${n.id}')">
          <div class="notif-icon ${n.type==='SUCCESS'?'success':n.type==='ATTENDANCE'?'warning':n.type==='INTERVENTION'?'danger':'info'}">
            <i class="fas ${n.type==='ASSESSMENT'?'fa-pencil-alt':n.type==='ATTENDANCE'?'fa-calendar-check':n.type==='SUCCESS'?'fa-trophy':n.type==='INTERVENTION'?'fa-exclamation-triangle':'fa-bell'}"></i>
          </div>
          <div class="notif-content">
            <div class="title">${n.title} ${n.read?'':'<span class="badge badge-primary" style="font-size:8px;padding:2px 6px;">NEW</span>'}</div>
            <div class="desc">${n.message}</div>
            <div class="time">${new Date(n.createdAt).toLocaleString()}</div>
          </div>
        </div>
      `).join('');
    }
    function closeNotifications() { 
      const panel = document.getElementById('notif-panel');
      const overlay = document.getElementById('overlay');
      if (panel) panel.classList.remove('open'); 
      if (overlay) overlay.style.display='none'; 
    }
    function markNotification(id) { 
      DS.markNotificationRead(id); 
      openNotifications(); 
    }

    function fireConfetti() {
      const container = document.getElementById('confetti-container');
      if (!container) return;
      const colors = ['#6366f1', '#8b5cf6', '#10b981', '#f59e0b', '#ef4444', '#0ea5e9'];
      for (let i=0; i<45; i++) {
        const el = document.createElement('div');
        el.className = 'confetti';
        el.style.left = Math.random() * 100 + 'vw';
        el.style.background = colors[Math.floor(Math.random() * colors.length)];
        el.style.animationDuration = (Math.random() * 2 + 2) + 's';
        el.style.animationDelay = (Math.random() * 0.4) + 's';
        container.appendChild(el);
        setTimeout(() => el.remove(), 4000);
      }
    }

    // ===================== GPS UTILITIES =====================
    function getDistanceFromLatLonInMeters(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI/180) * Math.cos(lat2 * Math.PI/180) * Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return R * c;
    }
    function getCurrentPosition() {
      return new Promise((resolve, reject) => {
        if (!navigator.geolocation) { reject(new Error('Geolocation not supported by browser')); return; }
        navigator.geolocation.getCurrentPosition(
          pos => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude, accuracy: pos.coords.accuracy }),
          err => reject(err),
          { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
        );
      });
    }

    // ===================== UTILITY COMPONENTS =====================
    function AnimatedNumber({ value, suffix='', duration=1000 }) {
      const [display, setDisplay] = useState(0);
      useEffect(() => {
        let start = 0; const end = Number(value) || 0; const startTime = Date.now();
        const animate = () => {
          const elapsed = Date.now() - startTime;
          const progress = Math.min(elapsed / duration, 1);
          const easeOut = 1 - Math.pow(1 - progress, 3);
          setDisplay(Math.round(start + (end - start) * easeOut));
          if (progress < 1) requestAnimationFrame(animate);
        };
        requestAnimationFrame(animate);
      }, [value, duration]);
      return <span>{display.toLocaleString('en-IN')}{suffix}</span>;
    }

          if (result.success) { 
            showToast(`Welcome back, ${result.user.name}!`, 'success'); 
            onLogin(result.user, result.role); 
          } else { 
            setError(result.error); 
            showToast(result.error, 'error'); 
          }
          setLoading(false);
        }, 500);
      };

      return (
        <div className="login-container">
          <div className="login-bg-pattern"></div>
          <div className="login-orbs"></div>
          <div className="login-orbs"></div>
          <div className="login-box animate-scaleIn">
            <div className="logo">
              <div className="logo-icon"><i className="fas fa-graduation-cap"></i></div>
              <h1>EDUTrack Pro v5.0</h1>
              <p>Next-Generation Academic Operating System</p>
            </div>
            <form onSubmit={handleSubmit}>
              <div className="form-group">
                <label>Select Access Role</label>
                <div className="role-selector">
                  {demoAccounts.map(acc => (
                    <button key={acc.role} type="button" className={`role-btn ${role===acc.role?'active':''}`}
                      onClick={()=>{ setRole(acc.role); setEmail(acc.email); setPassword(acc.pass); setError(''); }}>
                      <i className={`fas ${acc.role==='STUDENT'?'fa-user-graduate':acc.role==='TEACHER'?'fa-chalkboard-teacher':acc.role==='ADMIN'?'fa-user-shield':'fa-calculator'}`} />
                      {acc.label}
                    </button>
                  ))}
                </div>
              </div>
              <div className="form-group">
                <label>Email Address</label>
                <input type="email" className="input" value={email} onChange={e=>setEmail(e.target.value)} placeholder="Enter institutional email" required />
              </div>
              <div className="form-group">
                <label>Password</label>
                <input type="password" className="input" value={password} onChange={e=>setPassword(e.target.value)} placeholder="Enter password (e.g. GR Number)" required />
              </div>
              {error && (
                <p style={{color:'#f87171',fontSize:'13px',marginBottom:'16px',display:'flex',alignItems:'center',gap:'6px'}}>
                  <i className="fas fa-exclamation-circle"></i> {error}
                </p>
              )}
              <button type="submit" className="btn btn-primary btn-block btn-lg" disabled={loading} style={{marginTop:'8px'}}>
                {loading ? <><i className="fas fa-circle-notch fa-spin"></i> Authenticating...</> : <><i className="fas fa-sign-in-alt"></i> Enter Portal</>}
              </button>
              <div style={{textAlign:'center',color:'rgba(255,255,255,0.4)',fontSize:'11.5px',marginTop:'18px',lineHeight:'1.6'}}>
                <i className="fas fa-shield-alt" style={{color:'var(--primary-light)'}}></i> Secured by 256-bit AES · GPS Geofenced Attendance · Role Based ERP
              </div>
            </form>
          </div>
        </div>
      );
    }

    // ===================== DASHBOARD =====================
    function DashboardPage({ user, role, viewAs, navigateTo }) {
      const [stats, setStats] = useState(null);
      const [suggestions, setSuggestions] = useState([]);
      const [announcements, setAnnouncements] = useState([]);
      const [recentActivity, setRecentActivity] = useState([]);
      const [loading, setLoading] = useState(true);
      const effectiveRole = viewAs || role;

      useEffect(() => {
        setLoading(true);
        setTimeout(() => {
          if (effectiveRole === 'STUDENT') {
            const s = DS.getStudentByUserId(user.id) || (effectiveRole==='STUDENT' && role!=='STUDENT' ? DS.getStudents()[0] : null);
            if (s) {
              const att = DS.getAttendanceStats(s.id);
              const fees = DS.getFeeTransactions({ studentId: s.id, status: 'SUCCESS' });
              const totalPaid = fees.reduce((sum, f) => sum + (Number(f.amountPaid) || 0), 0);
              const pendingFees = DS.getTotalPending(s.id);
              const pendingAssignments = DS.getAssignments(s.classId).filter(a => a.status === 'ACTIVE' && !DS.getSubmissions(a.id, s.id).length);
              const pendingComplaints = DS.getComplaints().filter(c => c.filedBy === user.id && c.status !== 'RESOLVED').length;
              const transport = DS.getTransportAllocations(s.id);
              setStats({ 
                attendance: s.attendance || att.percentage || 0, 
                curriculum: s.curriculumProgress || 0, 
                quizAvg: s.quizAverage || 0, 
                cgpa: s.cgpa || 0, 
                pendingFees, 
                totalPaid, 
                pendingAssignments: pendingAssignments.length, 
                pendingComplaints, 
                hasTransport: transport.length > 0, 
                grNumber: s.grNumber,
                studentId: s.id
              });
            }
            setAnnouncements(DS.getAnnouncements('STUDENT').slice(0, 3));
          } else if (effectiveRole === 'TEACHER') {
            const all = DS.getStudents(); 
            const total = all.length;
            const avgAtt = total > 0 ? Math.round(all.reduce((s, a) => s + (a.attendance || 0), 0) / total) : 0;
            const avgQuiz = total > 0 ? Math.round(all.reduce((s, a) => s + (a.quizAverage || 0), 0) / total) : 0;
            const avgCgpa = total > 0 ? (all.reduce((s, a) => s + (a.cgpa || 0), 0) / total).toFixed(2) : '0.00';
            const critical = all.filter(s => s.attendance < 75 || s.quizAverage < 60 || s.backlogs > 0).length;
            const pendingComplaints = DS.getComplaints().filter(c => c.status === 'PENDING').length;
            const todayCollection = DS.getTotalCollected({ from: new Date().toISOString().split('T')[0] + 'T00:00:00' });
            setStats({ 
              totalStudents: total, 
              avgAttendance: avgAtt, 
              avgQuiz: avgQuiz, 
              avgCgpa, 
              critical, 
              classes: DS.getClasses().length, 
              pendingComplaints, 
              todayCollection 
            });
            let sugg = []; 
            all.forEach(s => { sugg.push(...DS.generateAISuggestions(s.id)); }); 
            setSuggestions(sugg.slice(0, 5));
            setAnnouncements(DS.getAnnouncements('TEACHER').slice(0, 3));
          } else if (effectiveRole === 'ADMIN') {
            const all = DS.getStudents();
            const pendingComplaints = DS.getComplaints().filter(c => c.status === 'PENDING').length;
            const totalCollected = DS.getTotalCollected();
            setStats({ 
              totalStudents: all.length, 
              totalTeachers: DS.getTeachers().length, 
              totalSubjects: DS.getSubjects().length, 
              totalClasses: DS.getClasses().length, 
              totalDepartments: DS.getDepartments().length, 
              pendingComplaints, 
              totalCollected 
            });
            setAnnouncements(DS.getAnnouncements().slice(0, 3));
          } else if (effectiveRole === 'ACCOUNTANT') {
            const totalCollected = DS.getTotalCollected();
            const todayCollection = DS.getTotalCollected({ from: new Date().toISOString().split('T')[0] + 'T00:00:00' });
            const pendingCount = DS.getStudents().filter(s => DS.getTotalPending(s.id) > 0).length;
            const txCount = DS.getFeeTransactions({ status: 'SUCCESS' }).length;
            setStats({ totalCollected, todayCollection, pendingCount, txCount, totalStudents: DS.getStudents().length });
            setAnnouncements(DS.getAnnouncements().slice(0, 3));
          }

          const acts = [];
          if (effectiveRole === 'STUDENT') {
            const s = DS.getStudentByUserId(user.id);
            if (s) {
              const atts = DS.getAttendance(s.id).slice(0, 3);
              atts.forEach(a => acts.push({ time: a.date, text: `Marked ${a.status} for ${DS.getSubjectById(a.subjectId)?.name || 'Subject'}`, type: a.status==='PRESENT'?'success':'danger' }));
            }
          } else {
            acts.push({ time: 'Just now', text: 'System database synchronized with cloud local storage', type: 'success' });
            acts.push({ time: '1 hour ago', text: 'New student enrolled under CSE Department', type: 'info' });
            acts.push({ time: '3 hours ago', text: 'Assessment published: SQL Joins Mastery', type: 'info' });
          }
          setRecentActivity(acts);
          setLoading(false);
        }, 300);
      }, [user, effectiveRole]);

      if (loading) return <div className="stats-grid"><SkeletonCard/><SkeletonCard/><SkeletonCard/><SkeletonCard/></div>;

      if (effectiveRole === 'STUDENT') return (
        <div>
          <div className="stats-grid">
            <StatCard icon="fa-calendar-check" iconClass="purple" label="Attendance" value={stats?.attendance||0} suffix="%" change={3} changeType="up" delay={1} />
            <StatCard icon="fa-book-open" iconClass="blue" label="Curriculum Progress" value={stats?.curriculum||0} suffix="%" delay={2} />
            <StatCard icon="fa-pencil-alt" iconClass="green" label="Quiz Average" value={stats?.quizAvg||0} suffix="%" change={5} changeType="up" delay={3} />
            <StatCard icon="fa-chart-line" iconClass="orange" label="Cumulative CGPA" value={stats?.cgpa||0} delay={4} />
          </div>
          
          <div className="grid-2">
            <div className="card animate-fadeIn stagger-2">
              <div className="card-header">
                <h3 className="card-title"><i className="fas fa-id-card"></i> Student Enrollment</h3>
                <button className="btn btn-sm btn-secondary" onClick={()=>navigateTo('profile')}><i className="fas fa-user"></i> View Profile</button>
              </div>
              <div style={{display:'flex',gap:'16px',flexWrap:'wrap'}}>
                <div style={{flex:1,minWidth:'140px',padding:'16px',background:'var(--bg-primary)',borderRadius:'12px',textAlign:'center'}}>
                  <div style={{fontSize:'12px',color:'var(--text-light)',textTransform:'uppercase',letterSpacing:'0.5px'}}>GR Number</div>
                  <div style={{fontSize:'22px',fontWeight:800,color:'var(--primary)',marginTop:'4px'}}>{stats?.grNumber || 'GR2026036'}</div>
                </div>
                <div style={{flex:1,minWidth:'140px',padding:'16px',background:'var(--bg-primary)',borderRadius:'12px',textAlign:'center'}}>
                  <div style={{fontSize:'12px',color:'var(--text-light)',textTransform:'uppercase',letterSpacing:'0.5px'}}>Pending Fees</div>
                  <div style={{fontSize:'22px',fontWeight:800,color:stats?.pendingFees>0?'var(--danger)':'var(--success)',marginTop:'4px'}}>₹{(stats?.pendingFees||0).toLocaleString('en-IN')}</div>
                </div>
              </div>
              <div style={{marginTop:'18px',display:'flex',gap:'10px',flexWrap:'wrap'}}>
                <button className="btn btn-primary btn-sm" onClick={()=>navigateTo('fees')}><i className="fas fa-credit-card"></i> Pay Fees Online</button>
                <button className="btn btn-secondary btn-sm" onClick={()=>navigateTo('attendance')}><i className="fas fa-location-arrow"></i> Mark GPS Attendance</button>
                <button className="btn btn-secondary btn-sm" onClick={()=>navigateTo('quiz')}><i className="fas fa-pencil-alt"></i> Take Quiz</button>
              </div>
            </div>

            <div className="card animate-fadeIn stagger-3">
              <div className="card-header">
                <h3 className="card-title"><i className="fas fa-bullhorn"></i> Campus Announcements</h3>
                <button className="btn btn-sm btn-ghost" onClick={()=>navigateTo('announcements')}>View All</button>
              </div>
              {announcements.length>0 ? announcements.map((a,i)=> (
                <div key={i} style={{padding:'10px 0',borderBottom:i<announcements.length-1?'1px solid var(--border-light)':'none'}}>
                  <div style={{display:'flex',alignItems:'center',gap:'8px'}}>
                    <span className={`badge ${a.priority==='HIGH'?'badge-danger':'badge-info'}`}>{a.priority}</span>
                    <span style={{fontWeight:700,fontSize:'14px'}}>{a.title}</span>
                  </div>
                  <p style={{fontSize:'13px',color:'var(--text-secondary)',marginTop:'4px'}}>{a.content}</p>
                </div>
              )) : <EmptyState icon="fa-bullhorn" title="No announcements" description="Check back later for updates" />}
            </div>
          </div>

          <div className="grid-2" style={{marginTop:'24px'}}>
            <div className="card animate-fadeIn stagger-4">
              <div className="card-header"><h3 className="card-title"><i className="fas fa-tasks"></i> Quick Access Shortcuts</h3></div>
              <div style={{display:'grid',gridTemplateColumns:'repeat(2,1fr)',gap:'14px'}}>
                <div style={{padding:'16px',background:'var(--bg-primary)',borderRadius:'12px',textAlign:'center',cursor:'pointer',border:'1px solid var(--border-color)',transition:'var(--transition)'}} onClick={()=>navigateTo('assignments')}>
                  <div style={{fontSize:'26px',fontWeight:800,color:'var(--primary)'}}>{stats?.pendingAssignments||0}</div>
                  <div style={{fontSize:'12px',color:'var(--text-secondary)',marginTop:'4px'}}>Assignments Pending</div>
                </div>
                <div style={{padding:'16px',background:'var(--bg-primary)',borderRadius:'12px',textAlign:'center',cursor:'pointer',border:'1px solid var(--border-color)',transition:'var(--transition)'}} onClick={()=>navigateTo('fees')}>
                  <div style={{fontSize:'26px',fontWeight:800,color:'var(--warning)'}}>₹{(stats?.pendingFees||0).toLocaleString('en-IN')}</div>
                  <div style={{fontSize:'12px',color:'var(--text-secondary)',marginTop:'4px'}}>Outstanding Balance</div>
                </div>
                <div style={{padding:'16px',background:'var(--bg-primary)',borderRadius:'12px',textAlign:'center',cursor:'pointer',border:'1px solid var(--border-color)',transition:'var(--transition)'}} onClick={()=>navigateTo('transport')}>
                  <div style={{fontSize:'26px',fontWeight:800,color:stats?.hasTransport?'var(--success)':'var(--text-light)'}}>
                    <i className={`fas ${stats?.hasTransport?'fa-bus':'fa-times'}`}></i>
                  </div>
                  <div style={{fontSize:'12px',color:'var(--text-secondary)',marginTop:'4px'}}>Campus Transport</div>
                </div>
                <div style={{padding:'16px',background:'var(--bg-primary)',borderRadius:'12px',textAlign:'center',cursor:'pointer',border:'1px solid var(--border-color)',transition:'var(--transition)'}} onClick={()=>navigateTo('ai-assistant')}>
                  <div style={{fontSize:'26px',fontWeight:800,color:'var(--info)'}}><i className="fas fa-brain"></i></div>
                  <div style={{fontSize:'12px',color:'var(--text-secondary)',marginTop:'4px'}}>AI Academic Tutor</div>
                </div>
              </div>
            </div>

            <div className="card animate-fadeIn stagger-5">
              <div className="card-header"><h3 className="card-title"><i className="fas fa-history"></i> Recent Academic Feed</h3></div>
              <div>
                {recentActivity.map((act,i)=> (
                  <div key={i} style={{display:'flex',gap:'12px',padding:'11px 0',borderBottom:i<recentActivity.length-1?'1px solid var(--border-light)':'none',alignItems:'flex-start'}}>
                    <div style={{width:8,height:8,borderRadius:'50%',background:act.type==='success'?'var(--success)':act.type==='danger'?'var(--danger)':'var(--info)',marginTop:6,flexShrink:0}}></div>
                    <div><div style={{fontSize:'13px',fontWeight:600}}>{act.text}</div><div style={{fontSize:'11px',color:'var(--text-light)'}}>{act.time}</div></div>
                  </div>
                ))}
              </div>
            </div>
          </div>
        </div>
      );

      if (effectiveRole === 'TEACHER') return (
        <div>
          <div className="stats-grid">
            <StatCard icon="fa-users" iconClass="purple" label="Assigned Students" value={stats?.totalStudents||0} change={8} changeType="up" delay={1} />
            <StatCard icon="fa-calendar-check" iconClass="green" label="Avg Attendance" value={stats?.avgAttendance||0} suffix="%" delay={2} />
            <StatCard icon="fa-pencil-alt" iconClass="blue" label="Avg Quiz Score" value={stats?.avgQuiz||0} suffix="%" delay={3} />
            <StatCard icon="fa-exclamation-triangle" iconClass="red" label="At-Risk Students" value={stats?.critical||0} delay={4} />
          </div>
          <div className="grid-2">
            <div className="card animate-fadeIn stagger-2">
              <div className="card-header">
                <h3 className="card-title"><i className="fas fa-brain"></i> AI Action Center Alerts</h3>
                <button className="btn btn-sm btn-primary" onClick={()=>navigateTo('action-center')}>Action Center</button>
              </div>
              {suggestions.length > 0 ? suggestions.map((s,i)=> (
                <div key={i} className={`action-card ${s.priority==='CRITICAL'?'critical':'attention'}`}>
                  <div className="action-header">
                    <strong>{s.studentName}</strong> 
                    <span className={`badge ${s.priority==='CRITICAL'?'badge-danger':'badge-warning'}`}>{s.priority}</span>
                  </div>
                  <div className="action-reason">{s.reason}</div>
                  <div className="action-evidence"><i className="fas fa-info-circle"></i> {s.evidence}</div>
                </div>
              )) : <EmptyState icon="fa-check-circle" title="All clear!" description="All students currently meet attendance & academic standards." />}
            </div>

            <div className="card animate-fadeIn stagger-3">
              <div className="card-header">
                <h3 className="card-title"><i className="fas fa-chalkboard-teacher"></i> Faculty Quick Actions</h3>
              </div>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'12px',marginBottom:'18px'}}>
                <button className="btn btn-primary" onClick={()=>navigateTo('attendance')}><i className="fas fa-qrcode"></i> Start GPS + OTP</button>
                <button className="btn btn-secondary" onClick={()=>navigateTo('quiz')}><i className="fas fa-plus"></i> Create New Quiz</button>
                <button className="btn btn-secondary" onClick={()=>navigateTo('timetable')}><i className="fas fa-calendar"></i> View Timetable</button>
                <button className="btn btn-secondary" onClick={()=>navigateTo('curriculum')}><i className="fas fa-book"></i> Syllabus Tracker</button>
              </div>
              <h4 style={{fontSize:'14px',fontWeight:700,marginBottom:'10px',color:'var(--text-secondary)'}}>Active Announcements</h4>
              {announcements.map((a,i)=> (
                <div key={i} style={{padding:'8px 0',borderBottom:i<announcements.length-1?'1px solid var(--border-light)':'none'}}>
                  <div style={{display:'flex',alignItems:'center',gap:'8px'}}>
                    <span className={`badge ${a.priority==='HIGH'?'badge-danger':'badge-info'}`}>{a.priority}</span>
                    <span style={{fontWeight:700,fontSize:'13px'}}>{a.title}</span>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>
      );

      if (effectiveRole === 'ACCOUNTANT') return (
        <div>
          <div className="stats-grid">
            <StatCard icon="fa-rupee-sign" iconClass="green" label="Total Collected" value={stats?.totalCollected||0} suffix="" delay={1} />
            <StatCard icon="fa-calendar-day" iconClass="blue" label="Today's Collection" value={stats?.todayCollection||0} suffix="" delay={2} />
            <StatCard icon="fa-user-clock" iconClass="orange" label="Dues Pending Students" value={stats?.pendingCount||0} delay={3} />
            <StatCard icon="fa-receipt" iconClass="purple" label="Verified Transactions" value={stats?.txCount||0} delay={4} />
          </div>
          <div className="grid-2">
            <div className="card card-gradient animate-fadeIn stagger-2">
              <div className="card-header"><h3 className="card-title"><i className="fas fa-calculator"></i> Finance Overview</h3></div>
              <p style={{opacity:0.9,fontSize:'14px',marginBottom:'16px'}}>Real-time fee collection analytics, ledger monitoring, and counter payments.</p>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'16px'}}>
                <div style={{padding:'16px',background:'rgba(255,255,255,0.1)',borderRadius:'12px',textAlign:'center'}}>
                  <div style={{fontSize:'28px',fontWeight:800}}>₹{((stats?.totalCollected||0)/100000).toFixed(2)}L</div>
                  <div style={{fontSize:'12px',opacity:0.8,marginTop:'4px'}}>Gross Inflow</div>
                </div>
                <div style={{padding:'16px',background:'rgba(255,255,255,0.1)',borderRadius:'12px',textAlign:'center'}}>
                  <div style={{fontSize:'28px',fontWeight:800}}>{stats?.totalStudents||0}</div>
                  <div style={{fontSize:'12px',opacity:0.8,marginTop:'4px'}}>Enrolled Accounts</div>
                </div>
              </div>
              <div style={{marginTop:'18px'}}>
                <button className="btn btn-secondary btn-block" style={{background:'rgba(255,255,255,0.2)',color:'white',border:'none'}} onClick={()=>navigateTo('fees')}>
                  <i className="fas fa-file-invoice-dollar"></i> Open Full Finance & Ledger Portal
                </button>
              </div>
            </div>

            <div className="card animate-fadeIn stagger-3">
              <div className="card-header">
                <h3 className="card-title"><i className="fas fa-receipt"></i> Recent Fee Collections</h3>
                <button className="btn btn-sm btn-primary" onClick={()=>navigateTo('fees')}>View Ledger</button>
              </div>
              <div className="table-container">
                <table>
                  <thead><tr><th>Receipt</th><th>Student</th><th>Amount</th><th>Mode</th></tr></thead>
                  <tbody>
                    {DS.getFeeTransactions({ status:'SUCCESS' }).slice(0, 5).map(t => (
                      <tr key={t.id}>
                        <td><span className="badge badge-primary">{t.receiptNumber}</span></td>
                        <td>{DS.getStudentById(t.studentId)?.name || t.grNumber}</td>
                        <td><strong>₹{Number(t.amountPaid).toLocaleString('en-IN')}</strong></td>
                        <td><span className="badge badge-info">{t.paymentMode}</span></td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      );

      // ADMIN
      return (
        <div>
          <div className="stats-grid">
            <StatCard icon="fa-users" iconClass="purple" label="Enrolled Students" value={stats?.totalStudents||0} change={12} changeType="up" delay={1} />
            <StatCard icon="fa-chalkboard-teacher" iconClass="blue" label="Faculty Members" value={stats?.totalTeachers||0} delay={2} />
            <StatCard icon="fa-book" iconClass="green" label="Curriculum Subjects" value={stats?.totalSubjects||0} delay={3} />
            <StatCard icon="fa-school" iconClass="orange" label="Class Sections" value={stats?.totalClasses||0} delay={4} />
          </div>
          <div className="grid-2">
            <div className="card card-gradient animate-fadeIn stagger-2">
              <div className="card-header"><h3 className="card-title"><i className="fas fa-server"></i> System Health & Metrics</h3></div>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'16px'}}>
                <div style={{padding:'16px',background:'rgba(255,255,255,0.1)',borderRadius:'12px',textAlign:'center'}}>
                  <div style={{fontSize:'30px',fontWeight:800}}>99.9%</div>
                  <div style={{fontSize:'12px',opacity:0.8,marginTop:'4px'}}>Service Uptime</div>
                </div>
                <div style={{padding:'16px',background:'rgba(255,255,255,0.1)',borderRadius:'12px',textAlign:'center'}}>
                  <div style={{fontSize:'30px',fontWeight:800}}>12ms</div>
                  <div style={{fontSize:'12px',opacity:0.8,marginTop:'4px'}}>Local Storage Engine</div>
                </div>
              </div>
