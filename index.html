      const createAnnouncement = () => {
        if (!newAnn.title.trim() || !newAnn.content.trim()) { showToast('Title and content are required','error','Validation Error'); return; }
        if (newAnn.title.length > 200) { showToast('Title must be under 200 characters','error'); return; }
        if (newAnn.content.length > 2000) { showToast('Content must be under 2000 characters','error'); return; }
        DS.addAnnouncement({ id:`an-${Date.now()}`, ...newAnn, createdAt:new Date().toISOString(), createdBy:user.id });
        setShowAdd(false); setNewAnn({title:'',content:'',priority:'MEDIUM',audience:'ALL'});
        showToast('Announcement published','success');
      };

      return (
        <div>
          {effectiveRole==='ADMIN' && (
            <div style={{display:'flex',justifyContent:'flex-end',marginBottom:'24px'}}>
              <button className="btn btn-primary" onClick={()=>setShowAdd(true)}><i className="fas fa-plus"></i> New Announcement</button>
            </div>
          )}
          <div className="grid-2">{announcements.map(a=> (
            <div key={a.id} className="card animate-fadeIn">
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:'12px'}}>
                <span className={`badge ${a.priority==='HIGH'?'badge-danger':'badge-info'}`}>{a.priority}</span>
                <span className="badge badge-secondary">{a.audience}</span>
              </div>
              <h3 style={{fontSize:'18px',fontWeight:700,marginBottom:'8px'}}>{a.title}</h3>
              <p style={{color:'var(--text-secondary)',fontSize:'14px',lineHeight:'1.6',marginBottom:'16px'}}>{a.content}</p>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',fontSize:'12px',color:'var(--text-light)'}}>
                <span><i className="fas fa-user"></i> {DS.getUserById(a.createdBy)?.name}</span>
                <span><i className="fas fa-clock"></i> {new Date(a.createdAt).toLocaleDateString()}</span>
              </div>
            </div>
          ))}</div>
          {showAdd && (
            <Modal isOpen={showAdd} onClose={()=>setShowAdd(false)} title="New Announcement" footer={<><button className="btn btn-secondary" onClick={()=>setShowAdd(false)}>Cancel</button><button className="btn btn-primary" onClick={createAnnouncement}><i className="fas fa-bullhorn"></i> Publish</button></>}>
              <div className="form-group"><label className="form-label">Title</label><input className="input" value={newAnn.title} onChange={e=>setNewAnn({...newAnn,title:e.target.value})} placeholder="Announcement title" /></div>
              <div className="form-group"><label className="form-label">Content</label><textarea className="input" rows="4" value={newAnn.content} onChange={e=>setNewAnn({...newAnn,content:e.target.value})} placeholder="Announcement details..." style={{resize:'vertical'}}></textarea></div>
              <div className="grid-2">
                <div className="form-group"><label className="form-label">Priority</label><select className="input" value={newAnn.priority} onChange={e=>setNewAnn({...newAnn,priority:e.target.value})}><option>HIGH</option><option>MEDIUM</option><option>LOW</option></select></div>
                <div className="form-group"><label className="form-label">Audience</label><select className="input" value={newAnn.audience} onChange={e=>setNewAnn({...newAnn,audience:e.target.value})}><option value="ALL">Everyone</option><option value="STUDENT">Students</option><option value="TEACHER">Teachers</option></select></div>
              </div>
            </Modal>
          )}
        </div>
      );
    }

    // ===================== USER PROFILE / ACCOUNT CENTER =====================
    function ProfilePage({ user, role, theme, toggleTheme, navigateTo, onLogout }) {
      const [activeTab, setActiveTab] = useState('overview');
      const [editing, setEditing] = useState(false);
      const [saving, setSaving] = useState(false);
      const [profile, setProfile] = useState({ ...user });
      const [avatarPreview, setAvatarPreview] = useState(user?.avatar || null);
      const [prefs, setPrefs] = useState(DS.getProfilePreferences(user.id));
      const [passwords, setPasswords] = useState({current:'',next:'',confirm:''});
      const [idModal, setIdModal] = useState(false);
      const fileRef = useRef(null);

      const student = DS.getStudentByUserId(user.id);
      const teacher = DS.getTeacherByUserId(user.id);
      const admin = DS.getAdminByUserId(user.id);
      const accountant = DS.getCollection('accountants').find(a=>a.userId===user.id);
      const dept = student ? DS.getDepartmentById(student.department) : teacher ? DS.getDepartmentById(teacher.department) : null;
      const cls = student ? DS.getClassById(student.classId) : null;
      const attendance = student ? DS.getAttendanceStats(student.id) : null;
      const fees = student ? DS.getFeeTransactions({studentId:student.id,status:'SUCCESS'}) : [];
      const pendingFees = student ? DS.getTotalPending(student.id) : 0;
      const library = student ? DS.getLibraryBooks().filter(b=>b.borrowedBy===student.id || b.studentId===student.id || b.issuedTo===student.id) : [];
      const transport = student ? DS.getTransportAllocations(student.id) : [];
      const assignments = student ? DS.getAssignments(student.classId).filter(a=>DS.getSubmissions(a.id,student.id).length===0) : [];
      const grades = student ? DS.getGrades(student.id) : [];
      const attempts = student ? DS.getQuizAttempts(student.id) : [];
      const complaints = DS.getComplaints().filter(c=>c.filedBy===user.id);
      const notifications = DS.getNotifications(user.id);
      const customActivity = DS.getActivities(user.id);

      const profileData = student || teacher || admin || accountant || {};
      const displayName = profile.name || user.name || 'User';
      const initials = displayName.split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase() || 'U';
      const roleLabel = role || user.role || 'USER';
      const roleDetails = roleLabel==='STUDENT' ? `${dept?.name || 'Student'} · ${cls?.name || 'Academic Program'}` : roleLabel==='TEACHER' ? `${dept?.name || 'Faculty'} · ${teacher?.specialization || teacher?.designation || 'Faculty'}` : roleLabel==='ADMIN' ? `${admin?.department || 'Administration'} · ${admin?.designation || 'Administrator'}` : `${accountant?.department || 'Finance'} · ${accountant?.designation || 'Accountant'}`;

      const completionFields = roleLabel==='STUDENT' ? [profile.name,profile.email,profile.phone,profile.avatar||avatarPreview,student?.dob,student?.address,student?.guardian,student?.guardianPhone] : [profile.name,profile.email,profile.phone,profile.avatar||avatarPreview,profile.joined];
      const completion = Math.round(completionFields.filter(Boolean).length / completionFields.length * 100);

      const activities = useMemo(() => {
        const items = [...customActivity];
        if (student) {
          DS.getAttendance(student.id).slice(0,4).forEach(a=>items.push({id:`att-${a.id}`,type:'attendance',title:'Attendance record updated',detail:`${a.status}${a.method ? ' · '+a.method : ''}`,createdAt:a.timestamp || a.date}));
          DS.getQuizAttempts(student.id).slice(0,3).forEach(a=>items.push({id:`quiz-${a.id}`,type:'quiz',title:'Quiz attempt recorded',detail:`Score: ${a.score}${a.total ? '/'+a.total : ''}`,createdAt:a.date}));
          DS.getSubmissions(null,student.id).slice(0,3).forEach(a=>items.push({id:`sub-${a.id}`,type:'assignment',title:'Assignment submitted',detail:a.fileName || a.status || 'Submission',createdAt:a.submittedAt}));
          fees.slice(0,3).forEach(a=>items.push({id:`fee-${a.id}`,type:'fee',title:'Fee payment recorded',detail:`₹${Number(a.amountPaid||0).toLocaleString('en-IN')}`,createdAt:a.paidAt}));
        }
        notifications.slice(0,3).forEach(n=>items.push({id:`notif-${n.id}`,type:'notification',title:n.title,detail:n.message,createdAt:n.createdAt}));
        return items.filter(x=>x.createdAt).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)).slice(0,8);
      }, [student, customActivity.length, notifications.length, fees.length]);

      const saveProfile = () => {
        if (!profile.name.trim()) return showToast('Full name is required','error');
        if (profile.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(profile.email)) return showToast('Please enter a valid email','error');
        if (profile.phone && profile.phone.replace(/\D/g,'').length < 10) return showToast('Phone number must contain at least 10 digits','error');
        setSaving(true);
        setTimeout(()=>{
          const updated = DS.updateCurrentUser(user.id,{name:profile.name.trim(),email:profile.email.trim(),phone:profile.phone.trim(),avatar:avatarPreview || null});
          if (student) DS.updateStudent(student.id,{name:profile.name.trim(),dob:profile.dob || student.dob,address:profile.address || student.address,gender:profile.gender || student.gender,guardian:profile.guardian || student.guardian,guardianPhone:profile.guardianPhone || student.guardianPhone});
          DS.addActivity(user.id,'profile','Profile updated','Personal information was updated');
          setProfile({...updated}); setEditing(false); setSaving(false); showToast('Profile updated successfully','success');
          window.dispatchEvent(new Event('edutrack-profile-updated'));
        },350);
      };

      const handleAvatar = e => {
        const file=e.target.files?.[0]; if(!file) return;
        if(!file.type.startsWith('image/')) return showToast('Please choose an image file','error');
        if(file.size>2*1024*1024) return showToast('Profile photo must be 2 MB or smaller','error');
        const reader=new FileReader(); reader.onload=ev=>{setAvatarPreview(ev.target.result); setEditing(true);}; reader.readAsDataURL(file);
      };

      const savePrefs = () => { DS.saveProfilePreferences(user.id,prefs); showToast('Preferences saved','success'); };
      const changePassword = () => {
        if (!passwords.current || !passwords.next || !passwords.confirm) return showToast('Complete all password fields','error');
        if (passwords.current !== user.password) return showToast('Current password is incorrect','error');
        if (passwords.next.length < 8) return showToast('New password must be at least 8 characters','error');
        if (passwords.next !== passwords.confirm) return showToast('New passwords do not match','error');
        DS.updateCurrentUser(user.id,{password:passwords.next}); DS.addActivity(user.id,'security','Password changed','Account password was updated'); setPasswords({current:'',next:'',confirm:''}); showToast('Password changed successfully','success');
      };

      const field = (label,value,extra='') => <div className="profile-field"><div className="field-label">{label}</div><div className="field-value">{value || 'Not provided'} {extra}</div></div>;
      const stat = (label,value,sub,icon) => <div className="profile-stat"><div style={{display:'flex',justifyContent:'space-between',gap:8}}><div><div className="label">{label}</div><div className="value">{value}</div><div className="sub">{sub}</div></div><i className={`fas ${icon}`} style={{color:'var(--primary)',fontSize:20,marginTop:3}}></i></div></div>;

      const renderOverview = () => (
        <div>
          <div className="grid-4" style={{marginBottom:20}}>
            {roleLabel==='STUDENT' ? <>
              {stat('Attendance',`${attendance?.percentage||student?.attendance||0}%`,'Overall attendance','fa-calendar-check')}
              {stat('CGPA',student?.cgpa ?? 0,'Current academic score','fa-graduation-cap')}
              {stat('Quiz Average',`${student?.quizAverage||0}%`,'Assessment average','fa-pencil-alt')}
              {stat('Backlogs',student?.backlogs||0,'Active backlogs','fa-exclamation-triangle')}
            </> : <>
              {stat('Role',roleLabel,'Access level','fa-user-shield')}
              {stat('Department',dept?.code || profileData.department || '—','Department','fa-building')}
              {stat('Joined',profile.joined || '—','Institution date','fa-calendar')}
              {stat('Status','Active','Account status','fa-circle-check')}
            </>}
          </div>
          <div className="grid-2">
            <div className="card animate-fadeIn">
              <div className="profile-section-title"><div><h3>Profile Completion</h3><p>Complete your account for a better experience.</p></div><div className="profile-completion-ring" style={{'--progress':`${completion}%`}}><span>{completion}%</span></div></div>
              <div className="profile-progress"><div style={{width:`${completion}%`}}></div></div>
              <div style={{marginTop:14,fontSize:12,color:'var(--text-secondary)'}}>{completion>=100?'Your profile is complete.':`${completionFields.filter(Boolean).length} of ${completionFields.length} recommended fields completed.`}</div>
            </div>
            <div className="card animate-fadeIn">
              <div className="profile-section-title"><div><h3>Quick Access</h3><p>Jump to your most-used modules.</p></div></div>
              <div style={{display:'flex',flexWrap:'wrap',gap:8}}>
                {roleLabel==='STUDENT' && <><button className="btn btn-secondary btn-sm" onClick={()=>navigateTo('grades')}><i className="fas fa-chart-bar"></i> Grades</button><button className="btn btn-secondary btn-sm" onClick={()=>navigateTo('fees')}><i className="fas fa-rupee-sign"></i> Fees</button><button className="btn btn-secondary btn-sm" onClick={()=>navigateTo('library')}><i className="fas fa-book"></i> Library</button><button className="btn btn-secondary btn-sm" onClick={()=>navigateTo('transport')}><i className="fas fa-bus"></i> Transport</button></>}
                <button className="btn btn-secondary btn-sm" onClick={()=>navigateTo('messages')}><i className="fas fa-envelope"></i> Messages</button>
                <button className="btn btn-secondary btn-sm" onClick={()=>setActiveTab('security')}><i className="fas fa-shield-alt"></i> Security</button>
              </div>
            </div>
          </div>
          {roleLabel==='STUDENT' && <>
            <div className="grid-4" style={{marginTop:20}}>
              {stat('Pending Fees',`₹${pendingFees.toLocaleString('en-IN')}`,'Outstanding amount','fa-wallet')}
              {stat('Pending Assignments',assignments.length,'Not submitted','fa-tasks')}
              {stat('Quiz Attempts',attempts.length,'Recorded attempts','fa-pencil-alt')}
              {stat('Complaints',complaints.length,'Filed by you','fa-exclamation-circle')}
            </div>
            <div className="grid-2" style={{marginTop:20}}>
              <div className="card"><div className="profile-section-title"><div><h3>Academic Snapshot</h3><p>Current performance from your UMS records.</p></div></div><div className="grid-2">{field('Department',dept?.name)}{field('Class',cls?.name)}{field('Semester',student?.semester)}{field('Curriculum Progress',`${student?.curriculumProgress||0}%`)}{field('Quiz Average',`${student?.quizAverage||0}%`)}{field('Academic Status',(student?.backlogs||0)>0?'Needs Attention':'Good Standing')}</div></div>
              <div className="card"><div className="profile-section-title"><div><h3>Recent Activity</h3><p>Your latest account and academic activity.</p></div><button className="btn btn-ghost btn-sm" onClick={()=>setActiveTab('activity')}>View all</button></div>{activities.length?<div className="timeline">{activities.slice(0,5).map(a=><div className="timeline-item" key={a.id}><div style={{fontWeight:700,fontSize:13}}>{a.title}</div><div style={{fontSize:12,color:'var(--text-secondary)',marginTop:3}}>{a.detail}</div><div className="time">{new Date(a.createdAt).toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'})}</div></div>)}</div>:<EmptyState icon="fa-history" title="No recent activity" description="Your recent account activity will appear here."/>}</div>
            </div>
          </>}
        </div>
      );

      const renderPersonal = () => (
        <div className="grid-2">
          <div className="card">
            <div className="profile-section-title"><div><h3>Personal Information</h3><p>Manage the information you are allowed to edit.</p></div><button className="btn btn-primary btn-sm" onClick={()=>setEditing(!editing)}><i className={`fas ${editing?'fa-times':'fa-pen'}`}></i> {editing?'Cancel':'Edit Profile'}</button></div>
            <div style={{display:'flex',gap:18,alignItems:'center',marginBottom:20}}><div className="profile-avatar-xl" style={{width:74,height:74,borderRadius:22}}>{avatarPreview?<img src={avatarPreview} alt="Profile"/>:initials}</div><div><div style={{fontWeight:800}}>{displayName}</div><div style={{fontSize:12,color:'var(--text-secondary)',marginTop:3}}>{roleDetails}</div>{editing&&<><input ref={fileRef} type="file" accept="image/*" onChange={handleAvatar} style={{display:'none'}}/><button className="btn btn-secondary btn-sm" style={{marginTop:9}} onClick={()=>fileRef.current?.click()}><i className="fas fa-camera"></i> Change Photo</button></>}</div></div>
            <div className="grid-2">
              <div className="form-group"><label className="form-label">Full Name</label><input className="input" disabled={!editing} value={profile.name||''} onChange={e=>setProfile({...profile,name:e.target.value})}/></div>
              <div className="form-group"><label className="form-label">Email</label><input className="input" disabled={!editing} value={profile.email||''} onChange={e=>setProfile({...profile,email:e.target.value})}/></div>
              <div className="form-group"><label className="form-label">Phone</label><input className="input" disabled={!editing} value={profile.phone||''} onChange={e=>setProfile({...profile,phone:e.target.value})}/></div>
              {roleLabel==='STUDENT' && <><div className="form-group"><label className="form-label">Date of Birth</label><input type="date" className="input" disabled={!editing} value={profile.dob||student?.dob||''} onChange={e=>setProfile({...profile,dob:e.target.value})}/></div><div className="form-group"><label className="form-label">Gender</label><select className="input" disabled={!editing} value={profile.gender||student?.gender||'Male'} onChange={e=>setProfile({...profile,gender:e.target.value})}><option>Male</option><option>Female</option><option>Other</option></select></div><div className="form-group"><label className="form-label">Guardian Name</label><input className="input" disabled={!editing} value={profile.guardian||student?.guardian||''} onChange={e=>setProfile({...profile,guardian:e.target.value})}/></div><div className="form-group"><label className="form-label">Guardian Phone</label><input className="input" disabled={!editing} value={profile.guardianPhone||student?.guardianPhone||''} onChange={e=>setProfile({...profile,guardianPhone:e.target.value})}/></div></>}
              <div className="form-group" style={{gridColumn:'1/-1'}}><label className="form-label">Address</label><textarea className="input" rows="3" disabled={!editing} value={profile.address||student?.address||''} onChange={e=>setProfile({...profile,address:e.target.value})}></textarea></div>
            </div>
            {editing && <div style={{display:'flex',justifyContent:'flex-end',gap:8,marginTop:4}}><button className="btn btn-secondary" onClick={()=>{setProfile({...user});setAvatarPreview(user.avatar||null);setEditing(false)}}>Discard</button><button className="btn btn-primary" disabled={saving} onClick={saveProfile}>{saving?<><i className="fas fa-circle-notch fa-spin"></i> Saving...</>:<><i className="fas fa-save"></i> Save Changes</>}</button></div>}
          </div>
          <div className="card">
            <div className="profile-section-title"><div><h3>Identity & Academic Details</h3><p>Institution-managed information.</p></div><span className="badge badge-success">Verified</span></div>
            <div className="grid-2">{roleLabel==='STUDENT'?<>{field('GR Number',student?.grNumber)}{field('Roll Number',student?.rollNo)}{field('Department',dept?.name)}{field('Class',cls?.name)}{field('Semester',student?.semester)}{field('Admission Year',student?.admissionYear)}{field('Academic Year',DS.getSettings().semester)}{field('Role',roleLabel)}</>:<>{field('Employee / User ID',user.id)}{field('Department',dept?.name || profileData.department)}{field('Designation',profileData.designation || teacher?.specialization)}{field('Joining Date',profile.joined)}{field('Role',roleLabel)}{field('Account Status','Active')}</>}</div>
          </div>
        </div>
      );

      const renderAnalytics = () => {
        if(roleLabel!=='STUDENT') return <div className="card"><EmptyState icon="fa-chart-line" title="Role analytics" description="Detailed analytics for staff can be opened from the main Analytics module."/><div style={{textAlign:'center'}}><button className="btn btn-primary" onClick={()=>navigateTo('analytics')}><i className="fas fa-chart-line"></i> Open Analytics</button></div></div>;
        const subjectScores = DS.getSubjects().filter(s=>s.department===student?.department && s.semester===student?.semester).map(s=>{const gs=grades.filter(g=>g.subjectId===s.id); const vals=gs.map(g=>[g.internal1,g.internal2,g.assignment,g.midTerm,g.final].filter(v=>typeof v==='number').reduce((a,b)=>a+b,0)); return {name:s.code||s.name.slice(0,10),score:vals.length?Math.min(100,Math.round(vals[0])):0};});
        return <div><div className="grid-4">{stat('CGPA',student?.cgpa||0,'Current','fa-graduation-cap')}{stat('Attendance',`${attendance?.percentage||0}%`,'Overall','fa-calendar-check')}{stat('Curriculum',`${student?.curriculumProgress||0}%`,'Progress','fa-book-open')}{stat('Quiz Avg',`${student?.quizAverage||0}%`,'Average','fa-pencil-alt')}</div><div className="grid-2" style={{marginTop:20}}><div className="card"><div className="profile-section-title"><div><h3>Performance Indicators</h3><p>Live values from your student record.</p></div></div>{[['Attendance',attendance?.percentage||student?.attendance||0],['Curriculum',student?.curriculumProgress||0],['Quiz Average',student?.quizAverage||0],['CGPA',Math.round(((student?.cgpa||0)/10)*100)]] .map(([n,v])=><div key={n} style={{marginBottom:16}}><div style={{display:'flex',justifyContent:'space-between',fontSize:12,fontWeight:700,marginBottom:7}}><span>{n}</span><span>{v}{n==='CGPA'?'%':'%'}</span></div><div className="profile-progress"><div style={{width:`${Math.max(0,Math.min(100,v))}%`}}></div></div></div>)}</div><div className="card"><div className="profile-section-title"><div><h3>Subject Snapshot</h3><p>Stored grade data by subject.</p></div></div>{subjectScores.length?subjectScores.map(x=><div key={x.name} style={{marginBottom:14}}><div style={{display:'flex',justifyContent:'space-between',fontSize:12,fontWeight:700,marginBottom:6}}><span>{x.name}</span><span>{x.score}</span></div><div className="profile-progress"><div style={{width:`${Math.min(100,x.score)}%`}}></div></div></div>):<EmptyState icon="fa-chart-bar" title="No grade data" description="Subject performance will appear after grades are recorded."/>}</div></div></div>;
      };

      const renderAchievements = () => {
        const rules=[
          ['fa-calendar-check','Attendance Champion','Maintain 90%+ attendance',(attendance?.percentage||student?.attendance||0)>=90],
          ['fa-star','Academic Excellence','CGPA 8.5 or higher',(student?.cgpa||0)>=8.5],
          ['fa-pencil-alt','Quiz Master','Quiz average 80%+',(student?.quizAverage||0)>=80],
          ['fa-tasks','Assignment Streak','At least 5 submissions',student ? DS.getSubmissions(null,student.id).length>=5 : false],
          ['fa-book-open','Curriculum Explorer','Complete 80%+ curriculum',(student?.curriculumProgress||0)>=80],
          ['fa-shield-alt','Profile Complete','Complete all recommended profile fields',completion>=100]
        ];
        return <div className="card"><div className="profile-section-title"><div><h3>Achievements</h3><p>Badges are earned from real system data.</p></div></div><div className="achievement-grid">{rules.map(([icon,title,desc,earned])=><div className={`achievement ${earned?'':'locked'}`} key={title}><div className="achievement-icon"><i className={`fas ${icon}`}></i></div><div style={{fontWeight:800,fontSize:13}}>{title}</div><div style={{fontSize:11,color:'var(--text-secondary)',marginTop:5}}>{desc}</div><div style={{fontSize:10,fontWeight:800,color:earned?'var(--success)':'var(--text-light)',marginTop:10}}>{earned?'✓ EARNED':'LOCKED'}</div></div>)}</div></div>;
      };

      const renderActivity = () => <div className="card"><div className="profile-section-title"><div><h3>Activity Timeline</h3><p>Your latest academic, account and communication events.</p></div></div>{activities.length?<div className="timeline">{activities.map(a=><div className="timeline-item" key={a.id}><div style={{display:'flex',justifyContent:'space-between',gap:10}}><div style={{fontWeight:800,fontSize:13}}>{a.title}</div><span className="badge badge-secondary">{a.type}</span></div><div style={{fontSize:12,color:'var(--text-secondary)',marginTop:4}}>{a.detail}</div><div className="time">{new Date(a.createdAt).toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'})}</div></div>)}</div>:<EmptyState icon="fa-history" title="No activity yet" description="Activity will be collected as you use the system."/>}</div>;

      const renderDocuments = () => <div className="grid-2"><div className="card"><div className="profile-section-title"><div><h3>My Documents</h3><p>Document center ready for institution storage integration.</p></div></div>{['Digital Student ID','Academic Report','Fee Receipts','Certificates','Bonafide Certificate'].map((d,i)=><div className="profile-security-row" key={d}><div style={{display:'flex',gap:12,alignItems:'center'}}><div className="profile-security-icon"><i className={`fas ${i===0?'fa-id-card':i===2?'fa-receipt':'fa-file-alt'}`}></i></div><div><div style={{fontWeight:700,fontSize:13}}>{d}</div><div style={{fontSize:11,color:'var(--text-light)'}}>{i===0?'Available now':'Institution-managed document'}</div></div></div>{i===0?<button className="btn btn-primary btn-sm" onClick={()=>setIdModal(true)}>View</button>:<span className="badge badge-secondary">Ready</span>}</div>)}</div><div className="card"><div className="profile-section-title"><div><h3>Digital ID</h3><p>Print a clean institutional ID card.</p></div></div><div style={{textAlign:'center',padding:'18px 0'}}><i className="fas fa-id-card" style={{fontSize:48,color:'var(--primary)',marginBottom:12}}></i><p style={{fontSize:13,color:'var(--text-secondary)',maxWidth:330,margin:'0 auto 16px'}}>Use the digital identity card for campus verification. The QR code contains only a verification identifier.</p><button className="btn btn-primary" onClick={()=>setIdModal(true)}><i className="fas fa-eye"></i> Open Digital ID</button></div></div></div>;

      const renderPreferences = () => <div className="grid-2"><div className="card"><div className="profile-section-title"><div><h3>Notification Preferences</h3><p>Choose what you want to receive.</p></div><button className="btn btn-primary btn-sm" onClick={savePrefs}>Save</button></div>{[['academic','Academic updates','Assignments, exams and grades'],['attendance','Attendance alerts','Absence and attendance warnings'],['finance','Finance alerts','Fees and payment confirmations'],['communication','Communication','Messages and announcements'],['security','Security alerts','Login and account security']].map(([key,title,desc])=><label className="profile-security-row" key={key}><div><div style={{fontWeight:700,fontSize:13}}>{title}</div><div style={{fontSize:11,color:'var(--text-secondary)',marginTop:3}}>{desc}</div></div><input type="checkbox" checked={!!prefs.notifications?.[key]} onChange={e=>setPrefs({...prefs,notifications:{...prefs.notifications,[key]:e.target.checked}})} style={{width:20,height:20}}/></label>)}</div><div className="card"><div className="profile-section-title"><div><h3>Appearance</h3><p>Personal interface preferences.</p></div></div><div style={{display:'flex',gap:10,marginBottom:16}}><button className={`btn ${theme==='light'?'btn-primary':'btn-secondary'}`} style={{flex:1}} onClick={()=>theme!=='light'&&toggleTheme()}><i className="fas fa-sun"></i> Light</button><button className={`btn ${theme==='dark'?'btn-primary':'btn-secondary'}`} style={{flex:1}} onClick={()=>theme!=='dark'&&toggleTheme()}><i className="fas fa-moon"></i> Dark</button></div><label className="profile-security-row"><div><div style={{fontWeight:700,fontSize:13}}>Reduce motion</div><div style={{fontSize:11,color:'var(--text-secondary)',marginTop:3}}>Use fewer transition effects.</div></div><input type="checkbox" checked={!!prefs.appearance?.reduceMotion} onChange={e=>setPrefs({...prefs,appearance:{...prefs.appearance,reduceMotion:e.target.checked}})} style={{width:20,height:20}}/></label><label className="profile-security-row"><div><div style={{fontWeight:700,fontSize:13}}>Profile visibility</div><div style={{fontSize:11,color:'var(--text-secondary)',marginTop:3}}>Control who can view your profile.</div></div><select className="input" style={{width:160}} value={prefs.privacy?.profileVisibility||'INSTITUTION'} onChange={e=>setPrefs({...prefs,privacy:{...prefs.privacy,profileVisibility:e.target.value}})}><option value="INSTITUTION">Institution</option><option value="PRIVATE">Private</option></select></label><button className="btn btn-primary" style={{marginTop:16}} onClick={savePrefs}><i className="fas fa-save"></i> Save Preferences</button></div></div>;

      const renderSecurity = () => <div className="grid-2"><div className="card"><div className="profile-section-title"><div><h3>Password & Security</h3><p>Manage your local/demo account credentials.</p></div><span className="badge badge-warning">Demo auth</span></div><div className="profile-alert"><i className="fas fa-shield-alt" style={{color:'var(--warning)',fontSize:18}}></i><div><strong>Production note</strong><div style={{fontSize:12,color:'var(--text-secondary)',marginTop:3}}>Before real institutional deployment, move authentication to Firebase Auth/server-side identity. Do not store production passwords in client storage.</div></div></div><div className="form-group" style={{marginTop:18}}><label className="form-label">Current Password</label><input type="password" className="input" value={passwords.current} onChange={e=>setPasswords({...passwords,current:e.target.value})}/></div><div className="form-group"><label className="form-label">New Password</label><input type="password" className="input" value={passwords.next} onChange={e=>setPasswords({...passwords,next:e.target.value})}/></div><div className="form-group"><label className="form-label">Confirm New Password</label><input type="password" className="input" value={passwords.confirm} onChange={e=>setPasswords({...passwords,confirm:e.target.value})}/></div><button className="btn btn-primary" onClick={changePassword}><i className="fas fa-key"></i> Change Password</button></div><div className="card"><div className="profile-section-title"><div><h3>Account Security</h3><p>Current account state and security actions.</p></div></div><div className="profile-security-row"><div style={{display:'flex',gap:12,alignItems:'center'}}><div className="profile-security-icon"><i className="fas fa-user-check"></i></div><div><div style={{fontWeight:700,fontSize:13}}>Account status</div><div style={{fontSize:11,color:'var(--text-secondary)'}}>Active and authenticated</div></div></div><span className="badge badge-success">Active</span></div><div className="profile-security-row"><div style={{display:'flex',gap:12,alignItems:'center'}}><div className="profile-security-icon"><i className="fas fa-clock"></i></div><div><div style={{fontWeight:700,fontSize:13}}>Session protection</div><div style={{fontSize:11,color:'var(--text-secondary)'}}>Inactivity timeout enabled</div></div></div><span className="badge badge-success">Enabled</span></div><div className="profile-security-row"><div style={{display:'flex',gap:12,alignItems:'center'}}><div className="profile-security-icon"><i className="fas fa-history"></i></div><div><div style={{fontWeight:700,fontSize:13}}>Last login</div><div style={{fontSize:11,color:'var(--text-secondary)'}}>Current browser session</div></div></div><span style={{fontSize:11,color:'var(--text-light)'}}>{new Date().toLocaleString('en-IN')}</span></div><button className="btn btn-danger" style={{marginTop:18}} onClick={onLogout}><i className="fas fa-sign-out-alt"></i> Logout</button></div></div>;

      const renderPrivacy = () => <div className="grid-2"><div className="card"><div className="profile-section-title"><div><h3>Privacy Controls</h3><p>Manage what other institution users can see.</p></div></div>{[['showPhone','Phone number','Allow authorized institution users to see your phone'],['showEmail','Email address','Allow authorized institution users to see your email']].map(([key,title,desc])=><label className="profile-security-row" key={key}><div><div style={{fontWeight:700,fontSize:13}}>{title}</div><div style={{fontSize:11,color:'var(--text-secondary)',marginTop:3}}>{desc}</div></div><input type="checkbox" checked={prefs.privacy?.[key]!==false} onChange={e=>setPrefs({...prefs,privacy:{...prefs.privacy,[key]:e.target.checked}})} style={{width:20,height:20}}/></label>)}<div className="form-group" style={{marginTop:16}}><label className="form-label">Profile visibility</label><select className="input" value={prefs.privacy?.profileVisibility||'INSTITUTION'} onChange={e=>setPrefs({...prefs,privacy:{...prefs.privacy,profileVisibility:e.target.value}})}><option value="INSTITUTION">Institution users only</option><option value="PRIVATE">Private</option></select></div><button className="btn btn-primary" onClick={savePrefs}><i className="fas fa-save"></i> Save Privacy</button></div><div className="card"><div className="profile-section-title"><div><h3>Data & Account</h3><p>Keep your account information under control.</p></div></div><div className="profile-security-row"><div><div style={{fontWeight:700,fontSize:13}}>Profile data</div><div style={{fontSize:11,color:'var(--text-secondary)'}}>Your account and academic records remain subject to institution policy.</div></div><span className="badge badge-secondary">Protected</span></div><div className="profile-security-row"><div><div style={{fontWeight:700,fontSize:13}}>Export data</div><div style={{fontSize:11,color:'var(--text-secondary)'}}>Create a local JSON snapshot of your profile data for testing/demo use.</div></div><button className="btn btn-secondary btn-sm" onClick={()=>{const payload={user:profile,student,teacher,admin,accountant,preferences:prefs,exportedAt:new Date().toISOString()}; const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`edutrack-profile-${user.id}.json`; a.click(); URL.revokeObjectURL(a.href); showToast('Profile data exported','success')}}><i className="fas fa-download"></i> Export</button></div></div></div>;

      const renderContent = () => { switch(activeTab){case 'personal':return renderPersonal();case 'analytics':return renderAnalytics();case 'achievements':return renderAchievements();case 'activity':return renderActivity();case 'documents':return renderDocuments();case 'preferences':return renderPreferences();case 'security':return renderSecurity();case 'privacy':return renderPrivacy();default:return renderOverview();} };

      return <div>
        <div className="profile-hero"><div className="profile-hero-inner"><div className="profile-avatar-xl">{avatarPreview?<img src={avatarPreview} alt="Profile"/>:initials}</div><div className="profile-hero-info"><div className="profile-hero-name">{displayName}</div><div className="profile-hero-meta"><span className="badge badge-primary">{roleLabel}</span><span>{roleDetails}</span>{student?.grNumber&&<span>· {student.grNumber}</span>}<span>· <i className="fas fa-circle" style={{fontSize:6,color:'var(--success)'}}></i> Active</span></div><div style={{marginTop:13,maxWidth:480}}><div style={{display:'flex',justifyContent:'space-between',fontSize:11,color:'var(--text-secondary)',marginBottom:6}}><span>Profile completion</span><strong>{completion}%</strong></div><div className="profile-progress"><div style={{width:`${completion}%`}}></div></div></div></div><div className="profile-actions"><button className="btn btn-primary" onClick={()=>setActiveTab('personal')}><i className="fas fa-user-edit"></i> Edit Profile</button>{roleLabel==='STUDENT'&&<button className="btn btn-secondary" onClick={()=>setIdModal(true)}><i className="fas fa-id-card"></i> Digital ID</button>}</div></div></div>
        <div className="profile-tabs">{[['overview','fa-home','Overview'],['personal','fa-user','Personal'],...(roleLabel==='STUDENT'?[['analytics','fa-chart-line','Analytics'],['achievements','fa-trophy','Achievements']]:[]),['activity','fa-history','Activity'],['documents','fa-file-alt','Documents'],['preferences','fa-bell','Preferences'],['privacy','fa-user-lock','Privacy'],['security','fa-shield-alt','Security']].map(([id,icon,label])=><button key={id} className={`profile-tab ${activeTab===id?'active':''}`} onClick={()=>setActiveTab(id)}><i className={`fas ${icon}`}></i> {label}</button>)}</div>
        {renderContent()}

vokeObjectURL(a.href);showToast('Verification data exported','success')}}><i className="fas fa-download"></i> Export Verification</button></div></div></div></div>}
      </div>;

    // ===================== SETTINGS =====================
    function SettingsPage({ theme, toggleTheme }) {
      const [activeTab, setActiveTab] = useState('profile');
      const [radius, setRadius] = useState(DS.getSettings().geofenceRadius || 100);
      const [domain, setDomain] = useState(DS.getSettings().schoolDomain || 'vidhyadham.edu');
      const [instName, setInstName] = useState(DS.getSettings().institutionName || 'Vidhyadham Institute');
      const user = DS.getCurrentUser();
      
      const updateSettings = () => {
        const s = DS.getSettings();
        s.geofenceRadius = parseInt(radius) || 100;
        s.schoolDomain = domain.trim() || 'vidhyadham.edu';
        s.institutionName = instName.trim() || 'Vidhyadham Institute';
        DS.setSettings(s);
        showToast('Settings updated successfully!', 'success');
      };

      return (
        <div>
          <div className="grid-2">
            <div className="card animate-fadeIn">
              <div className="card-header"><h3 className="card-title"><i className="fas fa-user-cog"></i> Profile Settings</h3></div>
              <div className="form-group"><label className="form-label">Full Name</label><input className="input" value={user?.name||''} readOnly /></div>
              <div className="form-group"><label className="form-label">Email</label><input className="input" value={user?.email||''} readOnly /></div>
              <div className="form-group"><label className="form-label">Phone</label><input className="input" value={user?.phone||''} readOnly /></div>
              <div className="form-group"><label className="form-label">Role</label><input className="input" value={user?.role||''} readOnly /></div>
              <button className="btn btn-primary" onClick={()=>showToast('Profile updated','success')}><i className="fas fa-save"></i> Save Changes</button>
            </div>
            <div className="card animate-fadeIn">
              <div className="card-header"><h3 className="card-title"><i className="fas fa-palette"></i> Appearance & System</h3></div>
              <div style={{display:'flex',gap:'16px',marginBottom:'24px'}}>
                <button className={`btn ${theme==='light'?'btn-primary':'btn-secondary'}`} onClick={()=>theme!=='light'&&toggleTheme()} style={{flex:1}}><i className="fas fa-sun"></i> Light</button>
                <button className={`btn ${theme==='dark'?'btn-primary':'btn-secondary'}`} onClick={()=>theme!=='dark'&&toggleTheme()} style={{flex:1}}><i className="fas fa-moon"></i> Dark</button>
              </div>
              <div className="form-group">
                <label className="form-label">School Domain</label>
                <input className="input" value={domain} onChange={e=>setDomain(e.target.value)} placeholder="e.g. vidhyadham.edu" />
                <p style={{fontSize:'12px',color:'var(--text-light)',marginTop:'4px'}}>Used to generate student emails: name@domain.com</p>
              </div>
              <div className="form-group">
                <label className="form-label">Institution Name</label>
                <input className="input" value={instName} onChange={e=>setInstName(e.target.value)} />
              </div>
              <div className="form-group">
                <label className="form-label">Geofence Radius (meters)</label>
                <div style={{display:'flex',gap:'12px'}}>
                  <input type="number" className="input" value={radius} onChange={e=>setRadius(e.target.value)} min="10" max="1000" />
                </div>
                <p style={{fontSize:'12px',color:'var(--text-light)',marginTop:'4px'}}>Students must be within this distance from the teacher to mark attendance.</p>
              </div>
              <button className="btn btn-primary" onClick={updateSettings}><i className="fas fa-save"></i> Save All Settings</button>
              <div style={{padding:'16px',background:'var(--bg-primary)',borderRadius:'12px',marginTop:'16px'}}>
                <h4 style={{fontSize:'14px',fontWeight:700,marginBottom:'8px'}}>System Information</h4>
                <div style={{fontSize:'13px',color:'var(--text-secondary)',lineHeight:'1.8'}}>
                  <div>Institution: {DS.getSettings().institutionName}</div>
                  <div>Semester: {DS.getSettings().semester}</div>
                  <div>Version: EDUTrack Pro v4.0</div>
                  <div>Database: {DS.useFirebase ? 'Firebase Cloud' : 'Local Persistence'}</div>
                  <div>AI Engine: Active</div>
                  <div>GPS Attendance: Active</div>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    
    // ===================== ASSIGNMENTS =====================
    function AssignmentsPage({ user, role, viewAs }) {
      const effectiveRole = viewAs || role;
      const student = DS.getStudentByUserId(user.id) || (effectiveRole==='STUDENT' && role!=='STUDENT' ? DS.getStudents()[0] : null);
      const [showAdd, setShowAdd] = useState(false);
      const [newAssignment, setNewAssignment] = useState({title:'', description:'', dueDate:'', maxMarks:50, subjectId:'', classId:'cls1'});

      const assignments = (effectiveRole==='STUDENT' && student) 
        ? DS.getAssignments(student.classId) 
        : DS.getAssignments();

      const handleCreate = () => {
        if(!newAssignment.title.trim() || !newAssignment.dueDate) { showToast('Title and due date required','error'); return; }
        const all = DS.getCollection('assignments');
        all.push({
          id:'as-'+Date.now(), ...newAssignment, teacherId:user.id, status:'ACTIVE', createdAt:new Date().toISOString()
        });
        DS.setCollection('assignments', all);
        setShowAdd(false); 
        setNewAssignment({title:'', description:'', dueDate:'', maxMarks:50, subjectId:'', classId:'cls1'});
        showToast('Assignment created','success');
      };

      return (
        <div>
          {effectiveRole!=='STUDENT' && (
            <div style={{display:'flex',justifyContent:'flex-end',marginBottom:'24px'}}>
              <button className="btn btn-primary" onClick={()=>setShowAdd(true)}><i className="fas fa-plus"></i> New Assignment</button>
            </div>
          )}
          <div className="grid-2">
            {assignments.map(a => {
              const sub = DS.getSubjectById(a.subjectId);
              const cls = DS.getClassById(a.classId);
              const submission = student ? DS.getSubmissions(a.id, student.id)[0] : null;
              return (
                <div key={a.id} className="card animate-fadeIn">
                  <div className="card-header">
                    <h3 className="card-title">{a.title}</h3>
                    <span className={`badge ${a.status==='ACTIVE'?'badge-success':'badge-secondary'}`}>{a.status}</span>
                  </div>
                  <p style={{color:'var(--text-secondary)',fontSize:'14px',marginBottom:'12px'}}>{a.description}</p>
                  <div style={{display:'flex',gap:'8px',flexWrap:'wrap',marginBottom:'12px'}}>
                    <span className="badge badge-secondary">{sub?.name || 'Subject'}</span>
                    <span className="badge badge-info">{cls?.name || 'Class'}</span>
                    <span className="badge badge-warning"><i className="fas fa-clock"></i> Due: {a.dueDate}</span>
                    <span className="badge badge-primary">Max: {a.maxMarks}</span>
                  </div>
                  {effectiveRole==='STUDENT' && (
                    <div style={{marginTop:'12px',padding:'12px',background:'var(--bg-primary)',borderRadius:'10px'}}>
                      {submission ? (
                        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                          <span style={{fontSize:'13px',fontWeight:600}}><i className="fas fa-check-circle" style={{color:'var(--success)'}}></i> Submitted</span>
                          <span style={{fontSize:'12px',color:'var(--text-light)'}}>{submission.status}{submission.marks!==null?` · ${submission.marks}/${a.maxMarks}`:''}</span>
                        </div>
                      ) : (
                        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                          <span style={{fontSize:'13px',color:'var(--warning)',fontWeight:600}}><i className="fas fa-hourglass-half"></i> Pending</span>
                          <span style={{fontSize:'12px',color:'var(--text-light)'}}>Not submitted yet</span>
                        </div>
                      )}
                    </div>
                  )}
                  {effectiveRole!=='STUDENT' && (
                    <div style={{marginTop:'12px',fontSize:'12px',color:'var(--text-light)'}}>
                      Submissions: {DS.getSubmissions(a.id).length}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
          {assignments.length===0 && <EmptyState icon="fa-tasks" title="No assignments" description="No assignments found for your view." />}
          {showAdd && (
            <Modal isOpen={showAdd} onClose={()=>setShowAdd(false)} title="New Assignment" footer={<><button className="btn btn-secondary" onClick={()=>setShowAdd(false)}>Cancel</button><button className="btn btn-primary" onClick={handleCreate}>Create</button></>}>
              <div className="form-group"><label className="form-label">Title</label><input className="input" value={newAssignment.title} onChange={e=>setNewAssignment({...newAssignment,title:e.target.value})} /></div>
              <div className="form-group"><label className="form-label">Description</label><textarea className="input" rows="3" value={newAssignment.description} onChange={e=>setNewAssignment({...newAssignment,description:e.target.value})}></textarea></div>
              <div className="grid-2">
                <div className="form-group"><label className="form-label">Subject</label><select className="input" value={newAssignment.subjectId} onChange={e=>setNewAssignment({...newAssignment,subjectId:e.target.value})}><option value="">Select</option>{DS.getSubjects().map(s=><option key={s.id} value={s.id}>{s.name}</option>)}</select></div>
                <div className="form-group"><label className="form-label">Class</label><select className="input" value={newAssignment.classId} onChange={e=>setNewAssignment({...newAssignment,classId:e.target.value})}>{DS.getClasses().map(c=><option key={c.id} value={c.id}>{c.name}</option>)}</select></div>
              </div>
              <div className="grid-2">
                <div className="form-group"><label className="form-label">Due Date</label><input type="date" className="input" value={newAssignment.dueDate} onChange={e=>setNewAssignment({...newAssignment,dueDate:e.target.value})} /></div>
                <div className="form-group"><label className="form-label">Max Marks</label><input type="number" className="input" value={newAssignment.maxMarks} onChange={e=>setNewAssignment({...newAssignment,maxMarks:Number(e.target.value)||0})} /></div>
              </div>
            </Modal>
          )}
        </div>
      );
    }

    // ===================== GRADES =====================
    function GradesPage({ user, role, viewAs }) {
      const effectiveRole = viewAs || role;
      const student = DS.getStudentByUserId(user.id) || (effectiveRole==='STUDENT' && role!=='STUDENT' ? DS.getStudents()[0] : null);
      const [selectedStudent, setSelectedStudent] = useState(student?.id || '');

      const grades = effectiveRole==='STUDENT' && student 
        ? DS.getGrades(student.id) 
        : selectedStudent ? DS.getGrades(selectedStudent) : DS.getCollection('grades');

      return (
        <div>
          {effectiveRole!=='STUDENT' && (
            <div style={{marginBottom:'24px'}}>
              <select className="input" style={{width:'auto',minWidth:'240px'}} value={selectedStudent} onChange={e=>setSelectedStudent(e.target.value)}>
                <option value="">All Students</option>
                {DS.getStudents().map(s=><option key={s.id} value={s.id}>{s.name} ({s.grNumber})</option>)}
              </select>
            </div>
          )}
          <div className="card animate-fadeIn">
            <div className="card-header"><h3 className="card-title"><i className="fas fa-chart-bar"></i> Gradebook</h3></div>
            <div className="table-container">
              <table>
                <thead><tr><th>Subject</th><th>Internal 1</th><th>Internal 2</th><th>Assignment</th><th>Mid Term</th><th>Final</th><th>Total</th><th>Grade</th></tr></thead>
                <tbody>
                  {grades.map(g => {
                    const sub = DS.getSubjectById(g.subjectId);
                    const stu = DS.getStudentById(g.studentId);
                    const total = (g.internal1||0)+(g.internal2||0)+(g.assignment||0)+(g.midTerm||0)+(g.final||0);
                    const max = sub?.credits ? sub.credits*25 : 100;
                    const pct = max>0?Math.round((total/max)*100):0;
                    const grade = pct>=90?'A+':pct>=80?'A':pct>=70?'B':pct>=60?'C':pct>=50?'D':'F';
                    return (
                      <tr key={g.id}>
                        <td><strong>{sub?.name||'-'}</strong>{stu&&effectiveRole!=='STUDENT'?<div style={{fontSize:11,color:'var(--text-light)'}}>{stu.name}</div>:null}</td>
                        <td>{g.internal1??'-'}</td><td>{g.internal2??'-'}</td><td>{g.assignment??'-'}</td><td>{g.midTerm??'-'}</td><td>{g.final??'-'}</td>
                        <td><strong>{total}/{max}</strong></td>
                        <td><span className={`badge ${grade==='F'?'badge-danger':grade.startsWith('A')?'badge-success':'badge-primary'}`}>{grade}</span></td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
            {grades.length===0 && <EmptyState icon="fa-chart-bar" title="No grades" description="No grade records found." />}
          </div>
        </div>
      );
    }

    // ===================== LIBRARY =====================
    function LibraryPage({ user, role, viewAs }) {
      const [search, setSearch] = useState('');
      const books = DS.getLibraryBooks(search);

      return (
        <div>
          <div style={{display:'flex',gap:'12px',marginBottom:'24px'}}>
            <div className="search-bar" style={{flex:1}}>
              <i className="fas fa-search"></i>
              <input placeholder="Search by title or author..." value={search} onChange={e=>setSearch(e.target.value)} style={{border:'none',background:'none',outline:'none',width:'100%'}} />
            </div>
          </div>
          <div className="grid-3">
            {books.map(b => (
              <div key={b.id} className="card animate-fadeIn">
                <div className="card-header"><h3 className="card-title"><i className="fas fa-book"></i> {b.title}</h3><span className={`badge ${b.available?'badge-success':'badge-danger'}`}>{b.available?'Available':'Issued'}</span></div>
                <div style={{fontSize:'13px',color:'var(--text-secondary)',marginBottom:'8px'}}>{b.author}</div>
                <div style={{display:'flex',gap:'8px',flexWrap:'wrap',marginBottom:'12px'}}>
                  <span className="badge badge-secondary">{b.category}</span>
                  <span className="badge badge-info">ISBN: {b.isbn}</span>
                </div>
                <div style={{display:'flex',justifyContent:'space-between',fontSize:'12px',color:'var(--text-light)'}}>
                  <span>Total: {b.total}</span>
                  <span>Issued: {b.issued}</span>
                </div>
              </div>
            ))}
          </div>
          {books.length===0 && <EmptyState icon="fa-book" title="No books found" description="Try a different search term." />}
        </div>
      );
    }

// ===================== MAIN APP =====================
    function App() {
      const [user, setUser] = useState(DS.getCurrentUser());
      const [role, setRole] = useState(DS.getCurrentRole());
      const [viewAs, setViewAs] = useState(null);
      const [currentPage, setCurrentPage] = useState('dashboard');
      const [sidebarOpen, setSidebarOpen] = useState(false);
      const [theme, setTheme] = useState('light');
      const [notifCount, setNotifCount] = useState(0);
      const [modalContent, setModalContent] = useState(null);
      const [sessionWarning, setSessionWarning] = useState(false);

      useEffect(() => {
        const saved = localStorage.getItem('edutrack-theme');
        if (saved) { setTheme(saved); document.documentElement.setAttribute('data-theme', saved); }
        else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
          setTheme('dark'); document.documentElement.setAttribute('data-theme', 'dark');
        }
        if (user) {
          const notifs = DS.getNotifications(user.id) || [];
          setNotifCount(notifs.filter(n=>!n.read).length);
        }
        let inactiveTime = 0;
        const resetTimer = () => { inactiveTime = 0; setSessionWarning(false); };
        const interval = setInterval(() => {
          inactiveTime += 1000;
          if (inactiveTime > 900000 && user) setSessionWarning(true);
        }, 1000);
        window.addEventListener('mousemove', resetTimer);
        window.addEventListener('keypress', resetTimer);
        return () => { clearInterval(interval); window.removeEventListener('mousemove', resetTimer); window.removeEventListener('keypress', resetTimer); };
      }, [user]);

      const effectiveRole = viewAs || role;

      const handleLogin = (user, role) => { setUser(user); setRole(role); setViewAs(null); const n=DS.getNotifications(user.id); setNotifCount(n.filter(n=>!n.read).length); };
      const handleLogout = () => { DS.logout(); setUser(null); setRole(null); setViewAs(null); setCurrentPage('dashboard'); showToast('Logged out successfully','info'); };
      const toggleTheme = () => { const nt = theme==='light'?'dark':'light'; setTheme(nt); document.documentElement.setAttribute('data-theme',nt); localStorage.setItem('edutrack-theme',nt); };
      const toggleSidebar = () => setSidebarOpen(!sidebarOpen);
      const navigateTo = (page) => { setCurrentPage(page); setSidebarOpen(false); window.scrollTo(0,0); };

      const navStructure = {
        STUDENT: [
          { section:'Main', items:[ {id:'dashboard',label:'Dashboard',icon:'fa-home'}, {id:'attendance',label:'Attendance',icon:'fa-map-marker-alt'}, {id:'timetable',label:'Timetable',icon:'fa-clock'}, {id:'curriculum',label:'Curriculum',icon:'fa-book-open'}, {id:'assignments',label:'Assignments',icon:'fa-tasks'}, {id:'quiz',label:'Quizzes',icon:'fa-pencil-alt'} ] },
          { section:'Academics', items:[ {id:'grades',label:'Grades & Reports',icon:'fa-chart-bar'}, {id:'library',label:'Library',icon:'fa-book'}, {id:'fees',label:'Fee Status',icon:'fa-rupee-sign'}, {id:'transport',label:'Transport',icon:'fa-bus'} ] },
          { section:'Support', items:[ {id:'complaints',label:'Complaints',icon:'fa-exclamation-circle'}, {id:'ai-assistant',label:'AI Assistant',icon:'fa-robot'}, {id:'messages',label:'Messages',icon:'fa-envelope'}, {id:'announcements',label:'Announcements',icon:'fa-bullhorn'} ] }
        ],
        TEACHER: [
          { section:'Main', items:[ {id:'dashboard',label:'Dashboard',icon:'fa-home'}, {id:'attendance',label:'Attendance',icon:'fa-map-marker-alt'}, {id:'timetable',label:'Timetable',icon:'fa-clock'}, {id:'curriculum',label:'Curriculum',icon:'fa-book-open'}, {id:'assignments',label:'Assignments',icon:'fa-tasks'}, {id:'quiz',label:'Quizzes',icon:'fa-pencil-alt'} ] },
          { section:'Management', items:[ {id:'students',label:'Students',icon:'fa-users'}, {id:'grades',label:'Gradebook',icon:'fa-chart-bar'}, {id:'action-center',label:'Action Center',icon:'fa-bullhorn'}, {id:'complaints',label:'Complaints',icon:'fa-exclamation-circle'} ] },
          { section:'Tools', items:[ {id:'ai-assistant',label:'AI Assistant',icon:'fa-robot'}, {id:'analytics',label:'Analytics',icon:'fa-chart-line'}, {id:'announcements',label:'Announcements',icon:'fa-bullhorn'} ] }
        ],
        ADMIN: [
          { section:'Overview', items:[ {id:'dashboard',label:'Dashboard',icon:'fa-home'}, {id:'analytics',label:'Analytics',icon:'fa-chart-line'} ] },
          { section:'Management', items:[ {id:'students',label:'Students',icon:'fa-users'}, {id:'teachers',label:'Teachers',icon:'fa-chalkboard-teacher'}, {id:'classes',label:'Classes',icon:'fa-school'}, {id:'timetable',label:'Timetable',icon:'fa-clock'} ] },
          { section:'Finance', items:[ {id:'fees',label:'Fee Manager',icon:'fa-rupee-sign'}, {id:'import',label:'Import Center',icon:'fa-upload'}, {id:'transport',label:'Transport',icon:'fa-bus'} ] },
          { section:'Operations', items:[ {id:'complaints',label:'Complaints',icon:'fa-exclamation-circle'}, {id:'announcements',label:'Announcements',icon:'fa-bullhorn'}, {id:'settings',label:'Settings',icon:'fa-cog'} ] }
        ],
        ACCOUNTANT: [
          { section:'Overview', items:[ {id:'dashboard',label:'Dashboard',icon:'fa-home'} ] },
          { section:'Finance', items:[ {id:'fees',label:'Fee Collection',icon:'fa-rupee-sign'}, {id:'students',label:'Students',icon:'fa-users'} ] }
        ]
      };

      const getNavItems = () => navStructure[effectiveRole] || navStructure.STUDENT;
      const pageTitles = { profile:'My Profile', dashboard:'Dashboard', attendance:'Attendance', curriculum:'Curriculum', quiz:'Quizzes', 'ai-assistant':'AI Assistant', 'action-center':'Action Center', analytics:'Analytics', students:'Students', teachers:'Teachers', timetable:'Timetable', settings:'Settings', assignments:'Assignments', grades:'Grades & Reports', library:'Library', fees:'Fee Status', messages:'Messages', announcements:'Announcements', classes:'Classes', complaints:'Complaints', transport:'Transport', import:'Import Center' };

      if (!user) return <Login onLogin={handleLogin} />;

      const renderPage = () => {
        const props = { user, role, viewAs, setViewAs, navigateTo, onModal: setModalContent };
        switch(currentPage) {
          case 'profile': return <ProfilePage {...props} theme={theme} toggleTheme={toggleTheme} onLogout={handleLogout} />;
          case 'dashboard': return <DashboardPage {...props} />;
          case 'attendance': return <AttendancePage {...props} />;
          case 'curriculum': return <CurriculumPage {...props} />;
          case 'quiz': return <QuizPage {...props} />;
          case 'assignments': return <AssignmentsPage {...props} />;
          case 'grades': return <GradesPage {...props} />;
          case 'library': return <LibraryPage {...props} />;
          case 'fees': return <FeesPage {...props} />;
          case 'transport': return <TransportPage {...props} />;
          case 'import': return <ImportCenterPage {...props} />;
          case 'ai-assistant': return <AIAssistantPage {...props} />;
          case 'action-center': return <ActionCenterPage {...props} />;
          case 'analytics': return <AnalyticsPage {...props} />;
          case 'students': return <StudentsPage {...props} />;
          case 'teachers': return <TeachersPage {...props} />;
          case 'classes': return <ClassesPage {...props} />;
          case 'timetable': return <TimetablePage {...props} />;
          case 'messages': return <MessagesPage {...props} />;
          case 'announcements': return <AnnouncementsPage {...props} />;
          case 'settings': return <SettingsPage {...props} theme={theme} toggleTheme={toggleTheme} />;
          case 'complaints': return <ComplaintsPage {...props} />;
          default: return <DashboardPage {...props} />;
        }
      };

      const canSwitchView = role === 'ADMIN' || role === 'TEACHER';
      const viewOptions = role === 'ADMIN' ? ['ADMIN','TEACHER','STUDENT'] : role === 'TEACHER' ? ['TEACHER','STUDENT'] : [];

      return (
        <div className="app-container">
          <div className={`sidebar ${sidebarOpen?'open':''}`}>
            <div className="sidebar-brand">
              <div className="brand-icon"><i className="fas fa-graduation-cap"></i></div>
              <div><h2>EDUTrack AI</h2><small>Pro v5.0 · Digital Campus ERP</small></div>
            </div>
            <nav className="sidebar-nav">
              {getNavItems().map((section, si) => (
                <div key={si}>
                  <div className="nav-section">{section.section}</div>
                  {section.items.map(item => (
                    <div key={item.id} className={`nav-item ${currentPage===item.id?'active':''}`} onClick={()=>navigateTo(item.id)}>
                      <i className={`fas ${item.icon}`}></i> {item.label}
                      {item.id==='action-center' && effectiveRole==='TEACHER' && <span className="nav-badge">{DS.getInterventions().filter(i=>i.status==='PENDING').length}</span>}
                      {item.id==='complaints' && <span className="nav-badge">{DS.getComplaints().filter(c=>c.status==='PENDING').length}</span>}
                    </div>
                  ))}
                </div>
              ))}
              <div className="nav-section">Account</div>
              <div className={`nav-item ${currentPage==='profile'?'active':''}`} onClick={()=>navigateTo('profile')}><i className="fas fa-user-circle"></i> My Profile</div>
              <div className="nav-item" onClick={handleLogout}><i className="fas fa-sign-out-alt"></i> Logout</div>
            </nav>
            <div className="sidebar-footer" onClick={()=>navigateTo('profile')} style={{cursor:'pointer'}}>
              <div className="avatar">{user.avatar ? <img src={user.avatar} alt="" style={{width:'100%',height:'100%',objectFit:'cover',borderRadius:'50%'}}/> : user.name.charAt(0)}</div>
              <div className="user-info">
                <div className="name">{user.name}</div>
                <div className="role">{viewAs ? `${role} → ${viewAs}` : role}</div>
              </div>
              <button className="theme-btn" onClick={toggleTheme}><i className={`fas ${theme==='light'?'fa-moon':'fa-sun'}`}></i></button>
            </div>
          </div>
          <div className="main-content">
            <header className="topbar">
              <div className="topbar-left">
                <button className="menu-toggle" onClick={toggleSidebar}><i className="fas fa-bars"></i></button>
                <h1 className="page-title">{pageTitles[currentPage]||'Dashboard'}</h1>
              </div>
              <div className="topbar-right">
                {canSwitchView && (
                  <div className="view-switcher">
                    <i className="fas fa-eye" style={{color:'var(--primary)'}}></i>
                    <select value={viewAs||role} onChange={e=>{ setViewAs(e.target.value===role?null:e.target.value); setCurrentPage('dashboard'); }}>
                      {viewOptions.map(v=><option key={v} value={v}>{v==='ADMIN'?'Admin View':v==='TEACHER'?'Teacher View':'Student View'}</option>)}
                    </select>
                  </div>
                )}
                <div className="search-bar"><i className="fas fa-search"></i><input type="text" placeholder="Search anything..." /></div>
                <button className="icon-btn" onClick={toggleTheme}><i className={`fas ${theme==='light'?'fa-moon':'fa-sun'}`}></i></button>
                <button className="icon-btn" onClick={openNotifications}>
                  <i className="fas fa-bell"></i>
                  {notifCount>0 && <span className="badge-dot"></span>}
                </button>
                <button className="icon-btn" title="My Profile" onClick={()=>navigateTo('profile')}><i className="fas fa-user-circle"></i></button>
                <button className="icon-btn" title="Logout" onClick={handleLogout}><i className="fas fa-sign-out-alt"></i></button>
              </div>
            </header>
            <div className="page-content">{renderPage()}</div>
          </div>
          {modalContent && <Modal {...modalContent} />}
          {sessionWarning && (
            <div className="modal-overlay" style={{zIndex:4000}}>
              <div className="modal-content" style={{maxWidth:'400px',textAlign:'center'}}>
                <div className="modal-body">
                  <i className="fas fa-clock" style={{fontSize:'48px',color:'var(--warning)',marginBottom:'16px'}}></i>
                  <h3>Session Timeout Warning</h3>
                  <p style={{color:'var(--text-secondary)',marginTop:'8px'}}>You have been inactive for 15 minutes. You will be logged out soon for security.</p>
                  <button className="btn btn-primary" style={{marginTop:'16px'}} onClick={()=>setSessionWarning(false)}>Stay Logged In</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ===================== RENDER =====================
    try {
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    } catch (err) {
      console.error('Failed to mount application:', err);
      document.getElementById('root').innerHTML = '<div style="padding:40px;text-align:center;font-family:sans-serif;"><h1 style="color:#ef4444">Application Error</h1><p>Please refresh the page or contact support.</p></div>';
    }
  </script>
</body>
</html>
