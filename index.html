              <div style={{marginTop:'16px',display:'flex',gap:'8px',flexWrap:'wrap'}}>
                <span className="badge badge-success"><i className="fas fa-check"></i> Database: Operational</span>
                <span className="badge badge-success"><i className="fas fa-check"></i> AI Model: Ready</span>
                <span className="badge badge-success"><i className="fas fa-check"></i> GPS Engine: Active</span>
                <span className="badge badge-success"><i className="fas fa-check"></i> Bulk Import: Online</span>
              </div>
              <div style={{marginTop:'18px',display:'flex',gap:'10px',flexWrap:'wrap'}}>
                <button className="btn btn-secondary btn-sm" style={{background:'rgba(255,255,255,0.2)',color:'white',border:'none'}} onClick={()=>navigateTo('import')}>
                  <i className="fas fa-file-excel"></i> Bulk Student Import
                </button>
                <button className="btn btn-secondary btn-sm" style={{background:'rgba(255,255,255,0.2)',color:'white',border:'none'}} onClick={()=>navigateTo('settings')}>
                  <i className="fas fa-cog"></i> Global ERP Settings
                </button>
              </div>
            </div>

            <div className="card animate-fadeIn stagger-3">
              <div className="card-header">
                <h3 className="card-title"><i className="fas fa-shield-alt"></i> Administrative Shortcuts</h3>
              </div>
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'12px',marginBottom:'16px'}}>
                <button className="btn btn-secondary" onClick={()=>navigateTo('students')}><i className="fas fa-user-graduate"></i> Student Roster</button>
                <button className="btn btn-secondary" onClick={()=>navigateTo('teachers')}><i className="fas fa-chalkboard-teacher"></i> Faculty Directory</button>
                <button className="btn btn-secondary" onClick={()=>navigateTo('classes')}><i className="fas fa-school"></i> Manage Classes</button>
                <button className="btn btn-secondary" onClick={()=>navigateTo('transport')}><i className="fas fa-bus"></i> Transport Fleet</button>
                <button className="btn btn-secondary" onClick={()=>navigateTo('analytics')}><i className="fas fa-chart-pie"></i> Campus Analytics</button>
                <button className="btn btn-secondary" onClick={()=>navigateTo('complaints')}><i className="fas fa-exclamation-circle"></i> Grievances ({stats?.pendingComplaints||0})</button>
              </div>
            </div>
          </div>
        </div>
      );
    }


function AttendancePage({ user, role, viewAs }) {
      const effectiveRole = viewAs || role;
      const [activeTab, setActiveTab] = useState('overview');
      const [selectedDate, setSelectedDate] = useState(new Date().toISOString().split('T')[0]);
      const [selectedClass, setSelectedClass] = useState('cls1');
      const [selectedSubject, setSelectedSubject] = useState('sub1');
      const [sessionActive, setSessionActive] = useState(false);
      const [currentSession, setCurrentSession] = useState(null);
      const [otpTimer, setOtpTimer] = useState(0);
      const [teacherLocation, setTeacherLocation] = useState(null);
      const [gpsLoading, setGpsLoading] = useState(false);
      const [activeSessions, setActiveSessions] = useState([]);
      const [enteredOtp, setEnteredOtp] = useState('');
      const [scanningSession, setScanningSession] = useState(null);
      const [studentLocation, setStudentLocation] = useState(null);
      const [scanResult, setScanResult] = useState(null);
      const [scanStep, setScanStep] = useState(0);
      const [studentGpsLoading, setStudentGpsLoading] = useState(false);
      const [newStudent, setNewStudent] = useState({name:'', phone:'', email:'', gender:'Male', classId:'cls1', departmentId:'d1', guardian:'', guardianPhone:'', address:'', admissionYear: new Date().getFullYear()});
      const [addResult, setAddResult] = useState(null);
      const [, setTick] = useState(0);

      const student = DS.getStudentByUserId(user.id) || (effectiveRole==='STUDENT' && role!=='STUDENT' ? DS.getStudents()[0] : null);
      const teacher = DS.getTeacherByUserId(user.id);
      const settings = DS.getSettings();

      useEffect(() => {
        if (effectiveRole !== 'STUDENT') return;
        const poll = () => { const sessions = DS.getActiveAttendanceSessions(student?.classId); setActiveSessions(sessions || []); };
        poll();
        const interval = setInterval(poll, 3000);
        return () => clearInterval(interval);
      }, [effectiveRole, student]);

      useEffect(() => {
        let interval;
        if (sessionActive && otpTimer > 0) {
          interval = setInterval(() => {
            setOtpTimer(t => { if (t <= 1) { setSessionActive(false); setCurrentSession(null); showToast('OTP session expired','warning'); return 0; } return t - 1; });
          }, 1000);
        }
        return () => clearInterval(interval);
      }, [sessionActive, otpTimer]);

      const startSession = async () => {
        if (!selectedClass || !selectedSubject) { showToast('Please select class and subject','error'); return; }
        setGpsLoading(true);
        try {
          const pos = await getCurrentPosition();
          setTeacherLocation(pos); setGpsLoading(false);
          const existing = DS.getActiveAttendanceSessions(selectedClass);
          if (existing.length > 0) { showToast('An active session already exists for this class','warning'); return; }
          const otp = Math.floor(1000 + Math.random() * 9000).toString();
          const session = DS.createAttendanceSession({ teacherId: teacher?.id || user.id, classId: selectedClass, subjectId: selectedSubject, otp: otp, otpExpiresAt: new Date(Date.now() + 60000).toISOString(), location: pos, radius: settings.geofenceRadius || 100 });
          setCurrentSession(session); setSessionActive(true); setOtpTimer(60);
          showToast(`🎯 Session started! OTP: ${otp}`, 'success'); fireConfetti();
        } catch (err) { setGpsLoading(false); showToast('GPS Error: ' + (err.message || 'Unable to get location'), 'error'); }
      };

      const selectSession = (session) => { setScanningSession(session); setScanStep(1); setEnteredOtp(''); setScanResult(null); };

      const verifyOtp = () => {
        if (!scanningSession || !enteredOtp) return;
        if (enteredOtp !== scanningSession.otp) { setScanResult({ status: 'error', message: '❌ Invalid OTP code!' }); showToast('Invalid OTP code','error'); return; }
        if (new Date(scanningSession.otpExpiresAt) < new Date()) { setScanResult({ status: 'error', message: '⏰ OTP has expired!' }); showToast('OTP expired','error'); setActiveSessions(DS.getActiveAttendanceSessions(student?.classId)); return; }
        setScanStep(2); setScanResult(null);
      };

      const verifyGPSAndMark = async () => {
        if (!scanningSession || !student) return;
        setStudentGpsLoading(true);
        try {
          const pos = await getCurrentPosition(); setStudentLocation(pos);
          if (!scanningSession.location) { showToast('Session location not available','error'); setStudentGpsLoading(false); return; }
          const distance = getDistanceFromLatLonInMeters(pos.lat, pos.lng, scanningSession.location.lat, scanningSession.location.lng);
          const radius = scanningSession.radius || 100;
          if (distance > radius) { setScanResult({ status: 'error', message: `📍 You are ${Math.round(distance)}m away from classroom. Max allowed: ${radius}m.`, details: 'Please move closer to the classroom to mark attendance.' }); showToast(`Too far from classroom: ${Math.round(distance)}m`, 'error'); setStudentGpsLoading(false); return; }
          const today = new Date().toISOString().split('T')[0];
          const existing = DS.getAttendance(student.id, scanningSession.subjectId, today);
          if (existing.length > 0) { setScanResult({ status: 'error', message: '⚠️ Attendance already recorded for today!' }); showToast('Attendance already recorded','warning'); setStudentGpsLoading(false); return; }
          DS.markAttendance(student.id, scanningSession.subjectId, today, 'PRESENT', scanningSession.teacherId, 'GPS_OTP', pos);
          setScanResult({ status: 'success', message: `✅ Attendance recorded!`, details: `📍 Verified within ${Math.round(distance)}m of classroom · ${DS.getSubjectById(scanningSession.subjectId)?.name}` });
          showToast('✅ Attendance marked successfully!', 'success'); fireConfetti(); setScanStep(3); setActiveSessions(DS.getActiveAttendanceSessions(student?.classId));
        } catch (err) { showToast('GPS Error: ' + (err.message || 'Unable to verify location'), 'error'); }
        setStudentGpsLoading(false);
      };

      const handleBulkAttendance = (studentId, status) => {
        if (!selectedSubject) { showToast('Please select a subject','error'); return; }
        DS.markAttendance(studentId, selectedSubject, selectedDate, status, teacher?.id||user.id);
        setTick(t => t + 1);
        showToast(`Attendance recorded: ${status}`,'success');
      };

      const handleAddStudent = () => {
        if (!newStudent.name.trim()) { showToast('Student name is required','error'); return; }
        if (!newStudent.phone.trim()) { showToast('Phone number is required','error'); return; }
        if (newStudent.phone.length < 10) { showToast('Phone number must be at least 10 digits','error'); return; }
        const settings = DS.getSettings();
        const year = parseInt(newStudent.admissionYear) || new Date().getFullYear();
        const seq = DS.getNextGRSequence(year);
        const grNumber = DS.generateGRNumber(year, seq);
        const email = DS.generateEmail(newStudent.name);
        const userId = 'u-' + Date.now();
        DS.addUser({ id: userId, name: newStudent.name, email: email, role: 'STUDENT', password: grNumber, avatar: null, phone: newStudent.phone || '', joined: new Date().toISOString().split('T')[0] });
        const studentId = 's-' + Date.now();
        const newStu = DS.addStudent({ id: studentId, userId: userId, grNumber: grNumber, name: newStudent.name, rollNo: grNumber, classId: newStudent.classId, department: newStudent.departmentId, semester: 1, attendance: 0, curriculumProgress: 0, quizAverage: 0, cgpa: 0, backlogs: 0, gender: newStudent.gender || 'Male', dob: newStudent.dob || '', address: newStudent.address || '', guardian: newStudent.guardian || '', guardianPhone: newStudent.guardianPhone || '', admissionYear: year });
        setAddResult({ student: newStu, user: DS.getUserById(userId), password: grNumber });
        showToast(`Student added! GR: ${grNumber}`,'success');
        setNewStudent({name:'', phone:'', email:'', gender:'Male', classId:'cls1', departmentId:'d1', guardian:'', guardianPhone:'', address:'', admissionYear: new Date().getFullYear()});
        setTimeout(()=>setAddResult(null), 8000);
      };

      const attendanceRecords = student ? DS.getAttendance(student.id) : [];
      const stats = student ? (DS.getAttendanceStats(student.id) || {}) : {};

      if (effectiveRole==='STUDENT') return (
        <div>
          <div className="stats-grid">
            <StatCard icon="fa-calendar-check" iconClass="green" label="Overall" value={stats.percentage||0} suffix="%" delay={1} />
            <StatCard icon="fa-check" iconClass="purple" label="Present" value={stats.present||0} delay={2} />
            <StatCard icon="fa-clock" iconClass="orange" label="Late" value={stats.late||0} delay={3} />
            <StatCard icon="fa-times" iconClass="red" label="Absent" value={stats.absent||0} delay={4} />
          </div>
          <div className="grid-2">
            <div className="card animate-fadeIn stagger-2">
              <div className="card-header"><h3 className="card-title"><i className="fas fa-map-marker-alt"></i> Mark Attendance (GPS + OTP)</h3></div>
              {scanStep === 0 && (
                <div>
                  {activeSessions.length > 0 ? (
                    <div>
                      <p style={{color:'var(--text-secondary)',marginBottom:'16px',fontSize:'14px'}}><i className="fas fa-info-circle" style={{color:'var(--primary)'}}></i> {activeSessions.length} active session(s) found. Select one to mark your attendance.</p>
                      {activeSessions.map((session, idx) => {
                        const sub = DS.getSubjectById(session.subjectId);
                        const cls = DS.getClassById(session.classId);
                        const timeLeft = Math.max(0, Math.floor((new Date(session.otpExpiresAt) - new Date()) / 1000));
                        return (
                          <div key={idx} style={{padding:'16px',background:'var(--bg-primary)',borderRadius:'12px',marginBottom:'12px',border:'2px solid var(--primary)',cursor:'pointer'}} onClick={()=>selectSession(session)}>
                            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'8px'}}>
                              <span style={{fontWeight:700,fontSize:'15px'}}><i className="fas fa-book" style={{color:'var(--primary)'}}></i> {sub?.name || 'Subject'}</span>
                              <span className="badge badge-success" style={{animation:'pulse-glow 2s infinite'}}><i className="fas fa-circle" style={{fontSize:'8px'}}></i> Active</span>
                            </div>
                            <div style={{fontSize:'13px',color:'var(--text-secondary)',marginBottom:'8px'}}>Class: {cls?.name} · Expires in <strong style={{color:'var(--danger)'}}>{Math.floor(timeLeft/60)}:{(timeLeft%60).toString().padStart(2,'0')}</strong></div>
                            <button className="btn btn-primary btn-block" style={{fontSize:'14px'}}><i className="fas fa-location-arrow"></i> Mark Attendance</button>
                          </div>
                        );
                      })}
                    </div>
                  ) : (
                    <div style={{textAlign:'center',padding:'40px 20px'}}>
                      <div style={{width:'120px',height:'120px',background:'var(--bg-primary)',borderRadius:'20px',border:'2px dashed var(--border-color)',display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 16px'}}>
                        <i className="fas fa-map-marker-alt" style={{fontSize:'48px',color:'var(--text-light)',opacity:0.5}}></i>
                      </div>
                      <p style={{color:'var(--text-secondary)',fontSize:'15px'}}>No active attendance sessions found.</p>
                      <p style={{color:'var(--text-light)',fontSize:'13px',marginTop:'4px'}}>Your teacher hasn't started a GPS + OTP session yet.</p>
                    </div>
                  )}
                </div>
              )}
              {scanStep === 1 && scanningSession && (
                <div style={{textAlign:'center',padding:'20px'}}>
                  <div style={{marginBottom:'20px'}}><h4 style={{marginBottom:'8px'}}>Enter 4-Digit OTP</h4><p style={{color:'var(--text-secondary)',fontSize:'13px'}}>Your teacher will announce this code. Enter it below.</p></div>
                  <div style={{display:'flex',gap:'12px',justifyContent:'center',marginBottom:'24px'}}>
                    <input type="text" maxLength="4" className="input" style={{width:'200px',textAlign:'center',fontSize:'32px',fontWeight:'800',letterSpacing:'12px',fontFamily:'Space Grotesk'}} value={enteredOtp} onChange={e=>setEnteredOtp(e.target.value.replace(/\D/g,''))} placeholder="0000" />
                  </div>
                  <div style={{display:'flex',gap:'12px',justifyContent:'center'}}>
                    <button className="btn btn-secondary" onClick={()=>{setScanStep(0);setScanningSession(null);}}>Cancel</button>
                    <button className="btn btn-primary btn-lg" onClick={verifyOtp} disabled={enteredOtp.length!==4}><i className="fas fa-arrow-right"></i> Verify OTP</button>
                  </div>
                  {scanResult && scanResult.status === 'error' && (
                    <div style={{marginTop:'16px',padding:'12px',background:'#fee2e2',borderRadius:'10px',color:'#991b1b',fontSize:'14px'}}><i className="fas fa-exclamation-circle"></i> {scanResult.message}</div>
                  )}
                </div>
              )}
              {scanStep === 2 && scanningSession && (
                <div style={{textAlign:'center',padding:'20px'}}>
                  <div style={{width:'80px',height:'80px',borderRadius:'50%',background:'var(--primary-gradient)',display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 16px',fontSize:'32px',color:'white'}}><i className="fas fa-crosshairs"></i></div>
                  <h4 style={{marginBottom:'8px'}}>Verify Your Location</h4>
                  <p style={{color:'var(--text-secondary)',fontSize:'13px',marginBottom:'20px'}}>We need to verify you are physically present in the classroom.</p>
                  <div className="gps-status pending" style={{marginBottom:'20px',justifyContent:'center'}}><i className="fas fa-satellite-dish fa-spin"></i> Acquiring GPS signal...</div>
                  <button className="btn btn-success btn-lg" onClick={verifyGPSAndMark} disabled={studentGpsLoading}>
                    {studentGpsLoading ? <><i className="fas fa-circle-notch fa-spin"></i> Verifying...</> : <><i className="fas fa-check"></i> Verify Location & Mark Present</>}
                  </button>
                  <button className="btn btn-ghost" style={{marginTop:'12px'}} onClick={()=>{setScanStep(1);setScanResult(null);}}><i className="fas fa-arrow-left"></i> Back to OTP</button>
                </div>
              )}
              {scanStep === 3 && scanResult && (
                <div style={{textAlign:'center',padding:'30px 20px'}}>
                  <div style={{fontSize:'64px',marginBottom:'16px'}}>🎉</div>
                  <h3 style={{color:'var(--success)',marginBottom:'8px'}}>{scanResult.message}</h3>
                  <p style={{color:'var(--text-secondary)'}}>{scanResult.details}</p>
                  <button className="btn btn-primary" style={{marginTop:'20px'}} onClick={()=>{setScanStep(0);setScanningSession(null);setScanResult(null);setEnteredOtp('');}}><i className="fas fa-check"></i> Done</button>
                </div>
              )}
            </div>
            <div className="card animate-fadeIn stagger-3">
              <div className="card-header"><h3 className="card-title"><i className="fas fa-history"></i> Recent Records</h3></div>
              <div className="table-container">
                <table><thead><tr><th>Date</th><th>Subject</th><th>Status</th><th>Method</th></tr></thead>
                <tbody>{(attendanceRecords || []).slice(0,8).map((a,i)=> (
                  <tr key={i}><td>{a.date}</td><td>{DS.getSubjectById(a.subjectId)?.code || 'N/A'}</td>
                  <td><span className={`badge ${a.status==='PRESENT'?'badge-success':a.status==='LATE'?'badge-warning':'badge-danger'}`}>{a.status}</span></td>
                  <td><span className="badge badge-secondary">{a.method || 'MANUAL'}</span></td></tr>
                ))}</tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      );

      return (
        <div>
          <div className="tabs">
            <button className={`tab ${activeTab==='overview'?'active':''}`} onClick={()=>setActiveTab('overview')}>Overview</button>
            <button className={`tab ${activeTab==='mark'?'active':''}`} onClick={()=>setActiveTab('mark')}>Mark Attendance</button>
            <button className={`tab ${activeTab==='gps-otp'?'active':''}`} onClick={()=>setActiveTab('gps-otp')}>GPS + OTP Session</button>
            <button className={`tab ${activeTab==='students'?'active':''}`} onClick={()=>setActiveTab('students')}>Add Students</button>
          </div>

          {activeTab==='overview' && (
            <div className="card animate-fadeIn">
              <div className="card-header"><h3 className="card-title">Attendance Overview</h3></div>
              <div className="table-container">
                <table><thead><tr><th>Student</th><th>GR Number</th><th>Roll No</th><th>Overall %</th><th>Present</th><th>Absent</th><th>Status</th></tr></thead>
                <tbody>{(DS.getStudents() || []).map(s=>{ const st=DS.getAttendanceStats(s.id); return (
                  <tr key={s.id}>
                    <td className="td-name"><div className="td-avatar">{s.name.charAt(0)}</div><div className="td-info"><span className="name">{s.name}</span><span className="sub">{DS.getClassById(s.classId)?.name}</span></div></td>
                    <td><span className="badge badge-primary" style={{fontSize:'10px'}}>{s.grNumber}</span></td>
                    <td>{s.rollNo}</td>
                    <td><div className="progress-bar" style={{width:'80px',display:'inline-block',marginRight:'8px',verticalAlign:'middle'}}><div className={`fill ${(st.percentage||0)>80?'success':(st.percentage||0)>70?'warning':'danger'}`} style={{width:`${st.percentage||0}%`}}></div></div> {st.percentage||0}%</td>
                    <td>{st.present||0}</td><td>{st.absent||0}</td>
                    <td><span className={`badge ${(st.percentage||0)>=75?'badge-success':'badge-danger'}`}>{(st.percentage||0)>=75?'✅ Good':'⚠️ At Risk'}</span></td>
                  </tr>
                );})}</tbody>
                </table>
              </div>
            </div>
          )}

          {activeTab==='mark' && (
            <div className="card animate-fadeIn">
              <div className="card-header"><h3 className="card-title">Mark Attendance - {new Date(selectedDate).toDateString()}</h3></div>
              
              <div style={{marginBottom:'20px',display:'flex',gap:'12px',flexWrap:'wrap',alignItems:'center'}}>
                <input type="date" className="input" style={{width:'auto'}} value={selectedDate} onChange={e=>setSelectedDate(e.target.value)} />
                <select className="input" style={{width:'auto'}} value={selectedClass} onChange={e=>setSelectedClass(e.target.value)}>{(DS.getClasses() || []).map(c=><option key={c.id} value={c.id}>{c.name}</option>)}</select>
                <select className="input" style={{width:'auto'}} value={selectedSubject} onChange={e=>setSelectedSubject(e.target.value)}>{(DS.getSubjects() || []).map(s=><option key={s.id} value={s.id}>{s.name}</option>)}</select>
                <div style={{marginLeft:'auto',display:'flex',gap:'8px'}}>
                  <button className="btn btn-sm btn-success" onClick={()=>{
                    const stus = DS.getStudents().filter(s=>s.classId===selectedClass);
                    stus.forEach(s => DS.markAttendance(s.id, selectedSubject, selectedDate, 'PRESENT', teacher?.id||user.id));
                    setTick(t => t + 1);
                    showToast(`Marked ${stus.length} students PRESENT`,'success');
                  }}><i className="fas fa-check-double"></i> Mark All Present</button>
                  <button className="btn btn-sm btn-secondary" onClick={()=>{
                    const stus = DS.getStudents().filter(s=>s.classId===selectedClass);
                    stus.forEach(s => DS.markAttendance(s.id, selectedSubject, selectedDate, 'ABSENT', teacher?.id||user.id));
                    setTick(t => t + 1);
                    showToast(`Cleared attendance`,'info');
                  }}><i className="fas fa-undo"></i> Reset All</button>
                </div>
              </div>

              <div className="table-container">
                <table><thead><tr><th>Student</th><th>GR</th><th>Roll No</th><th>Mark Status</th></tr></thead>
                <tbody>{(DS.getStudents() || []).filter(s=>s.classId===selectedClass).map(s=> {
                  const todayRec = DS.getAttendance(s.id, selectedSubject, selectedDate);
                  const currentStatus = todayRec.length>0 ? todayRec[0].status : null;
                  return (
                    <tr key={s.id}>
                      <td className="td-name"><div className="td-avatar">{s.name.charAt(0)}</div><div className="td-info"><span className="name">{s.name}</span></div></td>
                      <td><span style={{fontSize:'11px',color:'var(--primary)',fontWeight:700}}>{s.grNumber}</span></td>
                      <td>{s.rollNo}</td>
                      <td><div style={{display:'flex',gap:'6px',flexWrap:'wrap'}}>
                        <button className={`btn btn-sm ${currentStatus==='PRESENT'?'btn-success':'btn-secondary'}`} onClick={()=>handleBulkAttendance(s.id,'PRESENT')}><i className="fas fa-check"></i> Present</button>
                        <button className={`btn btn-sm ${currentStatus==='LATE'?'btn-warning':'btn-secondary'}`} onClick={()=>handleBulkAttendance(s.id,'LATE')}><i className="fas fa-clock"></i> Late</button>
                        <button className={`btn btn-sm ${currentStatus==='ABSENT'?'btn-danger':'btn-secondary'}`} onClick={()=>handleBulkAttendance(s.id,'ABSENT')}><i className="fas fa-times"></i> Absent</button>
                        {currentStatus && <span className="badge badge-secondary">✅ Marked</span>}
                      </div></td>
                    </tr>
                  );
                })}</tbody>
                </table>
              </div>
            </div>
          )}

          {activeTab==='gps-otp' && (
            <div>
              <div className="card animate-fadeIn" style={{textAlign:'center',padding:'40px',marginBottom:'24px'}}>
                <div className="card-header" style={{justifyContent:'center'}}><h3 className="card-title"><i className="fas fa-map-marker-alt"></i> GPS + OTP Attendance Session</h3></div>
                <div style={{display:'flex',gap:'12px',justifyContent:'center',marginBottom:'24px',flexWrap:'wrap'}}>
                  <select className="input" style={{width:'auto',minWidth:'160px'}} value={selectedClass} onChange={e=>setSelectedClass(e.target.value)}>{(DS.getClasses() || []).map(c=><option key={c.id} value={c.id}>{c.name}</option>)}</select>
                  <select className="input" style={{width:'auto',minWidth:'200px'}} value={selectedSubject} onChange={e=>setSelectedSubject(e.target.value)}>{(DS.getSubjects() || []).map(s=><option key={s.id} value={s.id}>{s.name}</option>)}</select>
                </div>
                {!sessionActive && (
                  <button className="btn btn-primary btn-lg" onClick={startSession} disabled={gpsLoading} style={{minWidth:'260px',padding:'14px 32px',fontSize:'16px'}}>
                    {gpsLoading ? <><i className="fas fa-circle-notch fa-spin"></i> Getting GPS...</> : <><i className="fas fa-play"></i> Start GPS + OTP Session</>}
                  </button>
                )}
                {sessionActive && currentSession && (
                  <div style={{marginTop:'24px'}}>
                    <div style={{padding:'24px',background:'var(--bg-primary)',borderRadius:'16px',border:'2px solid var(--primary)',marginBottom:'20px'}}>
                      <div style={{fontSize:'12px',textTransform:'uppercase',letterSpacing:'1px',color:'var(--text-light)',marginBottom:'12px'}}>One-Time Passcode</div>
                      <div className="otp-display">{currentSession.otp}</div>
                      <div className="otp-timer"><i className="fas fa-clock"></i> Expires in {Math.floor(otpTimer/60)}:{(otpTimer%60).toString().padStart(2,'0')}</div>
                    </div>
                    {teacherLocation && (
                      <div className="gps-status valid" style={{justifyContent:'center',marginBottom:'16px'}}>
                        <i className="fas fa-satellite"></i> GPS Locked · Lat: {teacherLocation.lat.toFixed(4)} · Lng: {teacherLocation.lng.toFixed(4)} · Accuracy: {Math.round(teacherLocation.accuracy)}m
                      </div>
                    )}
                    <div style={{display:'flex',gap:'8px',justifyContent:'center',flexWrap:'wrap'}}>
                      <span className="badge badge-success" style={{padding:'6px 14px',fontSize:'12px'}}><i className="fas fa-broadcast-tower"></i> Broadcasting</span>
                      <span className="badge badge-info" style={{padding:'6px 14px',fontSize:'12px'}}><i className="fas fa-users"></i> {DS.getClassById(selectedClass)?.name}</span>
                      <span className="badge badge-primary" style={{padding:'6px 14px',fontSize:'12px'}}><i className="fas fa-book"></i> {DS.getSubjectById(selectedSubject)?.name}</span>
                      <span className="badge badge-warning" style={{padding:'6px 14px',fontSize:'12px'}}><i className="fas fa-ruler"></i> Radius: {settings.geofenceRadius || 100}m</span>
                    </div>
                    <p style={{color:'var(--text-secondary)',fontSize:'14px',marginTop:'16px'}}><i className="fas fa-info-circle" style={{color:'var(--primary)'}}></i> Students must be within {settings.geofenceRadius || 100} meters and enter this OTP to mark attendance.</p>
                  </div>
                )}
              </div>
              <div className="card animate-fadeIn">
                <div className="card-header"><h3 className="card-title"><i className="fas fa-history"></i> Recent Sessions</h3></div>
                <div className="table-container">
                  <table><thead><tr><th>Session ID</th><th>Class</th><th>Subject</th><th>OTP</th><th>Started</th><th>Status</th></tr></thead>
                  <tbody>{(DS.getAttendanceSessions() || []).slice(-5).reverse().map((s,i)=> (
                    <tr key={i}><td>#{s.id.slice(-6)}</td><td>{DS.getClassById(s.classId)?.name}</td><td>{DS.getSubjectById(s.subjectId)?.name}</td>
                    <td><span style={{fontWeight:'800',letterSpacing:'2px'}}>{s.otp}</span></td>
                    <td>{new Date(s.createdAt).toLocaleTimeString()}</td>
                    <td><span className={`badge ${s.status==='ACTIVE' && new Date(s.otpExpiresAt)>new Date()?'badge-success':'badge-secondary'}`}>{s.status==='ACTIVE' && new Date(s.otpExpiresAt)>new Date()?'🟢 Active':'🔴 Expired'}</span></td></tr>
                  ))}</tbody>
                  </table>
                </div>
              </div>
            </div>
          )}

          {activeTab==='students' && (
            <div>
              <div className="grid-2">
                <div className="card animate-fadeIn">
                  <div className="card-header"><h3 className="card-title"><i className="fas fa-user-plus"></i> Add New Student</h3></div>
                  <div className="form-group"><label className="form-label">Full Name *</label><input className="input" placeholder="Enter student full name" value={newStudent.name} onChange={e=>setNewStudent({...newStudent,name:e.target.value})} /></div>
                  <div className="form-group"><label className="form-label">Phone Number *</label><input className="input" placeholder="Enter phone number" value={newStudent.phone} onChange={e=>setNewStudent({...newStudent,phone:e.target.value})} /></div>
                  <div className="grid-2">
                    <div className="form-group"><label className="form-label">Gender</label><select className="input" value={newStudent.gender} onChange={e=>setNewStudent({...newStudent,gender:e.target.value})}><option>Male</option><option>Female</option><option>Other</option></select></div>
                    <div className="form-group"><label className="form-label">Class *</label><select className="input" value={newStudent.classId} onChange={e=>setNewStudent({...newStudent,classId:e.target.value})}>{(DS.getClasses()||[]).map(c=><option key={c.id} value={c.id}>{c.name}</option>)}</select></div>
                  </div>
                  <div className="form-group"><label className="form-label">Department *</label><select className="input" value={newStudent.departmentId} onChange={e=>setNewStudent({...newStudent,departmentId:e.target.value})}>{(DS.getDepartments()||[]).map(d=><option key={d.id} value={d.id}>{d.name}</option>)}</select></div>
                  <div className="form-group"><label className="form-label">Admission Year</label><input type="number" className="input" value={newStudent.admissionYear} onChange={e=>setNewStudent({...newStudent,admissionYear:e.target.value})} /></div>
                  <div className="form-group"><label className="form-label">Guardian Name</label><input className="input" placeholder="Parent/Guardian name" value={newStudent.guardian} onChange={e=>setNewStudent({...newStudent,guardian:e.target.value})} /></div>
                  <div className="form-group"><label className="form-label">Guardian Phone</label><input className="input" placeholder="Parent/Guardian phone" value={newStudent.guardianPhone} onChange={e=>setNewStudent({...newStudent,guardianPhone:e.target.value})} /></div>
                  <div className="form-group"><label className="form-label">Address</label><input className="input" placeholder="Student address" value={newStudent.address} onChange={e=>setNewStudent({...newStudent,address:e.target.value})} /></div>
                  <button className="btn btn-primary btn-block btn-lg" onClick={handleAddStudent}><i className="fas fa-plus"></i> Add Student & Generate GR</button>
                </div>
                <div className="card animate-fadeIn">
                  <div className="card-header"><h3 className="card-title"><i className="fas fa-id-card"></i> Result</h3></div>
                  {addResult ? (
                    <div style={{textAlign:'center',padding:'20px'}}>
                      <div style={{width:'64px',height:'64px',borderRadius:'50%',background:'var(--success)',display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 16px',fontSize:'28px',color:'white'}}><i className="fas fa-check"></i></div>
                      <h3 style={{marginBottom:'8px'}}>Student Added Successfully!</h3>
                      <div style={{background:'var(--bg-primary)',borderRadius:'12px',padding:'16px',textAlign:'left',marginTop:'16px',border:'1px solid var(--border-color)'}}>
                        <div style={{marginBottom:'10px',display:'flex',justifyContent:'space-between'}}><span style={{color:'var(--text-light)',fontSize:'12px',textTransform:'uppercase'}}>Name</span><div style={{fontWeight:700}}>{addResult.student.name}</div></div>
                        <div style={{marginBottom:'10px',display:'flex',justifyContent:'space-between'}}><span style={{color:'var(--text-light)',fontSize:'12px',textTransform:'uppercase'}}>GR Number</span><div style={{fontWeight:700,color:'var(--primary)',fontSize:'18px'}}>{addResult.student.grNumber}</div></div>
                        <div style={{marginBottom:'10px',display:'flex',justifyContent:'space-between'}}><span style={{color:'var(--text-light)',fontSize:'12px',textTransform:'uppercase'}}>Email</span><div style={{fontWeight:700}}>{addResult.user.email}</div></div>
                        <div style={{display:'flex',justifyContent:'space-between'}}><span style={{color:'var(--text-light)',fontSize:'12px',textTransform:'uppercase'}}>Password</span><div style={{fontWeight:700,color:'var(--warning)'}}>{addResult.password}</div></div>
                      </div>
                      <p style={{fontSize:'13px',color:'var(--text-light)',marginTop:'12px'}}><i className="fas fa-info-circle"></i> Student can login with email and password: <strong>{addResult.password}</strong></p>
                    </div>
                  ) : (
                    <div style={{textAlign:'center',padding:'40px 20px'}}>
                      <i className="fas fa-user-graduate" style={{fontSize:'48px',color:'var(--text-light)',marginBottom:'16px',opacity:0.5}}></i>
                      <h4 style={{fontWeight:700,marginBottom:'6px'}}>No Student Added Yet</h4>
                      <p style={{color:'var(--text-secondary)',fontSize:'14px'}}>Fill the form and click "Add Student" to generate GR number automatically.</p>
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ===================== COMPLAINTS =====================
    function ComplaintsPage({ user, role, viewAs }) {
      const effectiveRole = viewAs || role;
      const [activeTab, setActiveTab] = useState('all');
      const [showFileModal, setShowFileModal] = useState(false);
      const [showDetailModal, setShowDetailModal] = useState(false);
      const [selectedComplaint, setSelectedComplaint] = useState(null);
      const [filterStatus, setFilterStatus] = useState('ALL');
      const [filterCategory, setFilterCategory] = useState('ALL');
      const [newComment, setNewComment] = useState('');
      const [newComplaint, setNewComplaint] = useState({ title: '', category: 'Academic', description: '', priority: 'MEDIUM', anonymous: false });
      const [, setTick] = useState(0);
      const categories = ['Academic', 'Infrastructure', 'Harassment', 'Administration', 'Other'];
      const priorities = ['LOW', 'MEDIUM', 'HIGH', 'CRITICAL'];
      const allComplaints = DS.getComplaints();
      const myComplaints = allComplaints.filter(c => c.filedBy === user.id);
      let filtered = activeTab === 'my' ? myComplaints : allComplaints;
      if (filterStatus !== 'ALL') filtered = filtered.filter(c => c.status === filterStatus);
      if (filterCategory !== 'ALL') filtered = filtered.filter(c => c.category === filterCategory);
      filtered = filtered.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

      const handleFileComplaint = () => {
        if (!newComplaint.title.trim()) { showToast('Title is required','error'); return; }
        if (!newComplaint.description.trim()) { showToast('Description is required','error'); return; }
        if (newComplaint.title.length > 200) { showToast('Title too long (max 200 chars)','error'); return; }
        if (newComplaint.description.length > 2000) { showToast('Description too long (max 2000 chars)','error'); return; }
        const complaint = { id: `comp-${Date.now()}`, title: newComplaint.title.trim(), category: newComplaint.category, description: newComplaint.description.trim(), priority: newComplaint.priority, filedBy: newComplaint.anonymous ? 'anonymous' : user.id, filedByName: newComplaint.anonymous ? 'Anonymous' : user.name, filedByRole: effectiveRole, against: '', status: 'PENDING', createdAt: new Date().toISOString(), updatedAt: new Date().toISOString(), comments: [], evidence: [] };
        DS.addComplaint(complaint);
        setShowFileModal(false);
        setNewComplaint({ title: '', category: 'Academic', description: '', priority: 'MEDIUM', anonymous: false });
        setTick(t => t + 1);
        showToast('Complaint filed successfully','success');
      };

      const handleUpdateStatus = (id, status) => { 
        DS.updateComplaint(id, { status, updatedAt: new Date().toISOString() }); 
        setTick(t => t + 1);
        showToast(`Status updated to ${status}`,'success'); 
        if (selectedComplaint && selectedComplaint.id === id) setSelectedComplaint(DS.getComplaintById(id)); 
      };

      const handleAddComment = () => {
        if (!selectedComplaint || !newComment.trim()) return;
        const comment = { by: user.name, text: newComment.trim(), time: new Date().toISOString() };
        const updatedComments = [...(selectedComplaint.comments || []), comment];
        DS.updateComplaint(selectedComplaint.id, { comments: updatedComments, updatedAt: new Date().toISOString() });
        setSelectedComplaint({ ...selectedComplaint, comments: updatedComments });
        setNewComment('');
        setTick(t => t + 1);
        showToast('Comment added','success');
      };

      const getStatusBadge = (status) => { const map = { 'PENDING': 'badge-warning', 'IN_PROGRESS': 'badge-info', 'RESOLVED': 'badge-success', 'ESCALATED': 'badge-danger' }; return map[status] || 'badge-secondary'; };

      return (
        <div>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'24px',flexWrap:'wrap',gap:'12px'}}>
            <div className="tabs" style={{margin:0}}><button className={`tab ${activeTab==='all'?'active':''}`} onClick={()=>setActiveTab('all')}>All Complaints</button><button className={`tab ${activeTab==='my'?'active':''}`} onClick={()=>setActiveTab('my')}>My Complaints</button></div>
            <button className="btn btn-primary" onClick={()=>setShowFileModal(true)}><i className="fas fa-plus"></i> File Complaint</button>
          </div>
          <div style={{display:'flex',gap:'12px',marginBottom:'24px',flexWrap:'wrap'}}>
            <select className="input" style={{width:'auto'}} value={filterStatus} onChange={e=>setFilterStatus(e.target.value)}><option value="ALL">All Status</option><option value="PENDING">Pending</option><option value="IN_PROGRESS">In Progress</option><option value="RESOLVED">Resolved</option><option value="ESCALATED">Escalated</option></select>
            <select className="input" style={{width:'auto'}} value={filterCategory} onChange={e=>setFilterCategory(e.target.value)}><option value="ALL">All Categories</option>{categories.map(c=><option key={c} value={c}>{c}</option>)}</select>
          </div>
          <div>
            {filtered.length > 0 ? filtered.map(c => (
              <div key={c.id} className="complaint-card animate-fadeIn" onClick={()=>{setSelectedComplaint(c);setShowDetailModal(true);}} style={{cursor:'pointer'}}>
                <div className="complaint-header"><div><h4 style={{fontSize:'16px',fontWeight:700,marginBottom:'4px'}}>{c.title}</h4><div style={{fontSize:'12px',color:'var(--text-light)'}}>#{c.id.slice(-6)} · {new Date(c.createdAt).toLocaleDateString()}</div></div><span className={`badge ${getStatusBadge(c.status)}`}>{c.status}</span></div>
                <div className="complaint-meta"><span className="badge badge-secondary">{c.category}</span><span className={`badge ${c.priority==='CRITICAL'?'badge-danger':c.priority==='HIGH'?'badge-warning':'badge-info'}`}>{c.priority}</span><span className="badge badge-dark"><i className="fas fa-user"></i> {c.filedByName}</span><span className="badge badge-secondary">{c.filedByRole}</span></div>
                <div className="complaint-body">{c.description.length > 150 ? c.description.substring(0,150)+'...' : c.description}</div>
                <div style={{fontSize:'12px',color:'var(--text-light)'}}><i className="fas fa-comments"></i> {c.comments?.length || 0} comments</div>
              </div>
            )) : <EmptyState icon="fa-check-circle" title="No complaints found" description={activeTab==='my' ? "You haven't filed any complaints yet." : "No complaints match your filters."} />}
          </div>
          {showFileModal && (
            <Modal isOpen={showFileModal} onClose={()=>setShowFileModal(false)} title="File New Complaint" footer={<><button className="btn btn-secondary" onClick={()=>setShowFileModal(false)}>Cancel</button><button className="btn btn-primary" onClick={handleFileComplaint}><i className="fas fa-paper-plane"></i> Submit</button></>}>
              <div className="form-group"><label className="form-label">Title *</label><input className="input" value={newComplaint.title} onChange={e=>setNewComplaint({...newComplaint,title:e.target.value})} placeholder="Brief title of your complaint" maxLength={200} /></div>
              <div className="grid-2"><div className="form-group"><label className="form-label">Category</label><select className="input" value={newComplaint.category} onChange={e=>setNewComplaint({...newComplaint,category:e.target.value})}>{categories.map(c=><option key={c}>{c}</option>)}</select></div><div className="form-group"><label className="form-label">Priority</label><select className="input" value={newComplaint.priority} onChange={e=>setNewComplaint({...newComplaint,priority:e.target.value})}>{priorities.map(p=><option key={p}>{p}</option>)}</select></div></div>
              <div className="form-group"><label className="form-label">Description *</label><textarea className="input" rows="4" value={newComplaint.description} onChange={e=>setNewComplaint({...newComplaint,description:e.target.value})} placeholder="Describe your complaint in detail..." maxLength={2000}></textarea></div>
              <label style={{display:'flex',alignItems:'center',gap:'8px',fontSize:'13px',cursor:'pointer'}}><input type="checkbox" checked={newComplaint.anonymous} onChange={e=>setNewComplaint({...newComplaint,anonymous:e.target.checked})} /> File anonymously</label>
            </Modal>
          )}
          {showDetailModal && selectedComplaint && (
            <Modal isOpen={showDetailModal} onClose={()=>setShowDetailModal(false)} title={`Complaint #${selectedComplaint.id.slice(-6)}`} footer={<button className="btn btn-secondary" onClick={()=>setShowDetailModal(false)}>Close</button>}>
              <div style={{marginBottom:'20px'}}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'12px'}}><h3 style={{fontSize:'18px',fontWeight:800}}>{selectedComplaint.title}</h3><span className={`badge ${getStatusBadge(selectedComplaint.status)}`}>{selectedComplaint.status}</span></div>
                <div style={{display:'flex',gap:'8px',flexWrap:'wrap',marginBottom:'16px'}}><span className="badge badge-secondary">{selectedComplaint.category}</span><span className={`badge ${selectedComplaint.priority==='CRITICAL'?'badge-danger':selectedComplaint.priority==='HIGH'?'badge-warning':'badge-info'}`}>{selectedComplaint.priority}</span><span className="badge badge-dark">By: {selectedComplaint.filedByName}</span><span className="badge badge-secondary">{new Date(selectedComplaint.createdAt).toLocaleString()}</span></div>
                <div style={{padding:'16px',background:'var(--bg-primary)',borderRadius:'12px',fontSize:'14px',lineHeight:'1.7',color:'var(--text-secondary)',marginBottom:'20px'}}>{selectedComplaint.description}</div>
                {effectiveRole === 'ADMIN' && (
                  <div style={{display:'flex',gap:'8px',marginBottom:'24px',flexWrap:'wrap'}}>
                    <span style={{fontSize:'12px',fontWeight:600,color:'var(--text-light)',textTransform:'uppercase',alignSelf:'center'}}>Update Status:</span>
                    {['PENDING','IN_PROGRESS','RESOLVED','ESCALATED'].map(st => (
                      <button key={st} className={`btn btn-sm ${selectedComplaint.status===st?'btn-primary':'btn-secondary'}`} onClick={()=>handleUpdateStatus(selectedComplaint.id, st)}>{st.replace('_',' ')}</button>
                    ))}
                  </div>
                )}
                <h4 style={{fontSize:'14px',fontWeight:700,marginBottom:'12px'}}><i className="fas fa-comments"></i> Comments ({selectedComplaint.comments?.length || 0})</h4>
                <div style={{maxHeight:'200px',overflowY:'auto',marginBottom:'16px'}}>
                  {(selectedComplaint.comments || []).length === 0 && <p style={{color:'var(--text-light)',fontSize:'13px'}}>No comments yet.</p>}
                  {(selectedComplaint.comments || []).map((com, idx) => (
                    <div key={idx} style={{padding:'10px 0',borderBottom:'1px solid var(--border-light)'}}>
                      <div style={{display:'flex',justifyContent:'space-between',marginBottom:'4px'}}>
                        <span style={{fontWeight:700,fontSize:'13px'}}>{com.by}</span>
                        <span style={{fontSize:'11px',color:'var(--text-light)'}}>{new Date(com.time).toLocaleString()}</span>
                      </div>
                      <p style={{fontSize:'13px',color:'var(--text-secondary)'}}>{com.text}</p>
                    </div>
                  ))}
                </div>
                <div style={{display:'flex',gap:'8px'}}>
                  <input className="input" placeholder="Add a comment..." value={newComment} onChange={e=>setNewComment(e.target.value)} onKeyDown={e=>e.key==='Enter'&&handleAddComment()} />
                  <button className="btn btn-primary" onClick={handleAddComment}><i className="fas fa-paper-plane"></i></button>
                </div>
              </div>
            </Modal>
          )}
        </div>
      );
    }

    // ===================== TIMETABLE =====================
    function TimetablePage({ user, role, viewAs }) {
      const effectiveRole = viewAs || role;
      const [selectedClass, setSelectedClass] = useState('cls1');
      const [selectedDay, setSelectedDay] = useState('Monday');
      const [showAddModal, setShowAddModal] = useState(false);
      const [newEntry, setNewEntry] = useState({ day:'Monday', subjectId:'', teacherId:'', time:'', room:'', type:'LECTURE' });
      const days = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
      const entries = DS.getTimetable(selectedClass, selectedDay) || [];
      const canEdit = effectiveRole==='ADMIN' || effectiveRole==='TEACHER';

      const addEntry = () => {
        if (!newEntry.subjectId || !newEntry.teacherId || !newEntry.time || !newEntry.room) { showToast('Please fill all fields','error','Validation Error'); return; }
        if (!/^\d{1,2}:\d{2}-\d{1,2}:\d{2}$/.test(newEntry.time)) { showToast('Time must be in format HH:MM-HH:MM','error','Invalid Time'); return; }
        DS.addTimetableEntry({ classId:selectedClass, ...newEntry });
        setShowAddModal(false); setNewEntry({ day:'Monday', subjectId:'', teacherId:'', time:'', room:'', type:'LECTURE' });
        showToast('Timetable entry added successfully','success');
      };

      const deleteEntry = (id) => { if (confirm('Are you sure you want to delete this timetable entry?')) { DS.deleteTimetableEntry(id); showToast('Entry deleted','info'); } };

      return (
        <div>
          <div style={{display:'flex',gap:'12px',flexWrap:'wrap',marginBottom:'24px',alignItems:'center'}}>
            <select className="input" style={{width:'auto',minWidth:'160px'}} value={selectedClass} onChange={e=>setSelectedClass(e.target.value)}>
              {(DS.getClasses() || []).map(c=><option key={c.id} value={c.id}>{c.name} - {(DS.getDepartmentById(c.department)?.code) || c.department}</option>)}
            </select>
            <div className="tabs" style={{margin:0}}>
              {days.map(d=><button key={d} className={`tab ${selectedDay===d?'active':''}`} onClick={()=>setSelectedDay(d)}>{d.slice(0,3)}</button>)}
            </div>
            <div style={{marginLeft:'auto',display:'flex',gap:'8px'}}>
              <button className="btn btn-secondary btn-sm" onClick={()=>printSchedule(selectedClass)}><i className="fas fa-print"></i> Print Schedule</button>
              {canEdit && <button className="btn btn-primary btn-sm" onClick={()=>setShowAddModal(true)}><i className="fas fa-plus"></i> Add Entry</button>}
            </div>
          </div>
          <div className="card animate-fadeIn">
            <div className="card-header"><h3 className="card-title">{selectedDay} - {DS.getClasses().find(c=>c.id===selectedClass)?.name}</h3></div>
            {entries && entries.length>0 ? (
              <div className="table-container">
                <table><thead><tr><th>Time</th><th>Subject</th><th>Teacher</th><th>Room</th><th>Type</th>{canEdit&&<th>Action</th>}</tr></thead>
                <tbody>{entries.sort((a,b)=>a.time.localeCompare(b.time)).map(e=> {
                  const sub = DS.getSubjectById(e.subjectId);
                  const teacher = DS.getTeachers().find(t=>t.id===e.teacherId);
                  return (
                    <tr key={e.id}><td><span className="badge badge-primary">{e.time}</span></td>
                    <td><strong>{sub?.name || 'Unknown'}</strong><div style={{fontSize:'12px',color:'var(--text-light)'}}>{sub?.code}</div></td>
                    <td>{teacher?.name || 'N/A'}</td><td>{e.room}</td>
                    <td><span className={`badge ${e.type==='LAB'?'badge-warning':'badge-info'}`}>{e.type}</span></td>
                    {canEdit&&<td><button className="btn btn-sm btn-danger" onClick={()=>deleteEntry(e.id)}><i className="fas fa-trash"></i></button></td>}</tr>
                  );
                })}</tbody>
                </table>
              </div>
            ) : <EmptyState icon="fa-calendar-times" title="No classes" description={`No timetable entries for ${selectedDay}`} />}
          </div>
          {showAddModal && (
            <Modal isOpen={showAddModal} onClose={()=>setShowAddModal(false)} title="Add Timetable Entry" footer={<><button className="btn btn-secondary" onClick={()=>setShowAddModal(false)}>Cancel</button><button className="btn btn-primary" onClick={addEntry}><i className="fas fa-plus"></i> Add Entry</button></>}>
              <div className="form-group"><label className="form-label">Day</label><select className="input" value={newEntry.day} onChange={e=>setNewEntry({...newEntry,day:e.target.value})}>{days.map(d=><option key={d}>{d}</option>)}</select></div>
              <div className="form-group"><label className="form-label">Subject</label><select className="input" value={newEntry.subjectId} onChange={e=>setNewEntry({...newEntry,subjectId:e.target.value})}><option value="">Select Subject</option>{(DS.getSubjects() || []).map(s=><option key={s.id} value={s.id}>{s.name}</option>)}</select></div>
              <div className="form-group"><label className="form-label">Teacher</label><select className="input" value={newEntry.teacherId} onChange={e=>setNewEntry({...newEntry,teacherId:e.target.value})}><option value="">Select Teacher</option>{(DS.getTeachers() || []).map(t=><option key={t.id} value={t.id}>{t.name}</option>)}</select></div>
              <div className="form-group"><label className="form-label">Time Slot</label><input className="input" placeholder="e.g. 09:00-10:30" value={newEntry.time} onChange={e=>setNewEntry({...newEntry,time:e.target.value})} /></div>
              <div className="form-group"><label className="form-label">Room</label><input className="input" placeholder="e.g. L-301" value={newEntry.room} onChange={e=>setNewEntry({...newEntry,room:e.target.value})} /></div>
              <div className="form-group"><label className="form-label">Type</label><select className="input" value={newEntry.type} onChange={e=>setNewEntry({...newEntry,type:e.target.value})}><option>LECTURE</option><option>LAB</option><option>TUTORIAL</option></select></div>
            </Modal>
          )}
        </div>
      );
    }

    // ===================== CURRICULUM =====================
    

function CurriculumPage({ user, role, viewAs }) {
      const effectiveRole = viewAs || role;
      const [selectedSubject, setSelectedSubject] = useState('sub1');
      const [expandedUnit, setExpandedUnit] = useState(null);
      const [showAddModal, setShowAddModal] = useState(false);
      const [selectedTopicNotes, setSelectedTopicNotes] = useState(null);
      const [newUnit, setNewUnit] = useState(1);
      const [newTitle, setNewTitle] = useState('');
      const [newDuration, setNewDuration] = useState('2 Hours');
      const [newDesc, setNewDesc] = useState('');
      const [newNotes, setNewNotes] = useState('');
      const [newResources, setNewResources] = useState(3);
      const [, setTick] = useState(0);

      const subjects = DS.getSubjects();
      const curriculum = DS.getCurriculum(selectedSubject) || [];
      const grouped = curriculum.reduce((acc,item)=>{ if(!acc[item.unit]) acc[item.unit]=[]; acc[item.unit].push(item); return acc; },{});

      const canEdit = effectiveRole === 'TEACHER' || effectiveRole === 'ADMIN';

      const handleAddTopic = () => {
        if (!newTitle.trim()) { showToast('Please enter topic title', 'error'); return; }
        const item = {
          id: 'topic_' + Date.now(),
          unit: Number(newUnit) || 1,
          order: (grouped[newUnit]?.length || 0) + 1,
          title: newTitle,
          duration: newDuration,
          description: newDesc || 'Core syllabus topic with reading materials and practice sets.',
          notes: newNotes || 'Comprehensive topic notes covering principles, algorithms, and practical exam review questions.',
          resources: Number(newResources) || 3,
          materials: [
            { title: `${newTitle} - Lecture Slides.pdf`, type: 'PDF', size: '2.5 MB' },
            { title: `${newTitle} - Solved Exercises.pdf`, type: 'PDF', size: '1.4 MB' }
          ],
          completed: false
        };
        DS.addCurriculumTopic(selectedSubject, item);
        setShowAddModal(false);
        setNewTitle('');
        setNewDesc('');
        setTick(t => t + 1);
        showToast('Curriculum topic added successfully!', 'success');
      };

      const toggleTopicComplete = (topicId, currState) => {
        DS.updateCurriculumTopic(selectedSubject, topicId, { completed: !currState });
        setTick(t => t + 1);
        showToast(!currState ? 'Topic marked completed!' : 'Topic marked pending', 'info');
      };

      return (
        <div>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:'12px',marginBottom:'24px'}}>
            <div style={{display:'flex',gap:'12px',flexWrap:'wrap'}}>
              {subjects.map(s=> (
                <button key={s.id} className={`btn btn-${selectedSubject===s.id?'primary':'secondary'} btn-sm`} onClick={()=>{setSelectedSubject(s.id); setExpandedUnit(null);}}>
                  {s.name} <span className="badge badge-secondary" style={{marginLeft:'6px'}}>{s.code}</span>
                </button>
              ))}
            </div>
            {canEdit && (
              <button className="btn btn-primary btn-sm" onClick={()=>setShowAddModal(true)}>
                <i className="fas fa-plus"></i> Add Topic / Unit
              </button>
            )}
          </div>

          <div className="grid-2">
            {Object.keys(grouped).length === 0 ? (
              <div className="card" style={{gridColumn:'1 / -1',textAlign:'center',padding:'40px'}}>
                <i className="fas fa-book-open" style={{fontSize:40,color:'var(--text-light)',marginBottom:12}}></i>
                <h3>No curriculum topics found for this subject</h3>
                <p style={{color:'var(--text-secondary)'}}>Click "Add Topic / Unit" to populate syllabus topics.</p>
              </div>
            ) : Object.entries(grouped).map(([unit,items])=> {
              const completedCount = items.filter(x => x.completed).length;
              const unitPct = items.length ? Math.round((completedCount / items.length) * 100) : 0;
              return (
                <div key={unit} className="card animate-fadeIn">
                  <div className="card-header" style={{cursor:'pointer'}} onClick={()=>setExpandedUnit(expandedUnit===unit?null:unit)}>
                    <div>
                      <h3 className="card-title"><i className="fas fa-layer-group"></i> Unit {unit}</h3>
                      <div style={{fontSize:'12px',color:'var(--text-light)',marginTop:'4px'}}>
                        {completedCount} of {items.length} topics covered ({unitPct}%)
                      </div>
                    </div>
                    <div style={{display:'flex',alignItems:'center',gap:'10px'}}>
                      <span className={`badge ${unitPct===100?'badge-success':'badge-primary'}`}>{unitPct}% Done</span>
                      <i className={`fas fa-chevron-${expandedUnit===unit?'up':'down'}`} style={{color:'var(--text-light)'}}></i>
                    </div>
                  </div>
                  <div style={{display:expandedUnit===unit||expandedUnit===null?'block':'none'}}>
                    {items.map((c,i)=> (
                      <div key={c.id || i} style={{padding:'14px 0',borderBottom:i<items.length-1?'1px solid var(--border-light)':'none'}}>
                        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:'6px',gap:'10px'}}>
                          <div style={{display:'flex',alignItems:'center',gap:'10px'}}>
                            <input 
                              type="checkbox" 
                              checked={!!c.completed} 
                              onChange={()=>toggleTopicComplete(c.id, !!c.completed)}
                              style={{width:18,height:18,cursor:'pointer',accentColor:'var(--primary)'}}
                              title="Toggle Topic Completion"
                            />
                            <span style={{fontWeight:700,fontSize:'14px',textDecoration:c.completed?'line-through':'none',color:c.completed?'var(--text-light)':'var(--text-primary)'}}>
                              {c.order || (i+1)}. {c.title}
                            </span>
                          </div>
                          <span className="badge badge-secondary">{c.duration}</span>
                        </div>
                        <p style={{color:'var(--text-secondary)',fontSize:'13px',marginBottom:'10px',marginLeft:'28px'}}>{c.description}</p>
                        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginTop:'10px',marginLeft:'28px',flexWrap:'wrap',gap:'8px'}}>
                          <div style={{display:'flex',alignItems:'center',gap:'12px',flex:1,minWidth:180}}>
                            <div className="progress-bar" style={{flex:1}}>
                              <div className="fill primary" style={{width: c.completed ? '100%' : '35%'}}></div>
                            </div>
                            <span style={{fontSize:'12px',color:'var(--text-light)',fontWeight:600}}><i className="fas fa-paperclip"></i> {c.resources || 3} resources</span>
                          </div>
                          <div style={{display:'flex',gap:'6px'}}>
                            <button className="btn btn-sm btn-secondary" onClick={()=>setSelectedTopicNotes(c)} title="View and download complete lecture notes">
                              <i className="fas fa-book-open"></i> Access Study Notes
                            </button>
                            <button className="btn btn-sm btn-primary" onClick={()=>printCurriculumNotes(c, subjects.find(s=>s.id===selectedSubject)?.name)} title="Print formatted study notes">
                              <i className="fas fa-print"></i> Print
                            </button>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              );
            })}
          </div>

          {showAddModal && (
            <Modal isOpen={showAddModal} onClose={()=>setShowAddModal(false)} title="Add Syllabus Topic / Unit"
              footer={<>
                <button className="btn btn-secondary" onClick={()=>setShowAddModal(false)}>Cancel</button>
                <button className="btn btn-primary" onClick={handleAddTopic}>Save Topic</button>
              </>}>
              <div className="form-group">
                <label className="form-label">Subject</label>
                <input className="input" disabled value={subjects.find(s=>s.id===selectedSubject)?.name || selectedSubject} />
              </div>
              <div className="grid-2">
                <div className="form-group">
                  <label className="form-label">Unit Number</label>
                  <input className="input" type="number" min="1" max="10" value={newUnit} onChange={e=>setNewUnit(e.target.value)} />
                </div>
                <div className="form-group">
                  <label className="form-label">Estimated Duration</label>
                  <input className="input" value={newDuration} onChange={e=>setNewDuration(e.target.value)} placeholder="e.g. 2 Hours, 3 Weeks" />
                </div>
              </div>
              <div className="form-group">
                <label className="form-label">Topic Title</label>
                <input className="input" value={newTitle} onChange={e=>setNewTitle(e.target.value)} placeholder="e.g. Binary Search Trees & AVL Balancing" />
              </div>
              <div className="form-group">
                <label className="form-label">Topic Summary & Learning Objectives</label>
                <textarea className="input" style={{minHeight:80}} value={newDesc} onChange={e=>setNewDesc(e.target.value)} placeholder="Key concepts, references, and expected outcomes..." />
              </div>
              <div className="form-group">
                <label className="form-label">Attached Resources / Handouts Count</label>
                <input className="input" type="number" min="0" value={newResources} onChange={e=>setNewResources(e.target.value)} />
              </div>
              <div className="form-group">
                <label className="form-label">Full Lecture Notes & Key Theoretical Concepts</label>
                <textarea className="input" style={{minHeight:110}} value={newNotes} onChange={e=>setNewNotes(e.target.value)} placeholder="Provide full chapter study notes, formulas, step-by-step algorithms, or lecture handout text..." />
              </div>
            </Modal>
          )}

          {/* Study Notes & Learning Material Viewer Modal */}
          {selectedTopicNotes && (
            <Modal isOpen={!!selectedTopicNotes} onClose={()=>setSelectedTopicNotes(null)} title={`Study Material · ${selectedTopicNotes.title}`} maxWidth="750px"
              footer={<>
                <button className="btn btn-secondary" onClick={()=>{
                  const blob = new Blob([
                    `${selectedTopicNotes.title}\nUnit ${selectedTopicNotes.unit} · ${subjects.find(s=>s.id===selectedSubject)?.name}\n\n` +
                    `DESCRIPTION:\n${selectedTopicNotes.description}\n\n` +
                    `LECTURE NOTES:\n${selectedTopicNotes.notes || 'Core concepts, algorithms, and practical applications.'}\n\n` +
                    `---\nGenerated by EDUTrack Pro Digital Campus ERP`
                  ], { type: 'text/plain;charset=utf-8' });
                  const url = URL.createObjectURL(blob);
                  const a = document.createElement('a');
                  a.href = url;
                  a.download = `${selectedTopicNotes.title.replace(/[^a-z0-9]/gi, '_')}_notes.txt`;
                  document.body.appendChild(a);
                  a.click();
                  document.body.removeChild(a);
                  showToast('Study notes text file downloaded!', 'success');
                }}>
                  <i className="fas fa-file-download"></i> Download Notes (.txt)
                </button>
                <button className="btn btn-primary" onClick={()=>printCurriculumNotes(selectedTopicNotes, subjects.find(s=>s.id===selectedSubject)?.name)}>
                  <i className="fas fa-print"></i> Print Official Notes
                </button>
                <button className="btn btn-secondary" onClick={()=>setSelectedTopicNotes(null)}>Close</button>
              </>}>
              <div style={{lineHeight:1.6}}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14,paddingBottom:10,borderBottom:'1px solid var(--border-light)'}}>
                  <div>
                    <span className="badge badge-primary">Unit {selectedTopicNotes.unit}</span>
                    <span className="badge badge-secondary" style={{marginLeft:8}}>Est. {selectedTopicNotes.duration}</span>
                  </div>
                  <span className="badge badge-success"><i className="fas fa-check-circle"></i> Syllabus Verified</span>
                </div>

                <div style={{background:'var(--bg-primary)',padding:'14px 18px',borderRadius:10,marginBottom:16,border:'1px solid var(--border-color)'}}>
                  <h4 style={{margin:'0 0 6px 0',fontSize:14,color:'var(--primary)'}}><i className="fas fa-bullseye"></i> Learning Objectives</h4>
                  <p style={{margin:0,fontSize:13,color:'var(--text-secondary)'}}>{selectedTopicNotes.description || 'In-depth conceptual study notes, practical exercises, and system implementations.'}</p>
                </div>

                <div style={{marginBottom:18}}>
                  <h4 style={{margin:'0 0 8px 0',fontSize:15}}><i className="fas fa-file-alt"></i> Complete Lecture & Reference Notes</h4>
                  <div style={{background:'var(--bg-card)',padding:18,borderRadius:10,border:'1px solid var(--border-color)',fontSize:13.5,whiteSpace:'pre-wrap',color:'var(--text-primary)',maxHeight:300,overflowY:'auto'}}>
                    {selectedTopicNotes.notes || (
                      `1. Core Theoretical Foundations:\n• In-depth conceptual framework and formal definitions.\n• Architectural component breakdown and structural relationships.\n• Key terminology and standard nomenclature.\n\n2. Implementation Details & Practical Applications:\n• Production-grade architectural patterns and algorithm steps.\n• Complexity analysis: Time O(log n) vs Space O(1) trade-offs.\n• Common pitfalls, race conditions, and error mitigation strategies.\n\n3. Review & Examination Preparation:\n• Key questions frequently asked in university and semester examinations.\n• Numerical examples with verified step-by-step solutions.\n• Cross-referenced with standard department textbooks and IEEE papers.`
                    )}
                  </div>
                </div>

                <div>
                  <h4 style={{margin:'0 0 8px 0',fontSize:14}}><i className="fas fa-paperclip"></i> Attached Course Handouts & Slides</h4>
                  <div style={{display:'flex',flexDirection:'column',gap:8}}>
                    {(selectedTopicNotes.materials || [
                      { title: 'Lecture Slide Deck & Overview.pdf', type: 'PDF', size: '2.4 MB' },
                      { title: 'Practice Exercises & Answer Key.pdf', type: 'PDF', size: '1.8 MB' }
                    ]).map((m, mi) => (
                      <div key={mi} style={{display:'flex',justifyContent:'space-between',alignItems:'center',background:'var(--bg-primary)',padding:'10px 14px',borderRadius:8,fontSize:13}}>
                        <span><i className="fas fa-file-pdf" style={{color:'var(--danger)',marginRight:8}}></i> {m.title}</span>
                        <div style={{display:'flex',alignItems:'center',gap:10}}>
                          <span style={{fontSize:11,color:'var(--text-light)'}}>{m.size}</span>
                          <button className="btn btn-sm btn-secondary" onClick={()=>showToast(`Downloading ${m.title}...`, 'success')}>
                            <i className="fas fa-download"></i>
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            </Modal>
          )}
        </div>
      );
    }


function QuizPage({ user, role, viewAs }) {
      const effectiveRole = viewAs || role;
      const [activeTab, setActiveTab] = useState('available');
      const [selectedQuiz, setSelectedQuiz] = useState(null);
      const [answers, setAnswers] = useState({});
      const [submitted, setSubmitted] = useState(false);
      const [score, setScore] = useState(null);
      const [timeLeft, setTimeLeft] = useState(0);
      const [showBuilder, setShowBuilder] = useState(false);
      const [builderMode, setBuilderMode] = useState('AI');
      const [subjectId, setSubjectId] = useState(DS.getSubjects()[0]?.id || '');
      const [topic, setTopic] = useState('');
      const [materialTitle, setMaterialTitle] = useState('');
      const [materialText, setMaterialText] = useState('');
      const [googleDocUrl, setGoogleDocUrl] = useState('');
      const [questionCount, setQuestionCount] = useState(10);
      const [duration, setDuration] = useState(15);
      const [difficulty, setDifficulty] = useState('Mixed');
      const [autoEnabled, setAutoEnabled] = useState(false);
      const [approvalRequired, setApprovalRequired] = useState(true);
      const [weeklyTime, setWeeklyTime] = useState('10:00');
      const [builderQuestions, setBuilderQuestions] = useState([]);
      const [manualText, setManualText] = useState('');
      const [busy, setBusy] = useState(false);
      const student = DS.getStudentByUserId(user.id) || (effectiveRole==='STUDENT' && role!=='STUDENT' ? DS.getStudents()[0] : null);
      const quizzes = DS.getQuizzes();

      const parseMaterialFile = async (file) => {
        if (!file) return;
        setBusy(true);
        try {
          const ext = file.name.toLowerCase().split('.').pop();
          let text='';
          if(ext==='txt' || ext==='csv' || ext==='md') text = await file.text();
          else if(ext==='pdf' && window.pdfjsLib) {
            const buf=await file.arrayBuffer(); const pdf=await pdfjsLib.getDocument({data:buf}).promise;
            const pages=[]; for(let i=1;i<=pdf.numPages;i++){const page=await pdf.getPage(i); const c=await page.getTextContent(); pages.push(c.items.map(x=>x.str).join(' '));}
            text=pages.join('\n');
          } else if(ext==='docx' && window.mammoth) {
            const r=await mammoth.extractRawText({arrayBuffer:await file.arrayBuffer()}); text=r.value;
          } else if(ext==='pptx') {
            text='PowerPoint text extraction is not enabled in this offline build. Paste the slide notes/text below or export the presentation as PDF.';
          } else text=await file.text();
          setMaterialTitle(file.name.replace(/\.[^.]+$/,'')); setMaterialText(text.slice(0,120000));
          showToast(`Material loaded: ${file.name}`,'success');
        } catch(e){ showToast('Unable to read material: '+e.message,'error'); }
        finally{setBusy(false);}
      };

      const tokenize = (text) => String(text||'').replace(/\r/g,' ').split(/[.!?\n]+/).map(x=>x.trim()).filter(x=>x.length>25).slice(0,80);
      const makeQuestions = (text, count, level, sid, source) => {
        const sentences=tokenize(text); const concepts=[]; const seen=new Set();
        sentences.forEach(sentence=>{
          const words=sentence.split(/\s+/).filter(w=>w.length>5).map(w=>w.replace(/[^A-Za-z0-9-]/g,''));
          const key=words.slice(0,3).join(' ').toLowerCase(); if(words.length>=4&&!seen.has(key)){seen.add(key);concepts.push({sentence,words});}
        });
        const fallback=[
          {text:'Which statement best represents the main concept covered in the supplied material?',options:['A peripheral detail','A core concept from the material','An unrelated example','None of these'],answer:1},
          {text:'Which approach is most appropriate when reviewing the supplied topic?',options:['Ignore the source material','Use evidence from the material','Guess without checking','Remove all examples'],answer:1},
          {text:'True or False: A good assessment question should be aligned with the learning material.',options:['True','False'],answer:0}
        ];
        const out=[];
        for(let i=0;i<count;i++){
          const c=concepts[i%Math.max(1,concepts.length)];
          if(!c){const f=fallback[i%fallback.length];out.push({id:`qb-${Date.now()}-${i}`,...f,marks:1,difficulty:level==='Mixed'?(i%3===0?'Easy':i%3===1?'Medium':'Hard'):level,topic:topic||'General',subjectId:sid,source});continue;}
          const phrase=c.words.slice(0,Math.min(6,c.words.length)).join(' ');
          const type=i%4===3?'TRUE_FALSE':'MCQ';
          if(type==='TRUE_FALSE') out.push({id:`qb-${Date.now()}-${i}`,text:`True or False: The following statement is supported by the supplied material: ${c.sentence}`,options:['True','False'],answer:0,marks:1,difficulty:level==='Mixed'?(i%2?'Medium':'Easy'):level,topic:topic||'General',subjectId:sid,source});
          else out.push({id:`qb-${Date.now()}-${i}`,text:`According to the supplied material, which option best matches this concept: ${phrase}?`,options:[c.words[0]||'Concept A',c.words[1]||'Concept B',c.words[2]||'Concept C','None of the above'],answer:0,marks:1,difficulty:level==='Mixed'?(i%3===0?'Easy':i%3===1?'Medium':'Hard'):level,topic:topic||'General',subjectId:sid,source});
        }
        return out;
      };

      const createGeneratedQuiz = (publish=true, sourceText=materialText) => {
        if(!subjectId){showToast('Select a subject','warning');return;}
        if(!sourceText.trim()){showToast('Upload or paste material first','warning');return;}
        const qs=makeQuestions(sourceText,Math.max(1,Math.min(50,questionCount)),difficulty,subjectId,materialTitle||'Teacher Material');
        DS.addQuestionBankItems(qs.map(q=>({...q,approved:!approvalRequired,createdBy:user.id,createdAt:new Date().toISOString()})));
        const quiz={id:`q-${Date.now()}`,title:`${topic||materialTitle||'Smart'} Quiz`,subjectId,questions:qs,marks:qs.reduce((a,q)=>a+q.marks,0),duration:Math.max(1,Number(duration)||15),difficulty,published:publish&&!approvalRequired,approvalRequired,createdBy:user.id,source:materialTitle||'Uploaded Material',createdAt:new Date().toISOString()};
        const all=DS.getCollection('quizzes'); all.push(quiz); DS.setCollection('quizzes',all);
        if(publish&&!approvalRequired) showToast('AI quiz generated and published','success'); else showToast('AI quiz generated and sent for teacher approval','success');
        setBuilderQuestions(qs); setShowBuilder(false); setActiveTab('manage');
      };

      const createManualQuiz = () => {
        if(!subjectId){showToast('Select a subject','warning');return;}
        const lines=manualText.split('\n').map(x=>x.trim()).filter(Boolean);
        const qs=lines.map((line,i)=>{const parts=line.split('|').map(x=>x.trim()); return {id:`qb-${Date.now()}-${i}`,text:parts[0],options:parts.slice(1,5).length?parts.slice(1,5):['True','False'],answer:Math.max(0,Math.min(3,parseInt(parts[5])||0)),marks:1,difficulty,topic:topic||'General',subjectId,source:'Manual'};});
        if(!qs.length){showToast('Add at least one question. Format: question | option A | option B | option C | option D | correctIndex','warning');return;}
        DS.addQuestionBankItems(qs.map(q=>({...q,approved:true,createdBy:user.id,createdAt:new Date().toISOString()})));
        const quiz={id:`q-${Date.now()}`,title:`${topic||'Manual'} Quiz`,subjectId,questions:qs,marks:qs.length,duration:Math.max(1,Number(duration)||15),difficulty,published:true,approvalRequired:false,createdBy:user.id,source:'Manual',createdAt:new Date().toISOString()};
        const all=DS.getCollection('quizzes');all.push(quiz);DS.setCollection('quizzes',all);showToast('Manual quiz published','success');setShowBuilder(false);setActiveTab('manage');
      };
