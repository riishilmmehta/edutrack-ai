    function FeesPage({ user, role, viewAs }) {
      const effectiveRole=viewAs||role;
      const [showPay,setShowPay]=useState(false), [showReceipt,setShowReceipt]=useState(null), [paymentStep,setPaymentStep]=useState(1);
      const [selectedHeads,setSelectedHeads]=useState([]), [method,setMethod]=useState('UPI'), [filterMethod,setFilterMethod]=useState('ALL'), [search,setSearch]=useState('');
      const student=DS.getStudentByUserId(user.id)||(effectiveRole==='STUDENT'&&role!=='STUDENT'?DS.getStudents()[0]:null);
      const feeStructure=student?DS.getFeeStructureByClass(student.classId,student.semester):null;
      const myTxs=student?DS.getFeeTransactions({studentId:student.id}):[]; const allTxs=DS.getFeeTransactions();
      const paymentMethods=[['UPI','fa-mobile-alt'],['CREDIT_CARD','fa-credit-card'],['DEBIT_CARD','fa-credit-card'],['ACH','fa-university'],['ECHECK','fa-receipt'],['PREPAID_CARD','fa-id-card'],['NEFT','fa-building-columns'],['CASH','fa-money-bill-wave']];
      const labels={UPI:'UPI',CREDIT_CARD:'Credit Card',DEBIT_CARD:'Debit Card',ACH:'ACH / Direct Debit',ECHECK:'eCheck',PREPAID_CARD:'Prepaid School Card',NEFT:'NEFT / Bank Transfer',CASH:'Cash'};
      const getLabel=m=>labels[m]||m;
      const getIcon=m=>paymentMethods.find(x=>x[0]===m)?.[1]||'fa-credit-card';
      const balances=student?DS.getFeeHeadBalances(student.id):[];
      const pendingTotal=balances.reduce((s,x)=>s+x.due,0); const totalPaid=balances.reduce((s,x)=>s+x.paid,0);
      const selectedTotal=balances.filter(x=>selectedHeads.includes(x.head)).reduce((s,x)=>s+x.due,0);
      const toggleHead=h=>setSelectedHeads(x=>x.includes(h)?x.filter(y=>y!==h):[...x,h]);
      const openPay=()=>{const dueHeads=balances.filter(x=>x.due>0).map(x=>x.head);setSelectedHeads(dueHeads);setPaymentStep(1);setShowPay(true);};
      const completePayment=()=>{
        if(!student||selectedTotal<=0){showToast('Select at least one outstanding fee head','warning');return;}
        const tx={id:`ft-${Date.now()}`,studentId:student.id,grNumber:student.grNumber,academicYear:feeStructure.academicYear,semester:student.semester,feeHead:selectedHeads.join(','),feeHeads:selectedHeads,amountPaid:selectedTotal,paymentMode:method,transactionId:`TXN${Date.now()}`,status:'SUCCESS',receiptNumber:DS.nextReceiptNumber(),paidAt:new Date().toISOString(),collectedBy:method==='CASH'?'u13':null,remarks:`Gateway-agnostic payment via ${getLabel(method)}`};
        DS.addFeeTransaction(tx); setShowPay(false); setShowReceipt(tx); showToast(`Payment successful · ₹${selectedTotal.toLocaleString('en-IN')}`,'success');fireConfetti();
        selectedHeads.forEach(h=>DS.addNotification({id:`n-${Date.now()}-${h}`,userId:student.userId,title:'Fee Payment Successful',message:`₹${DS.getFeeHeadBalances(student.id).find(x=>x.head===h)?.paid||0} payment recorded for ${h}. Receipt ${tx.receiptNumber}`,type:'SUCCESS',read:false,createdAt:new Date().toISOString()}));
      };
      const ReceiptModal=({tx})=><Modal isOpen={!!tx} onClose={()=>setShowReceipt(null)} title={`E-Receipt · ${tx.receiptNumber}`} footer={<div style={{display:'flex',gap:8}}><button className="btn btn-secondary" onClick={()=>printReceipt(tx,'STUDENT')}>Print / Save PDF</button><button className="btn btn-primary" onClick={()=>setShowReceipt(null)}>Close</button></div>}><div className="receipt-box"><div style={{textAlign:'center'}}><div style={{fontSize:24,fontWeight:800}}>{DS.getSettings().institutionName}</div><div style={{fontSize:12,color:'var(--text-secondary)'}}>EDUTrack Pro · Official E-Receipt</div></div><div className="grid-2" style={{marginTop:20}}><div><label className="form-label">Student</label><strong>{DS.getStudentById(tx.studentId)?.name}</strong></div><div><label className="form-label">GR Number</label><strong>{tx.grNumber}</strong></div><div><label className="form-label">Receipt</label><strong>{tx.receiptNumber}</strong></div><div><label className="form-label">Transaction</label><strong>{tx.transactionId}</strong></div><div><label className="form-label">Fee Heads</label><strong>{tx.feeHeads?.join(', ')||tx.feeHead}</strong></div><div><label className="form-label">Method</label><strong>{getLabel(tx.paymentMode)}</strong></div></div><div style={{textAlign:'center',marginTop:20,paddingTop:18,borderTop:'2px dashed var(--border-color)'}}><div style={{fontSize:12,color:'var(--text-light)'}}>Amount Paid</div><div style={{fontSize:34,fontWeight:900,color:'var(--primary)'}}>₹{Number(tx.amountPaid).toLocaleString('en-IN')}</div><span className="badge badge-success">PAID</span></div></div></Modal>;

      if(effectiveRole==='STUDENT') return <div><div className="stats-grid"><StatCard icon="fa-rupee-sign" iconClass="green" label="Total Paid" value={totalPaid} delay={1}/><StatCard icon="fa-exclamation-triangle" iconClass="red" label="Pending" value={pendingTotal} delay={2}/><StatCard icon="fa-receipt" iconClass="purple" label="Transactions" value={myTxs.length} delay={3}/><StatCard icon="fa-percentage" iconClass="blue" label="Payment Progress" value={feeStructure?Math.round(totalPaid/feeStructure.totalAmount*100):0} suffix="%" delay={4}/></div><div className="card animate-fadeIn" style={{marginBottom:20}}><div className="card-header"><h3 className="card-title"><i className="fas fa-file-invoice"/> Fee Card · Semester {student?.semester}</h3><span className={`badge ${pendingTotal?'badge-warning':'badge-success'}`}>{pendingTotal?'Payment Due':'Fully Paid'}</span></div>{balances.map(f=><div className="fee-select-row" key={f.head}><div><span className={`fee-head-badge ${f.mandatory?'mandatory':'optional'}`}>{f.head}</span><div style={{fontSize:11,color:'var(--text-light)',marginTop:5}}>{f.mandatory?'Mandatory':'Optional'} · Paid ₹{f.paid.toLocaleString('en-IN')} / ₹{f.amount.toLocaleString('en-IN')}</div></div><strong>{f.due>0?`₹${f.due.toLocaleString('en-IN')} due`:'✓ Paid'}</strong></div>)}<div style={{marginTop:18,padding:20,borderRadius:14,background:'var(--bg-primary)',display:'flex',justifyContent:'space-between',alignItems:'center',gap:16,flexWrap:'wrap'}}><div><div style={{fontSize:12,color:'var(--text-light)'}}>Outstanding Balance</div><div style={{fontSize:30,fontWeight:900}}>₹{pendingTotal.toLocaleString('en-IN')}</div></div></div></div><div className="card"><div className="card-header"><h3 className="card-title"><i className="fas fa-history"/> Payment History</h3></div><div className="table-container"><table><thead><tr><th>Date</th><th>Receipt</th><th>Fee Heads</th><th>Amount</th><th>Method</th><th>Status</th><th/></tr></thead><tbody>{myTxs.map(t=><tr key={t.id}><td>{new Date(t.paidAt).toLocaleDateString()}</td><td>{t.receiptNumber}</td><td>{t.feeHeads?.join(', ')||t.feeHead}</td><td><strong>₹{Number(t.amountPaid).toLocaleString('en-IN')}</strong></td><td>{getLabel(t.paymentMode)}</td><td><span className="badge badge-success">{t.status}</span></td><td><button className="btn btn-sm btn-secondary" onClick={()=>setShowReceipt(t)}><i className="fas fa-receipt"/></button></td></tr>)}</tbody></table></div></div>{showReceipt&&<ReceiptModal tx={showReceipt}/>}</div>;

      if(effectiveRole==='ACCOUNTANT'){
        const filtered=allTxs.filter(t=>(filterMethod==='ALL'||t.paymentMode===filterMethod)&&(!search||String(t.grNumber).toLowerCase().includes(search.toLowerCase())||String(DS.getStudentById(t.studentId)?.name||'').toLowerCase().includes(search.toLowerCase())));
        const total=filtered.filter(t=>t.status==='SUCCESS').reduce((a,t)=>a+Number(t.amountPaid||0),0);
        return <div><div className="stats-grid"><StatCard icon="fa-rupee-sign" iconClass="green" label="Collected" value={total} delay={1}/><StatCard icon="fa-receipt" iconClass="purple" label="Transactions" value={filtered.length} delay={2}/><StatCard icon="fa-users" iconClass="blue" label="Students" value={DS.getStudents().length} delay={3}/><StatCard icon="fa-exclamation-triangle" iconClass="red" label="Outstanding Students" value={DS.getStudents().filter(s=>DS.getTotalPending(s.id)>0).length} delay={4}/></div><div className="card" style={{marginBottom:20}}><div style={{display:'flex',gap:10,flexWrap:'wrap'}}><input className="input" style={{flex:1,minWidth:220}} placeholder="Search student or GR..." value={search} onChange={e=>setSearch(e.target.value)}/><select className="input" style={{width:'auto'}} value={filterMethod} onChange={e=>setFilterMethod(e.target.value)}><option value="ALL">All payment methods</option>{paymentMethods.map(([m])=><option key={m} value={m}>{getLabel(m)}</option>)}</select></div></div><div className="card"><div className="card-header"><h3 className="card-title"><i className="fas fa-file-invoice-dollar"/> Accountant Payment Ledger</h3></div><div className="table-container"><table><thead><tr><th>Date</th><th>Receipt</th><th>GR</th><th>Student</th><th>Fee Head</th><th>Amount</th><th>Method</th><th>Status</th><th/></tr></thead><tbody>{filtered.map(t=><tr key={t.id}><td>{new Date(t.paidAt).toLocaleDateString()}</td><td>{t.receiptNumber}</td><td><span className="badge badge-primary">{t.grNumber}</span></td><td>{DS.getStudentById(t.studentId)?.name||'Unknown'}</td><td>{t.feeHeads?.join(', ')||t.feeHead}</td><td><strong>₹{Number(t.amountPaid).toLocaleString('en-IN')}</strong></td><td><span className="badge badge-info"><i className={`fas ${getIcon(t.paymentMode)}`}/> {getLabel(t.paymentMode)}</span></td><td><span className={`badge ${t.status==='SUCCESS'?'badge-success':'badge-warning'}`}>{t.status}</span></td><td><button className="btn btn-sm btn-secondary" onClick={()=>setShowReceipt(t)}><i className="fas fa-receipt"/></button></td></tr>)}</tbody></table></div></div>{showReceipt&&<Modal isOpen={!!showReceipt} onClose={()=>setShowReceipt(null)} title={`Accountant Receipt · ${showReceipt.receiptNumber}`} footer={<><button className="btn btn-secondary" onClick={()=>printReceipt(showReceipt,'ADMIN / ACCOUNTANT')}>Print / Save PDF</button><button className="btn btn-primary" onClick={()=>setShowReceipt(null)}>Close</button></>}><div className="receipt-box"><h3 style={{textAlign:'center'}}>{DS.getSettings().institutionName}</h3><div className="grid-2" style={{marginTop:18}}><div><label className="form-label">Student</label><strong>{DS.getStudentById(showReceipt.studentId)?.name}</strong></div><div><label className="form-label">GR</label><strong>{showReceipt.grNumber}</strong></div><div><label className="form-label">Receipt</label><strong>{showReceipt.receiptNumber}</strong></div><div><label className="form-label">Transaction</label><strong>{showReceipt.transactionId}</strong></div><div><label className="form-label">Fee Heads</label><strong>{showReceipt.feeHeads?.join(', ')||showReceipt.feeHead}</strong></div><div><label className="form-label">Payment Method</label><strong>{getLabel(showReceipt.paymentMode)}</strong></div></div><div style={{textAlign:'center',marginTop:20,fontSize:32,fontWeight:900,color:'var(--primary)'}}>₹{Number(showReceipt.amountPaid).toLocaleString('en-IN')}</div></div></Modal>}</div>;
      }
      return <div className="card"><div className="card-header"><h3 className="card-title">Fee Structure Manager</h3></div><div className="table-container"><table><thead><tr><th>Class</th><th>Semester</th><th>Total</th><th>Due</th><th>Heads</th></tr></thead><tbody>{DS.getFeeStructures().map(f=><tr key={f.id}><td>{DS.getClassById(f.classId)?.name||f.classId}</td><td>{f.semester}</td><td>₹{Number(f.totalAmount).toLocaleString('en-IN')}</td><td>{f.dueDate}</td><td>{f.feeHeads.map(x=>x.head).join(', ')}</td></tr>)}</tbody></table></div></div>;
    }


    // ===================== TRANSPORT =====================
    function TransportPage({ user, role, viewAs }) {
      const effectiveRole = viewAs || role;
      const [activeTab, setActiveTab] = useState('my-transport');
      const [showAddRoute, setShowAddRoute] = useState(false);
      const [showAllocate, setShowAllocate] = useState(false);
      const [newRoute, setNewRoute] = useState({ routeName:'', routeCode:'', stops:[], totalDistanceKm:0, estimatedTimeMin:0 });
      const [selectedRoute, setSelectedRoute] = useState(null);
      const [selectedStudent, setSelectedStudent] = useState('');
      const [selectedStop, setSelectedStop] = useState(0);

      const student = DS.getStudentByUserId(user.id) || (effectiveRole==='STUDENT' && role!=='STUDENT' ? DS.getStudents()[0] : null);
      const routes = DS.getTransportRoutes();
      const allocations = DS.getTransportAllocations(student?.id);
      const allAllocations = DS.getTransportAllocations();

      if (effectiveRole === 'STUDENT') {
        const myAllocation = allocations.length > 0 ? allocations[0] : null;
        const myRoute = myAllocation ? DS.getTransportRouteById(myAllocation.routeId) : null;
        return (
          <div>
            <div className="stats-grid">
              <StatCard icon="fa-bus" iconClass="purple" label="Routes" value={routes.length} delay={1} />
              <StatCard icon="fa-user-check" iconClass="green" label="Allocated" value={allocations.length > 0 ? 1 : 0} delay={2} />
              <StatCard icon="fa-money-bill" iconClass="orange" label="Fee" value={myAllocation?.feeAmount || 0} suffix="" delay={3} />
            </div>
            <div className="card animate-fadeIn">
              <div className="card-header"><h3 className="card-title"><i className="fas fa-route"></i> My Transport</h3></div>
              {myRoute && myAllocation ? (
                <div>
                  <div style={{display:'flex',gap:'16px',marginBottom:'16px',flexWrap:'wrap'}}>
                    <div style={{padding:'12px 20px',background:'var(--bg-primary)',borderRadius:'12px'}}>
                      <div style={{fontSize:'12px',color:'var(--text-light)'}}>Route</div>
                      <div style={{fontWeight:700,fontSize:'16px'}}>{myRoute.routeName}</div>
                    </div>
                    <div style={{padding:'12px 20px',background:'var(--bg-primary)',borderRadius:'12px'}}>
                      <div style={{fontSize:'12px',color:'var(--text-light)'}}>Pickup</div>
                      <div style={{fontWeight:700,fontSize:'16px'}}>{myRoute.stops[myAllocation.pickupStopId]?.stopName || 'N/A'} @ {myRoute.stops[myAllocation.pickupStopId]?.pickupTime || 'N/A'}</div>
                    </div>
                    <div style={{padding:'12px 20px',background:'var(--bg-primary)',borderRadius:'12px'}}>
                      <div style={{fontSize:'12px',color:'var(--text-light)'}}>Fee</div>
                      <div style={{fontWeight:700,fontSize:'16px',color:'var(--warning)'}}>₹{myAllocation.feeAmount}</div>
                    </div>
                    <div style={{padding:'12px 20px',background:'var(--bg-primary)',borderRadius:'12px'}}>
                      <div style={{fontSize:'12px',color:'var(--text-light)'}}>Status</div>
                      <div><span className={`badge ${myAllocation.status === 'ACTIVE' ? 'badge-success' : 'badge-secondary'}`}>{myAllocation.status}</span></div>
                    </div>
                  </div>
                  <div className="route-timeline">
                    {myRoute.stops.map((stop, idx) => (
                      <div key={idx} className="route-stop" style={{paddingBottom: idx < myRoute.stops.length - 1 ? '20px' : '0'}}>
                        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                          <span style={{fontWeight:600}}>{stop.stopName}</span>
                          <span style={{fontSize:'12px',color:'var(--text-light)'}}>Pickup: {stop.pickupTime} · Drop: {stop.dropTime}</span>
                        </div>
                        {idx === myAllocation.pickupStopId && (
                          <span className="badge badge-primary" style={{marginTop:'4px'}}><i className="fas fa-map-pin"></i> Your Stop</span>
                        )}
                      </div>
                    ))}
                  </div>
                </div>
              ) : (
                <EmptyState icon="fa-bus" title="No Transport Allocated" description="You have not been assigned to any transport route yet." />
              )}
            </div>
          </div>
        );
      }

      // Admin/Teacher view
      return (
        <div>
          <div className="tabs">
            <button className={`tab ${activeTab==='routes'?'active':''}`} onClick={()=>setActiveTab('routes')}>Routes</button>
            <button className={`tab ${activeTab==='allocations'?'active':''}`} onClick={()=>setActiveTab('allocations')}>Allocations</button>
            <button className={`tab ${activeTab==='vehicles'?'active':''}`} onClick={()=>setActiveTab('vehicles')}>Vehicles & Drivers</button>
          </div>
          {activeTab === 'routes' && (
            <div>
              <div style={{display:'flex',justifyContent:'flex-end',marginBottom:'24px'}}>
                <button className="btn btn-primary" onClick={()=>setShowAddRoute(true)}><i className="fas fa-plus"></i> Add Route</button>
              </div>
              <div className="grid-2">
                {routes.map(r => (
                  <div key={r.id} className="card animate-fadeIn">
                    <div className="card-header"><h3 className="card-title">{r.routeName}</h3><span className="badge badge-primary">{r.routeCode}</span></div>
                    <div style={{fontSize:'13px',color:'var(--text-secondary)',marginBottom:'12px'}}>{r.totalDistanceKm} km · {r.estimatedTimeMin} min</div>
                    <div style={{maxHeight:'150px',overflowY:'auto'}}>
                      {r.stops.map((s,idx) => (
                        <div key={idx} style={{display:'flex',justifyContent:'space-between',padding:'6px 0',borderBottom:'1px solid var(--border-light)',fontSize:'13px'}}>
                          <span>{s.sequence}. {s.stopName}</span>
                          <span style={{color:'var(--text-light)'}}>{s.pickupTime} - {s.dropTime}</span>
                        </div>
                      ))}
                    </div>
                    <div style={{marginTop:'12px',display:'flex',gap:'8px'}}>
                      <button className="btn btn-sm btn-secondary"><i className="fas fa-edit"></i></button>
                      <button className="btn btn-sm btn-primary" onClick={()=>{setSelectedRoute(r.id); setShowAllocate(true);}}><i className="fas fa-user-plus"></i> Allocate</button>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}
          {activeTab === 'allocations' && (
            <div className="card animate-fadeIn">
              <div className="card-header"><h3 className="card-title">Student Allocations</h3></div>
              <div className="table-container">
                <table><thead><tr><th>GR</th><th>Student</th><th>Route</th><th>Pickup</th><th>Fee</th><th>Status</th></tr></thead>
                <tbody>{allAllocations.map(a => {
                  const st = DS.getStudentById(a.studentId);
                  const route = DS.getTransportRouteById(a.routeId);
                  return <tr key={a.id}>
                    <td><span className="badge badge-primary" style={{fontSize:'10px'}}>{a.grNumber}</span></td>
                    <td>{st?.name || 'Unknown'}</td>
                    <td>{route?.routeName || 'N/A'}</td>
                    <td>{route?.stops[a.pickupStopId]?.stopName || 'N/A'}</td>
                    <td>₹{a.feeAmount}</td>
                    <td><span className={`badge ${a.status === 'ACTIVE' ? 'badge-success' : 'badge-secondary'}`}>{a.status}</span></td>
                  </tr>;
                })}</tbody>
                </table>
              </div>
            </div>
          )}
          {activeTab === 'vehicles' && (
            <div className="grid-2">
              {(DS.getTransportVehicles() || []).map(v => {
                const driver = DS.getTransportDrivers().find(d => d.assignedVehicleId === v.id);
                return (
                  <div key={v.id} className="card animate-fadeIn">
                    <div className="card-header"><h3 className="card-title">{v.vehicleNumber}</h3><span className={`badge ${v.type === 'BUS' ? 'badge-primary' : 'badge-warning'}`}>{v.type}</span></div>
                    <div style={{fontSize:'13px',color:'var(--text-secondary)'}}>{v.model} ({v.year}) · Capacity: {v.capacity}</div>
                    {driver && <div style={{marginTop:'12px',padding:'12px',background:'var(--bg-primary)',borderRadius:'10px'}}>
                      <div style={{fontWeight:600}}><i className="fas fa-user"></i> {driver.name}</div>
                      <div style={{fontSize:'12px',color:'var(--text-light)'}}>{driver.phone} · License: {driver.licenseNumber}</div>
                    </div>}
                  </div>
                );
              })}
            </div>
          )}
          {showAddRoute && (
            <Modal isOpen={showAddRoute} onClose={()=>setShowAddRoute(false)} title="Add Transport Route" footer={<><button className="btn btn-secondary" onClick={()=>setShowAddRoute(false)}>Cancel</button><button className="btn btn-primary" onClick={()=>{showToast('Route added!','success'); setShowAddRoute(false);}}><i className="fas fa-plus"></i> Add Route</button></>}>
              <div className="form-group"><label className="form-label">Route Name</label><input className="input" placeholder="e.g. Andheri - Campus" value={newRoute.routeName} onChange={e=>setNewRoute({...newRoute, routeName:e.target.value})} /></div>
              <div className="form-group"><label className="form-label">Route Code</label><input className="input" placeholder="e.g. R01" value={newRoute.routeCode} onChange={e=>setNewRoute({...newRoute, routeCode:e.target.value})} /></div>
              <div className="form-group"><label className="form-label">Stops (comma separated: Name,Time)</label><input className="input" placeholder="e.g. Station,07:30; Mall,07:45" /></div>
              <div className="form-group"><label className="form-label">Total Distance (km)</label><input type="number" className="input" value={newRoute.totalDistanceKm} onChange={e=>setNewRoute({...newRoute, totalDistanceKm: parseFloat(e.target.value) || 0})} /></div>
              <div className="form-group"><label className="form-label">Est. Time (min)</label><input type="number" className="input" value={newRoute.estimatedTimeMin} onChange={e=>setNewRoute({...newRoute, estimatedTimeMin: parseInt(e.target.value) || 0})} /></div>
            </Modal>
          )}
          {showAllocate && (
            <Modal isOpen={showAllocate} onClose={()=>setShowAllocate(false)} title="Allocate Student to Route" footer={<><button className="btn btn-secondary" onClick={()=>setShowAllocate(false)}>Cancel</button><button className="btn btn-primary" onClick={()=>{showToast('Student allocated!','success'); setShowAllocate(false);}}><i className="fas fa-check"></i> Allocate</button></>}>
              <div className="form-group"><label className="form-label">Student</label><select className="input" value={selectedStudent} onChange={e=>setSelectedStudent(e.target.value)}><option value="">Select Student</option>{DS.getStudents().map(s=><option key={s.id} value={s.id}>{s.name} ({s.grNumber})</option>)}</select></div>
              <div className="form-group"><label className="form-label">Route</label><select className="input" value={selectedRoute || ''} onChange={e=>setSelectedRoute(e.target.value)}><option value="">Select Route</option>{routes.map(r=><option key={r.id} value={r.id}>{r.routeName}</option>)}</select></div>
              <div className="form-group"><label className="form-label">Pickup Stop</label><select className="input" value={selectedStop} onChange={e=>setSelectedStop(parseInt(e.target.value))}>{selectedRoute ? (DS.getTransportRouteById(selectedRoute)?.stops || []).map((s,idx)=><option key={idx} value={idx}>{s.stopName}</option>) : <option value="0">Select route first</option>}</select></div>
              <div className="form-group"><label className="form-label">Fee Amount (₹)</label><input type="number" className="input" placeholder="12000" /></div>
            </Modal>
          )}
        </div>
      );
    }

    // ===================== IMPORT CENTER =====================
    function ImportCenterPage({ user }) {
      const [preview,setPreview]=useState([]),[fileName,setFileName]=useState(''),[busy,setBusy]=useState(false),[logs,setLogs]=useState(DS.getImportLogs());
      const normalizeRow=row=>{const out={};Object.keys(row||{}).forEach(k=>{out[String(k).trim().toLowerCase().replace(/\s+/g,'')]=row[k];});return out;};
      const resolveClassId=v=>{const x=String(v||'').trim();if(!x)return 'cls1';const byId=DS.getClassById(x);if(byId)return byId.id;return DS.getClasses().find(c=>String(c.name).toLowerCase()===x.toLowerCase())?.id||'cls1';};
      const resolveDeptId=v=>{const x=String(v||'').trim();if(!x)return 'd1';const byId=DS.getDepartmentById(x);if(byId)return byId.id;return DS.getDepartments().find(d=>String(d.name).toLowerCase()===x.toLowerCase()||String(d.code).toLowerCase()===x.toLowerCase())?.id||'d1';};
      const parseFile=async(file)=>{if(!file)return;setBusy(true);setFileName(file.name);try{let rows=[];const ext=file.name.toLowerCase().split('.').pop();if(ext==='xlsx'||ext==='xls'){if(!window.XLSX)throw new Error('Excel parser not loaded');const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];rows=XLSX.utils.sheet_to_json(ws,{defval:''});}else{const text=await file.text();const lines=text.split(/\r?\n/).filter(Boolean);const headers=lines.shift().split(',').map(x=>x.trim());rows=lines.map(line=>{const vals=line.split(',');const o={};headers.forEach((h,i)=>o[h]=vals[i]||'');return o;});}setPreview(rows.map(normalizeRow).filter(r=>r.name&&r.phone));showToast('File parsed successfully','success');}catch(e){showToast('Import read error: '+e.message,'error');}finally{setBusy(false);}};
      const importAll=()=>{if(!preview.length){showToast('No valid rows','warning');return;}setBusy(true);setTimeout(()=>{let success=0,failed=0;const details=[];preview.forEach(row=>{try{const data={name:String(row.name).trim(),phone:String(row.phone).trim(),classId:resolveClassId(row.class),department:resolveDeptId(row.department),semester:Number(row.semester)||1,admissionYear:Number(row.admissionyear)||new Date().getFullYear(),sequence:row.roll||row.sequence||'',guardian:row.guardian||'',guardianPhone:row.guardianphone||'',gender:row.gender||'',dob:row.dob||'',address:row.address||''};const r=DS.createStudentAccount(data);success++;details.push({name:r.student.name,gr:r.student.grNumber,email:r.user.email,password:r.user.password});}catch(e){failed++;details.push({name:row.name,error:e.message});}});const log={id:`log-${Date.now()}`,total:preview.length,success,failed,timestamp:new Date().toISOString(),fileName};DS.addImportLog(log);setLogs(DS.getImportLogs());setPreview([]);setBusy(false);showToast(`Imported ${success} students · ${failed} failed`,success?'success':'error');fireConfetti();},700);};
      return <div><div className="card card-gradient animate-fadeIn" style={{marginBottom:20}}><h2>Bulk Student Import</h2><p style={{opacity:.82,marginTop:6}}>Excel/CSV → validation → automatic GR → institutional email → account creation.</p></div><div className="card"><div className="upload-zone"><i className="fas fa-file-excel" style={{fontSize:46,color:'var(--primary)'}}/><h3 style={{marginTop:12}}>Drop Excel/CSV or browse</h3><p style={{color:'var(--text-secondary)',fontSize:12,marginTop:6}}>Required: Name, Phone · Optional: Class, Department, Semester, AdmissionYear, Roll/Sequence, Guardian, GuardianPhone, Gender, DOB, Address</p><input type="file" accept=".csv,.xlsx,.xls" onChange={e=>parseFile(e.target.files[0])} style={{marginTop:14}}/></div>{preview.length>0&&<div style={{marginTop:20}}><div className="card-header"><h3 className="card-title">Preview · {preview.length} valid rows</h3><button className="btn btn-success" onClick={importAll} disabled={busy}>{busy?'Importing...':'Import All'}</button></div><div className="table-container" style={{maxHeight:320}}><table><thead><tr>{Object.keys(preview[0]).map(k=><th key={k}>{k}</th>)}</tr></thead><tbody>{preview.slice(0,20).map((r,i)=><tr key={i}>{Object.values(r).map((v,j)=><td key={j}>{String(v)}</td>)}</tr>)}</tbody></table></div></div>}</div><div className="card" style={{marginTop:20}}><div className="card-header"><h3 className="card-title">Import Logs</h3></div><div className="table-container"><table><thead><tr><th>Date</th><th>File</th><th>Total</th><th>Success</th><th>Failed</th></tr></thead><tbody>{logs.map(l=><tr key={l.id}><td>{new Date(l.timestamp).toLocaleString()}</td><td>{l.fileName}</td><td>{l.total}</td><td><span className="badge badge-success">{l.success}</span></td><td><span className="badge badge-danger">{l.failed}</span></td></tr>)}</tbody></table></div></div></div>;
    }


    // ===================== AI ASSISTANT =====================
    function AIAssistantPage({ user }) {
      const [query, setQuery] = useState('');
      const [messages, setMessages] = useState([{ role:'ai', content:"Hello! I'm your AI Academic Assistant. I can help you with:\n\n• SQL queries and database concepts\n• Normalization and ER modeling\n• Cloud computing fundamentals\n• Operating systems concepts\n• General academic guidance\n\nWhat would you like to learn about?" }]);
      const [loading, setLoading] = useState(false);
      const chatEndRef = useRef(null);

      useEffect(() => { chatEndRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [messages]);

      const askQuestion = () => {
        const trimmed = query.trim();
        if (!trimmed) { showToast('Please enter a question','warning'); return; }
        if (trimmed.length > 500) { showToast('Question too long (max 500 chars)','warning'); return; }
        setMessages(prev=>[...prev, {role:'user', content:trimmed}]);
        setLoading(true); setQuery('');
        setTimeout(() => {
          try {
            const res = DS.askAI(trimmed);
            setMessages(prev=>[...prev, {role:'ai', content:res.answer, sources:res.sources||[]}]);
          } catch (err) {
            setMessages(prev=>[...prev, {role:'ai', content:'Sorry, I encountered an error. Please try again.'}]);
            showToast('AI response failed','error');
          }
          setLoading(false);
        }, 800);
      };

      return (
        <div className="card animate-fadeIn" style={{minHeight:'600px',display:'flex',flexDirection:'column'}}>
          <div className="card-header"><h3 className="card-title"><i className="fas fa-robot" style={{color:'var(--primary)'}}></i> AI Academic Assistant</h3><span className="badge badge-success"><i className="fas fa-circle" style={{fontSize:'8px'}}></i> Online</span></div>
          <div style={{flex:1,overflowY:'auto',maxHeight:'500px',marginBottom:'16px',padding:'8px'}}>
            {messages.map((msg,i)=> (
              <div key={i} className={`chat-message ${msg.role}`}>
                <div className={`avatar ${msg.role}`}>{msg.role==='ai'?<i className="fas fa-robot"></i>:user?.name?.charAt(0)}</div>
                <div className="bubble">
                  {msg.content.split('\n').map((line,li)=> <div key={li} style={{marginBottom:line.startsWith('•')?'4px':'0'}}>{line}</div>)}
                  {msg.sources && msg.sources.length>0 && <div style={{marginTop:'8px',paddingTop:'8px',borderTop:'1px solid var(--border-color)',display:'flex',gap:'8px',flexWrap:'wrap'}}>{msg.sources.map(s=><span key={s.title} style={{fontSize:'11px',color:'var(--primary)'}}><i className="fas fa-book"></i> {s.title}</span>)}</div>}
                </div>
              </div>
            ))}
            {loading && <div className="chat-message ai"><div className="avatar ai"><i className="fas fa-robot"></i></div><div className="bubble"><div className="typing-indicator"><span></span><span></span><span></span></div></div></div>}
            <div ref={chatEndRef}></div>
          </div>
          <div style={{display:'flex',gap:'8px',padding:'8px',background:'var(--bg-primary)',borderRadius:'14px',border:'1.5px solid var(--border-color)'}}>
            <input className="input" style={{border:'none',background:'transparent',boxShadow:'none'}} placeholder="Ask about SQL, normalization, cloud..." value={query} onChange={e=>setQuery(e.target.value)} onKeyDown={e=>e.key==='Enter'&&askQuestion()} />
            <button className="btn btn-primary btn-icon" onClick={askQuestion} disabled={loading}><i className="fas fa-paper-plane"></i></button>
          </div>
          <div style={{marginTop:'12px',display:'flex',gap:'8px',flexWrap:'wrap'}}>
            {['SQL Joins','Normalization','Cloud Models','CPU Scheduling','ACID Properties'].map(s=> (
              <button key={s} className="btn btn-secondary btn-sm" onClick={()=>{setQuery(s); setTimeout(askQuestion,100);}}>{s}</button>
            ))}
          </div>
        </div>
      );
    }

    // ===================== ACTION CENTER =====================
    function ActionCenterPage({ user }) {
      const [suggestions, setSuggestions] = useState([]);
      const [interventions, setInterventions] = useState([]);
      const [filter, setFilter] = useState('ALL');

      useEffect(() => {
        const all=DS.getStudents() || []; let s=[]; all.forEach(st=>{ s.push(...DS.generateAISuggestions(st.id)); });
        setSuggestions(s || []); setInterventions(DS.getInterventions() || []);
      }, []);

      const handleAction = (action, studentId) => {
        if (action==='Assign practice') {
          const student=DS.getStudentById(studentId);
          const newInt=DS.addIntervention({ studentId, studentName:student?.name||'Student', teacherId:user?.id||'t1', reason:'Practice assigned by teacher', suggestedAction:'Practice work', actionTaken:'Assigned practice', evidence:'Teacher intervention' });
          setInterventions(prev=>[...prev,newInt]); showToast('Practice assigned successfully','success');
        } else if (action==='Complete demo flow') {
          const student = DS.getStudentById(studentId);
          if (student) {
            const attempt = DS.getQuizAttempts(studentId).find(a=>a.quizId==='q1');
            if (attempt) { attempt.score = 78; }
            const all = DS.getQuizAttempts(studentId);
            const avg = all.length>0?Math.round(all.reduce((s,a)=>s+a.score,0)/all.length):0;
            DS.updateStudent(studentId, { quizAverage: avg, attendance: Math.min(100, (student.attendance||0) + 8) });
            const intervention = DS.getInterventions(studentId).find(i=>i.studentId===studentId);
            if (intervention) { DS.updateIntervention(intervention.id, { status:'COMPLETED', afterScore:78, completedAt:new Date().toISOString() }); }
            DS.addNotification({ id:`n-${Date.now()}`, userId:student.userId, title:'Great Improvement!', message:'Your SQL JOIN score improved to 78%! Keep it up!', type:'SUCCESS', read:false, link:'#quiz', createdAt:new Date().toISOString() });
            showToast('Demo completed! Student improved significantly','success');
            setInterventions(DS.getInterventions() || []);
            const allSt=DS.getStudents(); let s=[]; allSt.forEach(st=>{ s.push(...DS.generateAISuggestions(st.id)); }); setSuggestions(s || []);
          }
        } else showToast(`Action: ${action}`,'info');
      };

      const filtered = filter==='ALL' ? suggestions : suggestions.filter(s=>s.priority===filter);

      return (
        <div>
          <div className="card card-gradient animate-fadeIn" style={{marginBottom:'24px'}}>
            <h2 style={{fontSize:'24px',marginBottom:'8px'}}><i className="fas fa-bullhorn"></i> Action Center</h2>
            <p style={{opacity:0.8,fontSize:'15px'}}>Data → Insight → Action → Result. AI-powered intervention tracking.</p>
          </div>
          <div className="stats-grid">
            <StatCard icon="fa-exclamation-circle" iconClass="red" label="Critical" value={suggestions.filter(s=>s.priority==='CRITICAL').length} delay={1} />
            <StatCard icon="fa-exclamation-triangle" iconClass="orange" label="Attention" value={suggestions.filter(s=>s.priority==='ATTENTION').length} delay={2} />
            <StatCard icon="fa-check-circle" iconClass="green" label="Resolved" value={interventions.filter(i=>i.status==='COMPLETED').length} delay={3} />
            <StatCard icon="fa-spinner" iconClass="blue" label="In Progress" value={interventions.filter(i=>i.status==='IN_PROGRESS').length} delay={4} />
          </div>
          <div className="tabs">
            <button className={`tab ${filter==='ALL'?'active':''}`} onClick={()=>setFilter('ALL')}>All ({suggestions.length})</button>
            <button className={`tab ${filter==='CRITICAL'?'active':''}`} onClick={()=>setFilter('CRITICAL')}>Critical ({suggestions.filter(s=>s.priority==='CRITICAL').length})</button>
            <button className={`tab ${filter==='ATTENTION'?'active':''}`} onClick={()=>setFilter('ATTENTION')}>Attention ({suggestions.filter(s=>s.priority==='ATTENTION').length})</button>
          </div>
          <div className="card animate-fadeIn">
            <div className="card-header"><h3 className="card-title">AI Recommendations</h3></div>
            {filtered.length>0 ? filtered.map((s,i)=> (
              <div key={i} className={`action-card ${s.priority==='CRITICAL'?'critical':'attention'}`}>
                <div className="action-header"><strong>{s.studentName}</strong><span className={`badge ${s.priority==='CRITICAL'?'badge-danger':'badge-warning'}`}>{s.priority}</span></div>
                <div className="action-reason">{s.reason}</div>
                <div className="action-evidence">{s.evidence}</div>
                <div className="action-buttons">
                  <button className="btn btn-sm btn-primary" onClick={()=>handleAction('Assign practice',s.studentId)}><i className="fas fa-check"></i> Assign Practice</button>
                  <button className="btn btn-sm btn-secondary" onClick={()=>showToast(`Message sent to ${s.studentName}`,'success')}><i className="fas fa-envelope"></i> Message</button>
                  {s.studentName==='Aarav Shah' && <button className="btn btn-sm btn-success" onClick={()=>handleAction('Complete demo flow',s.studentId)}><i className="fas fa-rocket"></i> Simulate Improvement</button>}
                </div>
              </div>
            )) : <EmptyState icon="fa-check-circle" title="All clear!" description="No students match the selected filter." />}
          </div>
          <div className="card animate-fadeIn" style={{marginTop:'24px'}}>
            <div className="card-header"><h3 className="card-title">Intervention History</h3></div>
            <div className="table-container">
              <table><thead><tr><th>Student</th><th>Action</th><th>Status</th><th>Before</th><th>After</th></tr></thead>
              <tbody>{interventions.map(i=> (
                <tr key={i.id}><td className="td-name"><div className="td-avatar">{i.studentName.charAt(0)}</div><div className="td-info"><span className="name">{i.studentName}</span></div></td>
                <td>{i.actionTaken||i.suggestedAction}</td>
                <td><span className={`badge ${i.status==='COMPLETED'?'badge-success':i.status==='IN_PROGRESS'?'badge-primary':'badge-warning'}`}>{i.status}</span></td>
                <td>{i.beforeScore||'N/A'}</td><td>{i.afterScore||'Pending'}</td></tr>
              ))}</tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    // ===================== ANALYTICS =====================
    function AnalyticsPage({ role, viewAs }) {
      const effectiveRole = viewAs || role;
      const [chartType, setChartType] = useState('performance');
      const chartRef1 = useRef(null);
      const chartRef2 = useRef(null);
      const chartInstance1 = useRef(null);
      const chartInstance2 = useRef(null);

      useEffect(() => {
        if (chartRef1.current) {
          if (chartInstance1.current) chartInstance1.current.destroy();
          const ctx = chartRef1.current.getContext('2d');
          const students = DS.getStudents() || [];
          chartInstance1.current = new Chart(ctx, {
            type: chartType==='performance'?'bar':'line',
            data: { labels: students.map(s=>s.name.split(' ')[0]), datasets: [
              { label:'Attendance %', data: students.map(s=>s.attendance||0), backgroundColor:'rgba(99,102,241,0.7)', borderColor:'#6366f1', borderWidth:2, borderRadius:6 },
              { label:'Quiz Avg %', data: students.map(s=>s.quizAverage||0), backgroundColor:'rgba(16,185,129,0.7)', borderColor:'#10b981', borderWidth:2, borderRadius:6 }
            ]},
            options: { responsive:true, plugins:{legend:{position:'top',labels:{font:{family:'Inter'}}}}, scales:{y:{beginAtZero:true,max:100,grid:{color:'var(--border-color)'}}}, animation:{duration:1000,easing:'easeOutQuart'} }
          });
        }
        if (chartRef2.current) {
          if (chartInstance2.current) chartInstance2.current.destroy();
          const ctx = chartRef2.current.getContext('2d');
          const students = DS.getStudents() || [];
          const ranges = {'90-100':0,'80-89':0,'70-79':0,'60-69':0,'Below 60':0};
          students.forEach(s=>{ const avg=s.quizAverage||0; if(avg>=90) ranges['90-100']++; else if(avg>=80) ranges['80-89']++; else if(avg>=70) ranges['70-79']++; else if(avg>=60) ranges['60-69']++; else ranges['Below 60']++; });
          chartInstance2.current = new Chart(ctx, {
            type: 'doughnut',
            data: { labels: Object.keys(ranges), datasets: [{ data: Object.values(ranges), backgroundColor:['#10b981','#6366f1','#f59e0b','#ef4444','#94a3b8'], borderWidth:0 }] },
            options: { responsive:true, plugins:{legend:{position:'right'}}, cutout:'65%', animation:{animateScale:true,animateRotate:true} }
          });
        }
        return () => { if(chartInstance1.current) chartInstance1.current.destroy(); if(chartInstance2.current) chartInstance2.current.destroy(); };
      }, [chartType]);

      const students = DS.getStudents();
      const avgAttendance = students.length>0?Math.round(students.reduce((s,a)=>s+(a.attendance||0),0)/students.length):0;
      const avgQuiz = students.length>0?Math.round(students.reduce((s,a)=>s+(a.quizAverage||0),0)/students.length):0;
      const avgCgpa = students.length>0?(students.reduce((s,a)=>s+(a.cgpa||0),0)/students.length).toFixed(2):'0.00';

      return (
        <div>
          <div className="stats-grid">
            <StatCard icon="fa-calendar-check" iconClass="green" label="Avg Attendance" value={avgAttendance} suffix="%" delay={1} />
            <StatCard icon="fa-pencil-alt" iconClass="purple" label="Avg Quiz" value={avgQuiz} suffix="%" delay={2} />
            <StatCard icon="fa-chart-line" iconClass="blue" label="Avg CGPA" value={avgCgpa} delay={3} />
            <StatCard icon="fa-users" iconClass="orange" label="Total Students" value={students.length} delay={4} />
          </div>
          <div className="grid-2">
            <div className="card animate-fadeIn stagger-2">
              <div className="card-header"><h3 className="card-title">Performance Comparison</h3>
                <select className="input" style={{width:'auto',fontSize:'12px'}} value={chartType} onChange={e=>setChartType(e.target.value)}>
                  <option value="performance">Bar Chart</option><option value="trend">Line Chart</option>
                </select>
              </div>
              <canvas ref={chartRef1} height="250"></canvas>
            </div>
            <div className="card animate-fadeIn stagger-3">
              <div className="card-header"><h3 className="card-title">Score Distribution</h3></div>
              <canvas ref={chartRef2} height="250"></canvas>
            </div>
          </div>
          <div className="card animate-fadeIn stagger-4" style={{marginTop:'24px'}}>
            <div className="card-header"><h3 className="card-title">Detailed Statistics</h3></div>
            <div className="table-container">
              <table><thead><tr><th>Student</th><th>GR</th><th>Attendance</th><th>Quiz Avg</th><th>CGPA</th><th>Backlogs</th><th>Risk Level</th></tr></thead>
              <tbody>{students.map(s=> {
                const risk = s.attendance<75 || s.quizAverage<60 || s.cgpa<7 ? 'HIGH' : s.attendance<85 || s.quizAverage<75 ? 'MEDIUM' : 'LOW';
                return <tr key={s.id}><td className="td-name"><div className="td-avatar">{s.name.charAt(0)}</div><div className="td-info"><span className="name">{s.name}</span><span className="sub">{s.rollNo}</span></div></td>
                <td><span className="badge badge-primary" style={{fontSize:'10px'}}>{s.grNumber}</span></td>
                <td><div className="progress-bar" style={{width:'60px',display:'inline-block',marginRight:'8px',verticalAlign:'middle'}}><div className={`fill ${s.attendance>80?'success':s.attendance>70?'warning':'danger'}`} style={{width:`${s.attendance}%`}}></div></div>{s.attendance}%</td>
                <td>{s.quizAverage}%</td><td>{s.cgpa}</td><td>{s.backlogs}</td>
                <td><span className={`badge ${risk==='HIGH'?'badge-danger':risk==='MEDIUM'?'badge-warning':'badge-success'}`}>{risk}</span></td></tr>;
              })}</tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

Roll {s.rollNo}</span><span>{DS.getClassById(s.classId)?.name}</span></div></div></div></div><div className="grid-2"><div className="profile-field"><div className="field-label">Email</div><div className="field-value">{DS.getUserById(s.userId)?.email||'-'}</div></div><div className="profile-field"><div className="field-label">Guardian</div><div className="field-value">{s.guardian||'-'}</div></div><div className="profile-field"><div className="field-label">Guardian Phone</div><div className="field-value">{s.guardianPhone||'-'}</div></div><div className="profile-field"><div className="field-label">Admission Year</div><div className="field-value">{s.admissionYear}</div></div></div></div>})}><i className="fas fa-eye"/></button></td></tr>)}</tbody></table></div></div>{showAdd&&<Modal isOpen={showAdd} onClose={()=>setShowAdd(false)} title="Add New Student · Automatic GR & Login" footer={created?<button className="btn btn-primary" onClick={()=>setShowAdd(false)}>Done</button>:<><button className="btn btn-secondary" onClick={()=>setShowAdd(false)}>Cancel</button><button className="btn btn-primary" onClick={submit}>Create Student Account</button></>}>
        {created?<div className="card card-gradient"><h3>Account Created ✓</h3><p style={{marginTop:10}}>Student: {created.student.name}</p><p>GR Number: <strong>{created.student.grNumber}</strong></p><p>Email: <strong>{created.user.email}</strong></p><p>Initial Password: <strong>{created.user.password}</strong></p><p style={{marginTop:12,fontSize:12,opacity:.85}}>For production, require a password change on first login and deliver credentials through a secure institutional channel.</p></div>:<div className="grid-2"><div className="form-group"><label className="form-label">Full Name *</label><input className="input" value={form.name} onChange={e=>setForm({...form,name:e.target.value})}/></div><div className="form-group"><label className="form-label">Phone *</label><input className="input" value={form.phone} onChange={e=>setForm({...form,phone:e.target.value})}/></div><div className="form-group"><label className="form-label">Admission Year *</label><input type="number" className="input" value={form.admissionYear} onChange={e=>setForm({...form,admissionYear:e.target.value})}/></div><div className="form-group"><label className="form-label">Roll / Sequence (optional)</label><input type="number" className="input" placeholder="036" value={form.sequence} onChange={e=>setForm({...form,sequence:e.target.value})}/></div><div className="form-group"><label className="form-label">Department</label><select className="input" value={form.department} onChange={e=>setForm({...form,department:e.target.value})}>{DS.getDepartments().map(d=><option key={d.id} value={d.id}>{d.name}</option>)}</select></div><div className="form-group"><label className="form-label">Class</label><select className="input" value={form.classId} onChange={e=>setForm({...form,classId:e.target.value})}>{DS.getClasses().map(c=><option key={c.id} value={c.id}>{c.name}</option>)}</select></div><div className="form-group"><label className="form-label">Semester</label><input type="number" className="input" value={form.semester} onChange={e=>setForm({...form,semester:e.target.value})}/></div><div className="form-group"><label className="form-label">Gender</label><select className="input" value={form.gender} onChange={e=>setForm({...form,gender:e.target.value})}><option value="">Select</option><option>Male</option><option>Female</option><option>Other</option></select></div><div className="form-group"><label className="form-label">Guardian</label><input className="input" value={form.guardian} onChange={e=>setForm({...form,guardian:e.target.value})}/></div><div className="form-group"><label className="form-label">Guardian Phone</label><input className="input" value={form.guardianPhone} onChange={e=>setForm({...form,guardianPhone:e.target.value})}/></div><div className="form-group"><label className="form-label">Date of Birth</label><input type="date" className="input" value={form.dob} onChange={e=>setForm({...form,dob:e.target.value})}/></div><div className="form-group"><label className="form-label">Address</label><input className="input" value={form.address} onChange={e=>setForm({...form,address:e.target.value})}/></div><div style={{gridColumn:'1/-1',padding:14,borderRadius:12,background:'var(--bg-primary)',color:'var(--text-secondary)',fontSize:12}}><i className="fas fa-magic" style={{color:'var(--primary)'}}/> The system will automatically create <strong>GRYYYYNNN</strong>, an institutional email like <strong>name@{DS.getSettings().schoolDomain}</strong>, and initial password equal to the GR number.</div></div>}

    // ===================== MESSAGES =====================
    function MessagesPage({ user }) {
      const [messages, setMessages] = useState(DS.getMessages(user.id) || []);
      const [composeOpen, setComposeOpen] = useState(false);
      const [newMsg, setNewMsg] = useState({to:'', subject:'', content:''});

      const sendMessage = () => {
        if (!newMsg.to) { showToast('Please select a recipient','error','Validation Error'); return; }
        if (!newMsg.subject.trim()) { showToast('Subject is required','error','Validation Error'); return; }
        if (!newMsg.content.trim()) { showToast('Message content is required','error','Validation Error'); return; }
        if (newMsg.subject.length > 150) { showToast('Subject must be under 150 characters','error'); return; }
        if (newMsg.content.length > 2000) { showToast('Message must be under 2000 characters','error'); return; }
        DS.addMessage({ id:`m-${Date.now()}`, from:user.id, to:newMsg.to, subject:newMsg.subject.trim(), content:newMsg.content.trim(), timestamp:new Date().toISOString(), read:false });
        setMessages(DS.getMessages(user.id)); setComposeOpen(false); setNewMsg({to:'',subject:'',content:''});
        showToast('Message sent successfully','success');
      };

      return (
        <div>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'24px'}}>
            <h2 style={{fontSize:'20px',fontWeight:800}}>Messages</h2>
            <button className="btn btn-primary" onClick={()=>setComposeOpen(true)}><i className="fas fa-plus"></i> Compose</button>
          </div>
          <div className="card animate-fadeIn">
            {messages.length>0 ? messages.map(m=> {
              const isSent = m.from === user.id;
              const other = isSent ? DS.getUserById(m.to) : DS.getUserById(m.from);
              return (
                <div key={m.id} style={{padding:'16px',borderBottom:'1px solid var(--border-light)',display:'flex',gap:'14px',alignItems:'flex-start'}}>
                  <div style={{width:'40px',height:'40px',borderRadius:'50%',background:'var(--primary-gradient)',display:'flex',alignItems:'center',justifyContent:'center',color:'white',fontWeight:700,flexShrink:0}}>{other?.name.charAt(0)}</div>
                  <div style={{flex:1}}>
                    <div style={{display:'flex',justifyContent:'space-between',marginBottom:'4px'}}>
                      <span style={{fontWeight:700}}>{isSent?'To: ':'From: '}{other?.name}</span>
                      <span style={{fontSize:'12px',color:'var(--text-light)'}}>{new Date(m.timestamp).toLocaleString()}</span>
                    </div>
                    <div style={{fontWeight:600,marginBottom:'4px'}}>{m.subject}</div>
                    <div style={{fontSize:'13px',color:'var(--text-secondary)'}}>{m.content}</div>
                  </div>
                </div>
              );
            }) : <EmptyState icon="fa-envelope-open" title="No messages" description="Your inbox is empty" />}
          </div>
          {composeOpen && (
            <Modal isOpen={composeOpen} onClose={()=>setComposeOpen(false)} title="Compose Message" footer={<><button className="btn btn-secondary" onClick={()=>setComposeOpen(false)}>Cancel</button><button className="btn btn-primary" onClick={sendMessage}><i className="fas fa-paper-plane"></i> Send</button></>}>
              <div className="form-group"><label className="form-label">To</label><select className="input" value={newMsg.to} onChange={e=>setNewMsg({...newMsg,to:e.target.value})}><option value="">Select recipient</option>{DS.getUsers().filter(u=>u.id!==user.id).map(u=><option key={u.id} value={u.id}>{u.name} ({u.role})</option>)}</select></div>
              <div className="form-group"><label className="form-label">Subject</label><input className="input" value={newMsg.subject} onChange={e=>setNewMsg({...newMsg,subject:e.target.value})} placeholder="Enter subject" /></div>
              <div className="form-group"><label className="form-label">Message</label><textarea className="input" rows="4" value={newMsg.content} onChange={e=>setNewMsg({...newMsg,content:e.target.value})} placeholder="Type your message..." style={{resize:'vertical'}}></textarea></div>
            </Modal>
          )}
        </div>
      );
    }

    // ===================== ANNOUNCEMENTS =====================
    function AnnouncementsPage({ user, role, viewAs }) {
      const effectiveRole = viewAs || role;
      const [showAdd, setShowAdd] = useState(false);
      const [newAnn, setNewAnn] = useState({title:'', content:'', priority:'MEDIUM', audience:'ALL'});
